var POL = {"version": "1.0", "fecha": "8 de septiembre de 2026", "html": "<div class=\"jy21-doc\"><h2>Política de Privacidad y Tratamiento de Datos Personales</h2><p class=\"jy21-sub\">JYNTRA · Plataforma de entrenamiento y nutrición · Ley N° 21.719 (Chile)</p><p class=\"jy21-sub\">Versión 1.0 · 8 de septiembre de 2026 · Vigencia plena de la ley: 1 de diciembre de 2026</p><h3>1. Quién es responsable de tus datos</h3><p>El responsable del tratamiento de los datos personales que se registran en JYNTRA es <b>[RAZÓN SOCIAL], RUT [RUT]</b>, con domicilio en <b>[DOMICILIO]</b>, comuna de <b>[COMUNA]</b>, Región Metropolitana, Chile (en adelante, «JYNTRA», «la plataforma» o «nosotros»).</p><ul><li>Correo de contacto para materias de privacidad: <b>[privacidad@tu-dominio.cl]</b></li><li>Delegado de Protección de Datos (DPO): <b>[NOMBRE DEL DPO]</b> — <b>[dpo@tu-dominio.cl]</b></li><li>Plazo de respuesta comprometido: 30 días corridos desde la recepción de la solicitud.</li></ul><div class=\"jy21-nota\">Los campos entre corchetes deben completarse con los datos reales del titular del servicio antes de publicar esta política. Sin esa identificación, la política no cumple el deber de información del artículo 14.</div><h3>2. Qué ley se aplica</h3><p>Esta política se rige por la <b>Ley N° 21.719</b>, que regula la protección y el tratamiento de los datos personales y crea la Agencia de Protección de Datos Personales (APDP), publicada en el Diario Oficial el 13 de diciembre de 2024 y con vigencia plena a partir del 1 de diciembre de 2026. Dicha ley moderniza y reemplaza el marco de la Ley N° 19.628 y eleva el estándar chileno al nivel del Reglamento General de Protección de Datos europeo.</p><p>Cuando el tratamiento involucre datos de salud, se consideran además las normas sanitarias aplicables y las obligaciones de secreto profesional que pesan sobre profesores de educación física, preparadores físicos y nutricionistas que utilizan la plataforma.</p><h3>3. A quién aplica esta política</h3><p>Aplica a toda persona que cree una cuenta o cuyos datos se registren en cualquiera de los cuatro perfiles de la plataforma: <b>Alumno</b>, <b>Profesor</b>, <b>Nutricionista</b> y <b>Administrador</b>.</p><p>El alumno es titular de sus propios datos. El profesor y el nutricionista actúan como profesionales tratantes respecto de los alumnos con quienes tienen una conexión activa y aceptada, y quedan sujetos a las mismas obligaciones de confidencialidad, finalidad y seguridad que se describen aquí.</p><h3>4. Qué datos tratamos</h3><p>El inventario siguiente corresponde exactamente a los campos que la aplicación puede registrar. No pedimos datos «por si acaso»: cada categoría existe porque un módulo concreto la necesita (principio de proporcionalidad o minimización).</p><div class=\"jy21-tw\"><table><thead><tr><th>Categoría</th><th>Datos concretos que la plataforma registra</th><th>¿Sensible?</th></tr></thead><tbody><tr><td>A. Identificación y contacto</td><td>Nombre y apellido; correo electrónico; contraseña de acceso; teléfono; fecha de nacimiento; sexo; ciudad y comuna.</td><td>No</td></tr><tr><td>B. Perfil profesional (profesor / nutricionista)</td><td>Título profesional; especialidades; biografía; modalidad de atención; tarifa; planes de servicio y sus precios; visibilidad de la ficha pública en el buscador.</td><td>No</td></tr><tr><td>C. Composición corporal y antropometría</td><td>Talla; peso; perímetros (cintura, cadera, brazo, muslo); pliegues cutáneos; diámetros óseos (biacromial, biiliocrestal, húmero, fémur); talla sentada y envergadura; somatotipo ISAK; porcentaje graso; masa muscular esquelética; grasa visceral; edad metabólica; metabolismo basal y gasto energético estimado (bioimpedancia).</td><td>SÍ — dato de salud</td></tr><tr><td>D. Antecedentes de salud (anamnesis)</td><td>Patologías declaradas; medicamentos; cirugías previas; alergias e intolerancias alimentarias; síntomas y tolerancia digestiva; historial de lesiones y molestias musculoesqueléticas; lesión activa y zona afectada; ciclo menstrual y método anticonceptivo; horas y calidad de sueño; nivel de estrés; estado de ánimo; consumo de alcohol y tabaco; suplementos; patrón alimentario; número de comidas; hidratación; objetivo de salud.</td><td>SÍ — dato de salud</td></tr><tr><td>E. Entrenamiento y rendimiento</td><td>Cargas y repeticiones máximas (1RM); percepción de esfuerzo (RPE); asistencia y clases realizadas; calendario y horario semanal; sesiones del plan; mesociclos y planificación; adherencia.</td><td>Parcialmente — vinculado a salud</td></tr><tr><td>F. Relación comercial y situación socioeconómica</td><td>Plan contratado (Base, Pro, Elite); estado y fecha de renovación de la suscripción; boletas o facturas; montos y tarifas acordadas entre alumno y profesional.</td><td>SÍ — situación socioeconómica</td></tr><tr><td>G. Vínculos entre perfiles</td><td>Solicitudes de conexión y su estado; mensaje de presentación; profesional asignado por especialidad; notas y observaciones que el profesional escribe sobre el alumno.</td><td>Según contenido</td></tr><tr><td>H. Registros técnicos y de uso</td><td>Identificadores internos de usuario; fecha de creación de la cuenta; bitácora de accesos, altas y cambios; marca temporal de sincronización entre perfiles.</td><td>No</td></tr></tbody></table></div><p><b>Qué NO pedimos.</b> La plataforma no solicita ni almacena RUT, cédula de identidad, datos biométricos (huella dactilar, reconocimiento facial, iris o voz), geolocalización, origen étnico, afiliación política, sindical o religiosa, orientación sexual, ni datos de tarjetas de crédito o cuentas bancarias. Si en el futuro algún módulo requiere alguno de estos datos, esta política se actualizará y se solicitará un consentimiento nuevo y específico antes de recogerlos.</p><h3>5. Para qué usamos los datos y con qué base legal</h3><p>Ningún dato se usa para una finalidad distinta de aquella para la que fue recogido. La tabla siguiente es el registro resumido de actividades de tratamiento.</p><div class=\"jy21-tw\"><table><thead><tr><th>Finalidad</th><th>Datos usados</th><th>Base de licitud</th></tr></thead><tbody><tr><td>Crear y mantener la cuenta, autenticar el acceso y dirigir a la persona a su perfil.</td><td>A, H</td><td>Ejecución del servicio solicitado por el titular.</td></tr><tr><td>Permitir que el alumno registre su entrenamiento, su pauta y su seguimiento diario.</td><td>C, D, E</td><td>Consentimiento explícito para datos de salud.</td></tr><tr><td>Permitir que el profesor evalúe, planifique y haga seguimiento del alumno conectado.</td><td>C, D, E, G</td><td>Consentimiento explícito del alumno + ejecución del servicio profesional.</td></tr><tr><td>Permitir que el nutricionista realice anamnesis, antropometría, plan alimentario y control.</td><td>C, D, G</td><td>Consentimiento explícito del alumno + ejecución del servicio profesional.</td></tr><tr><td>Mostrar la ficha pública del profesional en el buscador interno.</td><td>B</td><td>Consentimiento del profesional, revocable en cualquier momento.</td></tr><tr><td>Gestionar agenda, horario semanal, reserva y registro de clases.</td><td>E, G</td><td>Ejecución del servicio.</td></tr><tr><td>Cobrar la suscripción a la plataforma y emitir documentos tributarios.</td><td>A, F</td><td>Ejecución del contrato y obligación legal tributaria.</td></tr><tr><td>Mantener la trazabilidad de accesos y cambios (evidencia de cumplimiento).</td><td>H</td><td>Interés legítimo en la seguridad de la información y deber de responsabilidad proactiva.</td></tr><tr><td>Enviar avisos operativos de la cuenta (cambios de plan, conexiones, recordatorios).</td><td>A</td><td>Ejecución del servicio.</td></tr><tr><td>Enviar comunicaciones comerciales o novedades del producto.</td><td>A</td><td>Consentimiento separado y opcional. Rechazarlo no limita el uso de la plataforma.</td></tr></tbody></table></div><h3>6. Cómo pedimos y cómo revocas tu consentimiento</h3><p>El consentimiento en JYNTRA es <b>libre, específico, informado, previo e inequívoco</b>. Se otorga marcando casillas que siempre aparecen <b>desmarcadas</b>. No usamos casillas premarcadas, no lo escondemos dentro de términos y condiciones y no lo inferimos del uso de la aplicación.</p><ul><li>El consentimiento se pide al crear la cuenta, en un cuadro visible que incluye el enlace a esta política.</li><li>Es <b>granular</b>: aceptar la política no implica aceptar el tratamiento de datos de salud, ni el envío de publicidad, ni compartir tu ficha con un profesional. Cada uno se marca por separado.</li><li>Queda registrado con fecha, hora y número de versión de la política aceptada, como evidencia del cumplimiento.</li><li>Puedes <b>revocarlo en cualquier momento</b> desde «Mi perfil» o escribiendo al correo de privacidad, con la misma facilidad con que lo otorgaste. La revocación no afecta la licitud del tratamiento anterior.</li><li>Si revocas el consentimiento para datos de salud, los módulos de evaluación, anamnesis, antropometría y seguimiento dejan de operar y los registros asociados se bloquean o se suprimen según lo que solicites.</li></ul><h3>7. Datos sensibles: regla reforzada</h3><p>La Ley N° 21.719 califica como sensibles, entre otros, los datos de salud y perfil biológico, los datos biométricos y —particularidad chilena— la <b>situación socioeconómica</b>. Buena parte de lo que JYNTRA registra cae en esa categoría.</p><ul><li>Su tratamiento exige <b>consentimiento explícito y separado</b>, que se solicita en una casilla propia al crear la cuenta y se vuelve a solicitar antes de activar cualquier módulo clínico.</li><li>El acceso está restringido: un profesional sólo puede ver los datos de salud de los alumnos con quienes tiene una <b>conexión activa y aceptada por el alumno</b>. Al terminar la conexión, cesa el acceso.</li><li>El alumno mantiene, en todo momento, una conexión por especialidad como máximo, de modo que sus datos clínicos no circulan entre varios profesionales simultáneamente.</li><li>Los datos sensibles no se usan para publicidad, no se ceden a terceros y no se comercializan en ninguna circunstancia.</li><li>Por su nivel de riesgo, este tratamiento está sujeto a una Evaluación de Impacto en Protección de Datos, que se mantiene documentada y actualizada.</li></ul><h3>8. Niños, niñas y adolescentes</h3><p>El tratamiento de datos de personas menores de edad se rige por el interés superior del niño.</p><ul><li><b>Menores de 14 años:</b> no pueden crear una cuenta por sí mismos. Se requiere el consentimiento de su padre, madre o representante legal, quien debe identificarse en el formulario de registro.</li><li><b>Entre 14 y 15 años:</b> el tratamiento de datos sensibles —es decir, de todo el módulo de salud, composición corporal y anamnesis— requiere igualmente el consentimiento del representante legal.</li><li><b>Entre 16 y 17 años:</b> puede consentir por sí mismo, con información redactada en lenguaje claro y adecuado a su edad; se recomienda de todos modos el acompañamiento de un adulto responsable.</li><li>El formulario de registro calcula la edad a partir de la fecha de nacimiento y activa automáticamente los campos de representante legal cuando corresponde.</li></ul><h3>9. Con quién se comparten los datos</h3><p>Los datos <b>no se venden, no se arriendan y no se ceden</b> con fines comerciales. Se comunican únicamente en estos casos:</p><ul><li><b>Al profesional que tú elijes conectar.</b> Al aceptarse una conexión, el profesor o nutricionista accede a la ficha del alumno en lo estrictamente necesario para su especialidad. Esta comunicación se basa en tu consentimiento y termina cuando terminas la conexión.</li><li><b>Al alumno.</b> El plan, la pauta y los resultados que el profesional publica quedan visibles para el alumno.</li><li><b>A encargados de tratamiento</b> (proveedores de hosting, respaldo o soporte), sólo bajo contrato escrito que les prohíbe usar los datos para fines propios y les impone las mismas medidas de seguridad.</li><li><b>A autoridades competentes</b>, cuando exista una obligación legal o una orden judicial.</li></ul><p><b>Transferencias internacionales.</b> En su configuración por defecto, JYNTRA funciona en el dispositivo del usuario y no transfiere datos fuera de Chile. Si en el futuro se habilita un servidor en el extranjero, se informará previamente y sólo se usarán países o proveedores con nivel adecuado de protección o cláusulas contractuales que garanticen un estándar equivalente.</p><h3>10. Dónde se guardan y por cuánto tiempo</h3><p>La aplicación está construida como archivos HTML autónomos. En su modo estándar, los datos se guardan en el <b>almacenamiento local del navegador del propio usuario</b> (localStorage), bajo el prefijo «jyntra.», y se sincronizan entre los perfiles abiertos en el mismo dispositivo o dominio. Si el operador habilita un servidor central, los datos se replican en él bajo las mismas reglas de esta política.</p><div class=\"jy21-tw\"><table><thead><tr><th>Dato</th><th>Plazo de conservación</th></tr></thead><tbody><tr><td>Cuenta e identificación</td><td>Mientras la cuenta esté activa y hasta 12 meses después de su cierre.</td></tr><tr><td>Datos de salud, antropometría y anamnesis</td><td>Mientras dure la conexión con el profesional y hasta el plazo que exija la normativa sanitaria sobre ficha clínica; luego se suprimen o anonimizan.</td></tr><tr><td>Registros de entrenamiento y seguimiento</td><td>Mientras la cuenta esté activa; se suprimen al cerrar la cuenta si el titular lo solicita.</td></tr><tr><td>Documentos tributarios y de pago</td><td>6 años, por obligación legal.</td></tr><tr><td>Bitácora de accesos y cambios</td><td>24 meses, como evidencia de cumplimiento.</td></tr><tr><td>Registro de consentimientos</td><td>Mientras dure el tratamiento y 5 años después, como prueba del consentimiento.</td></tr></tbody></table></div><h3>11. Seguridad de la información</h3><ul><li>Acceso segmentado por rol: cada perfil sólo ve lo que su función requiere.</li><li>Acceso a datos clínicos condicionado a una conexión aceptada por el titular.</li><li>Bitácora de altas, accesos y modificaciones, con identificación de quién hizo cada cambio.</li><li>Los datos permanecen en el dispositivo del usuario en la configuración estándar, lo que reduce la superficie de exposición.</li><li>Si el operador habilita servidor central: cifrado en tránsito (HTTPS/TLS), cifrado en reposo, autenticación por token y respaldos periódicos.</li><li>Recomendación al usuario: no compartir la contraseña, usar el bloqueo de pantalla del dispositivo y cerrar sesión en equipos compartidos.</li></ul><div class=\"jy21-nota\">Ninguna medida de seguridad es infalible. Si detectas un acceso indebido a tu cuenta, avísanos de inmediato al correo de privacidad.</div><h3>12. Qué hacemos si hay una brecha de seguridad</h3><p>Si se produce una vulneración de seguridad que afecte datos personales —acceso no autorizado, pérdida, alteración o divulgación—, activamos el protocolo de incidentes:</p><ul><li>Notificamos a la Agencia de Protección de Datos Personales <b>sin dilación indebida</b>, en un plazo objetivo de 72 horas desde que tomamos conocimiento del hecho.</li><li>Cuando la brecha afecte datos sensibles, datos de menores de 14 años o datos económicos, notificamos también <b>directamente a las personas afectadas</b>, describiendo qué ocurrió, qué datos se vieron comprometidos, qué medidas tomamos y qué puede hacer la persona.</li><li>Registramos el incidente y las medidas correctivas adoptadas.</li></ul><h3>13. Tus derechos (ARCOP y bloqueo)</h3><p>Como titular de datos puedes ejercer, gratuitamente y sin expresar motivo, los siguientes derechos:</p><div class=\"jy21-tw\"><table><thead><tr><th>Derecho</th><th>Qué te permite hacer</th></tr></thead><tbody><tr><td>Acceso</td><td>Saber qué datos tenemos sobre ti, de dónde provienen, para qué se usan, a quién se han comunicado y por cuánto tiempo se conservarán.</td></tr><tr><td>Rectificación</td><td>Corregir datos inexactos, incompletos o desactualizados.</td></tr><tr><td>Cancelación o supresión</td><td>Pedir que se eliminen tus datos cuando ya no sean necesarios, cuando retires el consentimiento o cuando el tratamiento sea ilícito («derecho al olvido»).</td></tr><tr><td>Oposición</td><td>Oponerte a un tratamiento determinado, por ejemplo al perfilamiento comercial o al envío de comunicaciones.</td></tr><tr><td>Bloqueo</td><td>Pedir la suspensión temporal del tratamiento mientras se resuelve una controversia sobre tus datos.</td></tr><tr><td>Portabilidad</td><td>Recibir tus datos en un formato estructurado, de uso común y lectura mecánica, y pedir que se transfieran a otro responsable.</td></tr></tbody></table></div><p><b>Cómo ejercerlos:</b> escribe a <b>[privacidad@tu-dominio.cl]</b> indicando tu nombre, el correo con que te registraste y el derecho que quieres ejercer. Responderemos en un plazo máximo de <b>30 días corridos</b>, prorrogable por otros 30 en casos complejos, avisándote antes del vencimiento del primer plazo.</p><p>Adicionalmente, la aplicación ofrece dos atajos: desde «Mi perfil» puedes <b>descargar un respaldo completo de tus datos</b> (derecho de portabilidad) y <b>borrar tus datos del dispositivo</b> (derecho de supresión).</p><h3>14. Decisiones automatizadas y perfilamiento</h3><p>JYNTRA calcula automáticamente indicadores como el porcentaje graso, el somatotipo, el metabolismo basal, el gasto energético o los rangos de macronutrientes. Son <b>apoyos al criterio profesional</b>, no decisiones automatizadas con efectos jurídicos ni sustitutos de una evaluación clínica.</p><p>No se realiza elaboración de perfiles con fines publicitarios ni se toman decisiones que afecten derechos de una persona basadas únicamente en un tratamiento automatizado. Toda indicación de entrenamiento o alimentación es revisada y firmada por el profesional a cargo.</p><h3>15. Almacenamiento local y cookies</h3><p>La aplicación no usa cookies de publicidad ni de analítica de terceros. Utiliza exclusivamente almacenamiento local del navegador (localStorage) y un canal de mensajería entre pestañas (BroadcastChannel), ambos <b>estrictamente necesarios</b> para que la plataforma funcione sin servidor y para que los perfiles se sincronicen entre sí. Por ser técnicamente necesarios no requieren consentimiento adicional, pero se informan aquí por transparencia.</p><p>Al borrar los datos de navegación del navegador se elimina también la información almacenada por JYNTRA en ese dispositivo.</p><h3>16. Reclamos ante la autoridad</h3><p>Si consideras que no hemos respetado tus derechos, puedes reclamar ante la <b>Agencia de Protección de Datos Personales (APDP)</b>, organismo fiscalizador creado por la Ley N° 21.719, que puede investigar de oficio, ordenar la suspensión de un tratamiento y aplicar multas de hasta 20.000 UTM en el caso de infracciones gravísimas. El reclamo ante la Agencia es independiente de las acciones judiciales que puedas ejercer.</p><h3>17. Cambios a esta política</h3><p>Podemos actualizar esta política cuando cambien los módulos de la plataforma o la normativa aplicable. Toda versión lleva un número y una fecha. Si el cambio amplía las finalidades o incorpora datos nuevos, se te solicitará un consentimiento nuevo antes de aplicarlo, y la aplicación te mostrará el texto actualizado la próxima vez que inicies sesión.</p><p>Versión vigente: <b>1.0</b> — 8 de septiembre de 2026.</p><h3>Anexo A · Textos de consentimiento que usa la aplicación</h3><p>Estos son los textos exactos que aparecen, en casillas desmarcadas, al crear una cuenta. Se reproducen aquí para que quede constancia de qué se está aceptando.</p><ul><li><b>(Obligatorio)</b> He leído y acepto la Política de Privacidad de JYNTRA, versión 1.0. Autorizo el tratamiento de mis datos de identificación y contacto con la finalidad de crear y operar mi cuenta.</li><li><b>(Obligatorio para usar los módulos de salud)</b> Doy mi consentimiento explícito para que JYNTRA trate mis datos personales sensibles de salud —composición corporal, antropometría, antecedentes clínicos, hábitos, sueño, lesiones y rendimiento— con la única finalidad de la evaluación, planificación y seguimiento de mi entrenamiento y de mi alimentación. Entiendo que puedo revocar esta autorización en cualquier momento.</li><li><b>(Se solicita al conectar)</b> Autorizo que el profesor o nutricionista con quien establezca una conexión acceda a mi ficha en lo necesario para su especialidad, mientras esa conexión esté activa.</li><li><b>(Opcional)</b> Quiero recibir novedades y comunicaciones comerciales de JYNTRA por correo electrónico. Sé que puedo desactivarlo cuando quiera y que no afecta mi uso de la plataforma.</li><li><b>(Sólo si el titular es menor de edad)</b> Declaro ser el padre, madre o representante legal de la persona que se registra y autorizo el tratamiento de sus datos en los términos de esta política.</li></ul><h3>Anexo B · Correspondencia con la Ley N° 21.719</h3><div class=\"jy21-tw\"><table><thead><tr><th>Exigencia de la ley</th><th>Cómo la cumple JYNTRA</th></tr></thead><tbody><tr><td>Licitud y consentimiento válido</td><td>Casillas desmarcadas, granulares y registradas con fecha, hora y versión.</td></tr><tr><td>Finalidad</td><td>Cada categoría de dato está asociada a una finalidad declarada en la sección 5.</td></tr><tr><td>Proporcionalidad / minimización</td><td>No se piden RUT, biometría ni geolocalización; se declara expresamente qué no se recoge.</td></tr><tr><td>Calidad y exactitud</td><td>Derecho de rectificación disponible y edición directa de la ficha por el titular.</td></tr><tr><td>Transparencia e información</td><td>Esta política es accesible desde un botón permanente en la aplicación y se presenta antes de crear la cuenta.</td></tr><tr><td>Seguridad</td><td>Segmentación por rol, acceso condicionado a conexión aceptada, bitácora y cifrado en despliegue con servidor.</td></tr><tr><td>Confidencialidad</td><td>Deber de secreto de los profesionales y prohibición de uso de datos para fines propios por parte de encargados.</td></tr><tr><td>Responsabilidad proactiva</td><td>Registro de actividades de tratamiento (sección 5), registro de consentimientos, bitácora y evaluación de impacto para datos sensibles.</td></tr><tr><td>Derechos ARCOP y bloqueo</td><td>Canal de contacto, plazo de 30 días y funciones de respaldo y borrado en la propia aplicación.</td></tr><tr><td>Datos sensibles</td><td>Consentimiento explícito separado y acceso restringido por conexión.</td></tr><tr><td>Menores de edad</td><td>Umbrales de 14 y 16 años implementados en el formulario de registro.</td></tr><tr><td>Notificación de brechas</td><td>Protocolo con plazo objetivo de 72 horas a la APDP y aviso directo a los afectados.</td></tr></tbody></table></div></div>"};

/* ---------- 21.1 · almacén de consentimientos ---------- */
if(!S.consentimientos){ S.consentimientos = DB.get('consentimientos', null) || []; guardar('consentimientos'); }
try{ if(JY_CANAL && JY_CANAL.claves && JY_CANAL.claves.indexOf('consentimientos') < 0) JY_CANAL.claves.push('consentimientos'); }catch(e){}

function consentimientoDe(usuarioId){
  var l = (S.consentimientos||[]).filter(function(c){ return c.usuarioId===usuarioId && !c.revocado; });
  return l.length ? l[l.length-1] : null;
}
function registrarConsentimiento(usuarioId, items, extra){
  var reg = {
    id: uid('cons'),
    usuarioId: usuarioId,
    version: POL.version,
    fecha: new Date().toISOString(),
    items: items || {},
    representante: (extra && extra.representante) || null,
    agente: (navigator && navigator.userAgent) ? String(navigator.userAgent).slice(0,180) : '',
    revocado: false
  };
  S.consentimientos.push(reg); guardar('consentimientos');
  try{ bitacora('privacidad','Consentimiento otorgado (v'+POL.version+')', usuarioId); }catch(e){}
  return reg;
}
function revocarConsentimiento(usuarioId, motivo){
  (S.consentimientos||[]).forEach(function(c){
    if(c.usuarioId===usuarioId && !c.revocado){ c.revocado = true; c.revocadoEn = new Date().toISOString(); c.motivo = motivo||''; }
  });
  guardar('consentimientos');
  try{ bitacora('privacidad','Consentimiento revocado', usuarioId); }catch(e){}
}
function edadDe(iso){
  if(!iso) return null;
  var n = new Date(iso); if(isNaN(n)) return null;
  var h = new Date(), e = h.getFullYear() - n.getFullYear();
  var m = h.getMonth() - n.getMonth();
  if(m < 0 || (m === 0 && h.getDate() < n.getDate())) e--;
  return e;
}

/* ---------- 21.2 · puente de sesión entre archivos ----------
   ADMITIDOS = roles que este archivo puede atender. null = todos. */
var ADMITIDOS = ['profesor'];
(function puenteDeSesion(){
  var q = {};
  (location.search||'').replace(/^\?/,'').split('&').forEach(function(p){
    if(!p) return; var i = p.indexOf('=');
    var k = i<0 ? p : p.slice(0,i);
    var v = i<0 ? '' : decodeURIComponent(p.slice(i+1).replace(/\+/g,' '));
    q[k] = v;
  });
  if(!q.u) return;
  var u = (S.usuarios||[]).filter(function(x){ return x.id === q.u; })[0];
  if(!u) return;
  if(q.r && u.rol !== q.r) return;
  if(ADMITIDOS && ADMITIDOS.indexOf(u.rol) < 0){
    try{ toast('Esta aplicación no atiende al perfil '+u.rol+'.','bad'); }catch(e){}
    return;
  }
  S.sesion = u.id; guardar('sesion');
  try{ history.replaceState(null, '', location.pathname + (location.hash||'')); }catch(e){}
})();

/* ---------- 21.4 · la ventana con el documento ---------- */
function abrirPolitica(opciones){
  var o = opciones || {};
  return new Promise(function(res){
    var bg = document.createElement('div'); bg.className = 'jy21-bg';
    var pie = o.aceptar
      ? '<button class="jy21-btn" data-jy21="no">'+(o.textoRechazar||'No acepto')+'</button>'
        + '<button class="jy21-btn oro" data-jy21="si">'+(o.textoAceptar||'Acepto')+'</button>'
      : '<button class="jy21-btn" data-jy21="imprimir">Imprimir o guardar en PDF</button>'
        + '<button class="jy21-btn oro" data-jy21="cerrar">Cerrar</button>';
    bg.innerHTML = '<div class="jy21-caja" role="dialog" aria-modal="true" aria-label="Política de Privacidad">'
      + '<div class="jy21-h"><div style="flex:1"><b>Políticas de privacidad</b>'
      +   '<small>JYNTRA · versión '+POL.version+' · '+POL.fecha+' · Ley N° 21.719</small></div></div>'
      + '<div class="jy21-b">'+POL.html+'</div>'
      + '<div class="jy21-f">'+pie+'</div></div>';
    document.body.appendChild(bg);
    var cerrar = function(v){ bg.remove(); res(v); };
    bg.addEventListener('click', function(e){
      if(e.target === bg && !o.aceptar) return cerrar(false);
      var b = e.target.closest('[data-jy21]'); if(!b) return;
      var a = b.dataset.jy21;
      if(a === 'imprimir'){ imprimirPolitica(); return; }
      if(a === 'si')  return cerrar(true);
      cerrar(false);
    });
  });
}

function ligarConsentimiento(form){
  if(!form) return;
  var caja = form.querySelector('#jy21-cons'); if(!caja) return;
  var ver = caja.querySelector('[data-jy21-ver]');
  if(ver) ver.onclick = function(e){ e.preventDefault(); abrirPolitica(); };
  var nac = form.querySelector('[name="nacimiento"]');
  var menor = caja.querySelector('#jy21-menor');
  var txt = caja.querySelector('#jy21-menor-txt');
  var revisar = function(){
    var e = nac ? edadDe(nac.value) : null;
    if(e === null || e >= 18){ menor.classList.remove('on'); return; }
    menor.classList.add('on');
    if(e < 14){
      txt.innerHTML = 'La persona tiene <b>'+e+' años</b>. La ley exige el consentimiento del padre, madre o '
        + 'representante legal para tratar sus datos.';
    } else if(e < 16){
      txt.innerHTML = 'La persona tiene <b>'+e+' años</b>. Los datos sensibles de salud de adolescentes menores de '
        + '16 años requieren el consentimiento del representante legal.';
    } else {
      txt.innerHTML = 'La persona tiene <b>'+e+' años</b>. Recomendamos el acompañamiento de un adulto responsable; '
        + 'si lo hay, complete los campos siguientes.';
    }
  };
  if(nac){ nac.addEventListener('change', revisar); nac.addEventListener('input', revisar); }
  revisar();

  /* si el formulario deja elegir rol, el texto de datos sensibles se adapta */
  var span = caja.querySelector('#jy21-salud-txt');
  var radios = Array.prototype.slice.call(form.querySelectorAll('[name="rol"]'));
  if(span && radios.length){
    var refrescar = function(){
      var r = form.querySelector('[name="rol"]:checked');
      span.innerHTML = textoSalud(r ? r.value : 'alumno');
    };
    radios.forEach(function(r){ r.addEventListener('change', refrescar); });
    refrescar();
  }
}

function validarConsentimiento(form, rol){
  var v = function(n){ var el = form.querySelector('[name="'+n+'"]'); return el ? (el.type==='checkbox' ? el.checked : el.value.trim()) : ''; };
  if(!v('jy21_politica'))
    return { ok:false, msg:'Debes aceptar las políticas de privacidad para crear la cuenta.' };
  if(!v('jy21_salud'))
    return { ok:false, msg: (rol==='profesor'||rol==='nutricionista')
      ? 'Debes aceptar el compromiso de confidencialidad sobre los datos de salud.'
      : 'Sin consentimiento explícito no podemos tratar tus datos de salud.' };
  var nac = form.querySelector('[name="nacimiento"]');
  var e = nac ? edadDe(nac.value) : null;
  var rep = null;
  if(e !== null && e < 18){
    if((rol==='profesor'||rol==='nutricionista') && e < 18)
      return { ok:false, msg:'Las cuentas profesionales requieren ser mayor de edad.' };
    if(e < 16){
      if(!v('jy21_rep_nombre') || !v('jy21_rep_email') || !v('jy21_rep_ok'))
        return { ok:false, msg:'Se requiere el consentimiento del padre, madre o representante legal.' };
    }
    if(v('jy21_rep_nombre')) rep = { nombre:v('jy21_rep_nombre'), email:v('jy21_rep_email'), edadTitular:e };
  }
  return { ok:true, items:{
      politica:  true,
      salud:     true,
      conexion:  !!v('jy21_conexion'),
      comercial: !!v('jy21_comercial'),
      edad:      e
    }, representante: rep };
}

    if(h.indexOf('jy21-cons') >= 0) return h;
    var ancla = '<button class="btn gold" type="submit"';
    var i = h.indexOf(ancla);
    if(i < 0) return h + bloqueConsentimiento(null);
    return h.slice(0, i) + bloqueConsentimiento(null) + h.slice(i);
  };

if(typeof ligarAcceso === 'function'){
  var _ligarAcceso = ligarAcceso;
  ligarAcceso = function(){
    _ligarAcceso();
    var fc = document.querySelector('#f-crear');
    if(!fc) return;
    ligarConsentimiento(fc);
    var orig = fc.onsubmit;
    fc.onsubmit = function(e){
      e.preventDefault();
      var rolEl = fc.querySelector('[name="rol"]:checked') || fc.querySelector('[name="rol"]');
      var rol = rolEl ? rolEl.value : (typeof PERFIL_UNICO !== 'undefined' ? PERFIL_UNICO : 'alumno');
      var chequeo = validarConsentimiento(fc, rol);
      if(!chequeo.ok) return toast(chequeo.msg, 'bad');
      var antes = (S.usuarios||[]).length;
      creandoCuenta = true;                       /* el portero no molesta durante el alta */
      try{ if(typeof orig === 'function') orig.call(fc, e); }
      finally{
        if((S.usuarios||[]).length > antes){
          var u = S.usuarios[S.usuarios.length-1];
          registrarConsentimiento(u.id, chequeo.items, { representante: chequeo.representante });
          creandoCuenta = false;
          try{ if(typeof JY22 !== 'undefined' && JY22.irAPerfil) JY22.irAPerfil(u); }catch(err){}
        } else {
          creandoCuenta = false;
        }
      }
    };
  };
}

/* ---------- 21.7 · portero: sin consentimiento vigente, no se entra ---------- */
var puertaAbierta = false, creandoCuenta = false;
function portero(u){
  if(!u || puertaAbierta || creandoCuenta) return;
  if(consentimientoDe(u.id)) return;
  puertaAbierta = true;
  abrirPolitica({ aceptar:true, textoAceptar:'Acepto y autorizo', textoRechazar:'No acepto · salir' })
   .then(function(ok){
      puertaAbierta = false;
      if(ok){
        registrarConsentimiento(u.id, { politica:true, salud:true, conexion:false, comercial:false, edad:edadDe(u.nacimiento) });
        toast('Consentimiento registrado. Gracias.','ok');
        try{ pintar(); }catch(e){}
      } else {
        toast('Sin consentimiento no podemos tratar tus datos.','bad');
        try{ salir(); }catch(e){ S.sesion=null; guardar('sesion'); location.reload(); }
      }
   });
}

if(typeof pintar === 'function'){
  var _pintar = pintar;
  pintar = function(){
    _pintar();
    try{ botonFlotante(); }catch(e){}
    try{ var u = (typeof sesion === 'function') ? sesion() : null; if(u) portero(u); }catch(e){}
  };
}

          if(!ok) return;
          revocarConsentimiento(u.id, 'solicitud del titular');
          toast('Consentimiento revocado.','ok');
          try{ salir(); }catch(e){ location.reload(); }
        });
    }
  });
}

function exportarMisDatos(u){
  var mio = { generado:new Date().toISOString(), politica:POL.version, usuario:null, datos:{} };
  try{
    mio.usuario = JSON.parse(JSON.stringify(u)); delete mio.usuario.clave;
    ['vinculos','agenda','registros','metricas','horario','fichas','pautas','consentimientos','bitacora'].forEach(function(k){
      var v = S[k]; if(v == null) return;
      if(Array.isArray(v)) mio.datos[k] = v.filter(function(x){
        return x && (x.alumnoId===u.id || x.profesionalId===u.id || x.usuarioId===u.id || x.usuario===u.id || x.id===u.id);
      });
      else if(typeof v === 'object') mio.datos[k] = v[u.id] != null ? v[u.id] : null;
    });
  }catch(e){}
  try{
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(mio,null,2)], {type:'application/json'}));
    a.download = 'jyntra_mis_datos_'+u.id+'.json'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast('Descarga iniciada (derecho de portabilidad).','ok');
  }catch(e){ toast('No se pudo generar la descarga.','bad'); }
}
