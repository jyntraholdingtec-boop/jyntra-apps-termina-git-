<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JYNTRA Technologies</title>
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   JYNTRA · sistema base
   Paleta del logo: dorado #C6A15A sobre negro
   ============================================================ */
:root{
  --ink:#0D0D0D; --panel:#161616; --panel2:#1E1E1E; --raise:#262626;
  --line:#33302A; --line-soft:#262420;
  --gold:#C6A15A; --gold-hi:#E8CF95; --gold-dim:#7C6535;
  --bone:#EDE7DA; --mute:#8E877A; --mute2:#6A655C;
  --r-alumno:#5B93B8; --r-profesor:#C6A15A; --r-nutricionista:#7FB77E; --r-admin:#C0785F;
  --ok:#7FB77E; --warn:#D9A441; --bad:#C9584C; --info:#5B93B8;
  --rail:250px; --top:60px;
  --f-disp:'Barlow Condensed',Impact,sans-serif;
  --f-head:'Archivo',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --rad:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--bone); font-family:var(--f-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 600px at 82% -14%, rgba(198,161,90,.09), transparent 62%);
  background-attachment:fixed;
}
a{color:var(--gold);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2E2A24;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- tipografía utilitaria ---------- */
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dim)}
.h1{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;margin:0}
.h2{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em;margin:0}
.h3{font-family:var(--f-head);font-weight:600;font-size:14px;margin:0}
.sub{color:var(--mute);font-size:13.5px;margin:6px 0 0}
.mono{font-family:var(--f-mono)}
.num{font-family:var(--f-disp);font-weight:700;font-size:38px;line-height:1;letter-spacing:.01em}

/* ---------- marca ---------- */
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark svg{flex:none}
.brandmark .wm{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.26em;text-transform:uppercase;color:var(--bone);white-space:nowrap}
.brandmark .wm b{color:var(--gold);font-weight:700}
.brandmark .tag{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.3em;color:var(--gold-dim);text-transform:uppercase;display:block;margin-top:1px}

/* ============================================================
   ARMAZÓN
   ============================================================ */
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{
  background:linear-gradient(180deg,#131313,#0F0F0F);
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.rail-head{padding:16px 16px 12px;border-bottom:1px solid var(--line-soft)}
.rail-user{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;flex:none;border-radius:2px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;color:#0D0D0D;background:var(--gold)}
.rail-user .n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-user .r{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.nav{padding:10px 8px;overflow-y:auto;flex:1}
.nav-group{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute2);padding:14px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rad);
  color:var(--bone);font-size:13.5px;border-left:2px solid transparent;transition:background .12s,border-color .12s;
}
.nav a .ic{width:16px;text-align:center;opacity:.75;font-size:13px}
.nav a:hover{background:#1B1B1B}
.nav a.on{background:#1E1B15;border-left-color:var(--gold);color:var(--gold-hi)}
.nav a .pill{margin-left:auto;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;padding:2px 5px;border-radius:2px;background:#2A2418;color:var(--gold-dim);border:1px solid #3A3222}
.rail-foot{padding:10px 12px;border-top:1px solid var(--line-soft);display:flex;gap:8px;align-items:center;justify-content:space-between}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--top);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;
  gap:14px;padding:0 22px;position:sticky;top:0;z-index:40;
  background:rgba(13,13,13,.88);backdrop-filter:blur(10px);
}
.topbar .crumb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.topbar .crumb b{color:var(--bone);font-weight:500}
.topbar .grow{flex:1}
.content{padding:26px 22px 70px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .grow{flex:1}

/* ---------- chips / botones ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--rad);
  border:1px solid var(--line);background:var(--panel2);color:var(--bone);cursor:pointer;
  font-size:13.5px;font-weight:500;transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:var(--raise);border-color:#453F33}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0D0D0D;font-weight:600}
.btn.gold:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{background:transparent}
.btn.danger{border-color:#5A2E28;color:#E0968C}
.btn.danger:hover{background:#2A1614}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid var(--line);color:var(--mute)}
.chip.gold{border-color:var(--gold-dim);color:var(--gold);background:#1C1810}
.chip.ok{border-color:#31502F;color:var(--ok);background:#141C13}
.chip.warn{border-color:#54421C;color:var(--warn);background:#1D1810}
.chip.bad{border-color:#542C27;color:var(--bad);background:#1D1311}
.chip.info{border-color:#28414F;color:var(--info);background:#111820}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- tarjetas / rejillas ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--rad);padding:18px}
.card.pad0{padding:0}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head .grow{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

.kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--rad);padding:16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);opacity:.5}
.kpi .lab{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.kpi .num{color:var(--bone)}
.kpi .foot{font-size:12px;color:var(--mute);margin-top:6px}

/* ---------- formularios ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.inp,select.inp,textarea.inp{
  background:#121212;border:1px solid var(--line);border-radius:var(--rad);
  padding:9px 11px;width:100%;color:var(--bone);transition:border-color .12s;
}
.inp:focus{border-color:var(--gold-dim)}
textarea.inp{min-height:84px;resize:vertical}
.hint{font-size:12px;color:var(--mute2)}

/* ---------- tablas ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#191919}
.tbl td.right,.tbl th.right{text-align:right}

/* ---------- vacíos ---------- */
.empty{border:1px dashed var(--line);border-radius:var(--rad);padding:28px;text-align:center;color:var(--mute)}
.empty .h3{color:var(--bone);margin-bottom:6px}

/* ============================================================
   PIEZA CARACTERÍSTICA · EL BASTIDOR
   Cada hueco de herramienta se muestra como una placa de montaje
   con su identificador, su contrato de datos y su estado.
   ============================================================ */
.slot{
  position:relative;border:1px dashed #3D372B;border-radius:var(--rad);
  background:
    linear-gradient(180deg,rgba(198,161,90,.035),transparent 46%),
    repeating-linear-gradient(135deg,transparent 0 13px,rgba(198,161,90,.028) 13px 14px);
  padding:0;overflow:hidden;
}
.slot.mounted{border-style:solid;border-color:var(--line);background:var(--panel)}
.slot-bar{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-bottom:1px dashed #3D372B;background:#131211;flex-wrap:wrap;
}
.slot.mounted .slot-bar{border-bottom-style:solid;border-bottom-color:var(--line-soft)}
.slot-id{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--gold);white-space:nowrap}
.slot-bar .grow{flex:1}
.slot-body{padding:16px}
.slot-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 18px;text-align:center}
.slot-empty .tt{font-family:var(--f-disp);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.slot-empty .ds{color:var(--mute);font-size:13px;max-width:56ch}
.contract{width:100%;max-width:660px;text-align:left;margin-top:4px;border:1px solid var(--line-soft);border-radius:var(--rad);background:#111}
.contract .cr{display:grid;grid-template-columns:82px 1fr;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.contract .cr:last-child{border-bottom:0}
.contract .cr .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:2px}
.contract code{font-family:var(--f-mono);font-size:11.5px;color:var(--gold-hi);background:#1A1710;border:1px solid #2C2618;border-radius:2px;padding:1px 5px}
.slot iframe{width:100%;border:0;display:block;min-height:620px;background:#0D0D0D}
.slot-corner{position:absolute;width:8px;height:8px;border-color:var(--gold-dim);opacity:.7}


/* ---------- tarjeta plegable de herramienta ---------- */
.fold{border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);margin-bottom:18px;overflow:hidden}
.fold-h{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--panel2);border:0;border-bottom:1px solid transparent;padding:12px 14px;color:inherit;font:inherit}
.fold.abierto .fold-h{border-bottom-color:var(--line-soft)}
.fold-h:hover{background:var(--raise)}
.fold-ic{font-family:var(--f-mono);font-size:12px;color:var(--gold);width:14px;flex:none;transition:transform .15s}
.fold.abierto .fold-ic{transform:rotate(90deg)}
.fold-t{font-family:var(--f-display,var(--f-body));font-weight:600;font-size:15px;letter-spacing:.01em}
.fold-s{font-size:12px;color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-b{padding:0 12px 12px}
.fold-b[hidden]{display:none}
.toolframe{width:100%;border:0;display:block;background:#0A0A0A;border-radius:2px}

/* ---------- agenda: grilla semanal y edición en tabla ---------- */
.jy-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media(max-width:1100px){.jy-week{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:680px){.jy-week{grid-template-columns:repeat(1,minmax(0,1fr))}}
.jy-day{background:var(--panel2);border:1px solid var(--line-soft);border-radius:var(--rad);padding:9px;min-height:96px}
.jy-day.hoy{border-color:var(--gold-dim)}
.jy-day-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
  border-bottom:1px solid var(--line-soft);padding-bottom:6px;margin-bottom:8px}
.jy-day-h b{font-weight:600;color:var(--bone)}
.jy-day-h span{color:var(--gold)}
.jy-slot{border-left:2px solid var(--line);padding:6px 8px;margin-bottom:6px;
  background:rgba(255,255,255,.025);border-radius:2px}
.jy-slot.asignado{border-left-color:var(--gold)}
.jy-slot .hh{font-family:var(--f-mono);font-size:11px;color:var(--gold);letter-spacing:.04em}
.jy-slot .nn{font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.3}
.jy-slot .ss{font-size:10.5px;color:var(--mute);margin-top:3px;line-height:1.35}
.jy-vacio{color:var(--mute2);text-align:center;padding:14px 0;font-size:11.5px;font-family:var(--f-mono)}
.tbl .inp{padding:6px 8px;font-size:12.5px;min-height:0;border-radius:2px}
.tbl .inp.mini{max-width:104px}
.tbl-scroll{overflow-x:auto}
.tbl-scroll .tbl{min-width:940px}

/* ---------- lector / vista de solo lectura ---------- */
.readonly-note{display:flex;gap:9px;align-items:flex-start;border-left:2px solid var(--info);background:#101820;padding:10px 12px;border-radius:0 var(--rad) var(--rad) 0;font-size:13px;color:#BFD6E4}

/* ---------- portada / acceso ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.gate-art{
  position:relative;overflow:hidden;border-right:1px solid var(--line-soft);
  background:linear-gradient(160deg,#141210,#0B0B0B 62%);
  display:flex;flex-direction:column;justify-content:space-between;padding:38px;
}
.gate-art .rings{position:absolute;inset:-18% -30% auto auto;width:660px;height:660px;opacity:.5;pointer-events:none}
.gate-claim{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;font-size:clamp(38px,5.4vw,66px);line-height:.92;letter-spacing:.005em;position:relative}
.gate-claim em{font-style:normal;color:var(--gold);display:block}
.gate-pillars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);position:relative}
.gate-pillars div{background:#101010;padding:11px 13px}
.gate-pillars .i{font-family:var(--f-mono);font-size:10px;color:var(--gold-dim);letter-spacing:.16em}
.gate-pillars .t{font-size:13px;margin-top:3px}
.gate-form{display:flex;align-items:center;justify-content:center;padding:38px}
.gate-form .box{width:100%;max-width:400px}
.tabs{display:flex;gap:2px;background:#121212;border:1px solid var(--line-soft);border-radius:var(--rad);padding:3px;margin-bottom:18px}
.tabs button{flex:1;background:transparent;border:0;padding:8px;border-radius:2px;cursor:pointer;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tabs button.on{background:var(--gold);color:#0D0D0D;font-weight:600}
.rolepick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rolepick label{
  border:1px solid var(--line);border-radius:var(--rad);padding:10px;cursor:pointer;background:#121212;
  display:flex;flex-direction:column;gap:2px;transition:border-color .12s,background .12s;
}
.rolepick label:hover{border-color:#4A4436}
.rolepick input{position:absolute;opacity:0;pointer-events:none}
.rolepick input:checked+span{color:var(--gold)}
.rolepick label:has(input:checked){border-color:var(--gold-dim);background:#191610}
.rolepick .rn{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.rolepick .rd{font-size:11.5px;color:var(--mute);line-height:1.35}

/* ---------- planes ---------- */
.plan{border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}
.plan.cur{border-color:var(--gold);box-shadow:0 0 0 1px rgba(198,161,90,.25) inset}
.plan .pn{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;font-size:24px;letter-spacing:.05em}
.plan .pp{font-family:var(--f-disp);font-size:30px;font-weight:700;color:var(--gold)}
.plan .pp small{font-family:var(--f-body);font-size:12px;color:var(--mute);font-weight:400}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px;flex:1}
.plan li{display:flex;gap:8px;align-items:flex-start;color:var(--bone)}
.plan li.off{color:var(--mute2);text-decoration:line-through}
.plan li i{font-style:normal;color:var(--gold);flex:none}
.plan li.off i{color:var(--mute2)}
.plan-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--gold);color:#0D0D0D;font-family:var(--f-mono);font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 11px;border-radius:20px;box-shadow:0 4px 14px rgba(198,161,90,.35);white-space:nowrap}
.plan.svc ul{flex:none}
.plan.svc{gap:10px}

/* ---------- avisos ---------- */
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:#1B1B1B;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--rad);padding:11px 14px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .18s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;background:rgba(5,5,5,.72);z-index:150;display:grid;place-items:center;padding:18px;animation:tin .14s ease-out}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);width:min(560px,100%);max-height:88vh;overflow:auto}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.modal-b{padding:18px}
.modal-f{padding:14px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end}

.locked{border:1px solid #54421C;background:#191510;border-radius:var(--rad);padding:16px;display:flex;gap:12px;align-items:flex-start}
.locked .h3{color:var(--warn)}

/* ---------- responsive ---------- */
.railtoggle{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:120;transform:translateX(-100%);transition:transform .2s ease;height:100dvh}
  body.rail-open .rail{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  body.rail-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:110}
  .railtoggle{display:inline-flex}
  .content{padding:18px 14px 60px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gate{grid-template-columns:1fr}
  .gate-art{border-right:0;border-bottom:1px solid var(--line-soft);padding:26px;gap:26px}
  .gate-form{padding:26px 18px 46px}
  .h1{font-size:27px}
}
@media(max-width:560px){

(function(){
  /* respaldo de almacenamiento si el visor bloquea localStorage */
  try{ localStorage.setItem('__jyt','1'); localStorage.removeItem('__jyt'); }
  catch(e){
    try{
      var P = (window.parent.__jyMemStore = window.parent.__jyMemStore || {});
      Object.defineProperty(window,'localStorage',{configurable:true,value:{
        getItem:function(k){ return P[k]==null?null:P[k]; },
        setItem:function(k,v){ P[k]=String(v); },
        removeItem:function(k){ delete P[k]; },
        clear:function(){ Object.keys(P).forEach(function(k){delete P[k];}); },
        key:function(i){ return Object.keys(P)[i]||null; },
        get length(){ return Object.keys(P).length; }
      }});
    }catch(_){}
  }
  /* la cascara ajusta el alto del marco a la altura real del contenido */
  function alto(){
    var d=document.documentElement, b=document.body;
    var h=Math.max(b.scrollHeight,d.scrollHeight,b.offsetHeight,d.offsetHeight);
    try{ parent.postMessage({jyEmbed:true, accion:'alto', px:h+24}, '*'); }catch(e){}
  }
  window.addEventListener('load', function(){
    alto(); setTimeout(alto,300); setTimeout(alto,1200);
    try{ new ResizeObserver(alto).observe(document.body); }catch(e){ setInterval(alto,900); }
    document.addEventListener('click', function(){ setTimeout(alto,120); setTimeout(alto,500); }, true);
    document.addEventListener('change', function(){ setTimeout(alto,150); }, true);
  });
})();

<script>
/* Puente de guardado con la cascara JYNTRA. */
window.__jySerieCampos = function(){
  var d = {vals:{}, chips:{}};
  document.querySelectorAll('input,select,textarea').forEach(function(el){
    if(!el.id) return;
    if(el.type==='file') return;
    d.vals[el.id] = (el.type==='checkbox') ? el.checked : el.value;
  });
  document.querySelectorAll('.chip-wrap').forEach(function(w){
    var g = w.dataset.group; if(!g) return;
    var marcados = [];
    [].slice.call(w.querySelectorAll('.chip')).forEach(function(c,i){
      if(c.classList.contains('on')) marcados.push(i);
    });
    d.chips[g] = marcados;
  });
  return d;
};
window.__jyRestauraCampos = function(d, saltar){
  if(!d) return;
  saltar = saltar || /^$/;
  var v = d.vals || {};
  Object.keys(v).forEach(function(id){
    if(saltar.test(id)) return;
    var el = document.getElementById(id); if(!el) return;
    if(el.type==='checkbox') el.checked = !!v[id]; else el.value = v[id];
  });
  var c = d.chips || {};
  Object.keys(c).forEach(function(g){
    var w = document.querySelector('.chip-wrap[data-group="'+g+'"]'); if(!w) return;
    var botones = w.querySelectorAll('.chip');
    (c[g]||[]).forEach(function(i){
      var b = botones[i];
      if(b && !b.classList.contains('on')) b.click();
    });
  });
};
window.__jyMontaPuente = function(recolectar, restaurar){
  var t=null;
  function avisar(){
    clearTimeout(t);
    t = setTimeout(function(){
      try{ parent.postMessage({jyEmbed:true, accion:'estado', datos:recolectar()},'*'); }catch(e){}
    }, 500);
  }
  window.addEventListener('message', function(e){
    if(!e.data || e.data.jyEmbed!==true) return;
    if(e.data.accion==='cargar'){ try{ restaurar(e.data.datos); }catch(err){ console.warn(err); } }
  });
  window.addEventListener('load', function(){
    document.addEventListener('input',  avisar, true);
    document.addEventListener('change', avisar, true);
    document.addEventListener('click',  function(ev){ if(ev.target.closest('button')) avisar(); }, true);
    try{ parent.postMessage({jyEmbed:true, accion:'listo'},'*'); }catch(e){}
  });
};
@@JYENDSCRIPT@@

<script>
"use strict";

/* ── Estado de chips (grupos de selección múltiple) ─────────────── */
const chipGroups = ['pat','ale','les','tipoent','pre_ent','ayudas_intra','supl','pref','metodo_peso'];
const chips = {};
chipGroups.forEach(g => chips[g] = []);

document.querySelectorAll('.chip-wrap').forEach(wrap=>{
  const g = wrap.dataset.group;
  wrap.addEventListener('click', e=>{
    const b = e.target.closest('.chip');
    if(!b) return;
    b.classList.toggle('on');
    chips[g] = [...wrap.querySelectorAll('.chip.on')].map(c=>c.textContent.replace('✓ ',''));
  });
});

/* ── Rangos con valor visible ────────────────────────────────────── */
function bindRange(id, valId, suffix=''){
  const inp = document.getElementById(id), out = document.getElementById(valId);
  if(!inp || !out) return;
  const upd = ()=> out.textContent = inp.value + suffix;
  inp.addEventListener('input', upd);
  upd();
}
bindRange('f_ent','vent');
bindRange('f_dur_ses','vdur',"'");
bindRange('f_dobles','vdob');
bindRange('f_rpe','vrpe');
bindRange('f_ag','vag',' L');
bindRange('f_sn','vsn',' h');
bindRange('f_es','ves');

/* ── Horarios de comida dinámicos ───────────────────────────────── */
const MEAL_NAMES = ['Desayuno','Media mañana','Almuerzo','Merienda','Cena','Colación'];
const DEF_TIMES  = ['07:30','10:30','13:30','17:00','20:00','21:30'];
function buildHorarios(){
  const n = parseInt(document.getElementById('f_nc').value,10);
  const grid = document.getElementById('hors_grid');
  grid.innerHTML = '';
  for(let i=0;i<n;i++){
    const f = document.createElement('div');
    f.className = 'field';
    f.innerHTML = `<label class="lbl">${MEAL_NAMES[i] || 'Comida '+(i+1)}</label>
      <input type="time" id="hor_${i}" value="${DEF_TIMES[i] || '12:00'}">`;
    grid.appendChild(f);
  }
}
document.getElementById('f_nc').addEventListener('change', buildHorarios);
buildHorarios();

/* ── Card femenina condicional ──────────────────────────────────── */
function toggleFemCard(){
  document.getElementById('card_femenino').style.display =
    document.getElementById('f_sx').value === 'F' ? 'block' : 'none';
}
document.getElementById('f_sx').addEventListener('change', toggleFemCard);
toggleFemCard();

/* ── Validación mínima paso 0 ────────────────────────────────────── */
function validarPaso0(){
  const ok = val('f_nom') && val('f_ed') && val('f_pe') && val('f_ta') && val('f_dep_principal');
  document.getElementById('bn0').disabled = !ok;
}
const val = id => (document.getElementById(id)?.value || '').trim();
['f_nom','f_ed','f_pe','f_ta','f_dep_principal'].forEach(id=>{
  document.getElementById(id).addEventListener('input', validarPaso0);
});
validarPaso0();

/* ── Navegación entre pasos ─────────────────────────────────────── */
function goto(step){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('p'+step).classList.add('on');
  document.querySelectorAll('.stbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('s'+step).classList.add('active');
  if(step===1) document.getElementById('s0').classList.add('done');
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('[data-goto]').forEach(b=>{
  b.addEventListener('click', ()=> goto(b.dataset.goto));
});
document.getElementById('bn0').addEventListener('click', ()=> goto(1));
document.querySelectorAll('.stbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    if(b.dataset.step === '1' && document.getElementById('bn0').disabled) return;
    goto(b.dataset.step);
  });
});

/* ── Toast ───────────────────────────────────────────────────────── */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(()=> t.classList.remove('on'), 2200);
}

/* ── Finalizar / Imprimir ───────────────────────────────────────── */
document.getElementById('bnFinal').addEventListener('click', ()=>{
  toast('Anamnesis completa. Puede imprimirla o exportarla a PDF.');
});
document.getElementById('printBtn').addEventListener('click', ()=>{
  goto(0);
  document.getElementById('p1').classList.add('on');
  window.print();
});

/* ── Reiniciar ───────────────────────────────────────────────────── */
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('¿Reiniciar todo el formulario?')) return;
  document.querySelectorAll('input[type=text],input[type=number],input:not([type])').forEach(i=>i.value='');
  document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
  chipGroups.forEach(g=>chips[g]=[]);
  document.querySelectorAll('select').forEach(s=> s.selectedIndex = 0);
  buildHorarios();
  toggleFemCard();
  validarPaso0();
  goto(0);
});

/* Devuelve un registro a la ficha del alumno. true si la cáscara lo recibió. */
function jyGuardar(registro) {
  try {
    if (typeof window !== 'undefined' && window.parent && window.parent !== window) {
      window.parent.postMessage({ jyntra: true, accion: 'guardar', registro }, '*');
      return true;
    }
  } catch (e) { /* fuera de la cáscara: sigue funcionando como app suelta */ }
  return false;
}

/* Perfil rehidratado desde el último registro guardado en la ficha. */
function jyPerfilGuardado() {

/* --------------------------------- Fórmulas -------------------------------- */

const calculate1RM = (weight, reps, author) => {
  if (!weight || !reps || reps < 1) return 0;
  if (parseInt(reps) === 1) return parseFloat(weight);
  const w = parseFloat(weight);
  const r = parseInt(reps);
  switch (author) {
    case 'Brzycki': return w * (36 / (37 - r));
    case 'Epley':   return w * (1 + (r / 30));
    case 'Lander':  return (100 * w) / (101.3 - (2.67123 * r));
    default:        return w;
  }
};

const getRelativeStrength = (rm, bodyweight) => {
  if (!rm || !bodyweight || bodyweight <= 0) return { cat: '-', tone: 'mu' };
  const ratio = rm / bodyweight;
  if (ratio < 0.7) return { cat: 'Principiante', tone: 'bad' };
  if (ratio < 1.2) return { cat: 'Intermedio',   tone: 'warn' };
  if (ratio < 1.8) return { cat: 'Avanzado',     tone: 'info' };
  return { cat: 'Élite', tone: 'ok' };
};

const calculateBruce = (timeMinutes, gender) => {
  const t = parseFloat(timeMinutes);
  if (!t) return 0;
  if (gender === 'M') return 14.8 - (1.379 * t) + (0.451 * Math.pow(t, 2)) - (0.012 * Math.pow(t, 3));
  return (4.38 * t) - 3.9;
};

const calculateBalke = (timeMinutes, gender) => {
  const t = parseFloat(timeMinutes);
  if (!t) return 0;
  if (gender === 'M') return (1.444 * t) + 14.99;
  return (1.38 * t) + 5.22;
};

const calculateRuffier = (p0, p1, p2) => {
  const a = parseFloat(p0), b = parseFloat(p1), c = parseFloat(p2);
  if (!a || !b || !c) return null;
  return ((a + b + c) - 200) / 10;
};

const getRuffierRating = (index) => {
  if (index === null || index === undefined || isNaN(index)) return '-';
  if (index <= 5)  return 'Excelente';
  if (index <= 10) return 'Bueno';
  if (index <= 15) return 'Insuficiente';
  return 'Deficiente';
};

const getKarvonenZones = (age, measuredFcMax, measuredFcRep) => {
  const ageNum = parseInt(age) || 30;
  const fcMax = measuredFcMax ? parseInt(measuredFcMax) : (220 - ageNum);
  const fcRep = measuredFcRep ? parseInt(measuredFcRep) : 70;
  const fcRes = fcMax - fcRep;
  return {
    calentamiento: { min: Math.round(fcRep + fcRes * 0.50), max: Math.round(fcRep + fcRes * 0.60) },
    grasa:         { min: Math.round(fcRep + fcRes * 0.60), max: Math.round(fcRep + fcRes * 0.70) },
    resistencia:   { min: Math.round(fcRep + fcRes * 0.70), max: Math.round(fcRep + fcRes * 0.80) },
    maximo:        { min: Math.round(fcRep + fcRes * 0.80), max: Math.round(fcRep + fcRes * 0.95) }
  };
};

const getVO2Rating = (vo2, gen) => {
  if (!vo2) return '-';
  if (gen === 'M') {
    if (vo2 < 35) return 'Pobre';
    if (vo2 < 43) return 'Regular';
    if (vo2 < 52) return 'Bueno';
    return 'Excelente';
  }
  if (vo2 < 30) return 'Pobre';
  if (vo2 < 37) return 'Regular';
  if (vo2 < 45) return 'Bueno';
  return 'Excelente';
};

const LOGO_ICON_SRC = 'data:image/png;base64,' + LOGO_ICON_B64;

const pdfReady = () => typeof window !== 'undefined' && !!window.jspdf;

function newDoc() {
  const { jsPDF } = window.jspdf;
  return new jsPDF({ unit: 'mm', format: 'a4' });
}

function pdfHeader(doc, title) {
  doc.setFillColor(...P.ink);
  doc.rect(0, 0, 210, 42, 'F');
  doc.setFillColor(...P.gold);
  doc.rect(0, 42, 210, 1.5, 'F');

  // Logo oficial (imagen), a la izquierda del texto de marca
  try {
    doc.addImage(LOGO_ICON_SRC, 'PNG', P.L, 8, 13, 13);
  } catch (e) { /* si la imagen falla, el texto de marca sigue siendo legible */ }

  const textX = P.L + 16;
  doc.setTextColor(...P.gold);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(22);
  doc.text('JINTRA PRO', textX, 17);

  doc.setTextColor(200, 200, 200);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.text('PERFORMANCE & DATA ANALYSIS', textX, 23);

  doc.setTextColor(255, 255, 255);
  doc.setFontSize(14);
  doc.setFont('helvetica', 'bold');
  doc.text(String(title).toUpperCase(), P.R, 20, { align: 'right' });

  doc.setTextColor(150, 150, 150);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.text('FECHA DE EMISIÓN: ' + new Date().toLocaleDateString('es-CL'), P.R, 26, { align: 'right' });
}

function pdfAthlete(doc, patient, y) {
  doc.setFillColor(...P.soft);
  doc.roundedRect(P.L, y, P.W, 22, 2, 2, 'F');
  doc.setFillColor(...P.gold);
  doc.rect(P.L, y, 2, 22, 'F');

  doc.setTextColor(...P.text);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.text('ATLETA: ' + String(patient.name || '').toUpperCase(), P.L + 8, y + 8);

  doc.setFontSize(8.5);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...P.mute);
  const line = [
    patient.age ? patient.age + ' años' : null,
    patient.weight ? patient.weight + ' kg' : null,
    patient.objective || null,
    patient.phone || null
  ].filter(Boolean).join('   |   ');
  doc.text(line, P.L + 8, y + 14);
  doc.text('REPORTE CONFIDENCIAL · GENERADO POR EL SISTEMA JINTRA PRO', P.L + 8, y + 19);
  return y + 30;
}

function pdfFooter(doc) {
  const n = doc.internal.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setFillColor(...P.gold);
    doc.rect(0, 283.5, 210, 0.8, 'F');
    doc.setFillColor(...P.ink);
    doc.rect(0, 284.3, 210, 12.7, 'F');
    doc.setTextColor(205, 205, 205);
    doc.setFontSize(7.5);
    doc.setFont('helvetica', 'normal');
    doc.text('JINTRA PRO · SOFTWARE DE EVALUACIÓN DEPORTIVA', P.L, 291);
    doc.setTextColor(...P.gold);
    doc.text('Página ' + i + ' de ' + n, P.R, 291, { align: 'right' });
  }
}

function ensureRoom(doc, ctx, need) {
  if (ctx.y + need > 276) { doc.addPage(); ctx.y = 22; }
}

function pdfSection(doc, ctx, label) {
  ensureRoom(doc, ctx, 16);
  ctx.y += 3;
  doc.setFillColor(...P.gold);
  doc.rect(P.L, ctx.y - 3.5, 3, 8, 'F');
  doc.setTextColor(20, 20, 20);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10.5);
  doc.text(String(label).toUpperCase(), P.L + 6, ctx.y + 2.2);
  doc.setDrawColor(...P.line);
  doc.setLineWidth(0.3);
  doc.line(P.L + 6 + doc.getTextWidth(String(label).toUpperCase()) + 4, ctx.y + 1, P.R, ctx.y + 1);
  ctx.y += 11;
}

function pdfHero(doc, ctx, { value, unit, caption, badge, badgeTone, extras = [] }) {
  ensureRoom(doc, ctx, 34);
  const h = 28;
  doc.setFillColor(...P.ink);
  doc.roundedRect(P.L, ctx.y, P.W, h, 2.5, 2.5, 'F');
  doc.setFillColor(...P.gold);
  doc.rect(P.L, ctx.y, P.W, 1.2, 'F');

  doc.setTextColor(150, 148, 140);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5);
  doc.text(String(caption).toUpperCase(), P.L + 8, ctx.y + 10);

  doc.setTextColor(...P.gold);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(28);
  doc.text(String(value), P.L + 8, ctx.y + 22);
  const vw = doc.getTextWidth(String(value));
  doc.setFontSize(9);
  doc.setTextColor(210, 208, 200);
  doc.setFont('helvetica', 'normal');
  if (unit) doc.text(unit, P.L + 10 + vw, ctx.y + 22);

  if (badge) {
    const t = TONE[badgeTone] || TONE.gold;
    const bw = 52;
    doc.setFillColor(...t.rgb);
    doc.roundedRect(P.R - bw - 6, ctx.y + 9, bw, 10, 5, 5, 'F');
    doc.setTextColor(10, 10, 10);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9.5);
    doc.text(String(badge).toUpperCase(), P.R - bw / 2 - 6, ctx.y + 15.7, { align: 'center' });
  }

  if (extras.length) {
    doc.setFontSize(7.5);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(160, 158, 150);
    doc.text(extras.join('     '), P.R - 6, ctx.y + 24.5, { align: 'right' });
  }
  ctx.y += h + 8;
}

/* Instrumento de medición: barra normativa con segmentos, ticks y aguja. */
function pdfScale(doc, ctx, { scale, value, title }) {
  ensureRoom(doc, ctx, 32);
  const { min, max, segments, unit, decimals } = scale;
  const x0 = P.L, w = P.W, barY = ctx.y + 8, barH = 7;

  if (title) {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(...P.mute);
    doc.text(String(title).toUpperCase(), x0, ctx.y + 3.5);
  }

  segments.forEach((s) => {
    const sx = x0 + ((s.from - min) / (max - min)) * w;
    const sw = ((s.to - s.from) / (max - min)) * w;
    const t = TONE[s.tone];
    doc.setFillColor(t.rgb[0], t.rgb[1], t.rgb[2]);
    doc.rect(sx, barY, sw, barH, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(6.5);
    if (sw > 16) doc.text(s.label.toUpperCase(), sx + sw / 2, barY + 4.6, { align: 'center' });
    doc.setTextColor(...P.mute);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(6);
    doc.text(String(s.from), sx, barY + barH + 4);
  });
  doc.setTextColor(...P.mute);
  doc.setFontSize(6);
  doc.text(String(max), x0 + w, barY + barH + 4, { align: 'right' });

  const v = clamp(Number(value), min, max);
  const mx = x0 + ((v - min) / (max - min)) * w;
  doc.setFillColor(...P.ink);
  doc.triangle(mx, barY - 1.2, mx - 2.6, barY - 5.4, mx + 2.6, barY - 5.4, 'F');
  doc.setDrawColor(...P.ink);
  doc.setLineWidth(0.8);
  doc.line(mx, barY, mx, barY + barH);

  const lab = fmt(value, decimals) + ' ' + (unit || '');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7.5);
  const lw = doc.getTextWidth(lab) + 6;
  const lx = clamp(mx - lw / 2, x0, x0 + w - lw);
  doc.setFillColor(...P.ink);
  doc.roundedRect(lx, barY - 12, lw, 6.5, 1.5, 1.5, 'F');
  doc.setTextColor(...P.gold);
  doc.text(lab, lx + lw / 2, barY - 7.6, { align: 'center' });

  ctx.y = barY + barH + 12;
}

function pdfKV(doc, ctx, rows) {
  rows.forEach((r, i) => {
    const label = String(r.label);
    const value = String(r.value == null || r.value === '' ? '-' : r.value);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    const vLines = doc.splitTextToSize(value, 86);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8.5);
    const lLines = doc.splitTextToSize(label, 76);
    const h = Math.max(lLines.length, vLines.length) * 4.6 + 5;
    ensureRoom(doc, ctx, h + 2);

    if (i % 2 === 0) {
      doc.setFillColor(250, 249, 246);
      doc.rect(P.L, ctx.y - 4, P.W, h, 'F');
    }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8.5);
    doc.setTextColor(...P.mute);
    doc.text(lLines, P.L + 3, ctx.y);

    if (r.tone) {
      const t = TONE[r.tone];
      doc.setFillColor(...t.bgPdf);
      doc.roundedRect(P.L + 92, ctx.y - 4.4, 54, 7.5, 3.5, 3.5, 'F');
      doc.setTextColor(...t.txPdf);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.text(value.toUpperCase(), P.L + 119, ctx.y + 0.7, { align: 'center' });
    } else {
      doc.setFont('helvetica', r.strong ? 'bold' : 'normal');
      doc.setFontSize(9);
      doc.setTextColor(...P.text);
      doc.text(vLines, P.L + 92, ctx.y);
    }
    ctx.y += h;
  });
  ctx.y += 4;
}

/* Rejilla de cargas por porcentaje, agrupada por zona de trabajo */
function pdfLoadGrid(doc, ctx, rm) {
  RM_ZONES.forEach((z) => {
    const cells = z.percents.length;
    ensureRoom(doc, ctx, 24);
    const t = TONE[z.tone];
    doc.setFillColor(...t.bgPdf);
    doc.roundedRect(P.L, ctx.y, P.W, 20, 2, 2, 'F');
    doc.setFillColor(...t.rgb);
    doc.rect(P.L, ctx.y, 2, 20, 'F');

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(...t.txPdf);
    doc.text(z.name.toUpperCase(), P.L + 6, ctx.y + 7);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7);
    doc.text(z.range + ' · ' + z.reps, P.L + 6, ctx.y + 12);

    const gx = P.L + 62, gw = P.W - 68, cw = gw / cells;
    z.percents.forEach((p, i) => {
      const cx = gx + i * cw;
      doc.setFillColor(255, 255, 255);
      doc.roundedRect(cx + 1.5, ctx.y + 3, cw - 3, 14, 1.5, 1.5, 'F');
      doc.setFontSize(6.5);
      doc.setTextColor(...P.mute);
      doc.setFont('helvetica', 'normal');
      doc.text(p + '%', cx + cw / 2, ctx.y + 8, { align: 'center' });
      doc.setFontSize(10);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(...P.text);
      doc.text(fmt(rm * (p / 100), 1) + ' kg', cx + cw / 2, ctx.y + 14, { align: 'center' });
    });
    ctx.y += 24;
  });
  ctx.y += 2;
}

function pdfTable(doc, ctx, head, rows) {
  if (!rows.length) return;
  const cols = head.length;
  const cw = P.W / cols;
  ensureRoom(doc, ctx, 16);
  doc.setFillColor(...P.ink);
  doc.rect(P.L, ctx.y - 4, P.W, 8, 'F');
  doc.setTextColor(...P.gold);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7.5);
  head.forEach((h, i) => doc.text(String(h).toUpperCase(), P.L + 3 + i * cw, ctx.y + 1));
  ctx.y += 8;

  const fs = cols >= 4 ? 7.8 : 8.5;
  rows.forEach((r, ri) => {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(fs);
    const cells = r.map((c) => doc.splitTextToSize(String(c), cw - 5));
    const lines = Math.max.apply(null, cells.map((c) => c.length));
    const h = lines * 4.2 + 3.6;
    ensureRoom(doc, ctx, h + 2);
    if (ri % 2 === 0) {
      doc.setFillColor(250, 249, 246);
      doc.rect(P.L, ctx.y - 4, P.W, h, 'F');
    }
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(fs);
    doc.setTextColor(...P.text);
    cells.forEach((c, i) => doc.text(c, P.L + 3 + i * cw, ctx.y + 0.8));
    ctx.y += h;
  });
  ctx.y += 6;
}

function pdfNote(doc, ctx, text) {
  const lines = doc.splitTextToSize(text, P.W - 12);
  const h = lines.length * 4.4 + 9;
  ensureRoom(doc, ctx, h + 4);
  doc.setFillColor(252, 249, 238);
  doc.roundedRect(P.L, ctx.y - 4, P.W, h, 2, 2, 'F');
  doc.setFillColor(...P.gold);
  doc.rect(P.L, ctx.y - 4, 2, h, 'F');
  doc.setFont('helvetica', 'italic');
  doc.setFontSize(8);
  doc.setTextColor(90, 80, 45);
  doc.text(lines, P.L + 6, ctx.y + 1.5);
  ctx.y += h + 4;
}

/* Compositor: recibe un "reporte" declarativo y lo dibuja. */
function buildPDF(report) {
  const doc = newDoc();
  pdfHeader(doc, report.title);
  const ctx = { y: pdfAthlete(doc, report.patient, 52) };

  report.blocks.forEach((b) => {
    if (b.type === 'section') pdfSection(doc, ctx, b.label);
    if (b.type === 'hero')    pdfHero(doc, ctx, b);
    if (b.type === 'scale')   pdfScale(doc, ctx, b);
    if (b.type === 'kv')      pdfKV(doc, ctx, b.rows);
    if (b.type === 'loads')   pdfLoadGrid(doc, ctx, b.rm);
    if (b.type === 'table')   pdfTable(doc, ctx, b.head, b.rows);
    if (b.type === 'note')    pdfNote(doc, ctx, b.text);
  });

  pdfFooter(doc);
  const clean = (s) => String(s || 'atleta').replace(/\s+/g, '_').replace(/[^\w\-]/g, '');
  doc.save('JINTRA_' + clean(report.title) + '_' + clean(report.patient.name) + '.pdf');
}

/* ============================== Componentes UI ============================= */

function Ruler({ scale, value, label, compact }) {
  const { min, max, segments, unit, decimals } = scale;
  const has = value !== '' && value !== null && value !== undefined && isFinite(Number(value));
  const v = has ? clamp(Number(value), min, max) : null;
  const pct = has ? ((v - min) / (max - min)) * 100 : 0;

  return (
    <div className={'jt-ruler' + (compact ? ' is-compact' : '')}>
      {label && <div className="jt-ruler-title">{label}</div>}
      <div className="jt-ruler-track">
        {segments.map((s) => (
          <div
            key={s.label}
            className="jt-ruler-seg"
            style={{
              width: ((s.to - s.from) / (max - min)) * 100 + '%',
              background: TONE[s.tone].hex
            }}
          >
            <span>{s.label}</span>
          </div>
        ))}
        {has && (
          <div className="jt-ruler-needle" style={{ left: pct + '%' }}>
            <div className="jt-ruler-chip">{fmt(v, decimals)}<em>{unit}</em></div>
          </div>
        )}
      </div>
      <div className="jt-ruler-ticks">
        {segments.map((s) => (
          <span key={'t' + s.from} style={{ left: ((s.from - min) / (max - min)) * 100 + '%' }}>{s.from}</span>
        ))}
        <span style={{ left: '100%' }} className="is-end">{max}</span>
      </div>
    </div>
  );
}

function Gauge({ value, scale, unit, caption, decimals = 1 }) {
  const { min, max, segments } = scale;
  const has = value !== '' && value !== null && isFinite(Number(value)) && Number(value) !== 0;
  const v = has ? clamp(Number(value), min, max) : min;
  const R = 78, CX = 100, CY = 96, SW = 16;

  const polar = (r, ang) => {
    const a = (Math.PI * (180 - ang)) / 180;
    return [CX + r * Math.cos(a), CY - r * Math.sin(a)];
  };
  const arc = (r, a0, a1) => {
    const [x0, y0] = polar(r, a0);
    const [x1, y1] = polar(r, a1);
    return 'M ' + x0 + ' ' + y0 + ' A ' + r + ' ' + r + ' 0 0 1 ' + x1 + ' ' + y1;
  };
  const toAng = (val) => ((clamp(val, min, max) - min) / (max - min)) * 180;
  const needle = toAng(v);
  const [nx, ny] = polar(R - 24, needle);

  return (
    <div className="jt-gauge">
      <svg viewBox="0 0 200 118" className="jt-gauge-svg">
        <path d={arc(R, 0, 180)} stroke="rgba(255,255,255,.05)" strokeWidth={SW} fill="none" strokeLinecap="round" />
        {segments.map((s) => (
          <path
            key={s.label}
            d={arc(R, toAng(s.from), toAng(s.to))}
            stroke={TONE[s.tone].hex}
            strokeWidth={SW}
            fill="none"
            opacity={has ? 1 : 0.35}
          />
        ))}
        {has && (
          <g className="jt-needle">
            <line x1={CX} y1={CY} x2={nx} y2={ny} stroke="#F3DFA0" strokeWidth="3" strokeLinecap="round" />
            <circle cx={CX} cy={CY} r="6" fill="#0B0B0B" stroke="#D4AF37" strokeWidth="2.5" />
          </g>
        )}
      </svg>
      <div className="jt-gauge-read">
        <strong>{has ? fmt(v, decimals) : '--'}</strong>
        <span>{unit}</span>
      </div>
      <div className="jt-gauge-cap">{caption}</div>
    </div>
  );
}

function Verdict({ cat }) {
  if (!cat || cat === '-') {
    return <div className="jt-verdict is-empty">Ingresa los datos para obtener la clasificación</div>;
  }
  const t = TONE[toneOf(cat)];
  return (
    <div className="jt-verdict" style={{ borderColor: t.hex, background: t.soft, color: t.hex }}>
      <CheckCircle2 size={18} /> {cat}
    </div>
  );
}

function Delta({ current, previous, unit, invert }) {
  if (previous == null || !isFinite(previous)) return null;
  const d = Number(current) - Number(previous);
  const better = invert ? d < 0 : d > 0;
  if (Math.abs(d) < 0.05) {
    return <span className="jt-delta is-flat"><Minus size={12} /> sin cambios vs. registro anterior</span>;
  }
  return (
    <span className={'jt-delta ' + (better ? 'is-up' : 'is-down')}>
      {better ? <TrendingUp size={12} /> : <TrendingDown size={12} />}
      {(d > 0 ? '+' : '') + fmt(d, 1)} {unit} vs. registro anterior
    </span>
  );
}

function Spark({ values }) {
  if (!values || values.length < 2) return null;
  const max = Math.max(...values), min = Math.min(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * 100;
    const y = 30 - ((v - min) / span) * 26 - 2;
    return x + ',' + y;
  }).join(' ');
  return (
    <svg viewBox="0 0 100 30" preserveAspectRatio="none" className="jt-spark">
      <polyline points={pts} fill="none" stroke="#D4AF37" strokeWidth="1.6" vectorEffect="non-scaling-stroke" />
    </svg>
  );
}

function Panel({ title, sub, icon, children, tone }) {
  return (
    <section className="jt-panel">
      {title && (
        <header className="jt-panel-h">
          <span className="jt-panel-icon" style={tone ? { color: TONE[tone].hex } : null}>{icon}</span>
          <div>
            <h3>{title}</h3>
            {sub && <p>{sub}</p>}
          </div>
        </header>
      )}
      <div className="jt-panel-b">{children}</div>
    </section>
  );
}

function Field({ label, hint, children }) {
  return (
    <label className="jt-field">
      <span className="jt-field-l">{label}{hint && <em>{hint}</em>}</span>
      {children}
    </label>
  );
}

            </span>

/* -------------------- Zonas de FC · acordeón desplegable ------------------- */

function HeartRateZones({ zones, zoneRows, fcMaxShown, fcRep }) {
  const [open, setOpen] = useState(() => new Set([zoneRows[0]?.k]));

  const toggle = (k) => {
    setOpen((prev) => {
      const next = new Set(prev);
      next.has(k) ? next.delete(k) : next.add(k);
      return next;
    });
  };

  return (
    <div className="jt-zones jt-zones-acc">
      {zoneRows.map((z) => {
        const isOpen = open.has(z.k);
        const total = fcMaxShown - (parseInt(fcRep) || 70);
        const w = ((zones[z.k].max - zones[z.k].min) / (total || 1)) * 100;
        return (
          <div key={z.k} className={'jt-zone jt-zone-acc' + (isOpen ? ' is-open' : '')} style={{ borderColor: TONE[z.tone].hex, background: TONE[z.tone].soft }}>
            <button type="button" className="jt-zone-acc-h" onClick={() => toggle(z.k)} aria-expanded={isOpen}>
              <div className="jt-zone-t">
                <span style={{ color: TONE[z.tone].hex }}>{z.label}</span>
                <em>{z.pct}</em>
              </div>
              <div className="jt-zone-acc-r">
                <strong>{zones[z.k].min}<i>–</i>{zones[z.k].max}<em>lpm</em></strong>
                <ChevronDown size={16} className="jt-zone-chev" />
              </div>
            </button>
            {isOpen && (
              <div className="jt-zone-acc-body">
                <div className="jt-zone-bar"><span style={{ width: clamp(w * 3, 12, 100) + '%', background: TONE[z.tone].hex }} /></div>
                <p>{z.use}</p>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Gestion({ patient, setPatient, notify, exportPDF, ready }) {
  /* Si la herramienta va montada en la cáscara, el formulario parte con los
     datos que ya tiene la ficha del alumno (nombre, edad, peso, objetivo). */
  const [form, setForm] = useState(patient || {
    name: JYA.nombre || '',
    age: JYA.edad ? String(JYA.edad) : '',
    weight: JYA.peso ? String(JYA.peso) : '',
    phone: JYA.telefono || '+56999826310',
    objective: (JYA.objetivo && OBJECTIVES.indexOf(JYA.objetivo) >= 0) ? JYA.objetivo : OBJECTIVES[0],
    fcRep: '', fcMax: ''
  });

  const zones = form.age ? getKarvonenZones(form.age, form.fcMax, form.fcRep) : null;
  const fcMaxShown = form.fcMax ? parseInt(form.fcMax) : (form.age ? 220 - parseInt(form.age) : null);
  const valid = form.name && form.age && form.weight;

  const zoneRows = zones ? [
    { k: 'calentamiento', label: 'Calentamiento', pct: '50–60%', tone: 'info', use: 'Activación y vuelta a la calma' },
    { k: 'grasa',         label: 'Quema de grasa', pct: '60–70%', tone: 'ok',   use: 'Trabajo aeróbico base, larga duración' },
    { k: 'resistencia',   label: 'Resistencia',    pct: '70–80%', tone: 'warn', use: 'Umbral aeróbico, ritmo sostenido' },
    { k: 'maximo',        label: 'Máximo',         pct: '80–95%', tone: 'bad',  use: 'Intervalos y potencia aeróbica' }
  ] : [];

  const save = () => {
    if (!valid) { notify('Completa nombre, edad y peso para guardar el perfil.', 'bad'); return; }
    const registros = patient?.records || {};
    setPatient({ ...form, records: registros });
    /* puente JYNTRA: el perfil queda en la ficha del alumno (pilar 5) */
    const enFicha = jyGuardar({
      modulo: 'evaluacion', tipo: 'Perfil del atleta',
      datos: {
        nombre: form.name, edad: form.age, peso: form.weight,
        telefono: form.phone, objetivo: form.objective,
        fcReposo: form.fcRep, fcMaxMedida: form.fcMax,
        fcMaxTrabajo: fcMaxShown || '',
        zonas: zones ? {
          calentamiento: zones.calentamiento.min + '-' + zones.calentamiento.max,
          grasa:         zones.grasa.min + '-' + zones.grasa.max,
          resistencia:   zones.resistencia.min + '-' + zones.resistencia.max,
          maximo:        zones.maximo.min + '-' + zones.maximo.max
        } : null,
        perfil: Object.assign({}, form, { records: undefined }),
        registros
      }
    });
    notify(enFicha ? 'Perfil guardado en la ficha del alumno' : 'Perfil guardado');
  };

  const pdf = () => {
    if (!valid) { notify('Completa nombre, edad y peso antes de generar el PDF.', 'bad'); return; }
    const blocks = [
      { type: 'hero', caption: 'Frecuencia cardíaca máxima de trabajo', value: String(fcMaxShown || '-'), unit: 'lpm',
        badge: form.objective, badgeTone: 'gold',
        extras: ['FC reposo ' + (form.fcRep || '—') + ' lpm', 'Reserva ' + (fcMaxShown && form.fcRep ? fcMaxShown - parseInt(form.fcRep) : '—') + ' lpm'] },
      { type: 'section', label: 'Información personal' },
      { type: 'kv', rows: [
        { label: 'Nombre completo', value: form.name, strong: true },
        { label: 'Edad', value: form.age + ' años' },
        { label: 'Peso corporal', value: form.weight + ' kg' },
        { label: 'Teléfono de contacto', value: form.phone },
        { label: 'Objetivo principal', value: form.objective, tone: 'gold' }
      ]},
      { type: 'section', label: 'Métricas cardíacas' },
      { type: 'kv', rows: [
        { label: 'Frecuencia de reposo', value: form.fcRep ? form.fcRep + ' lpm' : 'No registrada' },
        { label: 'Frecuencia máxima', value: form.fcMax ? form.fcMax + ' lpm (medida)' : (fcMaxShown ? fcMaxShown + ' lpm (fórmula 220 − edad)' : 'No disponible') }
      ]}

    if (zones) {
      blocks.push({ type: 'section', label: 'Zonas de entrenamiento · Karvonen' });
      blocks.push({ type: 'table',
        head: ['Zona', 'Intensidad', 'Rango (lpm)', 'Uso principal'],
        rows: zoneRows.map((z) => [z.label, z.pct, zones[z.k].min + ' – ' + zones[z.k].max, z.use]) });
      blocks.push({ type: 'note', text: 'Las zonas se calculan con el método de Karvonen sobre la frecuencia cardíaca de reserva (FC máx − FC reposo). Si la FC máxima fue estimada por fórmula, considera un margen de ±10 lpm.' });
    }
    exportPDF({ title: 'Perfil del Atleta', patient: form, blocks });
  };

  const whats = () => sendWhats(form.phone,
    '*JINTRA PRO · PERFIL DEL ATLETA*\nPerfil de ' + form.name + ' actualizado.\n\n*Objetivo:* ' + form.objective +
    '\n*Peso:* ' + form.weight + ' kg' + (zones ? '\n*Zona quema grasa:* ' + zones.grasa.min + '–' + zones.grasa.max + ' lpm' : ''));

  return (
    <div className="jt-stack">
      <Panel title="Perfil del atleta" sub="Estos datos alimentan el cálculo de fuerza relativa y las zonas cardíacas." icon={<User size={18} />} tone="gold">
        <div className="jt-grid-2">
          <div className="jt-col">
            <h4 className="jt-sub">Identificación</h4>
            <Field label="Nombre completo">
              <input className="jt-input" placeholder="Ej. Juan Pérez" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
            </Field>
            <Field label="Teléfono WhatsApp">
              <input className="jt-input" placeholder="+56 9 9982 6310" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
            </Field>
            <div className="jt-row-2">
              <Field label="Edad" hint="años">
                <input type="number" className="jt-input" placeholder="0" value={form.age} onChange={(e) => setForm({ ...form, age: e.target.value })} />
              </Field>
              <Field label="Peso" hint="kg">
                <input type="number" className="jt-input" placeholder="0" value={form.weight} onChange={(e) => setForm({ ...form, weight: e.target.value })} />
              </Field>
            </div>
            <Field label="Objetivo principal">
              <select className="jt-input" value={form.objective} onChange={(e) => setForm({ ...form, objective: e.target.value })}>
                {OBJECTIVES.map((o) => <option key={o} value={o}>{o}</option>)}
              </select>
            </Field>
          </div>

          <div className="jt-col">
            <h4 className="jt-sub">Monitoreo cardíaco</h4>
            <div className="jt-row-2">
              <Field label="FC reposo" hint="lpm">
                <input type="number" className="jt-input" placeholder="Ej. 65" value={form.fcRep} onChange={(e) => setForm({ ...form, fcRep: e.target.value })} />
              </Field>
              <Field label="FC máx real" hint="opcional">
                <input type="number" className="jt-input" placeholder="Ej. 195" value={form.fcMax} onChange={(e) => setForm({ ...form, fcMax: e.target.value })} />
              </Field>
            </div>

            <div className="jt-fcbox">
              <div className="jt-fcbox-h">
                <span>Frecuencia máxima de trabajo</span>
                <strong>{fcMaxShown || '--'}<em>lpm</em></strong>
              </div>
              <p className="jt-hint">{form.fcMax ? 'Medida en test directo.' : 'Estimada con 220 − edad. Ingresa la FC máx real para mayor precisión.'}</p>
            </div>

            {zones ? (
              <HeartRateZones zones={zones} zoneRows={zoneRows} fcMaxShown={fcMaxShown} fcRep={form.fcRep} />
            ) : (
              <div className="jt-note">Ingresa la edad para desplegar las zonas de Karvonen.</div>
            )}
          </div>
        </div>

        <Actions onSave={save} onPdf={pdf} onWhats={whats} saveLabel="Guardar perfil" ready={ready} />
      </Panel>
    </div>
  );
}

/* -------------------------------- 03 · 1RM -------------------------------- */

function RM({ patient, setPatient, notify, exportPDF, ready }) {
  const [exercise, setExercise] = useState(EXERCISES[0]);
  const [weight, setWeight] = useState('');
  const [reps, setReps] = useState('');
  const [author, setAuthor] = useState('Brzycki');
  const [openId, setOpenId] = useState(null);

  const rm = useMemo(() => calculate1RM(weight, reps, author), [weight, reps, author]);
  const all = useMemo(() => RM_AUTHORS.map((a) => ({ a, v: calculate1RM(weight, reps, a) })), [weight, reps]);
  const ratio = rm && patient.weight ? rm / patient.weight : 0;
  const level = getRelativeStrength(rm, patient.weight);

  const history = patient.records?.RM || [];
  const sameEx = history.filter((r) => r.exercise === exercise);
  const prev = sameEx.length ? parseFloat(sameEx[0].rm) : null;

  // Respaldo para registros guardados antes de existir el campo "zones"
  const zonesOf = (r) => r.zones || RM_ZONES.map((z) => ({
    name: z.name, tone: z.tone, range: z.range, reps: z.reps,
    loads: z.percents.map((p) => ({ p, kg: (parseFloat(r.rm) * (p / 100)).toFixed(1) }))
  }));

  const valid = rm > 0;

  const save = () => {
    if (!valid) { notify('Ingresa peso y repeticiones para guardar.', 'bad'); return; }
    const zones = RM_ZONES.map((z) => ({
      name: z.name, tone: z.tone, range: z.range, reps: z.reps,
      loads: z.percents.map((p) => ({ p, kg: (rm * (p / 100)).toFixed(1) }))
    }));
    const rec = {
      id: Date.now(), exercise, weight, reps, author,
      rm: rm.toFixed(1), ratio: ratio.toFixed(2), level: level.cat,
      zones,
      date: new Date().toLocaleDateString('es-CL')
    };
    const registros = { ...patient.records, RM: [rec, ...history] };
    setPatient({ ...patient, records: registros });
    /* puente JYNTRA: la toma de 1RM cae en la ficha del alumno (pilar 5) */
    const enFicha = jyGuardar({
      modulo: 'evaluacion', tipo: 'Fuerza 1RM · ' + exercise,
      datos: {
        nombre: patient.name, ejercicio: exercise,
        pesoMovido: weight, repeticiones: reps, formula: author,
        rm: rec.rm, fuerzaRelativa: rec.ratio, clasificacion: rec.level,
        pesoCorporal: patient.weight, fecha: rec.date,
        perfil: {
          name: patient.name, age: patient.age, weight: patient.weight,
          phone: patient.phone, objective: patient.objective,
          fcRep: patient.fcRep || '', fcMax: patient.fcMax || ''
        },
        registros
      }
    });
    notify(enFicha ? '1RM guardado en la ficha del alumno' : '1RM guardado en el historial');
  };

  const pdf = () => {
    if (!valid) { notify('Ingresa peso y repeticiones antes de generar el PDF.', 'bad'); return; }

    // Agrupa TODAS las evaluaciones guardadas (todos los ejercicios), no solo el actual.
    const byExercise = {};
    history.forEach((r) => {
      if (!byExercise[r.exercise]) byExercise[r.exercise] = [];
      byExercise[r.exercise].push(r);
    });
    const exerciseNames = Object.keys(byExercise);

    const perExerciseBlocks = exerciseNames.flatMap((ex) => {
      const recs = byExercise[ex]; // más reciente primero
      const latest = recs[0];
      return [
        { type: 'section', label: ex + ' · último 1RM registrado' },
        { type: 'kv', rows: [
          { label: 'Fecha de la última toma', value: latest.date },
          { label: 'Base del cálculo', value: latest.weight + ' kg × ' + latest.reps + ' reps · ' + latest.author },
          { label: '1RM estimado', value: latest.rm + ' kg', strong: true },
          { label: 'Fuerza relativa', value: latest.ratio + '× peso corporal', tone: toneOf(latest.level) },
          { label: 'Clasificación', value: latest.level, tone: toneOf(latest.level) }
        ]},
        { type: 'loads', rm: parseFloat(latest.rm) },
        ...(recs.length > 1 ? [
          { type: 'table', head: ['Fecha', 'Base', 'Fórmula', '1RM'],
            rows: recs.slice(0, 8).map((r) => [r.date, r.weight + ' kg × ' + r.reps, r.author, r.rm + ' kg']) }
        ] : [])
      ];
    });

    exportPDF({
      title: 'Fuerza 1RM',
      patient,
      blocks: [
        { type: 'hero', caption: exercise + ' · valores actuales en la calculadora', value: fmt(rm, 1), unit: 'kg (1RM estimado)',
          badge: level.cat, badgeTone: level.tone,
          extras: [weight + ' kg × ' + reps + ' reps', 'Fórmula ' + author] },
        { type: 'scale', scale: SCALES.relStrength, value: ratio, title: 'Fuerza relativa al peso corporal' },
        { type: 'section', label: 'Comparativa entre fórmulas · ' + exercise },
        { type: 'table', head: ['Fórmula', '1RM estimado', 'Diferencia vs. aplicada'],
          rows: all.map((x) => [x.a, fmt(x.v, 1) + ' kg', (x.v - rm >= 0 ? '+' : '') + fmt(x.v - rm, 1) + ' kg']) },
        { type: 'section', label: 'Resumen de todas las evaluaciones de 1RM registradas' },
        ...(history.length ? [
          { type: 'table', head: ['Fecha', 'Ejercicio', 'Base', 'Fórmula', '1RM', 'F. Relativa', 'Clasificación'],
            rows: history.map((r) => [r.date, r.exercise, r.weight + ' kg × ' + r.reps, r.author, r.rm + ' kg', r.ratio + '×', r.level]) }
        ] : [
          { type: 'note', text: 'Aún no hay evaluaciones guardadas en el historial; este PDF solo refleja los valores actuales de la calculadora.' }
        ]),
        ...(perExerciseBlocks.length ? [
          { type: 'section', label: 'Cargas de trabajo por zona · cada ejercicio evaluado' },
          ...perExerciseBlocks
        ] : [
          { type: 'section', label: 'Cargas de trabajo por zona · ' + exercise },
          { type: 'loads', rm }
        ]),
        { type: 'note', text: 'El 1RM es una estimación indirecta calculada a partir de una serie submáxima. Su precisión disminuye por sobre las 10 repeticiones; para cargas de fuerza máxima, revalida cada 4 a 6 semanas. Este reporte incluye todas las evaluaciones de 1RM guardadas en el historial del atleta, agrupadas por ejercicio.' }
      ]
    });
  };

  const whats = () => sendWhats(patient.phone,
    '*JINTRA PRO · FUERZA 1RM*\n' + patient.name + ', resultado de ' + exercise + ':\n\n*1RM estimado:* ' + fmt(rm, 1) +
    ' kg\n*Fuerza relativa:* ' + fmt(ratio, 2) + '× (' + level.cat + ')\n\n_En el PDF están todas tus evaluaciones de 1RM guardadas, con sus cargas exactas por zona._');

  return (
    <div className="jt-stack">
      <Panel title="Calculadora de 1RM" sub="Fórmulas de Brzycki, Epley y Lander sobre una serie submáxima." icon={<Calculator size={18} />} tone="gold">
        <div className="jt-rm-top">
          <div className="jt-col">
            <Field label="Ejercicio">
              <select className="jt-input" value={exercise} onChange={(e) => setExercise(e.target.value)}>
                {EXERCISES.map((x) => <option key={x} value={x}>{x}</option>)}
              </select>
            </Field>
            <div className="jt-row-2">
              <Field label="Peso movilizado" hint="kg">
                <input type="number" min="0" className="jt-input jt-input-xl" placeholder="0" value={weight} onChange={(e) => setWeight(e.target.value)} />
              </Field>
              <Field label="Repeticiones" hint="1 a 15">
                <input type="number" min="1" max="15" className="jt-input jt-input-xl" placeholder="0" value={reps} onChange={(e) => setReps(e.target.value)} />
              </Field>
            </div>
            <div className="jt-seg">
              {RM_AUTHORS.map((a) => (
                <button key={a} className={'jt-seg-b' + (author === a ? ' is-on' : '')} onClick={() => setAuthor(a)}>
                  {a}
                  <em>{all.find((x) => x.a === a)?.v > 0 ? fmt(all.find((x) => x.a === a).v, 1) + ' kg' : '—'}</em>
                </button>
              ))}
            </div>
          </div>

          <div className="jt-readout">
            <span className="jt-eyebrow">1RM estimado</span>
            <div className="jt-bignum">{valid ? fmt(rm, 1) : '--'}<em>kg</em></div>
            <Verdict cat={valid ? level.cat : null} />
            {valid && <Delta current={rm} previous={prev} unit="kg" />}
            {sameEx.length > 1 && <Spark values={[...sameEx].reverse().map((r) => parseFloat(r.rm))} />}
          </div>
        </div>

        <Ruler scale={SCALES.relStrength} value={valid ? ratio : ''} label={'Fuerza relativa · ' + fmt(ratio, 2) + '× de ' + patient.weight + ' kg de peso corporal'} />

        <Actions onSave={save} onPdf={pdf} onWhats={whats} saveLabel="Guardar 1RM" ready={ready} />
      </Panel>

      <Panel title="Cargas por zona de trabajo" sub="Calculadas sobre el 1RM actual. Úsalas para prescribir la sesión." icon={<Dumbbell size={18} />} tone="gold">
        <div className="jt-zonegrid">
          {RM_ZONES.map((z) => (
            <div key={z.name} className="jt-zonecard" style={{ borderColor: TONE[z.tone].hex, background: TONE[z.tone].soft }}>
              <div className="jt-zonecard-h">
                <span style={{ color: TONE[z.tone].hex }}><Activity size={14} /> {z.name}</span>
                <div><em>{z.range}</em><i>{z.reps}</i></div>
              </div>
              <div className="jt-loads">
                {z.percents.map((p) => (
                  <div key={p} className="jt-load">
                    <span>{p}%</span>
                    <strong>{valid ? fmt(rm * (p / 100), 1) : '--'}</strong>
                    <i>kg</i>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </Panel>

      {history.length > 0 && (
        <Panel title="Historial de evaluaciones" sub={history.length + ' registros · toca uno para ver sus cargas por zona'} icon={<GaugeIcon size={18} />} tone="gold">
          <div className="jt-hist">
            {history.map((r) => {
              const isOpen = openId === r.id;
              return (
                <div key={r.id} className={'jt-histcard' + (isOpen ? ' is-open' : '')}>
                  <button type="button" className="jt-histrow" onClick={() => setOpenId(isOpen ? null : r.id)} aria-expanded={isOpen}>
                    <div className="jt-histrow-l">
                      <span className="jt-date">{r.date}</span>
                      <strong>{r.exercise}</strong>
                      <em>{r.weight} kg × {r.reps} reps · {r.author}</em>
                    </div>
                    <div className="jt-histrow-r">
                      <span className="jt-histnum">{r.rm}<i>kg</i></span>
                      <span className="jt-pill" style={{ borderColor: TONE[toneOf(r.level)].hex, color: TONE[toneOf(r.level)].hex, background: TONE[toneOf(r.level)].soft }}>
                        {r.level} · {r.ratio}×
                      </span>
                      <ChevronDown size={16} className="jt-hist-chev" />
                    </div>
                  </button>

                  {isOpen && (
                    <div className="jt-histbody">
                      <span className="jt-histbody-cap">Cargas por zona de trabajo · {r.exercise} ({fmt(parseFloat(r.rm), 1)} kg de 1RM)</span>
                      <div className="jt-zonegrid">
                        {zonesOf(r).map((z) => (
                          <div key={z.name} className="jt-zonecard" style={{ borderColor: TONE[z.tone].hex, background: TONE[z.tone].soft }}>
                            <div className="jt-zonecard-h">
                              <span style={{ color: TONE[z.tone].hex }}><Activity size={14} /> {z.name}</span>
                              <div><em>{z.range}</em><i>{z.reps}</i></div>
                            </div>
                            <div className="jt-loads">
                              {z.loads.map((l) => (
                                <div key={l.p} className="jt-load">
                                  <span>{l.p}%</span>
                                  <strong>{l.kg}</strong>
                                  <i>kg</i>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </Panel>
      )}
    </div>
  );
}
