  },
  pro: {
    id:'pro', nombre:'Pro', precio:24900, periodo:'mes',
    maxAlumnos:40,
    permisos:['agenda','vinculos','evaluacion','planificacion','seguimiento.basico','seguimiento.correlacion','buscador','pdf'],
    resumen:'El plan de trabajo diario en sala.'
  },
  elite: {
    id:'elite', nombre:'Elite', precio:49900, periodo:'mes',
    maxAlumnos:Infinity,
    permisos:['agenda','vinculos','evaluacion','planificacion','seguimiento.basico','seguimiento.correlacion','buscador','pdf','marca','equipo','api'],
    resumen:'Centros y equipos multiprofesional.'
  }
};
const PERMISO_NOMBRE = {
  agenda:'Agenda y reservas', vinculos:'Vínculos con alumnos', evaluacion:'Módulo de evaluación',
  planificacion:'Planificación de mesociclos', 'seguimiento.basico':'Seguimiento diario',
  'seguimiento.correlacion':'Correlación de métricas', buscador:'Ficha en el buscador',
  pdf:'Informes en PDF', marca:'Informes con marca propia', equipo:'Varios profesionales', api:'Acceso por API'
};

/* ---------------------------------------------------------------
   §3 · ESTADO
   --------------------------------------------------------------- */
const S = {
  usuarios:   DB.get('usuarios', null),
  sesion:     DB.get('sesion', null),
  vinculos:   DB.get('vinculos', null),      // pilar 4
  agenda:     DB.get('agenda', null),        // pilar 3
  registros:  DB.get('registros', null),     // pilares 5,6,7 — datos de las herramientas
  metricas:   DB.get('metricas', null),      // pilar 7
  ejercicios: DB.get('ejercicios', null),    // pilar 8
  facturas:   DB.get('facturas', null),      // pilar 8
  bitacora:   DB.get('bitacora', null),
  gifs:       DB.get('gifs', null),         // biblioteca del planificador
  fichas:     DB.get('fichas', null),       // borradores de herramienta por persona
  horario:    DB.get('horario', null),      // horario semanal de cada alumno (compartido)
  pautas:     DB.get('pautas', null)        // expediente nutricional compartido
};
let guardar = function(clave){ DB.set(clave, S[clave]); };
function guardarTodo(){ Object.keys(S).forEach(guardar); }

/* ---------------------------------------------------------------
   §3b · CANAL COMPARTIDO ENTRE PERFILES
   ---------------------------------------------------------------
   Los tres perfiles (alumno, profesor, nutricionista) son archivos
   HTML independientes. Para que la conexión funcione comparten un
   mismo almacén con el prefijo 'jyntra.'.

   · MISMO HOSTING (mismo dominio, p.ej. tu-sitio.cl/alumno.html y
     tu-sitio.cl/profesor.html): funciona tal cual, sin tocar nada.
     El navegador comparte localStorage entre las dos páginas y este
     módulo detecta los cambios del otro perfil y repinta solo.

   · HOSTING SEPARADO (dominios distintos): rellena JY_CANAL.api con
     la URL de tu backend. Este módulo hará GET para traer el estado
     y POST para empujarlo. El backend sólo necesita guardar y
     devolver un JSON con las claves de JY_CANAL.claves.
   --------------------------------------------------------------- */
const JY_CANAL = {
  claves : ['usuarios','vinculos','agenda','registros','metricas','horario','fichas','pautas'],
  api    : null,      /* ← p.ej. 'https://api.tu-dominio.cl/jyntra'  */
  token  : null,      /* ← cabecera Authorization, si tu backend la pide */
  latido : 4000,      /* cada cuánto se mira si el otro perfil escribió */
  sello  : null,
  activo : false
};

/* sello de versión: cambia cada vez que alguien guarda algo */
function jySello(){ try{ return DB.get('__sello', 0); }catch(e){ return 0; } }
function jyMarcarSello(){ try{ DB.set('__sello', Date.now()); }catch(e){} }

/* guardar() original, envuelto para que avise al otro perfil */
const guardarLocal = guardar;
guardar = function(clave){
  guardarLocal(clave);
  if(JY_CANAL.claves.indexOf(clave) >= 0){
    jyMarcarSello();
    jyEmpujar(clave);
  }
};

/* relee del disco las claves que tocó el otro perfil y repinta */
function jyRecargar(){
  let cambio = false;
  JY_CANAL.claves.forEach(k=>{
    if(!(k in S)) return;
    const fresco = DB.get(k, null);
    if(fresco == null) return;
    if(JSON.stringify(fresco) !== JSON.stringify(S[k])){ S[k] = fresco; cambio = true; }
  });
  if(cambio && typeof pintar === 'function'){
    try{ pintar(); }catch(e){}
  }
  return cambio;
}

/* --- puente remoto (sólo si JY_CANAL.api está configurado) --- */
function jyCabeceras(){
  const h = { 'Content-Type':'application/json' };
  if(JY_CANAL.token) h['Authorization'] = 'Bearer ' + JY_CANAL.token;
  return h;
}
function jyEmpujar(clave){
  if(!JY_CANAL.api) return;
  try{
    fetch(JY_CANAL.api + '/estado/' + encodeURIComponent(clave), {
      method:'PUT', headers:jyCabeceras(), body: JSON.stringify({ valor: S[clave] })
    }).catch(()=>{});
  }catch(e){}
}
function jyTraer(){
  if(!JY_CANAL.api) return Promise.resolve(false);
  return fetch(JY_CANAL.api + '/estado', { headers: jyCabeceras() })
    .then(r=> r.ok ? r.json() : null)
    .then(d=>{
      if(!d) return false;
      let cambio = false;
      JY_CANAL.claves.forEach(k=>{
        if(d[k] == null || !(k in S)) return;
        if(JSON.stringify(d[k]) !== JSON.stringify(S[k])){
          S[k] = d[k]; guardarLocal(k); cambio = true;
        }
      });
      if(cambio && typeof pintar === 'function'){ try{ pintar(); }catch(e){} }
      return cambio;
    }).catch(()=> false);
}

/* --- arranque del canal --- */

/* ---------------------------------------------------------------
   §3d · EXPEDIENTE NUTRICIONAL COMPARTIDO
   Una sola pauta por persona. La arma el nutricionista, el alumno la
   ajusta a su día a día y los dos ven el cambio del otro.
   --------------------------------------------------------------- */
function pautaDe(alumnoId){
  if(!S.pautas) S.pautas = {};
  return S.pautas[alumnoId] || null;
}
function guardarPauta(alumnoId, estado, quienId){
  if(!S.pautas) S.pautas = {};
  const q = usuario(quienId);
  S.pautas[alumnoId] = {
    estado          : estado,
    actualizadoPor  : quienId || null,
    actualizadoNombre: q ? q.nombre : '',
    actualizadoRol  : q ? q.rol : '',
    actualizadoEn   : new Date().toISOString()
  };
  guardar('pautas');
  return S.pautas[alumnoId];
}
function firmaPauta(alumnoId){
  const p = pautaDe(alumnoId);
  if(!p || !p.actualizadoNombre) return '';
  const yo = S.sesion === p.actualizadoPor;
  return (yo ? 'Último cambio tuyo' : 'Último cambio de '+p.actualizadoNombre.split(' ')[0])
       + ' · ' + fechaHora(p.actualizadoEn);
}

/* ---------------------------------------------------------------
   §3e · IDENTIDAD DEL ATLETA
   Nombre, edad y sexo salen de la ficha y son iguales en los tres
   perfiles. Peso y talla se toman de la última medición y vuelven a
   la ficha cuando alguien los corrige.
   --------------------------------------------------------------- */
function identidadDe(alumnoId){
  const u = usuario(alumnoId);
  if(!u) return null;
  let edad = '';
  if(u.nacimiento){
    const e = Math.floor((Date.now() - new Date(u.nacimiento)) / 31557600000);
    if(e > 0 && e < 120) edad = e;
  }
  if(!edad && u.edad) edad = u.edad;

  /* último peso registrado en el seguimiento diario */
  let peso = u.peso || '';
  try{
    const serie = S.metricas
      .filter(m=> m.alumnoId===alumnoId && m.clave==='peso' && m.valor)
      .sort((a,b)=> String(b.fecha).localeCompare(String(a.fecha)));
    if(serie.length) peso = serie[0].valor;
  }catch(e){}

  return {
    id    : u.id,
    nombre: u.nombre || '',
    edad  : edad,
    sexo  : u.sexo || '',
    talla : u.altura || '',
    peso  : peso,
    objetivo: u.objetivo || ''
  };
}

/* peso y talla corregidos desde cualquier herramienta vuelven a la ficha */
function refrescarIdentidad(alumnoId, datos, quienId){
  const u = usuario(alumnoId); if(!u || !datos) return;
  let toco = false;
  if(datos.talla && +datos.talla !== +u.altura){ u.altura = +datos.talla; toco = true; }
  if(toco) guardar('usuarios');

  if(datos.peso){
    const f = hoy();
    const ya = S.metricas.find(m=> m.alumnoId===alumnoId && m.clave==='peso' && m.fecha===f);
    if(ya){ if(+ya.valor !== +datos.peso){ ya.valor = +datos.peso; guardar('metricas'); } }
    else {
      S.metricas.push({ id:uid('m'), alumnoId:alumnoId, clave:'peso',
                        valor:+datos.peso, fecha:f, autorId: quienId||alumnoId });
      guardar('metricas');
    }
  }
}

function jyAbrirCanal(){
  if(JY_CANAL.activo) return;
  JY_CANAL.activo = true;
  JY_CANAL.sello = jySello();

  /* aviso inmediato cuando el otro perfil escribe en otra pestaña */
  try{
    window.addEventListener('storage', function(e){
      if(!e || !e.key || e.key.indexOf('jyntra.') !== 0) return;
      JY_CANAL.sello = jySello();
      jyRecargar();
    });
  }catch(e){}

  /* red de seguridad: revisa el sello por si el evento no llegó */
  setInterval(function(){
    const s = jySello();
    if(s !== JY_CANAL.sello){ JY_CANAL.sello = s; jyRecargar(); }
    if(JY_CANAL.api) jyTraer();
  }, JY_CANAL.latido);

  if(JY_CANAL.api) jyTraer();
}

/* ---------------------------------------------------------------
   §3c · LLAVES DEL ALUMNO
   Qué se abre y qué queda cerrado según con quién esté conectado.
   Sin vínculo activo el alumno usa la versión libre.
   --------------------------------------------------------------- */
function profesionalesPorRol(alumnoId, rol){
  return S.vinculos.filter(v=> v.alumnoId===alumnoId && v.profesionalId && v.estado==='activo')
    .map(v=> S.usuarios.find(u=> u.id===v.profesionalId))
    .filter(u=> u && u.rol===rol);
}
function profesorDe(alumnoId){ return profesionalesPorRol(alumnoId,'profesor')[0] || null; }
function nutricionistaDe(alumnoId){ return profesionalesPorRol(alumnoId,'nutricionista')[0] || null; }

function llaves(alumnoId){
  const pro = profesorDe(alumnoId);
  const nut = nutricionistaDe(alumnoId);
  return {
    profesor      : pro,
    nutricionista : nut,
    conectado     : !!pro || !!nut,
    /* pestaña «Mi evaluación» */
    habitos       : !!pro || !!nut,   // 2º módulo de la anamnesis
    atleta        : !!pro,            // perfil del atleta y fuerza 1RM (sólo lectura)
    /* pestaña «Mi planificación» */
    superserie    : !!pro,            // herramienta de súper series
    planRecibido  : !!pro,            // rutina cargada por el profesor
    /* pestaña «Mis clases» */
    horarioDoble  : !!pro || !!nut    // edición a dos manos del horario
  };
}


/* ---------------------------------------------------------------
   §4 · PILAR 4 — CANAL DE CONEXIÓN (el puente de datos)
   Sin vínculo activo no se comparte una sola fila.
   --------------------------------------------------------------- */
function vinculoDe(alumnoId, proId){
  return S.vinculos.find(v=> v.alumnoId===alumnoId && v.profesionalId===proId);
}
function vinculado(alumnoId, proId){
  const v = vinculoDe(alumnoId, proId); return !!v && v.estado==='activo';
}
function alumnosDe(proId){
  return S.vinculos.filter(v=> v.profesionalId===proId && v.estado==='activo')
                   .map(v=> usuario(v.alumnoId)).filter(Boolean);
}
function profesionalesDe(alumnoId){
  return S.vinculos.filter(v=> v.alumnoId===alumnoId && v.estado==='activo')
                   .map(v=> usuario(v.profesionalId)).filter(Boolean);
}
function usuario(id){ return S.usuarios.find(u=>u.id===id); }
function sesion(){ return S.sesion ? usuario(S.sesion) : null; }

/* portero de permisos: rol + plan del profesional */
function puede(permiso, u){
  u = u || sesion(); if(!u) return false;
  if(u.rol==='alumno') return true;                   // el alumno consume, no compra módulos
  const p = PLANES[u.plan||'base'];
  if(!p) return false;
  if(u.suscripcion && u.suscripcion.estado==='vencida') return p.id==='base';
  return p.permisos.includes(permiso);
}
function cupoAlumnos(u){
  u = u || sesion();
  const p = PLANES[u.plan||'base'];
  return { usados: alumnosDe(u.id).length,
           tope: Math.min(p.maxAlumnos, TOPE_CONEXIONES_PRO) };
}

/* ---------------------------------------------------------------
   §4b · TOPES DE CONEXIÓN
   Una cuenta de alumno trabaja con un profesor y con un
   nutricionista: una conexión por especialidad, no más. Del otro
   lado, un profesional atiende hasta 20 personas; es un tope de la
   plataforma y se aplica además del que fije su plan.

   Cuentan tanto los vínculos activos como las solicitudes en
   espera: una solicitud pendiente ya ocupa el lugar.
   --------------------------------------------------------------- */
const TOPE_POR_ESPECIALIDAD = 1;
const TOPE_CONEXIONES_PRO   = 20;
const ESTADOS_VIVOS = ['activo','pendiente'];

function vinculosVivos(filtro, ignorarId){
  return S.vinculos.filter(v=> ESTADOS_VIVOS.indexOf(v.estado) >= 0
                            && v.id !== ignorarId && filtro(v));
}
function conexionesPorEspecialidad(alumnoId, rol, ignorarId){
  return vinculosVivos(v=>{
    if(v.alumnoId !== alumnoId) return false;
    const p = usuario(v.profesionalId);
    return !!p && p.rol === rol;
  }, ignorarId);
}
function cupoEspecialidad(alumnoId, rol, ignorarId){
  return { usados: conexionesPorEspecialidad(alumnoId, rol, ignorarId).length,
           tope  : TOPE_POR_ESPECIALIDAD };
}
function cupoVivoPro(proId, ignorarId){
  return { usados: vinculosVivos(v=> v.profesionalId===proId, ignorarId).length,
           tope  : TOPE_CONEXIONES_PRO };
}

/* Devuelve null si la conexión puede abrirse; si no, el motivo
   escrito para que la persona entienda qué hacer. */
function porQueNoConectar(alumnoId, proId, ignorarId){
  const p = usuario(proId);
  if(!p) return 'Ese perfil ya no est\u00e1 disponible.';

  const c = cupoEspecialidad(alumnoId, p.rol, ignorarId);
  if(c.usados >= c.tope){
    const otro = conexionesPorEspecialidad(alumnoId, p.rol, ignorarId)[0];
    const q = otro ? usuario(otro.profesionalId) : null;
    return 'Esa cuenta ya trabaja con '
         + (p.rol==='profesor' ? 'un profesor' : 'un nutricionista')
         + (q ? ' (' + q.nombre + ')' : '')
         + '. Hay que eliminar esa conexi\u00f3n antes de abrir otra.';
  }

  const cp = cupoVivoPro(proId, ignorarId);
  if(cp.usados >= cp.tope){
    return p.nombre.split(' ')[0] + ' lleg\u00f3 a las ' + cp.tope
         + ' conexiones que permite la plataforma.';
  }
  return null;
}

/* ---------------------------------------------------------------
   §4c · BAJA DEL VÍNCULO
   Cualquiera de los dos lados puede cortarlo. Se pregunta con el
   diálogo propio de la app, se explica qué deja de compartirse y
   nada de lo ya guardado se borra.
   --------------------------------------------------------------- */
async function eliminarVinculo(vinculoId, quienId){
  const x = S.vinculos.find(y=> y.id === vinculoId);
  if(!x) return false;

  const pro = usuario(x.profesionalId) || {nombre:'el profesional'};
  const al  = usuario(x.alumnoId)      || {nombre:'la persona'};
  const otro = (quienId === x.alumnoId) ? pro : al;
  const nombre = (otro.nombre || '').split(' ')[0];

  const ok = await preguntar('Eliminar la conexi\u00f3n con ' + otro.nombre,
      '<p class="sub" style="margin:0">Se corta el paso de datos entre las dos cuentas: '
    + esc(nombre) + ' deja de ver esos registros y esta cuenta deja de ver lo que '
    + esc(nombre) + ' public\u00f3.</p>'
    + '<p class="hint" style="margin:10px 0 0">Nada de lo ya guardado se borra, '
    + 'y pueden volver a conectarse cuando quieran.</p>',
      {ok:'Eliminar conexi\u00f3n', cancelar:'Mantener', peligro:true});
  if(!ok) return false;

  S.vinculos = S.vinculos.filter(y=> y.id !== vinculoId);
  guardar('vinculos');
  bitacora('vinculo', 'Elimin\u00f3 la conexi\u00f3n con ' + otro.nombre, quienId);
  toast('Conexi\u00f3n eliminada', 'warn');
  pintar();
  return true;
}

/* Un solo oyente para todos los botones de baja, los pinte quien
   los pinte: así la pieza funciona igual en el buscador, en la
   lista de pacientes y en cualquier pantalla que se sume después. */
document.addEventListener('click', function(e){
  const b = e.target && e.target.closest && e.target.closest('[data-desvincular]');
  if(!b) return;
  e.preventDefault();
  const yo = sesion();
  if(yo) eliminarVinculo(b.dataset.desvincular, yo.id);
});

/* ---------------------------------------------------------------
   §5 · PUENTE DE DATOS PARA LAS HERRAMIENTAS
   Toda herramienta lee y escribe por aquí. Un solo formato de registro:
   { id, modulo, tipo, autorId, sujetoId, creado, visible, datos }
   --------------------------------------------------------------- */
const Datos = {
  guardar(reg){
    const r = Object.assign({ id:uid('reg'), creado:new Date().toISOString(), visible:true, datos:{} }, reg);
    const i = S.registros.findIndex(x=>x.id===r.id);
    if(i>=0) S.registros[i] = r; else S.registros.push(r);
    guardar('registros'); bitacora('registro', r.modulo+' · '+(r.tipo||''), r.autorId);
    return r;
  },
  listar(filtro){
    filtro = filtro||{};
    return S.registros.filter(r=>{
      if(filtro.modulo && r.modulo!==filtro.modulo) return false;
      if(filtro.tipo && r.tipo!==filtro.tipo) return false;
      if(filtro.sujetoId && r.sujetoId!==filtro.sujetoId) return false;
      if(filtro.autorId && r.autorId!==filtro.autorId) return false;
      return true;
    }).sort((a,b)=> b.creado.localeCompare(a.creado));
  },
  ultimo(filtro){ return this.listar(filtro)[0] || null; },
  borrar(id){ S.registros = S.registros.filter(r=>r.id!==id); guardar('registros'); },
  /* lectura del alumno: sólo lo que su profesional le publicó */
  paraAlumno(alumnoId, modulo){
    return this.listar({sujetoId:alumnoId, modulo}).filter(r=> r.visible && vinculado(alumnoId, r.autorId));
  }
};

function bitacora(tipo, detalle, quien){
  S.bitacora.unshift({ id:uid('log'), tipo, detalle, quien: quien||S.sesion, cuando:new Date().toISOString() });
  S.bitacora = S.bitacora.slice(0,300); guardar('bitacora');
}

/* ---------------------------------------------------------------

   Cada hueco de la app tiene un identificador de ranura. Para montar

     });

   O, si la herramienta ya es un HTML propio:

     JYNTRA.registrarArchivo({
       ranura:'profesor.planificacion', id:'planificador',
       nombre:'Planificador de mesociclos', src:'./herramientas/planificador.html'
     });
   --------------------------------------------------------------- */
const RANURAS = {
  'profesor.evaluacion':      { nombre:'Evaluación física',        pilar:5, permiso:'evaluacion',
    recibe:'ctx.alumno · ctx.historial(\'evaluacion\')', entrega:'ctx.guardar({modulo:\'evaluacion\', datos:{...}})',

    nota:'Lee el RM de la evaluación y publica la rutina, que aparece sola en la pantalla del alumno.' },
  'profesor.seguimiento':     { nombre:'Correlación y progreso',   pilar:7, permiso:'seguimiento.correlacion',

    nota:'Disponibilidad, reservas y registro de asistencia por QR.' },

  'nutricionista.agenda':     { nombre:'Agenda de consultas',      pilar:3, permiso:'agenda',
    recibe:'ctx.usuario · ctx.alumnos · ctx.agenda', entrega:'ctx.guardarAgenda(bloques)', nota:'Horas de consulta y control de asistencia.' }
};

const MODULOS = {};                                    // ranura -> definición
const MONTADOS = new WeakMap();                        // caja -> {mod, ctx}

const JYNTRA = window.JYNTRA = {
  version:'1.0',
  ranuras: RANURAS,
  registrar(def){
    if(!def || !def.ranura) { console.warn('[JYNTRA] falta la ranura'); return; }
    if(!RANURAS[def.ranura]) console.warn('[JYNTRA] ranura desconocida: '+def.ranura+'. Ranuras válidas: '+Object.keys(RANURAS).join(', '));
    MODULOS[def.ranura] = def;
    if(document.readyState!=='loading' && typeof pintar==='function') pintar();
    return def;
  },
  registrarArchivo(def){
    return JYNTRA.registrar(Object.assign({}, def, {
      archivo:true,
      montar(caja, ctx){
        const f = document.createElement('iframe');
        f.src = def.src; f.title = def.nombre||def.id; f.loading='lazy';
        f.setAttribute('allow','camera; microphone; clipboard-write');
        if(def.alto) f.style.minHeight = def.alto;
        caja.appendChild(f);
        /* puente con la herramienta: window.parent.postMessage({jyntra:'guardar', ...}) */
        const oir = (e)=>{
          if(!e.data || e.data.jyntra!==true) return;
          if(e.source!==f.contentWindow) return;
          const m = e.data;
          if(m.accion==='guardar')  ctx.guardar(m.registro||{});
          if(m.accion==='metrica')  ctx.registrarMetrica(m.metrica||{});
          if(m.accion==='listo')    f.contentWindow.postMessage({jyntra:true, accion:'contexto', contexto: ctx.serializar()}, '*');
          if(m.accion==='alto' && m.px) f.style.minHeight = m.px+'px';
        };
        window.addEventListener('message', oir);
        f.addEventListener('load', ()=>{ try{ f.contentWindow.postMessage({jyntra:true, accion:'contexto', contexto: ctx.serializar()}, '*'); }catch(e){} });
        return ()=> window.removeEventListener('message', oir);
      }
    }));
  },
  quitar(ranura){ delete MODULOS[ranura]; if(typeof pintar==='function') pintar(); },
  listar(){ return Object.keys(RANURAS).map(r=> ({ranura:r, info:RANURAS[r], modulo:MODULOS[r]||null})); },
  /* acceso controlado a los datos, por si una herramienta lo necesita fuera del ctx */
  datos: Datos,
  db: { usuario, alumnosDe, profesionalesDe, vinculado, puede,
        ejercicios:()=>S.ejercicios, metricas:()=>S.metricas,
        agenda:()=>S.agenda, sesion },
  toast, preguntar
};

/* contexto que recibe cada herramienta al montarse */
function contextoDe(ranura, extra){
  const u = sesion(); const info = RANURAS[ranura]||{};
  const ctx = Object.assign({
    ranura, usuario:u, rol:u&&u.rol,
    marca:{ nombre:'JYNTRA', dorado:'#C6A15A', negro:'#0D0D0D', hueso:'#EDE7DA' },
    alumno:null,
    /* transversal: alumnos/pacientes vinculados al profesional (pilar 4), listos para
       que cualquier herramienta montada (p.ej. la Agenda) los use sin duplicar altas */
    alumnos: (u && esProfesional(u.rol)) ? alumnosDe(u.id) : [],
    agendaPropia: ()=> S.agenda.filter(b=> b.profesionalId===(u&&u.id)),
    historial(modulo){ return Datos.listar({modulo, sujetoId: ctx.alumno? ctx.alumno.id : (u&&u.id)}); },
    ultimo(modulo){ return Datos.ultimo({modulo, sujetoId: ctx.alumno? ctx.alumno.id : (u&&u.id)}); },
    guardar(reg){
      const sujeto = reg.sujetoId || (ctx.alumno&&ctx.alumno.id) || (u&&u.id);
      if(u && ctx.alumno && esProfesional(u.rol) && !vinculado(ctx.alumno.id, u.id)){
        toast('No hay vínculo activo con ese alumno. No se guardó nada.','bad'); return null;
      }
      const r = Datos.guardar(Object.assign({ autorId:u&&u.id, sujetoId:sujeto }, reg));
      toast('Registro guardado','ok'); pintar(); return r;
    },
    metricas(id){ return S.metricas.filter(m=> m.alumnoId===(id|| (ctx.alumno&&ctx.alumno.id) || (u&&u.id))); },
    registrarMetrica(m){ return registrarMetrica(Object.assign({alumnoId:(u&&u.id)}, m)); },
    guardarAgenda(bloques){ S.agenda = bloques; guardar('agenda'); pintar(); },
    ejercicios: ()=> S.ejercicios,
    guardarEjercicio(e){ return guardarEjercicio(e); },
    refrescar: ()=> pintar(),
    aviso: toast,
    serializar(){
      return { ranura, usuario: u&&{id:u.id,nombre:u.nombre,rol:u.rol,plan:u.plan},
               alumno: ctx.alumno&&{id:ctx.alumno.id,nombre:ctx.alumno.nombre,email:ctx.alumno.email,nacimiento:ctx.alumno.nacimiento,sexo:ctx.alumno.sexo},
               alumnos: (u && esProfesional(u.rol)) ? alumnosDe(u.id).map(a=>({id:a.id,nombre:a.nombre,email:a.email,telefono:a.telefono})) : [],
               marca: ctx.marca, historial: ctx.historial(info.modulo||''), permisos: PLANES[(u&&u.plan)||'base'].permisos };
    }
  }, extra||{});
  return ctx;
}

function registrarMetrica(m){
  const r = Object.assign({ id:uid('met'), fecha:hoy(), creado:new Date().toISOString() }, m);
  const i = S.metricas.findIndex(x=> x.alumnoId===r.alumnoId && x.clave===r.clave && x.fecha===r.fecha);
  if(i>=0) S.metricas[i]=r; else S.metricas.push(r);
  guardar('metricas'); return r;
}
function serieMetrica(alumnoId, clave, dias){
  dias = dias||30;
  const desde = new Date(Date.now()-dias*864e5).toISOString().slice(0,10);
  return S.metricas.filter(m=>m.alumnoId===alumnoId && m.clave===clave && m.fecha>=desde)
                   .sort((a,b)=> a.fecha.localeCompare(b.fecha));
}
function guardarEjercicio(e){
  const x = Object.assign({ id:uid('ej'), creado:new Date().toISOString() }, e);
  const i = S.ejercicios.findIndex(a=>a.id===x.id);
  if(i>=0) S.ejercicios[i]=x; else S.ejercicios.push(x);
  guardar('ejercicios'); return x;
}

/* la placa de montaje: así se ve un hueco vacío y así se ve ocupado */
function ranura(ranuraId, opciones){
  opciones = opciones||{};
  const info = RANURAS[ranuraId] || {nombre:ranuraId};
  const mod  = MODULOS[ranuraId];
  const u    = sesion();
  const bloqueado = info.permiso && !puede(info.permiso, u);
  const id = 'slot_'+ranuraId.replace(/\./g,'_');

  let cuerpo;
  if(bloqueado){
    cuerpo = '<div class="slot-body"><div class="locked">'
      + '<div style="font-size:20px;color:var(--warn)">◆</div><div><div class="h3">'+esc(info.nombre)+' no está en tu plan</div>'
      + '<div class="sub">Lo abre el plan '+esc(planQueIncluye(info.permiso))+'. Tus datos quedan guardados igual.</div>'
      + '<div style="margin-top:10px"><a class="btn sm gold" href="#/plan">Ver planes</a></div></div></div></div>';
  } else if(mod){
    cuerpo = '<div class="slot-body" id="'+id+'" data-montaje="'+esc(ranuraId)+'"></div>';
  } else {
    cuerpo = '<div class="slot-empty">'
      + '<div class="tt">'+esc(info.nombre)+'</div>'
      + '<div class="ds">'+esc(opciones.nota || info.nota || '')+'</div>'
      + '<div class="contract">'
      +   '<div class="cr"><span class="k">Ranura</span><span><code>'+esc(ranuraId)+'</code></span></div>'
      +   '<div class="cr"><span class="k">Recibe</span><span><code>'+esc(info.recibe||'ctx')+'</code></span></div>'
      +   '<div class="cr"><span class="k">Entrega</span><span><code>'+esc(info.entrega||'—')+'</code></span></div>'
      +   '<div class="cr"><span class="k">Montar</span><span><code>JYNTRA.registrar({ranura:\''+esc(ranuraId)+'\', montar(caja,ctx){…}})</code></span></div>'
      + '</div></div>';
  }
  return '<section class="slot '+(mod&&!bloqueado?'mounted':'')+'">'
   + '<div class="slot-bar">'
   +   '<span class="slot-id">'+esc(ranuraId)+'</span>'
   +   (info.pilar?'<span class="chip">Pilar '+info.pilar+'</span>':'')
   +   '<div class="grow"></div>'
   +   (opciones.extra||'')
   +   (bloqueado ? '<span class="chip warn"><span class="dot"></span>Fuera de plan</span>'
        : mod ? '<span class="chip ok"><span class="dot"></span>'+esc(mod.nombre||mod.id||'Montado')+'</span>'
        : '<span class="chip"><span class="dot"></span>Hueco libre</span>')
   + '</div>'+cuerpo+'</section>';
}
function planQueIncluye(permiso){
  const p = Object.values(PLANES).find(x=> x.permisos.includes(permiso));
  return p? p.nombre : 'Pro';
}

function montarRanuras(alumno){
  $$('[data-montaje]').forEach(caja=>{
    const ranuraId = caja.dataset.montaje;
    const mod = MODULOS[ranuraId]; if(!mod) return;
    const previo = MONTADOS.get(caja);
    if(previo && previo.limpiar) { try{ previo.limpiar(); }catch(e){} }
    caja.innerHTML = '';
    const ctx = contextoDe(ranuraId, { alumno: alumno||null });
    try{
      const limpiar = mod.montar ? mod.montar(caja, ctx) : null;
      MONTADOS.set(caja, {mod, ctx, limpiar: typeof limpiar==='function'?limpiar:null});
    }catch(e){
      console.error('[JYNTRA] falló el montaje de '+ranuraId, e);
      caja.innerHTML = '<div class="empty"><div class="h3">La herramienta no cargó</div><div class="mono" style="font-size:12px;color:var(--bad)">'+esc(e.message)+'</div></div>';
    }
  });
}

/* gráfico compacto — el mismo que ven profesional y alumno (pilar 7) */
function grafico(puntos, opciones){
  opciones = opciones||{};
  const W=560, H=opciones.alto||140, P=26;
  if(!puntos.length) return '<div class="empty" style="padding:18px">Sin datos todavía</div>';
  const vs = puntos.map(p=>p.valor);
  let min = Math.min.apply(null,vs), max = Math.max.apply(null,vs);
  if(min===max){ min-=1; max+=1; }
  const pad = (max-min)*0.12; min-=pad; max+=pad;
  const x = (i)=> P + i*(W-P*2)/Math.max(1,puntos.length-1);
  const y = (v)=> H-P - (v-min)/(max-min)*(H-P*1.5);
  const d = puntos.map((p,i)=> (i?'L':'M')+x(i).toFixed(1)+' '+y(p.valor).toFixed(1)).join(' ');
  const area = d+' L'+x(puntos.length-1).toFixed(1)+' '+(H-P)+' L'+x(0).toFixed(1)+' '+(H-P)+' Z';
  const col = opciones.color||'#C6A15A';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="'+esc(opciones.titulo||'serie')+'">'
   + '<defs><linearGradient id="g'+opciones.id+'" x1="0" x2="0" y1="0" y2="1">'
   +   '<stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
   + [0,.5,1].map(f=>'<line x1="'+P+'" x2="'+(W-P)+'" y1="'+(H-P-f*(H-P*1.5)).toFixed(1)+'" y2="'+(H-P-f*(H-P*1.5)).toFixed(1)+'" stroke="#2A2620" stroke-width="1"/>').join('')
   + '<path d="'+area+'" fill="url(#g'+opciones.id+')"/>'
   + '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
   + '<circle cx="'+x(puntos.length-1).toFixed(1)+'" cy="'+y(vs[vs.length-1]).toFixed(1)+'" r="3.5" fill="'+col+'"/>'
   + '<text x="'+P+'" y="14" fill="#8E877A" font-family="IBM Plex Mono,monospace" font-size="10">'+esc(opciones.titulo||'')+'</text>'
   + '<text x="'+(W-P)+'" y="14" text-anchor="end" fill="'+col+'" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="15">'
   +   esc(vs[vs.length-1])+' '+esc(opciones.unidad||'')+'</text>'
   + '<text x="'+P+'" y="'+(H-8)+'" fill="#6A655C" font-family="IBM Plex Mono,monospace" font-size="9">'+esc(puntos[0].fecha)+'</text>'
   + '<text x="'+(W-P)+'" y="'+(H-8)+'" text-anchor="end" fill="#6A655C" font-family="IBM Plex Mono,monospace" font-size="9">'+esc(puntos[puntos.length-1].fecha)+'</text>'
   + '</svg>';
}

async function responderVinculo(id, si, u){
  const x = S.vinculos.find(y=>y.id===id); if(!x) return;
  if(si){
    const c = cupoAlumnos(u);
    if(c.usados >= c.tope){
      const porPlan = c.tope < TOPE_CONEXIONES_PRO;
      toast(porPlan
        ? 'Tu plan '+PLANES[u.plan].nombre+' llega hasta '+c.tope+' alumnos. Sube de plan para aceptar.'
        : 'Llegaste a las '+TOPE_CONEXIONES_PRO+' conexiones que permite la plataforma. Elimina alguna para aceptar esta.','warn');
      return porPlan ? ruta('plan') : ruta('alumnos');
    }
    /* del otro lado: esa persona no puede tener dos de la misma especialidad */
    const vetoAl = porQueNoConectar(x.alumnoId, u.id, x.id);
    if(vetoAl) return toast(vetoAl, 'warn');
    const r = await preguntar('Aceptar a '+(usuario(x.alumnoId)||{}).nombre,
      '<form class="stack"><div class="field"><label>Plan que le asignas</label><input class="inp" name="plan" value="8 sesiones / mes"></div>'
      + '<div class="field"><label>Servicio</label><input class="inp" name="servicio" value="'+esc(x.servicio)+'"></div></form>',{ok:'Aceptar y vincular'});
    if(!r) return;
    x.estado='activo'; x.plan=r.plan; x.servicio=r.servicio; x.desde=new Date().toISOString();
    toast('Vínculo activo. Ya puedes evaluar y planificar.','ok');
  } else { x.estado='rechazado'; toast('Solicitud rechazada','warn'); }
  guardar('vinculos'); bitacora('vinculo',(si?'Aceptó':'Rechazó')+' a '+(usuario(x.alumnoId)||{}).nombre, u.id); pintar();
}

/* ---------------------------------------------------------------
   §17b · AGENDA — parámetros editables, asignación por alumno
   y horario semanal armado con todo lo cargado.
   Un bloque de agenda es:
     { id, profesionalId, dia, hora, horaFin, servicio, lugar,
       cupos, alumnoId, nota }
   Los bloques con alumnoId se publican en la ficha de esa persona
   como su calendario único (módulo 'agenda').
   --------------------------------------------------------------- */
const DIA_ORDEN = [1,2,3,4,5,6,0];          // la semana parte el lunes
const DIA_CORTO = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

function bloqueSano(b){
  return Object.assign({ horaFin:'', servicio:'', lugar:'', nota:'', cupos:1, alumnoId:'' }, b);
}
function sumaHora(hora, minutos){
  const p = String(hora||'').split(':');
  if(p.length < 2) return '';
  let t = (+p[0])*60 + (+p[1]) + minutos;
  t = Math.max(0, Math.min(23*60+59, t));
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function agendaDe(proId){
  return S.agenda.filter(b=> b.profesionalId===proId).map(bloqueSano)
    .sort((a,b)=> DIA_ORDEN.indexOf(a.dia)-DIA_ORDEN.indexOf(b.dia) || String(a.hora).localeCompare(String(b.hora)));
}
function bloqueDe(id){ return S.agenda.find(b=> b.id===id); }

/* --- la grilla que resume todo lo cargado --- */
function grillaSemanal(proId){
  const bl = agendaDe(proId);
  const hoyDia = new Date().getDay();
  return '<div class="jy-week">' + DIA_ORDEN.map(d=>{
    const del = bl.filter(x=> x.dia===d);
    return '<div class="jy-day'+(d===hoyDia?' hoy':'')+'">'
     + '<div class="jy-day-h"><b>'+diasES[d]+'</b><span>'+(del.length||'')+'</span></div>'
     + (del.length ? del.map(x=>{
          const a = x.alumnoId ? usuario(x.alumnoId) : null;
          return '<div class="jy-slot'+(a?' asignado':'')+'">'
           + '<div class="hh">'+esc(x.hora||'--:--')+(x.horaFin? ' – '+esc(x.horaFin):'')+'</div>'
           + '<div class="nn">'+esc(a ? a.nombre : ((x.cupos>1? x.cupos+' cupos' : 'Cupo')+' libre'))+'</div>'
           + '<div class="ss">'+esc(x.servicio||'—')+(x.lugar? ' · '+esc(x.lugar):'')
           + (x.nota? '<br>'+esc(x.nota):'')+'</div></div>';
        }).join('')
      : '<div class="jy-vacio">libre</div>')
     + '</div>';
  }).join('') + '</div>';
}

/* --- calendario publicado, visto desde la ficha de la persona --- */
function bloqueCalendario(a, u){
  const bl = agendaDe(u.id).filter(b=> b.alumnoId===a.id);
  const pub = Datos.ultimo({sujetoId:a.id, modulo:'agenda', autorId:u.id});
  return '<div class="card pad0" style="margin-bottom:18px">'

   + (bl.length
      ? '<table class="tbl"><thead><tr><th>Día</th><th>Horario</th><th>Servicio</th><th>Lugar</th><th>Nota</th></tr></thead><tbody>'
        + bl.map(b=>'<tr><td>'+diasES[b.dia]+'</td>'
           + '<td class="mono" style="font-size:12px">'+esc(b.hora)+(b.horaFin? ' – '+esc(b.horaFin):'')+'</td>'
           + '<td>'+esc(b.servicio||'—')+'</td><td>'+esc(b.lugar||'—')+'</td>'
           + '<td class="hint">'+esc(b.nota||'')+'</td></tr>').join('')

        + '<div>Asígnale días y horas desde la columna «Alumno» de tu agenda.</div></div>')

}

function publicarCalendarios(u){
  const asignados = agendaDe(u.id).filter(b=> b.alumnoId);
  const porPersona = {};
  asignados.forEach(b=>{ (porPersona[b.alumnoId] = porPersona[b.alumnoId] || []).push(b); });
  const ids = Object.keys(porPersona).filter(id=> vinculado(id, u.id));
  if(!ids.length) return toast('Todavía no hay horarios asignados a una persona vinculada.','warn');
  ids.forEach(id=>{
    Datos.listar({sujetoId:id, modulo:'agenda', autorId:u.id}).forEach(r=> Datos.borrar(r.id));
    Datos.guardar({
      modulo:'agenda', tipo:'Calendario semanal', autorId:u.id, sujetoId:id, visible:true,
      datos:{
        profesional: u.nombre, rol: u.rol, actualizado: new Date().toISOString(),
        bloques: porPersona[id].map(b=>({ dia:b.dia, diaNombre:diasES[b.dia], hora:b.hora,
          horaFin:b.horaFin, servicio:b.servicio, lugar:b.lugar, nota:b.nota }))
      }
    });
  });
  toast('Calendario publicado para '+ids.length+' persona'+(ids.length===1?'':'s'),'ok');
  pintar();
}


/* ---------------------------------------------------------------
   §17c · HORARIO DE LA PERSONA — el mismo que ella ve en «Mis clases»
   Vive en S.horario[alumnoId] y el §3b lo replica al otro perfil.
   Cada cambio queda firmado con el nombre de quien lo hizo.
   --------------------------------------------------------------- */
function horarioDe(alumnoId){
  if(!S.horario) S.horario = {};
  if(!Array.isArray(S.horario[alumnoId])) S.horario[alumnoId] = [];
  return S.horario[alumnoId];
}
function sellarBloque(b, quienId){
  const q = usuario(quienId);
  b.editadoPor    = quienId || null;
  b.editadoNombre = q ? q.nombre : '';
  b.editadoRol    = q ? q.rol : '';
  b.editadoEn     = new Date().toISOString();
  return b;
}
function firmaBloque(b){
  if(!b.editadoNombre) return '';
  const yo = S.sesion === b.editadoPor;
  return '<div class="hint" style="margin:4px 0 0;font-size:10.5px">'
   + (yo ? 'Editado por ti' : 'Editado por '+esc(b.editadoNombre.split(' ')[0]))
   + (b.editadoEn ? ' · '+esc(fechaHora(b.editadoEn)) : '') + '</div>';
}


/* ---------------------------------------------------------------
   §17d · GRILLA SEMANAL COMBINADA
   «Mi semana completa» junta dos fuentes:
     · los bloques de la agenda propia (§17b)
     · el horario semanal de cada alumno conectado (§17c)
   Así el profesor ve de un vistazo todas sus clases de la semana.
   --------------------------------------------------------------- */
function clasesDeLaSemana(proId){
  const fuera = [];

  /* bloques cargados en la agenda del profesional */
  agendaDe(proId).forEach(b=>{
    const a = b.alumnoId ? usuario(b.alumnoId) : null;
    fuera.push({
      dia   : +b.dia,
      ini   : b.hora || '',
      fin   : b.horaFin || '',
      titulo: a ? a.nombre : ((b.cupos>1 ? b.cupos+' cupos' : 'Cupo')+' libre'),
      detalle: [b.servicio||'', b.lugar||''].filter(Boolean).join(' · '),
      nota  : b.nota || '',
      quien : a ? a.id : '',
      origen: 'agenda',
      firma : ''
    });
  });

  /* horario semanal propio de cada persona vinculada */
  alumnosDe(proId).forEach(a=>{
    horarioDe(a.id).forEach(b=>{
      fuera.push({
        dia   : +b.dia,
        ini   : b.ini || '',
        fin   : b.fin || '',
        titulo: a.nombre,
        detalle: [b.actividad||'Sesión', b.lugar||''].filter(Boolean).join(' · '),
        nota  : b.nota || '',
        quien : a.id,
        origen: 'horario',
        firma : b.editadoNombre ? (S.sesion===b.editadoPor ? 'tú' : b.editadoNombre.split(' ')[0]) : ''
      });
    });
  });

  return fuera;
}

function grillaCombinada(proId, filtroAlumno){
  let bl = clasesDeLaSemana(proId);
  if(filtroAlumno) bl = bl.filter(x=> x.quien===filtroAlumno);
  const hoyDia = new Date().getDay();

  return '<div class="jy-week">' + DIA_ORDEN.map(d=>{
    const del = bl.filter(x=> x.dia===d)
      .sort((a,b)=> String(a.ini).localeCompare(String(b.ini)));
    return '<div class="jy-day'+(d===hoyDia?' hoy':'')+'">'
     + '<div class="jy-day-h"><b>'+diasES[d]+'</b><span>'+(del.length||'')+'</span></div>'
     + (del.length
        ? del.map(x=> '<div class="jy-slot'+(x.quien?' asignado':'')+'">'
            + '<div class="hh">'+esc(x.ini||'--:--')+(x.fin? ' – '+esc(x.fin):'')+'</div>'
            + '<div class="nn">'+esc(x.titulo)+'</div>'
            + '<div class="ss">'+esc(x.detalle||'—')
            +   (x.nota? '<br>'+esc(x.nota):'')
            +   (x.firma? '<br><span style="opacity:.7">último cambio · '+esc(x.firma)+'</span>':'')
            + '</div></div>').join('')
        : '<div class="jy-vacio">libre</div>')
     + '</div>';
  }).join('') + '</div>';
}

function resumenSemana(proId, filtroAlumno){
  let bl = clasesDeLaSemana(proId);
  if(filtroAlumno) bl = bl.filter(x=> x.quien===filtroAlumno);
  const conGente = bl.filter(x=> x.quien).length;
  return '<span class="chip">'+bl.length+' clase'+(bl.length===1?'':'s')+' esta semana</span>'
   + '<span class="chip '+(conGente?'ok':'')+'">'+conGente+' con persona asignada</span>';
}

/* --- el recuadro completo: selector + grilla + tabla editable --- */
function recuadroHorarioSemanal(u){
  const gente = alumnosDe(u.id);
  const rotulo = u.rol==='nutricionista' ? 'paciente' : 'alumno';

  /* el selector recuerda la elección entre repintados */
  let sel = HORARIO_ELEGIDO;
  if(sel && sel !== '__todos__' && !gente.find(a=> a.id===sel)) sel = null;
  if(sel === null || sel === undefined) sel = '__todos__';
  HORARIO_ELEGIDO = sel;
  const uno = sel === '__todos__' ? null : sel;

  return '<div class="card" style="margin-bottom:18px"><div class="card-head">'
   +   '<div class="h2">Horario semanal</div><div class="grow"></div>'
   +   (gente.length
        ? '<select class="inp" id="h-quien" style="max-width:240px">'
          + '<option value="__todos__"'+(uno?'':' selected')+'>Mi semana completa</option>'
          + gente.map(a=>'<option value="'+a.id+'"'+(uno===a.id?' selected':'')+'>'
              + esc(a.nombre)+'</option>').join('')
          + '</select>'
        : '<span class="chip">sin '+rotulo+'s vinculados</span>')
   + '</div>'

   + '<div class="row" style="margin-bottom:12px">'+resumenSemana(u.id, uno)+'</div>'

   + '<div id="jy-grid">'+grillaCombinada(u.id, uno)+'</div>'

   + (uno
      ? tablaHorarioAlumno(u, uno)
      : '<p class="hint" style="margin:14px 0 0">'
        + (gente.length
           ? 'Estás viendo todas tus clases: las de tu agenda y las del horario semanal de cada '
             + rotulo+'. Elige a una persona en el selector para cargar y editar su horario.'
           : 'Cuando aceptes una solicitud, aquí podrás cargar y editar el horario semanal de cada '
             + rotulo+'.')
        + '</p>')
   + '</div>';
}

let HORARIO_ELEGIDO = null;

function ligarHorarioAlumno(u){
  const quien = $('#h-quien');
  if(quien) quien.onchange = ()=>{ HORARIO_ELEGIDO = quien.value; pintar(); };

  const sel = HORARIO_ELEGIDO;
  if(!sel || sel === '__todos__') return;      /* vista general: nada que editar */

  const lista = horarioDe(sel);
  const tabla = $('#t-horario');
  const est   = $('#h-estado');
  const grid  = $('#jy-grid');

  const avisar = (txt, malo)=>{
    if(!est) return;
    est.textContent = txt;
    est.style.color = malo ? 'var(--bad)' : 'var(--ok)';
    clearTimeout(est._t);
    est._t = setTimeout(()=>{ est.textContent=''; est.style.color=''; }, 3500);
  };
  const refrescarGrilla = ()=>{ if(grid) grid.innerHTML = grillaCombinada(u.id, sel); };

  const escribir = (e)=>{
    const el = e.target.closest('[data-h][data-c]'); if(!el) return;
    const b = lista.find(x=> x.id===el.dataset.h); if(!b) return;
    b[el.dataset.c] = el.dataset.c==='dia' ? +el.value : el.value;
    sellarBloque(b, u.id);
    guardar('horario');
    refrescarGrilla();
    avisar('Guardado');
  };
  if(tabla){
    tabla.addEventListener('input', escribir);
    tabla.addEventListener('change', escribir);
    tabla.addEventListener('click', async (e)=>{
      const b = e.target.closest('[data-hborra]'); if(!b) return;
      if(!await preguntar('Eliminar el bloque',
        '<p class="sub" style="margin:0">Sale del horario de esta persona, que lo verá '
        + 'desaparecer en su pestaña «Mis clases».</p>', {ok:'Eliminar', peligro:true})) return;
      const i = lista.findIndex(x=> x.id===b.dataset.hborra);
      if(i>=0) lista.splice(i,1);
      guardar('horario'); toast('Bloque eliminado','warn'); pintar();
    });
  }

  const add = $('#h-add');
  if(add) add.onclick = ()=>{
    lista.push(sellarBloque({id:uid('h'), dia:1, ini:'08:00', fin:'09:00',
      actividad:'', profesor:u.nombre, lugar:'', nota:''}, u.id));
    guardar('horario'); toast('Bloque agregado al horario','ok'); pintar();
  };

  /* guardado explícito: sella toda la semana y la publica de una vez */
  const gu = $('#h-guardar');
  if(gu) gu.onclick = ()=>{
    if(!lista.length) return avisar('No hay bloques que guardar', true);
    lista.forEach(b=> sellarBloque(b, u.id));
    guardar('horario');
    refrescarGrilla();
    const a = usuario(sel);
    toast('Horario guardado. '+(a? a.nombre.split(' ')[0] : 'La persona')
      +' lo ve en su pestaña «Mis clases».','ok');
    avisar('Semana guardada · '+lista.length+' bloques');
  };
}

function pantallaAgenda(v,u){
  const esNutri = u.rol==='nutricionista';
  const rotulo  = esNutri ? 'paciente' : 'alumno';
  const gente   = alumnosDe(u.id);
  const bl      = agendaDe(u.id);

      ? '<div class="row" style="gap:6px;flex-wrap:wrap;border-top:1px solid var(--line-soft);padding-top:10px">'

async function abrirEditorPlanServicio(u, planId){
  const planes = u.planesServicio || (u.planesServicio = []);
  const existente = planId ? planes.find(p=>p.id===planId) : null;
  const r = await preguntar(existente? 'Editar plan de servicio' : 'Nuevo plan de servicio',
    '<form class="stack">'
    + '<div class="field"><label>Nombre del plan *</label><input class="inp" name="titulo" required value="'+esc(existente?existente.titulo:'')+'" placeholder="Ej. Plan Individual"></div>'
    + '<div class="field"><label>Descripción breve</label><input class="inp" name="subtitulo" value="'+esc(existente?existente.subtitulo:'')+'" placeholder="Ej. Entrenamiento personalizado 1 a 1"></div>'
    + '<div class="grid g2">'
    +   '<div class="field"><label>Precio (CLP) *</label><input class="inp" name="precio" type="number" min="0" step="1000" required value="'+(existente?existente.precio:'')+'"></div>'
    +   '<div class="field"><label>Duración / frecuencia</label><input class="inp" name="periodo" value="'+esc(existente?(existente.periodo||'mes'):'mes')+'" placeholder="Ej. mes, 4 clases/mes, 2 meses"></div>'
    + '</div>'
    + '<div class="field"><label>Qué incluye (un beneficio por línea)</label><textarea class="inp" name="caracteristicas" placeholder="Evaluación inicial'+String.fromCharCode(10)+'Rutina personalizada'+String.fromCharCode(10)+'Seguimiento por WhatsApp">'+esc(existente?(existente.caracteristicas||[]).join(String.fromCharCode(10)):'')+'</textarea></div>'
    + '<div class="field"><label>Etiqueta destacada (opcional)</label><input class="inp" name="badge" value="'+esc(existente?(existente.badge||''):'')+'" placeholder="Ej. Más elegido"></div>'
    + '<label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" name="destacado" '+(existente&&existente.destacado?'checked':'')+'> Destacar este plan con borde dorado</label>'
    + '<label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" name="visible" '+(!existente||existente.visible!==false?'checked':'')+'> Visible para los alumnos en el buscador</label>'
    + '</form>',
    {ok: existente? 'Guardar cambios' : 'Crear plan'});
  if(!r) return;
  if(!r.titulo || !r.titulo.trim()) return toast('El plan necesita un nombre.','bad');
  const datos = {
    id: existente? existente.id : uid('svcplan'),
    titulo: r.titulo.trim(),
    subtitulo: (r.subtitulo||'').trim(),
    precio: +r.precio || 0,
    periodo: (r.periodo||'').trim() || 'mes',
    caracteristicas: String(r.caracteristicas||'').split('\n').map(s=>s.trim()).filter(Boolean),
    badge: (r.badge||'').trim(),
    destacado: !!r.destacado,
    visible: !!r.visible
  };
  if(existente) Object.assign(existente, datos); else planes.push(datos);
  guardar('usuarios');
  bitacora('plan-servicio', (existente?'Actualizó':'Creó')+' el plan "'+datos.titulo+'"', u.id);
  toast(existente? 'Plan actualizado' : 'Plan creado', 'ok');
  pintar();
}

async function eliminarPlanServicio(u, planId){
  const planes = u.planesServicio||[];
  const plan = planes.find(p=>p.id===planId); if(!plan) return;
  if(!await preguntar('Eliminar plan','<p class="sub" style="margin:0">Se eliminará "'+esc(plan.titulo)+'" de tu ficha pública. Los alumnos que ya lo solicitaron mantienen su vínculo.</p>',{ok:'Eliminar',peligro:true})) return;
  u.planesServicio = planes.filter(p=>p.id!==planId);
  guardar('usuarios'); bitacora('plan-servicio','Eliminó el plan "'+plan.titulo+'"', u.id);
  toast('Plan eliminado','warn'); pintar();
}

function toggleVisiblePlanServicio(u, planId){
  const plan = (u.planesServicio||[]).find(p=>p.id===planId); if(!plan) return;
  plan.visible = plan.visible===false;
  guardar('usuarios');
  toast(plan.visible? 'Plan publicado en tu ficha' : 'Plan oculto del buscador', plan.visible?'ok':'warn');
  pintar();
}

/* Variante de solicitarVinculo() que precarga el mensaje con el plan elegido
   y deja registro del plan solicitado en el vínculo (pilar 4). */
async function solicitarVinculoConPlan(u, proId, plan){
  if(!u) return;
  const p = usuario(proId);
  const veto = porQueNoConectar(u.id, proId);
  if(veto) return toast(veto, 'warn');
  const previo = vinculoDe(u.id, proId);
  if(previo){ toast(previo.estado==='activo'? 'Ya estás conectado con '+p.nombre.split(' ')[0]+'.' : 'Ya tienes una solicitud enviada a '+p.nombre.split(' ')[0]+'.', 'warn'); return; }
  const mensajeDefault = plan? ('Me interesa el '+plan.titulo+' ('+money(plan.precio)+' / '+ (plan.periodo||'mes') +').') : '';
  const r = await preguntar('Solicitar '+(plan? plan.titulo : 'conexión')+' con '+p.nombre,
    '<form class="stack"><p class="sub" style="margin:0">Al aceptar, '+esc(p.nombre.split(' ')[0])
    +' podrá ver tus registros y publicarte evaluaciones y planes. Puedes cortar el vínculo cuando quieras.</p>'
    +'<div class="field"><label>Mensaje para '+esc(p.nombre.split(' ')[0])+'</label><textarea class="inp" name="mensaje" placeholder="Objetivo, disponibilidad, lesiones previas…">'+esc(mensajeDefault)+'</textarea></div></form>',
    {ok:'Enviar solicitud'});
  if(!r) return;
  S.vinculos.push({ id:uid('v'), alumnoId:u.id, profesionalId:proId, estado:'pendiente',
    desde:new Date().toISOString(), servicio: p.rol==='profesor'?'Entrenamiento':'Nutrición',
    plan: plan? (plan.titulo+' — '+money(plan.precio)+' / '+(plan.periodo||'mes')) : 'Por definir',
    planServicioId: plan? plan.id : null, mensaje:(r.mensaje||'') });
  guardar('vinculos'); bitacora('vinculo', 'Solicitud a '+p.nombre+(plan? ' por '+plan.titulo : ''), u.id);
  toast('Solicitud enviada a '+p.nombre.split(' ')[0], 'ok'); pintar();
}

/* ---------------------------------------------------------------
   §19 · MOTOR DE HERRAMIENTAS EMBEBIDAS
   Cada herramienta original vive intacta dentro de un bloque
   <script type="text/html"> y se monta en un iframe aislado
   (srcdoc). Así conserva su CSS y su JS sin chocar con la cáscara.
   El puente es postMessage: la herramienta pide contexto, informa
   su alto y devuelve registros que caen en el pilar 5 (Datos).
   --------------------------------------------------------------- */
const JY_FIN = '@@JYENDSCRIPT@@';

function payloadHerramienta(id){
  const el = document.getElementById(id);
  if(!el) return '';
  return el.textContent.split(JY_FIN).join('<'+'/script>');
}

function edadDe(nac){
  if(!nac) return '';
  const ms = Date.now() - new Date(nac).getTime();
  if(isNaN(ms)) return '';
  return String(Math.floor(ms/31557600000));
}

/* lo que la herramienta recibe al arrancar */
function semillaDe(ctx){
  const u = sesion(), a = ctx && ctx.alumno;
  const ultPeso = a ? (S.metricas.filter(m=>m.alumnoId===a.id && m.clave==='peso')
                        .sort((x,y)=> y.fecha.localeCompare(x.fecha))[0]||null) : null;
  const plan = a ? Datos.ultimo({sujetoId:a.id, modulo:'planificacion'}) : null;
  const evalu = a ? Datos.ultimo({sujetoId:a.id, modulo:'evaluacion'}) : null;
  return {
    marca:{ nombre:'JYNTRA', dorado:'#C6A15A', negro:'#0D0D0D', hueso:'#EDE7DA' },
    /* §3e · la misma identidad que ven el alumno y el nutricionista */
    identidad: a ? identidadDe(a.id) : null,
    usuario: u ? {id:u.id, nombre:u.nombre, rol:u.rol, plan:u.plan||'base'} : null,
    alumno : a ? {id:a.id, nombre:a.nombre, email:a.email||'', telefono:a.telefono||'',
                  nacimiento:a.nacimiento||'', edad:edadDe(a.nacimiento), sexo:a.sexo||'',
                  altura:a.altura||'', peso: ultPeso? ultPeso.valor : '',
                  objetivo:a.objetivo||''} : null,
    alumnos: (u && esProfesional(u.rol)) ? alumnosDe(u.id).map(x=>({id:x.id, nombre:x.nombre})) : [],
    plan   : plan ? plan.datos : null,
    evaluacion: evalu ? evalu.datos : null,
    gifs   : S.gifs || null
  };
}

/* guarda sin repintar la pantalla: el iframe no se pierde a mitad de trabajo */
function guardarDesdeHerramienta(reg, ctx){
  const u = sesion(); if(!u) return null;
  const a = ctx && ctx.alumno;
  if(a && !vinculado(a.id, u.id)){ toast('No hay vínculo activo con esa persona. No se guardó nada.','bad'); return null; }
  const r = Datos.guardar(Object.assign({ autorId:u.id, sujetoId:(a&&a.id)||u.id }, reg));
  toast(a? ('Guardado en la ficha de '+a.nombre.split(' ')[0]) : 'Registro guardado','ok');
  const marcador = document.getElementById('jy-marcador-registros');
  if(marcador && a) marcador.textContent = Datos.listar({sujetoId:a.id}).length+' registros';
  return r;
}

function montarHerramienta(caja, payloadId, ctx, opciones){
  opciones = opciones || {};
  const alto = opciones.alto || 980;
  const marco = document.createElement('iframe');
  marco.title = opciones.nombre || payloadId;
  marco.style.cssText = 'width:100%;border:0;display:block;background:#0A0A0A;'
    + 'border-radius:10px;min-height:'+alto+'px';
  marco.setAttribute('allow','clipboard-write; camera; microphone');

  const semilla = '<scr'+'ipt>window.__JY_CTX = '
      + JSON.stringify(semillaDe(ctx)).replace(/</g,'\\u003c')
      + ';</scr'+'ipt>'
    + '<sty'+'le>html,body{min-height:0 !important}#root{min-height:0 !important}</sty'+'le>';

  let html = payloadHerramienta(payloadId);
  if(html.indexOf('</head>') >= 0) html = html.replace('</head>', semilla+'</head>');
  else html = semilla + html;
  marco.srcdoc = html;
  caja.appendChild(marco);

  const oir = (e)=>{
    if(!e.data || e.data.jyntra !== true) return;
    if(e.source !== marco.contentWindow) return;
    const m = e.data;
    if(m.accion === 'alto' && m.px){
      const px = Math.max(420, Math.min(9000, Math.round(m.px) + 16));
      if(Math.abs(parseInt(marco.style.minHeight,10) - px) > 24) marco.style.minHeight = px+'px';
    }
    if(m.accion === 'guardar') guardarDesdeHerramienta(m.registro||{}, ctx);
    if(m.accion === 'gifs' && m.clave){
      S.gifs = S.gifs || {};
      S.gifs[m.clave] = m.valor;
      guardar('gifs');
    }
    if(m.accion === 'listo'){
      try{ marco.contentWindow.postMessage({jyntra:true, accion:'contexto', contexto: semillaDe(ctx)}, '*'); }catch(err){}
    }
  };
  window.addEventListener('message', oir);
  return ()=> window.removeEventListener('message', oir);
}

/* --- borradores de herramienta, por persona --- */
function fichaDe(personaId, herramienta){
  const f = S.fichas && S.fichas[personaId];
  return (f && f[herramienta]) || null;
}
function guardarFicha(personaId, herramienta, datos){
  if(!S.fichas) S.fichas = {};
  if(!S.fichas[personaId]) S.fichas[personaId] = {};
  S.fichas[personaId][herramienta] = datos;
  guardar('fichas');
}
function borrarFicha(personaId, herramienta){
  if(S.fichas && S.fichas[personaId]){ delete S.fichas[personaId][herramienta]; guardar('fichas'); }
}

/* --- semilla de contexto que se inyecta en la cabecera del marco --- */
function semillaHTML(datos){
  return '<scr'+'ipt>window.__JY_CTX = '
    + JSON.stringify(datos).replace(/</g,'\\u003c') + ';</scr'+'ipt>'
    + '<sty'+'le>html,body{min-height:0 !important}#root{min-height:0 !important}</sty'+'le>';
}
function conSemilla(html, datos){
  const semilla = semillaHTML(datos);
  return html.indexOf('</head>') >= 0 ? html.replace('</head>', semilla+'</head>') : semilla + html;
}

function ligarAnamnesis(a, u){
  const fr = $('#fr-anamnesis'); if(!fr) return;
  const est = $('#anam-estado');
  const sello = ()=>{ if(est) est.textContent = 'Borrador guardado ' +
      new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); };

  const oir = (e)=>{
    if(!e.data || e.data.jyEmbed !== true) return;
    if(fr.contentWindow && e.source !== fr.contentWindow) return;
    if(e.data.accion === 'alto' && e.data.px){
      fr.style.height = Math.max(520, Math.min(12000, e.data.px)) + 'px';
    }
    if(e.data.accion === 'listo'){
      const previo = fichaDe(a.id, 'anamnesis');
      if(previo){
        try{ fr.contentWindow.postMessage({jyEmbed:true, accion:'cargar', datos:previo}, '*'); sello(); }catch(err){}
      }
    }
    if(e.data.accion === 'estado'){ guardarFicha(a.id, 'anamnesis', e.data.datos); sello(); }
  };
  window.addEventListener('message', oir);

  const pintarMarco = ()=>{
    fr.srcdoc = conSemilla(payloadHerramienta('jy-tool-anamnesis'), {
      usuario:{id:u.id, nombre:u.nombre, rol:u.rol},
      alumno: {id:a.id, nombre:a.nombre, edad:edadDe(a.nacimiento), sexo:a.sexo||'',
               altura:a.altura||'', objetivo:a.objetivo||'',
               peso:(S.metricas.filter(m=>m.alumnoId===a.id && m.clave==='peso')
                       .sort((x,y)=> y.fecha.localeCompare(x.fecha))[0]||{}).valor || ''}
    });
  };
  pintarMarco();

  $('#b-anam-print').onclick = ()=>{
    try{
      const d = fr.contentDocument, b = d && d.querySelector('#printBtn');
      if(b) b.click(); else toast('La ficha todavía se está cargando.','warn');
    }catch(err){ toast('El visor no permite imprimir desde dentro del marco.','warn'); }
  };

  $('#b-anam-guardar').onclick = ()=>{
    const d = fichaDe(a.id, 'anamnesis');
    if(!d || !d.vals) return toast('Todavía no hay nada escrito en la ficha.','warn');
    const v = d.vals;
    guardarDesdeHerramienta({
      modulo:'anamnesis', tipo:'Anamnesis nutricional y deportiva',
      datos:{
        nombre: v.f_nom || a.nombre, edad: v.f_ed || '', peso: v.f_pe || '',
        talla: v.f_ta || '', deporte: v.f_dep_principal || '',
        campos: d
      }
    }, {alumno:a});
    pintar();
  };

  $('#b-anam-reset').onclick = async ()=>{
    if(!await preguntar('Reiniciar la anamnesis',
      '<p class="sub" style="margin:0">Se borra el borrador de '+esc(a.nombre)
      +' y la ficha vuelve a partir en blanco. Las anamnesis ya guardadas en su historial no se tocan.</p>',
      {ok:'Reiniciar', peligro:true})) return;
    borrarFicha(a.id, 'anamnesis');
    if(est) est.textContent = '';
    pintarMarco();
    toast('Ficha reiniciada','warn');
  };

  return ()=> window.removeEventListener('message', oir);
}

/* ---------------------------------------------------------------
   §19c · TARJETA PLEGABLE — para que el perfil del atleta y la
   calculadora de 1RM no ocupen toda la pantalla mientras se
   trabaja la anamnesis.
   --------------------------------------------------------------- */
let PLEGADO = { atleta:false };
function plegable(clave, titulo, bajada, cuerpo, extra){
  const ab = !!PLEGADO[clave];
  return '<section class="fold'+(ab?' abierto':'')+'" id="fold-'+clave+'">'
   + '<button type="button" class="fold-h" data-fold="'+clave+'" aria-expanded="'+ab+'">'
   +   '<span class="fold-ic">▸</span>'
   +   '<span class="fold-t">'+esc(titulo)+'</span>'
   +   '<span class="fold-s">'+esc(bajada||'')+'</span>'
   +   (extra||'')
   +   '<span class="chip">'+(ab?'ocultar':'desplegar')+'</span>'
   + '</button>'
   + '<div class="fold-b" id="foldb-'+clave+'"'+(ab?'':' hidden')+'>'+cuerpo+'</div>'
   + '</section>';
}
function ligarPlegable(clave, alAbrir){
  const b = $('[data-fold="'+clave+'"]'); if(!b) return;
  b.onclick = ()=>{
    const abierto = !PLEGADO[clave];
    PLEGADO[clave] = abierto;
    const sec = $('#fold-'+clave), cuerpo = $('#foldb-'+clave);
    sec.classList.toggle('abierto', abierto);
    b.setAttribute('aria-expanded', String(abierto));
    b.querySelector('.chip').textContent = abierto ? 'ocultar' : 'desplegar';
    if(abierto){ cuerpo.removeAttribute('hidden'); if(alAbrir) alAbrir(); }
    else cuerpo.setAttribute('hidden','');
  };
  if(PLEGADO[clave] && alAbrir) alAbrir();
}

  var col = COLOR_ROL[b.rolPro] || 'var(--line)';
  var rot = b.rolPro === 'nutricionista' ? 'Nutricionista' : (b.rolPro === 'profesor' ? 'Profesor' : '');
  if(!b.profesional) return '<span class="hint" style="margin:0">Por asignar</span>';
  return '<span class="jy-pro-chip" style="border-color:' + col + ';color:' + col + '">'
   + '<span class="dot" style="background:' + col + '"></span>' + esc(b.profesional) + '</span>'
   + (rot ? '<div class="hint" style="margin:2px 0 0;font-size:10.5px">' + rot + '</div>' : '');
}
function filaHorarioJY(b, editable){
  var cel = function(campo, tipo, ph){
    return '<input class="inp" data-h="' + b.id + '" data-c="' + campo + '" type="' + tipo + '" value="'
      + esc(b[campo]||'') + '" placeholder="' + esc(ph||'') + '">';
  };
  var lect = function(txt){ return '<span class="jy-ro">' + esc(txt||'—') + '</span>'; };
  var deplan = !!b.origenPlan;
  var col = deplan ? (COLOR_ROL[b.rolPro] || 'var(--line)') : 'transparent';

  return '<tr class="' + (deplan ? 'jy-b-plan' : '') + '" style="box-shadow:inset 3px 0 0 ' + col + '">'
   + '<td class="tight">' + (deplan
        ? lect(nombreDia(+b.dia))
        : '<select class="inp" data-h="' + b.id + '" data-c="dia">'
          + DIAS_ORD.map(function(d){ return '<option value="' + d + '"' + (+b.dia===d?' selected':'') + '>' + nombreDia(d) + '</option>'; }).join('')
          + '</select>') + '</td>'
   + '<td class="tight">' + (deplan ? lect(b.fecha ? fechaCorta(b.fecha) : 'Por definir') : lect('—')) + '</td>'
   + '<td class="tight">' + (deplan ? lect(b.ini) : cel('ini','time')) + '</td>'
   + '<td class="tight">' + (deplan ? lect(b.fin) : cel('fin','time')) + '</td>'
   + '<td class="tight">' + (deplan ? lect(b.actividad||'Sesión') : cel('actividad','text','Sesión')) + '</td>'
   + '<td class="tight">' + (deplan ? chipProfesional(b) : cel('profesional','text','Por asignar')) + '</td>'
   + '<td class="tight">' + cel('lugar','text','Lugar') + '</td>'
   + '<td class="tight">' + cel('nota','text','Nota') + firma(b) + '</td>'
   + '<td class="right tight">' + (deplan
        ? '<span class="chip" title="Bloque cargado por tu profesional">plan</span>'
        : '<button class="btn sm danger" data-borra="' + b.id + '" title="Eliminar bloque">✕</button>') + '</td>'
   + '</tr>';
}
try{ filaHorario = function(b){ return filaHorarioJY(b, true); }; }catch(e){}

var jyResumenHorario = function(lista){
  return '<div class="horagrid">' + DIAS_ORD.map(function(d){
    var bs = lista.filter(function(b){ return +b.dia === d; })
      .sort(function(a,b){ return String(a.ini).localeCompare(String(b.ini)); });
    return '<div class="col"><h4>' + nombreDia(d).slice(0,3) + '</h4>'
      + (bs.length ? bs.map(function(b){
          var col = b.origenPlan ? (COLOR_ROL[b.rolPro] || '') : '';
          return '<div class="blk"' + (col ? ' style="border-left:3px solid ' + col + '"' : '') + '>'
           + '<b>' + esc(b.ini||'--:--') + (b.fin ? '–' + esc(b.fin) : '') + '</b>'
           + '<span>' + esc(b.actividad||'Sesión') + (b.fecha ? ' · ' + esc(fechaCorta(b.fecha)) : '') + '</span>'
           + '<i>' + esc(b.profesional || b.profesor || 'Por asignar') + (b.lugar ? ' · ' + esc(b.lugar) : '') + '</i></div>';
        }).join('')
        : '<div class="hint" style="margin:0">—</div>')
      + '</div>';
  }).join('') + '</div>';
};
try{ resumenHorario = jyResumenHorario; }catch(e){}
function resumenH(l){ return jyResumenHorario(l); }

/* calendario mensual reutilizable */
function calendarioHTML(idBase, mesISO, eventos){
  var base = aFecha(mesISO) || new Date();
  var y = base.getFullYear(), m = base.getMonth();
  var primero = new Date(y, m, 1);
  var arranque = (primero.getDay() + 6) % 7;
  var dias = new Date(y, m+1, 0).getDate();
  var titulo = primero.toLocaleDateString('es-CL', {month:'long', year:'numeric'});
  var porDia = {};
  (eventos||[]).forEach(function(ev){
    if(!ev.fecha) return;
    (porDia[ev.fecha] = porDia[ev.fecha] || []).push(ev);
  });

  var celdas = '';
  for(var i=0; i<arranque; i++) celdas += '<div class="jy-cal-d off"></div>';
  for(var d=1; d<=dias; d++){
    var f = iso(new Date(y, m, d));
    var evs = porDia[f] || [];
    celdas += '<div class="jy-cal-d' + (f === hoy() ? ' hoy' : '') + (evs.length ? ' con' : '') + '">'
      + '<span class="n">' + d + '</span>'
      + evs.slice(0,3).map(function(ev){
          var col = COLOR_ROL[ev.rol] || 'var(--gold)';
          return '<i style="background:' + col + '22;border-left:2px solid ' + col + '">'
            + esc((ev.hora||'') + ' ' + (ev.titulo||'')) + '</i>';
        }).join('')
      + (evs.length > 3 ? '<u>+' + (evs.length-3) + '</u>' : '')
      + '</div>';
  }

  return '<div class="jy-cal" id="' + idBase + '">'
   + '<div class="jy-cal-h"><button class="btn sm" data-cal="' + idBase + '" data-mes="' + iso(new Date(y, m-1, 1)) + '">‹</button>'
   + '<b>' + esc(titulo.charAt(0).toUpperCase() + titulo.slice(1)) + '</b>'
   + '<button class="btn sm" data-cal="' + idBase + '" data-mes="' + iso(new Date(y, m+1, 1)) + '">›</button></div>'
   + '<div class="jy-cal-g">'
   + ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(function(x){ return '<div class="jy-cal-w">' + x + '</div>'; }).join('')
   + celdas + '</div></div>';
}

/* ---------- 20.8 · PROFESIONAL · horario semanal con fechas ---------- */
var JY_SEL_ALUMNO = null;
var JY_SEL_SEMANA = '__todas__';

function alumnosDelPro(proId){
  return (typeof alumnosDe === 'function') ? alumnosDe(proId) : [];
}
function bloquesDelPro(proId){
  var fuera = [];
  alumnosDelPro(proId).forEach(function(a){
    hDe(a.id).forEach(function(b){
      if(b.profesionalId && b.profesionalId !== proId) return;
      fuera.push({ b:b, alumno:a });
    });
  });
  return fuera;
}
function semanasDelMes(mesISO){
  var base = aFecha(mesISO) || new Date();
  var y = base.getFullYear(), m = base.getMonth();
  var d = new Date(y, m, 1);
  var vistos = {}, fuera = [];
  while(d.getMonth() === m){
    var l = lunesDe(iso(d));
    if(l && !vistos[l]){ vistos[l] = true; fuera.push(l); }
    d.setDate(d.getDate()+7);
  }
  return fuera;
}
function enSemana(fecha, lunesISO){
  if(lunesISO === '__todas__') return true;
  if(!fecha) return false;
  return fecha >= lunesISO && fecha <= masDias(lunesISO, 6);
}

var jy_grillaCombinada = function(proId, filtroAlumno, semana){
  var sem = semana || JY_SEL_SEMANA;
  var hoyDia = new Date().getDay();
  var items = bloquesDelPro(proId)
    .filter(function(x){ return !filtroAlumno || x.alumno.id === filtroAlumno; })
    .filter(function(x){ return sem === '__todas__' ? true : enSemana(x.b.fecha, sem); });

  return '<div class="jy-week">' + DIAS_ORD.map(function(d){
    var del = items.filter(function(x){ return +x.b.dia === d; })
      .sort(function(a,b){ return String(a.b.ini).localeCompare(String(b.b.ini)); });
    return '<div class="jy-day' + (d === hoyDia ? ' hoy' : '') + '">'
     + '<div class="jy-day-h"><b>' + nombreDia(d) + '</b><span>' + (del.length||'') + '</span></div>'
     + (del.length
        ? del.map(function(x){
            var col = COLOR_ROL[x.b.rolPro] || '';
            return '<div class="jy-slot asignado"' + (col ? ' style="border-left:3px solid ' + col + '"' : '') + '>'
             + '<div class="hh">' + esc(x.b.ini||'--:--') + (x.b.fin ? ' – ' + esc(x.b.fin) : '')
             + (x.b.fecha ? ' · ' + esc(fechaCorta(x.b.fecha)) : '') + '</div>'
             + '<div class="nn">' + esc(x.alumno.nombre) + '</div>'
             + '<div class="ss">' + esc(x.b.actividad||'Sesión') + (x.b.lugar ? ' · ' + esc(x.b.lugar) : '')
             + (x.b.nota ? '<br>' + esc(x.b.nota) : '')
             + (x.b.publicado ? '' : '<br><span style="opacity:.7">sin publicar</span>')
             + '</div></div>';
          }).join('')
        : '<div class="jy-vacio">libre</div>')
     + '</div>';
  }).join('') + '</div>';
};

var jy_recuadroHorarioSemanal = function(u){
  var gente = alumnosDelPro(u.id);
  var rotulo = u.rol === 'nutricionista' ? 'paciente' : 'alumno';
  var sel = JY_SEL_ALUMNO;
  if(sel && sel !== '__todos__' && !gente.filter(function(a){ return a.id === sel; })[0]) sel = null;
  if(sel == null) sel = '__todos__';
  JY_SEL_ALUMNO = sel;
  var uno = sel === '__todos__' ? null : sel;

  var semanas = semanasDelMes(MES_PRO);
  var optSem = '<option value="__todas__"' + (JY_SEL_SEMANA === '__todas__' ? ' selected' : '') + '>Todas las semanas</option>'
    + semanas.map(function(l){
        return '<option value="' + l + '"' + (JY_SEL_SEMANA === l ? ' selected' : '') + '>Semana del '
          + fechaCorta(l) + ' al ' + fechaCorta(masDias(l,6)) + '</option>';
      }).join('');

  var items = bloquesDelPro(u.id).filter(function(x){ return !uno || x.alumno.id === uno; });
  var enRango = items.filter(function(x){ return enSemana(x.b.fecha, JY_SEL_SEMANA); });

  return '<div class="card" style="margin-bottom:18px"><div class="card-head">'
   +   '<div class="h2">Horario semanal</div><div class="grow"></div>'
   +   (gente.length
        ? '<select class="inp" id="h-quien" style="max-width:220px">'

var jy_ligarHorarioAlumno = function(u, raiz){
  var r = raiz || document;
  var quien = q('#h-quien', r);
  if(quien) quien.onchange = function(){ JY_SEL_ALUMNO = quien.value; pintar(); };
  var sem = q('#h-semana', r);
  if(sem) sem.onchange = function(){ JY_SEL_SEMANA = sem.value; pintar(); };

  var sel = JY_SEL_ALUMNO;
  if(!sel || sel === '__todos__') return;

  var lista = hDe(sel);
  var tabla = q('#t-horario', r);
  var est   = q('#h-estado', r);
  var grid  = q('#jy-grid', r);

  var avisar = function(txt, malo){
    if(!est) return;
    est.textContent = txt;
    est.style.color = malo ? 'var(--bad)' : 'var(--ok)';
    clearTimeout(est._t);
    est._t = setTimeout(function(){ est.textContent=''; est.style.color=''; }, 3500);
  };
  var refrescarGrilla = function(){ if(grid) grid.innerHTML = jy_grillaCombinada(u.id, sel, JY_SEL_SEMANA); };

  var escribir = function(e){
    var el = e.target.closest ? e.target.closest('[data-h][data-c]') : null; if(!el) return;
    var b = lista.filter(function(x){ return x.id === el.dataset.h; })[0]; if(!b) return;
    b[el.dataset.c] = el.value;
    if(el.dataset.c === 'fecha'){
      var d = diaDeFecha(el.value);
      if(d != null){
        b.dia = d;
        var cel = q('[data-dia-de="' + b.id + '"]', r);
        if(cel) cel.textContent = nombreDia(d);
      }
      b.publicado = false;
    }
    if(el.dataset.c === 'actividad') b.servicio = el.value;
    sellar(b, u.id);
    guardar('horario');
    refrescarGrilla();
    avisar('Guardado');
  };
  if(tabla){
    tabla.addEventListener('input', escribir);
    tabla.addEventListener('change', escribir);
    tabla.addEventListener('click', async function(e){
      var b = e.target.closest ? e.target.closest('[data-hborra]') : null; if(!b) return;
      if(!await preguntar('Eliminar el bloque',
        '<p class="sub" style="margin:0">Sale del horario de esta persona, que lo verá desaparecer en «Mis clases».</p>',
        {ok:'Eliminar', peligro:true})) return;
      var i = lista.findIndex(function(x){ return x.id === b.dataset.hborra; });
      if(i >= 0) lista.splice(i,1);
      guardar('horario'); toast('Bloque eliminado','warn'); pintar();
    });
  }

  var gu = q('#h-guardar', r);
  if(gu) gu.onclick = function(){
    var mios = lista.filter(function(b){ return !b.profesionalId || b.profesionalId === u.id; });
    if(!mios.length) return avisar('No hay bloques que guardar', true);
    var conFecha = mios.filter(function(b){ return !!b.fecha; });
    if(!conFecha.length) return avisar('Ponle fecha al menos a un bloque', true);
    conFecha.forEach(function(b){
      b.publicado = true;
      b.profesionalId = b.profesionalId || u.id;
      b.profesional = b.profesional || u.nombre;
      b.rolPro = b.rolPro || u.rol;
      b.dia = diaDeFecha(b.fecha);
      sellar(b, u.id);
    });
    guardar('horario');
    var a = usr(sel);
    toast(conFecha.length + ' clases guardadas en tu calendario. '
      + (a ? a.nombre.split(' ')[0] : 'La persona') + ' las ve en «Mis clases».','ok');
    avisar('Semana guardada · ' + conFecha.length + ' fechas');
    pintar();
  };
};
