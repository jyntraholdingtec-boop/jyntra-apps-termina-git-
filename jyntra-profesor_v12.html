  const [p0, setP0] = useState('');
  const [p1, setP1] = useState('');
  const [p2, setP2] = useState('');

  const isRuffier = protocol === 'RUFFIER';
  const proto = VO2_PROTOCOLS.find((p) => p.id === protocol);

  const t = (parseFloat(minutes || 0) + parseFloat(seconds || 0) / 60);
  const vo2 = useMemo(() => {
    if (isRuffier || !(t > 0)) return 0;
    return protocol === 'BRUCE' ? calculateBruce(t, gender) : calculateBalke(t, gender);
  }, [t, protocol, gender, isRuffier]);

  const ruffierIndex = useMemo(() => (isRuffier ? calculateRuffier(p0, p1, p2) : null), [isRuffier, p0, p1, p2]);

  const rating = isRuffier ? getRuffierRating(ruffierIndex) : getVO2Rating(vo2, gender);
  const scale = isRuffier ? SCALES.ruffier : (gender === 'M' ? SCALES.vo2M : SCALES.vo2F);
  const mets = vo2 / 3.5;
  const readoutValue = isRuffier ? ruffierIndex : vo2;
  const readoutUnit = isRuffier ? 'IR' : 'ml/kg/min';

  const history = patient.records?.VO2 || [];
  const sameProto = history.filter((r) => r.protocol === protocol);
  const prev = sameProto.length ? parseFloat(isRuffier ? sameProto[0].index : sameProto[0].vo2) : null;
  const valid = isRuffier ? (ruffierIndex !== null && !isNaN(ruffierIndex)) : vo2 > 0;

  // Zonas de entrenamiento (Karvonen) en latidos por minuto, a partir del perfil del atleta
  const zones = patient.age ? getKarvonenZones(patient.age, patient.fcMax, patient.fcRep) : null;
  const fcMaxShown = patient.fcMax ? parseInt(patient.fcMax) : (patient.age ? 220 - parseInt(patient.age) : null);
  const zoneRows = zones ? [
    { k: 'calentamiento', label: 'Calentamiento', pct: '50–60%', tone: 'info', use: 'Activación y vuelta a la calma' },
    { k: 'grasa',         label: 'Quema de grasa', pct: '60–70%', tone: 'ok',   use: 'Trabajo aeróbico base, larga duración' },
    { k: 'resistencia',   label: 'Resistencia',    pct: '70–80%', tone: 'warn', use: 'Umbral aeróbico, ritmo sostenido' },
    { k: 'maximo',        label: 'Máximo',         pct: '80–95%', tone: 'bad',  use: 'Intervalos y potencia aeróbica' }
  ] : [];

  const save = () => {
    if (!valid) { notify(isRuffier ? 'Ingresa P0, P1 y P2 para guardar.' : 'Ingresa el tiempo del test para guardar.', 'bad'); return; }
    const rec = isRuffier
      ? { id: Date.now(), protocol, p0, p1, p2, index: ruffierIndex.toFixed(1), rating, date: new Date().toLocaleDateString('es-CL') }
      : { id: Date.now(), protocol, gender, time: t.toFixed(2), vo2: vo2.toFixed(2), rating, date: new Date().toLocaleDateString('es-CL') };
    setPatient({ ...patient, records: { ...patient.records, VO2: [rec, ...history] } });
    notify((isRuffier ? 'Índice de Ruffier' : 'VO₂ máx') + ' guardado en el historial');
  };

  const pdf = () => {
    if (!valid) { notify(isRuffier ? 'Ingresa P0, P1 y P2 antes de generar el PDF.' : 'Ingresa el tiempo del test antes de generar el PDF.', 'bad'); return; }

    const zoneBlocks = zones ? [
      { type: 'section', label: 'Zonas de trabajo · Karvonen (lpm)' },
      { type: 'table', head: ['Zona', 'Intensidad', 'Rango (lpm)', 'Uso principal'],
        rows: zoneRows.map((z) => [z.label, z.pct, zones[z.k].min + ' – ' + zones[z.k].max, z.use]) }
    ] : [];

    if (isRuffier) {
      exportPDF({
        title: 'VO2 Max - Test de Ruffier',
        patient,
        blocks: [
          { type: 'hero', caption: 'Índice de Ruffier-Dickson · Recuperación cardíaca', value: fmt(ruffierIndex, 1), unit: 'IR',
            badge: rating, badgeTone: toneOf(rating),
            extras: ['P0 ' + p0 + ' lpm', 'P1 ' + p1 + ' lpm', 'P2 ' + p2 + ' lpm'] },
          { type: 'scale', scale, value: ruffierIndex, title: 'Escala normativa del índice de Ruffier' },
          { type: 'section', label: 'Configuración de la prueba' },
          { type: 'kv', rows: [
            { label: 'Protocolo utilizado', value: 'Test de Ruffier', strong: true },
            { label: 'Pulso en reposo (P0)', value: p0 + ' lpm' },
            { label: 'Pulso post-esfuerzo (P1)', value: p1 + ' lpm' },
            { label: 'Pulso post-recuperación (P2)', value: p2 + ' lpm' },
            { label: 'Índice de Ruffier', value: fmt(ruffierIndex, 1), strong: true },
            { label: 'Clasificación', value: rating, tone: toneOf(rating) }
          ]},
          ...zoneBlocks,
          ...(sameProto.length ? [
            { type: 'section', label: 'Historial del test de Ruffier' },
            { type: 'table', head: ['Fecha', 'P0', 'P1', 'P2', 'Índice'],
              rows: sameProto.slice(0, 8).map((r) => [r.date, r.p0, r.p1, r.p2, r.index]) }
          ] : []),
          { type: 'note', text: 'El índice de Ruffier-Dickson evalúa la capacidad de recuperación cardíaca tras un esfuerzo submáximo (30 sentadillas en 45 s). A menor índice, mejor capacidad de recuperación. No reemplaza una prueba de esfuerzo clínica.' }
        ]
      });
      return;
    }

    exportPDF({
      title: 'VO2 Max',
      patient,
      blocks: [
        { type: 'hero', caption: 'Consumo máximo de oxígeno · Test de ' + (protocol === 'BRUCE' ? 'Bruce' : 'Balke'),
          value: fmt(vo2, 2), unit: 'ml/kg/min', badge: rating, badgeTone: toneOf(rating),
          extras: [fmt(mets, 1) + ' METs', Math.floor(t) + ' min ' + Math.round((t % 1) * 60) + ' s en cinta'] },
        { type: 'scale', scale, value: vo2, title: 'Escala normativa · ' + (gender === 'M' ? 'hombres' : 'mujeres') },
        { type: 'section', label: 'Configuración de la prueba' },
        { type: 'kv', rows: [
          { label: 'Protocolo utilizado', value: 'Test de ' + (protocol === 'BRUCE' ? 'Bruce' : 'Balke'), strong: true },
          { label: 'Sexo de referencia', value: gender === 'M' ? 'Masculino' : 'Femenino' },
          { label: 'Tiempo hasta el agotamiento', value: (minutes || 0) + ' min ' + (seconds || 0) + ' s  (' + fmt(t, 2) + ' min)' },
          { label: 'VO₂ máx estimado', value: fmt(vo2, 2) + ' ml/kg/min', strong: true },
          { label: 'Equivalente metabólico', value: fmt(mets, 1) + ' METs' },
          { label: 'Clasificación', value: rating, tone: toneOf(rating) }
        ]},
        { type: 'section', label: 'Referencia normativa por sexo' },
        { type: 'table', head: ['Clasificación', 'Rango (ml/kg/min)', 'Interpretación'],
          rows: scale.segments.slice().reverse().map((s) => [
            s.label, s.from + ' – ' + s.to,
            s.label === 'Excelente' ? 'Capacidad aeróbica de nivel deportivo'
              : s.label === 'Bueno' ? 'Buena reserva cardiorrespiratoria'
              : s.label === 'Regular' ? 'Margen amplio de mejora con trabajo aeróbico'
              : 'Prioridad: base aeróbica progresiva'
          ]) },
        ...zoneBlocks,
        ...(sameProto.length ? [
          { type: 'section', label: 'Historial de resistencia · ' + protocol },
          { type: 'table', head: ['Fecha', 'Protocolo', 'Tiempo', 'VO₂ máx'],
            rows: sameProto.slice(0, 8).map((r) => [r.date, r.protocol, r.time + ' min', r.vo2]) }
        ] : []),
        { type: 'note', text: 'El VO₂ máx indica la cantidad máxima de oxígeno que el organismo puede absorber, transportar y consumir durante el esfuerzo. Es una estimación indirecta a partir del tiempo en protocolo; repite la prueba con el mismo protocolo para que las comparaciones sean válidas.' }
      ]
    });
  };

  const whats = () => isRuffier
    ? sendWhats(patient.phone,
        '*JINTRA PRO · VO₂ MÁX*\nTest de Ruffier de ' + patient.name + ':\n\n*Índice de Ruffier:* ' + fmt(ruffierIndex, 1) +
        '\n*Nivel:* ' + rating + '\n\n_El PDF incluye la escala normativa completa y las zonas de trabajo._')
    : sendWhats(patient.phone,
        '*JINTRA PRO · VO₂ MÁX*\nTest de ' + protocol + ' de ' + patient.name + ':\n\n*VO₂ máx:* ' + fmt(vo2, 2) +
        ' ml/kg/min\n*Nivel:* ' + rating + '\n*Equivalente:* ' + fmt(mets, 1) + ' METs\n\n_El PDF incluye la escala normativa completa y las zonas de trabajo._');

  return (
    <div className="jt-stack">
      <Panel title="Capacidad cardiorrespiratoria" sub="Elige el protocolo, sigue sus pasos para tomar los parámetros y lee el resultado en la escala." icon={<HeartPulse size={18} />} tone="gold">
        <div className="jt-vo2-top">
          <div className="jt-col">
            <div className="jt-proto">
              {VO2_PROTOCOLS.map((p) => (
                <button key={p.id} className={'jt-proto-b' + (protocol === p.id ? ' is-on' : '')} onClick={() => setProtocol(p.id)}>
                  <strong>Test de {p.n}</strong>
                  <span>{p.d}</span>
                </button>
              ))}
            </div>

            <div className="jt-protodetail">
              <span className="jt-eyebrow">Protocolo · toma de parámetros</span>
              <p className="jt-protodetail-mat"><strong>Material: </strong>{proto.material}</p>
              <ol className="jt-protodetail-steps">
                {proto.steps.map((s, i) => <li key={i}>{s}</li>)}
              </ol>
            </div>

            {isRuffier ? (
              <div className="jt-row-3">
                <Field label="P0 · Reposo" hint="lpm">
                  <input type="number" min="0" className="jt-input jt-input-xl" placeholder="0" value={p0} onChange={(e) => setP0(e.target.value)} />
                </Field>
                <Field label="P1 · Post-esfuerzo" hint="lpm">
                  <input type="number" min="0" className="jt-input jt-input-xl" placeholder="0" value={p1} onChange={(e) => setP1(e.target.value)} />
                </Field>
                <Field label="P2 · Post-recuperación" hint="lpm">
                  <input type="number" min="0" className="jt-input jt-input-xl" placeholder="0" value={p2} onChange={(e) => setP2(e.target.value)} />
                </Field>
              </div>
            ) : (
              <>
                <div className="jt-row-2">
                  <Field label="Minutos">
                    <input type="number" min="0" className="jt-input jt-input-xl" placeholder="00" value={minutes} onChange={(e) => setMinutes(e.target.value)} />
                  </Field>
                  <Field label="Segundos">
                    <input type="number" min="0" max="59" className="jt-input jt-input-xl" placeholder="00" value={seconds} onChange={(e) => setSeconds(e.target.value)} />
                  </Field>
                </div>

                <div className="jt-seg">
                  {[{ v: 'M', l: 'Masculino' }, { v: 'F', l: 'Femenino' }].map((g) => (
                    <button key={g.v} className={'jt-seg-b' + (gender === g.v ? ' is-on' : '')} onClick={() => setGender(g.v)}>
                      {g.l}<em>tabla normativa</em>
                    </button>
                  ))}
                </div>
              </>
            )}
          </div>

          <div className="jt-readout is-gauge">
            <Gauge value={readoutValue} scale={scale} unit={readoutUnit} caption={isRuffier ? 'Índice de Ruffier' : 'Consumo de oxígeno'} decimals={isRuffier ? 1 : 2} />
            <Verdict cat={valid ? rating : null} />
            {valid && !isRuffier && (
              <div className="jt-mets">
                <span>{fmt(mets, 1)} METs</span>
                <Delta current={vo2} previous={prev} unit="ml/kg/min" />
              </div>
            )}
            {valid && isRuffier && <Delta current={ruffierIndex} previous={prev} unit="IR" invert />}

            {zones && (
              <div className="jt-vo2zones">
                <span className="jt-eyebrow">Zonas de trabajo · latidos por minuto</span>
                <HeartRateZones zones={zones} zoneRows={zoneRows} fcMaxShown={fcMaxShown} fcRep={patient.fcRep} />
              </div>
            )}
          </div>
        </div>

        <Ruler scale={scale} value={valid ? readoutValue : ''} label={isRuffier ? 'Escala normativa del índice de Ruffier' : ('Escala normativa · ' + (gender === 'M' ? 'hombres' : 'mujeres'))} />

        <Actions onSave={save} onPdf={pdf} onWhats={whats} saveLabel={isRuffier ? 'Guardar índice de Ruffier' : 'Guardar VO₂ máx'} ready={ready} />
      </Panel>

      {history.length > 0 && (
        <Panel title="Historial de resistencia" sub={history.length + ' registros'} icon={<Activity size={18} />} tone="gold">
          <div className="jt-hist">
            {history.map((r) => {
              const rIsRuffier = r.protocol === 'RUFFIER';
              return (
                <div key={r.id} className="jt-histrow">
                  <div className="jt-histrow-l">
                    <span className="jt-date">{r.date}</span>
                    <strong>Test de {r.protocol === 'RUFFIER' ? 'Ruffier' : r.protocol}</strong>
                    <em>{rIsRuffier ? ('P0 ' + r.p0 + ' · P1 ' + r.p1 + ' · P2 ' + r.p2) : (r.time + ' min en cinta')}</em>
                  </div>
                  <div className="jt-histrow-r">
                    <span className="jt-histnum">{rIsRuffier ? r.index : r.vo2}<i>{rIsRuffier ? 'IR' : 'ml/kg/min'}</i></span>
                    <span className="jt-pill" style={{ borderColor: TONE[toneOf(r.rating)].hex, color: TONE[toneOf(r.rating)].hex, background: TONE[toneOf(r.rating)].soft }}>
                      {r.rating}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        </Panel>
      )}
    </div>
  );
}

/* ---------------------------- 05 · FLEXIBILIDAD ---------------------------- */

function Flex({ patient, setPatient, notify, exportPDF, ready }) {
  const [sit, setSit] = useState('');
  const [esc, setEsc] = useState('');

  const sitCat = (v) => {
    if (v === '' || v === null || !isFinite(Number(v))) return null;
    const x = parseFloat(v);
    if (x >= 15) return 'Excelente';
    if (x >= 6) return 'Bueno';
    if (x >= 0) return 'Regular';
    return 'Pobre';
  };
  const escCat = (v) => {
    if (v === '' || v === null || !isFinite(Number(v))) return null;
    const x = parseFloat(v);
    if (x <= 5) return 'Excelente';
    if (x <= 10) return 'Bueno';
    if (x <= 15) return 'Regular';
    return 'Pobre';
  };

  const history = patient.records?.Flex || [];

  const TESTS = [
    {
      key: 'Sit & Reach', value: sit, setValue: setSit, cat: sitCat(sit), scale: SCALES.sitReach, invert: false,
      title: 'Test Sit and Reach', desc: 'Flexibilidad de la zona lumbar y la musculatura isquiotibial.',
      inputLabel: 'Alcance registrado', hint: 'cm', better: 'Mayor alcance es mejor',
      note: 'Sentado con piernas extendidas, se empuja el cursor del cajón con las dos manos sin flexionar rodillas. Se registra el mejor de tres intentos tras calentamiento.',
      material: 'Cajón de Sit and Reach (o caja con regla adosada), superficie plana.',
      steps: [
        'Realizar un calentamiento general breve antes de la prueba.',
        'Sentarse en el suelo, descalzo, con las piernas extendidas y las plantas de los pies apoyadas contra el cajón de medición.',
        'Colocar una mano sobre la otra con los brazos extendidos al frente.',
        'Empujar el cursor deslizante hacia adelante con ambas manos, sin flexionar las rodillas y sin realizar rebotes bruscos.',
        'Mantener la posición de máximo alcance durante 2 segundos.',
        'Repetir 3 intentos y registrar el mejor resultado, en centímetros, en la calculadora.'
      ]
    },
    {
      key: 'Amplitud Escapular', value: esc, setValue: setEsc, cat: escCat(esc), scale: SCALES.escapular, invert: true,
      title: 'Test de amplitud escapular', desc: 'Movilidad de la cintura escapular y flexibilidad de hombros.',
      inputLabel: 'Distancia entre manos', hint: 'cm', better: 'Menor distancia es mejor',
      note: 'Una mano por encima del hombro y la otra por la espalda baja; se mide la distancia entre las puntas de los dedos medios. Se evalúan ambos lados y se registra el peor resultado.',
      material: 'Cinta métrica flexible.',
      steps: [
        'De pie, llevar un brazo por encima del mismo hombro con el codo flexionado y la palma apoyada entre los omóplatos.',
        'Simultáneamente, llevar el otro brazo por detrás de la espalda baja, con el codo flexionado hacia arriba y la palma hacia afuera.',
        'Intentar aproximar o superponer los dedos medios de ambas manos entre los omóplatos, sin forzar ni generar dolor.',
        'Medir con la cinta métrica la distancia entre las puntas de los dedos medios; si se superponen, registrar el traslape como valor negativo.',
        'Evaluar ambos lados (brazo derecho arriba y brazo izquierdo arriba) y registrar el peor resultado (mayor distancia) en la calculadora.'
      ]
    }
  ];

  const saveOne = (test) => {
    if (!test.cat) { notify('Ingresa el resultado en centímetros para guardar.', 'bad'); return; }
    const rec = { id: Date.now(), type: test.key, val: parseFloat(test.value).toFixed(1), rating: test.cat, date: new Date().toLocaleDateString('es-CL') };
    setPatient({ ...patient, records: { ...patient.records, Flex: [rec, ...history] } });
    notify(test.key + ' guardado en el historial');
  };

  const pdfOne = (test) => {
    if (!test.cat) { notify('Ingresa el resultado antes de generar el PDF.', 'bad'); return; }
    const past = history.filter((r) => r.type === test.key);
    exportPDF({
      title: 'Flexibilidad - ' + test.key,
      patient,
      blocks: [
        { type: 'hero', caption: test.title, value: fmt(test.value, 1), unit: 'cm', badge: test.cat, badgeTone: toneOf(test.cat),
          extras: [test.better] },
        { type: 'scale', scale: test.scale, value: parseFloat(test.value), title: 'Escala normativa de referencia' },
        { type: 'section', label: 'Detalle de la evaluación' },
        { type: 'kv', rows: [
          { label: 'Prueba evaluada', value: test.title, strong: true },
          { label: 'Enfoque de medición', value: test.desc },
          { label: 'Resultado registrado', value: fmt(test.value, 1) + ' cm', strong: true },
          { label: 'Clasificación normativa', value: test.cat, tone: toneOf(test.cat) }
        ]},
        { type: 'section', label: 'Tabla de referencia (cm)' },
        { type: 'table', head: ['Clasificación', 'Rango', 'Criterio'],
          rows: test.scale.segments.slice().reverse().map((s) => [s.label, s.from + ' a ' + s.to + ' cm', test.better]) },
        ...(past.length ? [
          { type: 'section', label: 'Historial de la prueba' },
          { type: 'table', head: ['Fecha', 'Resultado', 'Clasificación'], rows: past.slice(0, 8).map((r) => [r.date, r.val + ' cm', r.rating]) }
        ] : []),
        { type: 'note', text: 'Protocolo aplicado: ' + test.note }
      ]
    });
  };

  const whatsOne = (test) => sendWhats(patient.phone,
    '*JINTRA PRO · FLEXIBILIDAD*\n' + test.title + ' de ' + patient.name + ':\n\n*Resultado:* ' + fmt(test.value, 1) +
    ' cm\n*Clasificación:* ' + (test.cat || '-') + '\n\n_El PDF incluye la escala completa y el protocolo._');

  return (
    <div className="jt-stack">
      {TESTS.map((test) => (
        <Panel key={test.key} title={test.title} sub={test.desc} icon={<RulerIcon size={18} />} tone="gold">
          <div className="jt-flex-top">
            <div className="jt-col">
              <Field label={test.inputLabel} hint={test.hint}>
                <input type="number" step="0.5" className="jt-input jt-input-xl" placeholder="0.0"
                  value={test.value} onChange={(e) => test.setValue(e.target.value)} />
              </Field>

              <div className="jt-protodetail">
                <span className="jt-eyebrow">Protocolo · toma de parámetros</span>
                <p className="jt-protodetail-mat"><strong>Material: </strong>{test.material}</p>
                <ol className="jt-protodetail-steps">
                  {test.steps.map((s, i) => <li key={i}>{s}</li>)}
                </ol>
                <p className="jt-protodetail-mat" style={{ marginTop: 10, marginBottom: 0 }}><strong>Criterio: </strong>{test.better}.</p>
              </div>
            </div>
            <div className="jt-readout">
              <span className="jt-eyebrow">Clasificación</span>
              <div className="jt-bignum">{test.cat ? fmt(test.value, 1) : '--'}<em>cm</em></div>
              <Verdict cat={test.cat} />
            </div>
          </div>

          <Ruler scale={test.scale} value={test.cat ? parseFloat(test.value) : ''} label="Escala normativa de referencia" />

          <Actions
            onSave={() => saveOne(test)}
            onPdf={() => pdfOne(test)}
            onWhats={() => whatsOne(test)}
            saveLabel={'Guardar ' + test.key}
            ready={ready}
          />
        </Panel>
      ))}

      {history.length > 0 && (
        <Panel title="Historial de amplitud" sub={history.length + ' registros'} icon={<RulerIcon size={18} />} tone="gold">
          <div className="jt-hist">
            {history.map((r) => (
              <div key={r.id} className="jt-histrow">
                <div className="jt-histrow-l">
                  <span className="jt-date">{r.date}</span>
                  <strong>{r.type}</strong>
                </div>
                <div className="jt-histrow-r">
                  <span className="jt-histnum">{r.val}<i>cm</i></span>
                  <span className="jt-pill" style={{ borderColor: TONE[toneOf(r.rating)].hex, color: TONE[toneOf(r.rating)].hex, background: TONE[toneOf(r.rating)].soft }}>
                    {r.rating}
                  </span>
                </div>
              </div>
            ))}
          </div>
        </Panel>
      )}
    </div>
  );
}

      ".jt-foot{margin:26px 0 6px;padding-top:14px;border-top:1px solid var(--line);font-size:10px;line-height:1.6;color:#4f4c47;letter-spacing:.03em;text-align:center;}",

      ".jt-toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:88vw;padding:12px 20px;border-radius:12px;font-size:12px;font-weight:600;text-align:center;background:#0F0F0F;border:1px solid var(--gold);color:var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.6);animation:jtToast .3s ease-out;}",
      ".jt-toast.is-bad{border-color:#E5484D;color:#E5484D;}",
      "@keyframes jtToast{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}",

      /* ---- Modo embebido: la herramienta vive dentro de la cáscara JYNTRA.

      ".jt-shell.is-embed .jt-top{position:static;}",
      ".jt-shell.is-embed .jt-nav{position:static;transform:none;left:auto;bottom:auto;width:auto;max-width:none;margin:0;border-top:0;border-bottom:1px solid var(--line);padding:9px 12px;justify-content:flex-start;gap:8px;border-left:0;border-right:0;}",
      ".jt-shell.is-embed .jt-tab{flex:0 1 200px;flex-direction:row;gap:9px;min-height:46px;font-size:11.5px;padding:8px 14px;border-color:var(--line);background:#101010;}",
      ".jt-shell.is-embed .jt-tab.is-active{border-color:var(--gold);background:rgba(212,175,55,.09);}",
      ".jt-shell.is-embed .jt-athlete{position:static;}",
      ".jt-shell.is-embed .jt-main{max-width:820px;padding:18px 16px 8px;}",
      ".jt-shell.is-embed .jt-toast{bottom:18px;}",
      "@media (min-width:900px){.jt-shell.is-embed .jt-grid-2{grid-template-columns:1fr 1fr;}}"
    ].join('\n') }} />

<script>
/* --- puente de alto con la cáscara JYNTRA ---
   El iframe no tiene scroll propio: le avisa al padre cuánto mide para que
   le ajuste el alto, y anuncia 'listo' para recibir el contexto de vuelta. */
(function(){
  if(!window.parent || window.parent === window) return;
  var ultimo = 0;
  function avisar(){
    var h = Math.max(
      document.documentElement.scrollHeight,
      document.body ? document.body.scrollHeight : 0
    );
    if(Math.abs(h - ultimo) > 20){
      ultimo = h;
      try{ window.parent.postMessage({jyntra:true, accion:'alto', px:h}, '*'); }catch(e){}
    }
  }
  window.addEventListener('load', avisar);
  window.addEventListener('resize', avisar);
  setInterval(avisar, 600);
  try{ window.parent.postMessage({jyntra:true, accion:'listo'}, '*'); }catch(e){}
})();
@@JYENDSCRIPT@@

  .slot-top .idx{color:var(--gold);font-weight:800;font-size:13px;font-family:'Arial Narrow',sans-serif;padding-bottom:9px;}

  .field-label{font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:3px;}

  .gif-btn{width:100%;height:132px;border-radius:8px;border:1px dashed var(--gold-dark);background:transparent;color:var(--gold-light);font-size:10px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;}

  /* ---------- biblioteca de GIFs ---------- */
  .lib-open{font-family:'Arial Narrow',sans-serif;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;padding:10px 16px;border-radius:8px;border:1px solid var(--gold-dark);background:transparent;color:var(--gold-light);cursor:pointer;}

  .modal{position:fixed;inset:0;background:rgba(10,9,8,.82);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .modal.open{display:flex;}

  .modal-head p{margin:6px 0 0;font-size:12px;color:var(--muted);max-width:560px;}

  .lib-item select{font-size:9.5px;padding:4px 5px;border-radius:5px;}

  .lib-item:hover{border-color:var(--gold);}

  .paste-area{display:none;margin-top:14px;}

  .slot-obs textarea{resize:vertical;min-height:44px;font-size:12px;}

  /* ---------- marcar como realizado ---------- */
  .done-btn{width:100%;height:44px;border-radius:8px;border:1px solid var(--gold-dark);background:transparent;
    color:var(--gold-light);font-family:'Arial Narrow',sans-serif;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;

    align-items:center;justify-content:center;font-size:10px;line-height:1;flex-shrink:0;}
  .done-btn:hover{background:rgba(201,154,82,0.12);}
  .done-btn:active{transform:scale(0.97);}
  .done-btn.done{background:var(--gold);border-color:var(--gold);color:#211d16;}
  .done-btn.done .tick{background:#211d16;color:var(--gold);border-color:#211d16;}
  .done-btn.just{animation:pop .45s ease;}
  @keyframes pop{
    0%{transform:scale(1);box-shadow:0 0 0 0 rgba(201,154,82,.55);}
    45%{transform:scale(1.06);box-shadow:0 0 0 9px rgba(201,154,82,0);}
    100%{transform:scale(1);box-shadow:0 0 0 0 rgba(201,154,82,0);}
  }
  .slot-card.done{border-color:var(--gold-dark);box-shadow:inset 3px 0 0 var(--gold);}
  .slot-card.done .slot-top .idx{color:var(--gold-light);}

  /* ---------- barra de avance de la sesión ---------- */
  .progress{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 18px;margin-bottom:16px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .progress .p-label{font-family:'Arial Narrow',sans-serif;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    font-size:11.5px;color:var(--muted);white-space:nowrap;}
  .progress .p-label b{color:var(--gold-light);font-size:14px;}
  .p-rail{flex:1;min-width:150px;height:9px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;}
  .p-fill{height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--gold-dark),var(--gold-light));
    transition:width .35s cubic-bezier(.3,.9,.4,1);}
  .p-msg{font-size:11px;color:var(--gold-dark);letter-spacing:.05em;text-transform:uppercase;
    font-family:'Arial Narrow',sans-serif;font-weight:800;white-space:nowrap;}
  .p-msg.full{color:var(--gold);}
  @media (prefers-reduced-motion:reduce){

<header class="top">

<main>

  <div class="session-config">

      <select id="session-modalidad"></select>

  <div class="actions">

    <button type="button" class="jy-guardar" id="jy-guardar-btn2">Guardar en la ficha del alumno</button>

  <div id="sheet-wrap">
    <div class="sheet-actions">
      <button class="primary" id="print-btn">Imprimir</button>

    <div id="sheet">

        <div class="sheet-fields">
          <div>Alumno<span class="line" id="jy-sheet-alumno"></span></div>
          <div>Fecha<span class="line"></span></div>
        </div>
      </div>

      <div id="sheet-sessions"></div>

      <div class="sheet-foot">
        <span>Jyntra — Entrenamiento con estructura</span>
        <span id="sheet-date"></span>
      </div>
    </div>
  </div>
</main>

<div class="modal" id="library-modal">
  <div class="modal-box">

    <div class="paste-area" id="paste-area">

      <div class="lib-tools" style="margin-top:10px;">
        <button class="mini-btn solid" id="add-links-btn">Agregar a la biblioteca</button>
      </div>
    </div>

    <p class="lib-status" id="lib-status"></p>
    <div class="lib-scroll" id="lib-scroll"></div>

    <div class="lib-tools" style="margin-top:18px;">
      <button class="mini-btn warn" id="clear-assign-btn">Quitar GIF del ejercicio</button>
      <button class="mini-btn solid" id="export-tool-btn">Descargar herramienta con los GIFs</button>
      <button class="mini-btn" id="lib-done-btn" style="margin-left:auto;">Listo</button>
    </div>
  </div>
</div>

/* ---------------- almacenamiento (IndexedDB + respaldos) ---------------- */
const DB_NAME = "jyntra-gifs", DB_STORE = "kv";
function idb(){
  return new Promise((res,rej) => {
    if (!window.indexedDB) return rej(new Error("sin indexedDB"));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { if(!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE); };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function dbGet(key){
  try{
    const db = await idb();
    return await new Promise((res,rej) => {
      const r = db.transaction(DB_STORE,"readonly").objectStore(DB_STORE).get(key);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }catch(e){
    try{ const v = localStorage.getItem(DB_NAME+":"+key); return v ? JSON.parse(v) : undefined; }catch(_){ return undefined; }
  }
}
async function dbSet(key, value){
  /* espejo hacia la cáscara JYNTRA, para que la biblioteca no se pierda */
  try{
    if(window.parent && window.parent !== window)
      window.parent.postMessage({jyntra:true, accion:'gifs', clave:key, valor:value}, '*');
  }catch(e){}
  try{
    const db = await idb();
    await new Promise((res,rej) => {
      const r = db.transaction(DB_STORE,"readwrite").objectStore(DB_STORE).put(value, key);
      r.onsuccess = () => res(); r.onerror = () => rej(r.error);
    });
    return true;
  }catch(e){
    try{ localStorage.setItem(DB_NAME+":"+key, JSON.stringify(value)); return true; }
    catch(_){ return false; }
  }
}

    return Array.isArray(data.lib) && data.lib.length ? data : null;

const VERSION_CATALOGO = "v9-fullbody";

async function loadGifData(){
  // biblioteca y asignaciones — si la app JYNTRA la tiene guardada, esa manda
  const JYG = (window.__JY_CTX && window.__JY_CTX.gifs) || null;
  gifLib = (JYG && JYG.lib) || (await dbGet("lib")) || [];
  gifMap = (JYG && JYG.map) || (await dbGet("map")) || {};

  // al estrenar el catálogo se descartan los GIFs sueltos de versiones anteriores
  const marca = await dbGet("catalogo-version");
  if (marca !== VERSION_CATALOGO){
    gifLib = []; gifMap = {};
    await dbSet("catalogo-version", VERSION_CATALOGO);
    await saveGifData();
  }

  // los GIFs que vienen dentro del archivo se suman a lo que ya haya en el equipo
  const seed = readSeed();
  if (seed){
    let nuevos = 0;
    seed.lib.forEach(g => {
      const before = gifLib.length;
      const item = addToLib(g.name, g.src, g.kind || "archivo", g.eje);
      if (gifLib.length > before) nuevos++;
      // reencaminar las asignaciones al id local
      if (seed.map) Object.entries(seed.map).forEach(([ex,ref]) => { if (ref === g.id && !gifMap[ex]) gifMap[ex] = item.id; });
    });
    if (nuevos) await saveGifData();
  }
  // los ítems guardados antes de la clasificación no tienen grupo muscular
  let faltaEje = false;
  gifLib.forEach(g => { if (!g.eje){ g.eje = detectEje(g.name); faltaEje = true; } });
  if (faltaEje) await saveGifData();

  // migración desde la versión anterior (window.storage con URLs sueltas)
  if (!gifLib.length && !Object.keys(gifMap).length){
    try{
      const r = await window.storage.get('gifs-map', false);
      const old = r ? JSON.parse(r.value) : {};
      Object.entries(old).forEach(([ex,url]) => {
        const item = addToLib(nameFromUrl(url) || ex, url, "enlace");
        gifMap[ex] = item.id;
      });
      if (Object.keys(gifMap).length) await saveGifData();
    }catch(e){ /* no había datos previos */ }
  }
}
async function saveGifData(){
  const okLib = await dbSet("lib", gifLib);
  const okMap = await dbSet("map", gifMap);
  return okLib && okMap;
}

/* ---------------- biblioteca: alta, búsqueda, resolución ---------------- */
function uid(){ return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function nameFromUrl(url){
  try{
    const clean = String(url).split("?")[0].split("#")[0];
    const last = clean.substring(clean.lastIndexOf("/")+1);
    return decodeURIComponent(last).replace(/\.(gif|png|jpe?g|webp|mp4)$/i,"").replace(/[-_]+/g," ").trim();
  }catch(e){ return ""; }
}

/* Convierte un enlace de Google Drive en una URL que el navegador puede mostrar */
function driveDirect(url){
  const m = String(url).match(/\/file\/d\/([-\w]{20,})/)
         || String(url).match(/[?&]id=([-\w]{20,})/)
         || String(url).match(/\/d\/([-\w]{20,})/);
  if (!m) return null;
  return "https://lh3.googleusercontent.com/d/" + m[1] + "=w640";
}
function driveFallback(url){
  const m = String(url).match(/lh3\.googleusercontent\.com\/d\/([-\w]{20,})/);
  return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w640" : null;
}

function addToLib(name, src, kind, eje){
  const dup = gifLib.find(g => g.src === src);
  if (dup) return dup;
  const nm = (name||"Sin nombre").trim();
  const item = { id: uid(), name: nm, src, kind: kind||"enlace", eje: eje || detectEje(nm) };
  gifLib.push(item);
  return item;
}

/* Devuelve la URL del GIF asignado a un ejercicio (soporta el formato viejo) */
function resolveGif(exercise){
  if (!exercise) return null;
  const ref = gifMap[exercise];
  if (!ref) return null;
  const item = gifLib.find(g => g.id === ref);
  if (item) return item.src;
  return /^(https?:|data:)/.test(ref) ? ref : null;
}
/* El GIF de un ejercicio: primero el que cargó el usuario, si no el de Drive */
function gifDe(ejercicio){ return resolveGif(ejercicio) || gifDeDrive(ejercicio); }
function resolveGifName(exercise){
  const ref = gifMap[exercise];
  const item = gifLib.find(g => g.id === ref);
  return item ? item.name : "";
}

/* Normalización para emparejar nombres de archivo con nombres de ejercicio */
function norm(s){
  return String(s).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\.(gif|png|jpe?g|webp|mp4)$/,"")
    .replace(/[^a-z0-9]+/g," ").trim();
}
const STOPWORDS = new Set(["de","del","la","el","en","con","a","y","los","las","por"]);
function tokens(s){ return norm(s).split(" ").filter(t => t.length > 2 && !STOPWORDS.has(t)); }
function matchScore(a,b){
  const A = tokens(a), B = tokens(b);
  if (!A.length || !B.length) return 0;
  if (norm(a) === norm(b)) return 1;
  const hits = A.filter(t => B.includes(t)).length;
  return hits / Math.max(A.length, B.length);
}
function allExerciseNames(){
  const out = [];
  Object.values(EJES).forEach(e => Object.values(e.grupos).forEach(list => list.forEach(x => out.push(x))));
  return out;
}
/* Devuelve [{ejercicio, eje}] de todo el catálogo */
function allExercisePairs(){
  const out = [];
  Object.entries(EJES).forEach(([eje,e]) => Object.values(e.grupos).forEach(list => list.forEach(x => out.push({ejercicio:x, eje}))));
  return out;
}

/* ---------------- clasificación por grupo muscular ---------------- */
const SIN_CLASIFICAR = "Sin clasificar";
/* peso 3 = término inequívoco, 1 = pista débil */
const EJE_KEYWORDS = {
  "Pantorrillas":   {3:["pantorrilla","gemelo","gemelos","soleo","talon","talones"], 1:["escalon","plantar"]},
  "Antebrazo":      {3:["antebrazo","muneca","munecas","pronador","pronacion","empunadura","braquial","zottman"], 1:["agarre","mango"]},
  "Abdomen y core": {3:["abdominal","abdominales","abs","crunch","oblicuo","plancha","core","giro ruso","rueda abdominal","escalador"], 1:["bicicleta","elevacion de piernas","elevacion de rodillas"]},
  "Trapecio":       {3:["trapecio","encogimiento","encogerse","face pull","remo al menton","pec deck inverso","cruciforme inversa"], 1:["remo al pecho","remo alto"]},
  "Espalda":        {3:["dominada","dominadas","jalon","pull down","pulldown","pull over","dorsal","dorsales","remo","espalda","superman","hiperextension en banco"], 1:["landmine","barra t","invertido"]},
  "Glúteos":        {3:["gluteo","gluteos","hip thrust","empuje de cadera","elevacion de cadera","elevacion pelvica","puente","aductor","abductor","aduccion","abduccion","hiperextension inversa"], 1:["patada","cadera"]},
  "Isquiotibiales": {3:["peso muerto","rumano","isquio","isquios","femoral","curl nordico","buenos dias"], 1:["rdl","mesa flexora"]},
  "Cuádriceps":     {3:["sentadilla","squat","cuadricep","cuadriceps","prensa de piernas","hack","estocada","zancada","bulgara","pistol","step up"], 1:["prensa","split"]},
  "Pectoral":       {3:["pecho","pectoral","press de banca","banca","push up","apertura","cruce","cross over","peck deck"], 1:["press plano","press inclinado","press declinado","paralelas"]},
  "Tríceps":        {3:["triceps","tricesp","catana","press frances","close grip","press cerrado","diamante"], 1:["patada de triceps","fondos","copa"]},
  "Bíceps":         {3:["biceps","bicep","bayesian","predicador","scott","scot","scort","arana","curl martillo","martillo"], 1:["curl","concentrado","inverso"]}
};
function scoreEje(text){
  const t = " " + norm(text) + " ";
  const scores = {};
  Object.entries(EJE_KEYWORDS).forEach(([eje,w]) => {
    let sc = 0;
    Object.entries(w).forEach(([peso,words]) => {
      words.forEach(k => { if (t.includes(" " + norm(k) + " ") || t.includes(norm(k))) sc += (+peso); });
    });
    scores[eje] = sc;
  });
  return scores;
}
/* Deduce el grupo muscular de un GIF: primero por ejercicio del catálogo, después por palabras clave */
function detectEje(name){
  let best = null, bestScore = 0;
  allExercisePairs().forEach(pair => {
    const sc = matchScore(name, pair.ejercicio);
    if (sc > bestScore){ bestScore = sc; best = pair; }
  });
  if (best && bestScore >= 0.5) return best.eje;
  const scores = scoreEje(name);
  let eje = null, top = 0;
  Object.entries(scores).forEach(([k,v]) => { if (v > top){ top = v; eje = k; } });
  return top >= 3 ? eje : SIN_CLASIFICAR;
}
function ejeTag(eje){ return EJES[eje] ? EJES[eje].tag : "??"; }

/* ---------------- tabs ---------------- */
function renderTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  sessionsData.forEach((s,i) => {
    const wrap = document.createElement("div");
    wrap.className = "tab-btn";
    const btn = document.createElement("button");
    btn.className = "tab" + (i===currentSession ? " active" : "");
    btn.textContent = s.nombre || `Sesión ${i+1}`;
    btn.addEventListener("click", () => { currentSession = i; renderAll(); });
    wrap.appendChild(btn);
    if (i >= 2){
      const close = document.createElement("span");
      close.className = "tab-close";
      close.textContent = "✕";
      close.title = "Eliminar sesión";
      close.addEventListener("click",(e) => {
        e.stopPropagation();
        sessionsData.splice(i,1);
        if (currentSession >= sessionsData.length) currentSession = sessionsData.length-1;
        renderAll();
      });
      wrap.appendChild(close);
    }
    tabsEl.appendChild(wrap);
  });
  const addBtn = document.getElementById("add-session-btn");
  addBtn.disabled = sessionsData.length >= MAX_SESSIONS;
}

            : `<button class="gif-btn" data-gif="${i}" ${!slot.ejercicio?"disabled":""}>Elegir GIF</button>`}
        </div>
      </div>

      <div class="slot-obs">
        <div class="cell">
          <span class="field-label">Observación</span>
          <textarea placeholder="Notas técnicas, cuidados, variantes..." data-field="obs" data-idx="${i}">${slot.obs}</textarea>
        </div>
        <button class="done-btn ${slot.hecho?'done':''}" data-done="${i}"
                title="${slot.hecho?'Marcado como realizado':'Marcar como realizado'}"
                aria-pressed="${slot.hecho?'true':'false'}">
          <span class="tick">${slot.hecho?'✓':''}</span>${slot.hecho?'Realizado':'Marcar hecho'}
        </button>
      </div>
    `;
    slotsEl.appendChild(card);
  });

  document.getElementById("count-label").textContent = `${filled}/${s.ejercicios.length}`;

  slotsEl.querySelectorAll("select").forEach(el => el.addEventListener("change", handleFieldChange));
  slotsEl.querySelectorAll('input[data-field="series"],input[data-field="reps"],input[data-field="peso"],input[data-field="descanso"],textarea[data-field="obs"]').forEach(el => {
    el.addEventListener("input", updateSlotFieldLight);
  });
  slotsEl.querySelectorAll("[data-remove]").forEach(btn => btn.addEventListener("click", handleRemoveSlot));
  slotsEl.querySelectorAll("[data-done]").forEach(btn => btn.addEventListener("click", handleDone));
  slotsEl.querySelectorAll("[data-gif]").forEach(el => el.addEventListener("click", handleGifClick));

  document.getElementById("add-slot-btn").disabled = s.ejercicios.length >= MAX_SLOTS;
  renderProgress();
}

/* ---------------- gestor de súper series de la sesión activa ---------------- */

  }));
  wrap.querySelectorAll(".gm-name").forEach(el => el.addEventListener("change", e => {
    const gid = e.target.dataset.gid;
    s.grupos[gid].nombre = e.target.value.trim() || s.grupos[gid].nombre;
    renderSlots();
    renderGruposManager();
  }));

/* Series, reps, peso, descanso y observaciones: solo actualiza el dato,
   sin redibujar la tarjeta, para que se pueda escribir de corrido sin
   que el cursor salte o se pierda el foco */
function updateSlotFieldLight(e){
  const idx = +e.target.dataset.idx;
  const field = e.target.dataset.field;
  sessionsData[currentSession].ejercicios[idx][field] = e.target.value;
}

function handleFieldChange(e){
  const idx = +e.target.dataset.idx;
  const field = e.target.dataset.field;
  const s = sessionsData[currentSession];
  const slot = s.ejercicios[idx];

  if (field === "grupoId"){
    slot.grupoId = e.target.value === "__new__" ? crearGrupo(s) : e.target.value;
    renderGruposManager();
    renderSlots();
    return;
  }

  slot[field] = e.target.value;
  if (field === "eje"){ slot.grupo=""; slot.ejercicio=""; }
  if (field === "grupo"){ slot.ejercicio=""; }
  renderSlots();
}

/* Marcar / desmarcar un ejercicio como realizado, sin redibujar la tarjeta
   (así no se pierde lo que el alumno esté escribiendo en observaciones) */
function handleDone(e){
  const btn = e.currentTarget;
  const idx = +btn.dataset.done;
  const slot = sessionsData[currentSession].ejercicios[idx];
  slot.hecho = !slot.hecho;

  btn.classList.toggle("done", slot.hecho);
  btn.setAttribute("aria-pressed", slot.hecho ? "true" : "false");
  btn.title = slot.hecho ? "Marcado como realizado" : "Marcar como realizado";
  btn.innerHTML = `<span class="tick">${slot.hecho ? "✓" : ""}</span>` + (slot.hecho ? "Realizado" : "Marcar hecho");
  btn.closest(".slot-card").classList.toggle("done", slot.hecho);

  if (slot.hecho){
    btn.classList.remove("just");
    void btn.offsetWidth;
    btn.classList.add("just");
  }
  renderProgress();
}

/* Avance de la sesión: cuántos ejercicios asignados ya se hicieron */
function renderProgress(){
  const s = sessionsData[currentSession];
  const asignados = s.ejercicios.filter(x => x.ejercicio);
  const hechos = asignados.filter(x => x.hecho).length;
  const total = asignados.length;
  const pct = total ? Math.round(hechos / total * 100) : 0;

  document.getElementById("p-count").textContent = `${hechos}/${total}`;
  document.getElementById("p-fill").style.width = pct + "%";

  const msg = document.getElementById("p-msg");
  msg.classList.toggle("full", total > 0 && hechos === total);
  msg.textContent =
    total === 0            ? "Sin ejercicios cargados" :
    hechos === 0           ? "A empezar" :
    hechos === total       ? "¡Sesión completa!" :
    hechos >= total * 0.5  ? `Vas por la mitad · ${pct}%` :
                             `${pct}% listo`;
}

function handleRemoveSlot(e){
  const idx = +e.currentTarget.dataset.remove;
  const s = sessionsData[currentSession];
  if (s.ejercicios.length <= MIN_SLOTS) return;
  s.ejercicios.splice(idx,1);
  renderSlots();
}

function handleGifClick(e){
  const idx = +e.currentTarget.dataset.gif;
  const slot = sessionsData[currentSession].ejercicios[idx];
  if (!slot.ejercicio) return;
  openLibrary(slot.ejercicio, slot.eje);
}

/* Si el enlace de Drive no carga por la vía principal, prueba la miniatura */
function fixGifSrc(img){
  const alt = driveFallback(img.getAttribute("src"));
  if (alt){ img.src = alt; } else { img.style.display = "none"; }
}

/* ================= BIBLIOTECA DE GIFS: interfaz ================= */
let pickerTarget = null;   // ejercicio al que se le va a asignar el GIF (null = solo administrar)
let ejeFilter = "";        // filtro de grupo muscular en la biblioteca

const modalEl   = () => document.getElementById("library-modal");
const gridEl    = () => document.getElementById("lib-scroll");
const statusEl  = () => document.getElementById("lib-status");

function setStatus(msg, tone){

function openLibrary(exercise, ejeDelSlot){

function renderFilterChips(){
  const wrap = document.getElementById("filter-chips");
  const counts = {};
  gifLib.forEach(g => { const e = g.eje || SIN_CLASIFICAR; counts[e] = (counts[e]||0)+1; });
  const groups = [...EJE_NAMES, SIN_CLASIFICAR].filter(e => counts[e]);
  wrap.innerHTML = [`<button class="fchip ${ejeFilter?'':'on'}" data-f="">Todos · ${gifLib.length}</button>`]
    .concat(groups.map(e => `<button class="fchip ${ejeFilter===e?'on':''}" data-f="${e}">${ejeTag(e)!=='??'?ejeTag(e)+' · ':''}${e} · ${counts[e]}</button>`))
    .join("");
  wrap.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
    ejeFilter = b.dataset.f; renderLibrary();
  }));

function renderLibrary(){
  const q = norm(document.getElementById("lib-search").value || "");
  const grid = gridEl();
  document.getElementById("lib-count").textContent = gifLib.length;
  renderFilterChips();

  let list = gifLib;
  if (q) list = list.filter(g => norm(g.name).includes(q));
  if (ejeFilter) list = list.filter(g => (g.eje || SIN_CLASIFICAR) === ejeFilter);

  if (!list.length){
    grid.innerHTML = `<div class="lib-grid"><div class="lib-empty">${gifLib.length
      ? "Ningún GIF coincide con ese filtro."
      : "Todavía no hay GIFs. Arrastrá archivos arriba o pegá enlaces."}</div></div>`;
    return;
  }

  const assignedId = pickerTarget ? gifMap[pickerTarget] : null;
  const ejeOptions = (sel) => [...EJE_NAMES, SIN_CLASIFICAR]
    .map(e => `<option value="${e}" ${sel===e?'selected':''}>${e}</option>`).join("");

  const card = g => `
    <div class="lib-item ${g.id===assignedId?'assigned':''}" data-pick="${g.id}" title="${g.name}">
      <button class="del" data-del="${g.id}" title="Eliminar de la biblioteca">✕</button>
      <img src="${g.src}" alt="${g.name}" loading="lazy" onerror="this.onerror=null;fixGifSrc(this)">
      <span class="nm">${g.name}</span>
      <select data-eje="${g.id}" title="Grupo muscular">${ejeOptions(g.eje || SIN_CLASIFICAR)}</select>
      <span class="src-tag">${g.kind}</span>
    </div>`;

  // agrupado por grupo muscular
  const order = [...EJE_NAMES, SIN_CLASIFICAR];
  grid.innerHTML = order.map(eje => {
    const items = list.filter(g => (g.eje || SIN_CLASIFICAR) === eje);
    if (!items.length) return "";
    return `<div class="lib-group-head">
        ${ejeTag(eje)!=='??' ? `<span class="g-tag">${ejeTag(eje)}</span>` : ''}
        <span class="g-name">${eje}</span>
        <span class="g-n">${items.length} GIF${items.length>1?'s':''}</span>
      </div>
      <div class="lib-grid">${items.map(card).join("")}</div>`;
  }).join("");

  grid.querySelectorAll("[data-eje]").forEach(sel => {
    sel.addEventListener("click", e => e.stopPropagation());
    sel.addEventListener("change", async e => {
      e.stopPropagation();
      const g = gifLib.find(x => x.id === sel.dataset.eje);
      if (g){ g.eje = sel.value; await saveGifData(); renderLibrary(); setStatus(`"${g.name}" movido a ${sel.value}.`, "ok"); }
    });
  });

  grid.querySelectorAll("[data-pick]").forEach(el => el.addEventListener("click", async (e) => {
    if (e.target.dataset.del) return;
    const id = el.dataset.pick;
    if (pickerTarget){
      gifMap[pickerTarget] = id;
      await saveGifData();
      closeLibrary();
    } else {
      const name = prompt("Asignar este GIF al ejercicio (escribí el nombre exacto):", "");
      if (!name) return;
      gifMap[name.trim()] = id;
      await saveGifData();
      setStatus(`Asignado a "${name.trim()}".`, "ok");
      renderLibrary();
    }
  }));

  grid.querySelectorAll("[data-del]").forEach(btn => btn.addEventListener("click", async (e) => {
    e.stopPropagation();
    const id = btn.dataset.del;
    gifLib = gifLib.filter(g => g.id !== id);
    Object.keys(gifMap).forEach(k => { if (gifMap[k] === id) delete gifMap[k]; });
    await saveGifData();
    renderLibrary();
    setStatus("GIF eliminado de la biblioteca.", "");
  }));
}

/* ---- carga de archivos locales ---- */
function readFileAsDataURL(file){
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}
async function ingestFiles(fileList){
  const files = Array.from(fileList).filter(f => /^image\//.test(f.type));
  if (!files.length){ setStatus("Esos archivos no son imágenes.", "bad"); return; }
  setStatus(`Cargando ${files.length} archivo(s)...`);
  let added = 0, heavy = 0, dup = 0;
  for (const f of files){
    try{
      if (f.size > 4 * 1024 * 1024) heavy++;
      const data = await readFileAsDataURL(f);
      const before = gifLib.length;
      addToLib(nameFromUrl(f.name) || f.name, data, "archivo");
      if (gifLib.length > before) added++; else dup++;
    }catch(e){ /* archivo ilegible, se salta */ }
  }
  const ok = await saveGifData();
  renderLibrary();
  setStatus(
    `${added} GIF(s) agregados.` +
    (dup ? ` ${dup} ya estaban en la biblioteca.` : "") +
    (heavy ? ` ${heavy} pesan más de 4 MB: conviene optimizarlos antes de cargarlos.` : "") +
    (ok ? "" : " No se pudieron guardar de forma permanente: el navegador se quedó sin espacio."),
    ok ? "ok" : "bad"
  );
}

/* ---- alta por enlaces pegados ---- */
async function ingestLinks(text){
  const lines = String(text).split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length){ setStatus("Pegá al menos un enlace.", "bad"); return; }
  let added = 0, skipped = 0, drive = 0;
  lines.forEach(line => {
    let name = "", url = line;
    if (line.includes("|")){
      const parts = line.split("|");
      name = parts[0].trim();
      url = parts.slice(1).join("|").trim();
    }
    const d = driveDirect(url);
    if (d){ url = d; drive++; }
    if (!/^https?:\/\//i.test(url)){ skipped++; return; }
    const before = gifLib.length;
    addToLib(name || nameFromUrl(url) || "GIF", url, d ? "drive" : "enlace");
    if (gifLib.length > before) added++; else skipped++;
  });
  await saveGifData();
  document.getElementById("paste-input").value = "";
  renderLibrary();
  setStatus(
    `${added} enlace(s) agregados${drive ? ` (${drive} de Drive)` : ""}.` +
    (skipped ? ` ${skipped} línea(s) sin enlace válido.` : "") +
    (drive ? " Si no se ven, revisá que estén compartidos como «cualquier persona con el enlace»." : ""),
    added ? "ok" : "bad"
  );
}

/* ---- asignación automática por nombre ---- */
async function autoMatch(){
  const names = allExerciseNames();
  let hits = 0;
  gifLib.forEach(g => {
    let best = null, bestScore = 0;
    names.forEach(n => {
      const s = matchScore(g.name, n);
      if (s > bestScore){ bestScore = s; best = n; }
    });
    if (best && bestScore >= 0.5 && !gifMap[best]){ gifMap[best] = g.id; hits++; }
  });
  await saveGifData();
  renderLibrary();
  setStatus(hits
    ? `${hits} ejercicio(s) quedaron con GIF por coincidencia de nombre. Los que ya tenían uno no se tocaron.`
    : "Ningún nombre de archivo se parece lo suficiente a un ejercicio del listado. Asignalos a mano.",
    hits ? "ok" : "");
}

/* ---- reclasificar todo por grupo muscular ---- */
async function reclassify(){
  let moved = 0, sueltos = 0;
  gifLib.forEach(g => {
    const e = detectEje(g.name);
    if (e !== g.eje){ g.eje = e; moved++; }
    if (e === SIN_CLASIFICAR) sueltos++;
  });
  await saveGifData();
  renderLibrary();
  setStatus(
    `${moved} GIF(s) reubicados por nombre.` +
    (sueltos ? ` ${sueltos} quedaron sin clasificar: asignales el grupo con el desplegable de cada tarjeta.` : ""),
    "ok");
}

/* ---- descargar la herramienta con los GIFs adentro ---- */
function bytesLegibles(n){
  if (n < 1024) return n + " B";
  if (n < 1024*1024) return (n/1024).toFixed(0) + " KB";
  return (n/(1024*1024)).toFixed(1) + " MB";
}
function exportTool(){
  const externos = gifLib.filter(g => !/^data:/.test(g.src)).length;
  setStatus("Armando el archivo...");
  try{
    const clone = document.documentElement.cloneNode(true);

    // dejar la copia en estado inicial
    const wipe = id => { const el = clone.querySelector("#"+id); if (el) el.innerHTML = ""; };
    ["slots","tabs","sheet-sessions","lib-scroll","filter-chips"].forEach(wipe);
    const modal = clone.querySelector("#library-modal"); if (modal) modal.classList.remove("open");
    const sheet = clone.querySelector("#sheet-wrap"); if (sheet) sheet.classList.remove("visible");
    const paste = clone.querySelector("#paste-area"); if (paste) paste.classList.remove("open");
    const st = clone.querySelector("#lib-status"); if (st){ st.textContent = ""; st.className = "lib-status"; }
    clone.querySelectorAll("textarea").forEach(t => t.textContent = "");
    clone.querySelectorAll('input[type="search"],input[type="text"]').forEach(i => i.removeAttribute("value"));

    // hornear la biblioteca dentro del archivo
    const seed = clone.querySelector("#gif-seed");
    const payload = JSON.stringify({ lib: gifLib, map: gifMap }).replace(/</g, "\\u003c");
    if (seed) seed.textContent = payload;

    const html = "<!DOCTYPE html>\n" + clone.outerHTML;
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "jyntra-planificador-con-gifs.html";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);

    setStatus(
      `Listo: ${bytesLegibles(blob.size)} con ${gifLib.length} GIF(s) adentro. Ese archivo funciona solo, en cualquier equipo y sin conexión.` +
      (externos ? ` Ojo: ${externos} son enlaces externos, esos siguen necesitando internet.` : ""),
      "ok");
  }catch(e){
    setStatus("No se pudo armar el archivo. Si la biblioteca es muy pesada, probá con «Exportar biblioteca» (JSON).", "bad");
  }
}

/* ---- exportar / importar la biblioteca ---- */
function exportLibrary(){
  const blob = new Blob([JSON.stringify({lib:gifLib, map:gifMap}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "jyntra-biblioteca-gifs.json";
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus("Biblioteca exportada. Ese archivo la reconstruye en cualquier equipo.", "ok");
}
async function importLibrary(file){
  try{
    const data = JSON.parse(await file.text());
    const incoming = Array.isArray(data.lib) ? data.lib : [];
    incoming.forEach(g => { if (g.src) addToLib(g.name, g.src, g.kind || "enlace", g.eje); });
    if (data.map) Object.entries(data.map).forEach(([ex,ref]) => {
      const src = (incoming.find(g => g.id === ref) || {}).src;
      const local = src ? gifLib.find(g => g.src === src) : null;
      if (local) gifMap[ex] = local.id;
    });
    await saveGifData();
    renderLibrary();
    setStatus(`Biblioteca importada: ${incoming.length} GIF(s).`, "ok");
  }catch(e){ setStatus("Ese archivo no es una biblioteca válida.", "bad"); }
}

          }

      }, '*');
      aviso('Guardado en la ficha de ' + A.nombre.split(' ')[0]);
    }catch(e){ aviso('No se pudo guardar', true); }

  function ligar(){
    rotular();
    ['jy-guardar-btn','jy-guardar-btn2'].forEach(function(id){
      var b = document.getElementById(id);
      if(b && !b._jy){ b._jy = true; b.addEventListener('click', guardar); }
    });
  }
  ligar();
  document.addEventListener('DOMContentLoaded', ligar);

  /* --- 4 · alto del marco -------------------------------------------- */
  if(window.parent && window.parent !== window){
    var ultimo = 0;
    setInterval(function(){
      var h = Math.max(document.documentElement.scrollHeight, document.body ? document.body.scrollHeight : 0);
      if(Math.abs(h - ultimo) > 20){
        ultimo = h;
        try{ window.parent.postMessage({jyntra:true, accion:'alto', px:h}, '*'); }catch(e){}
      }
    }, 600);
    try{ window.parent.postMessage({jyntra:true, accion:'listo'}, '*'); }catch(e){}
  }
})();

<script>
/* ================================================================
   JYNTRA TECHNOLOGIES · cáscara de aplicación
   Archivo único. Sin dependencias. Los 8 pilares de la bitácora.
   Las herramientas se enchufan con JYNTRA.registrar(...)  —  ver §MÓDULOS
   ================================================================ */
(function(){
'use strict';

/* ---------------------------------------------------------------
   §0 · UTILIDADES
   --------------------------------------------------------------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = (p)=> (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoy = ()=> new Date().toISOString().slice(0,10);
const esc = (s)=> String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha = (iso)=>{ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,10);
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}); };
const fechaHora = (iso)=>{ const d=new Date(iso); return isNaN(d)?'—':d.toLocaleString('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); };
const money = (n)=> '$'+Number(n||0).toLocaleString('es-CL');
const iniciales = (n)=> String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const diasES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

/* almacenamiento tolerante: si localStorage está bloqueado (visores en iframe)
   la app sigue funcionando en memoria durante la sesión. */
const mem = {};
const disco = (function(){ try{ const k='__jy'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
const DB = {
  get(k,def){
    try{ const v = disco ? localStorage.getItem('jyntra.'+k) : mem[k];
      return v==null ? def : JSON.parse(v);
    }catch(e){ return def; }
  },
  set(k,v){
    const s = JSON.stringify(v);
    if(disco){ try{ localStorage.setItem('jyntra.'+k,s); }catch(e){ mem[k]=s; } } else { mem[k]=s; }
    return v;
  }
};

function toast(msg,tipo){
  const el = document.createElement('div');
  el.className = 'toast '+(tipo||'');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),200); }, 3400);
}

/* diálogo propio: confirm() y prompt() quedan bloqueados dentro de visores con iframe */
function preguntar(titulo, cuerpoHTML, opciones){
  return new Promise(res=>{
    const o = Object.assign({ok:'Confirmar', cancelar:'Cancelar', peligro:false}, opciones||{});
    const bg = document.createElement('div'); bg.className='modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'
      + '<div class="modal-h"><div class="h2">'+esc(titulo)+'</div></div>'
      + '<div class="modal-b">'+(cuerpoHTML||'')+'</div>'
      + '<div class="modal-f"><button class="btn" data-x="0">'+esc(o.cancelar)+'</button>'
      + '<button class="btn '+(o.peligro?'danger':'gold')+'" data-x="1">'+esc(o.ok)+'</button></div></div>';
    $('#modal-root').appendChild(bg);
    const cerrar = (v)=>{ bg.remove(); res(v); };
    bg.addEventListener('click', e=>{
      if(e.target===bg) return cerrar(false);
      const b = e.target.closest('[data-x]'); if(!b) return;
      if(b.dataset.x==='0') return cerrar(false);
      const form = bg.querySelector('form'); 
      if(form){ const d={}; $$('[name]',form).forEach(i=>d[i.name]= i.type==='checkbox'?i.checked:i.value); return cerrar(d); }
      cerrar(true);
    });
    setTimeout(()=>{ const f=bg.querySelector('input,select,textarea,button.gold'); f&&f.focus(); },30);
  });
}

/* ---------------------------------------------------------------
   §1 · PILAR 1 — PERSONAS Y ROLES
   --------------------------------------------------------------- */
const ROLES = {
  alumno:        { nombre:'Alumno',        color:'var(--r-alumno)',        desc:'Entrena, registra y consulta sus resultados.' },
  profesor:      { nombre:'Profesor',      color:'var(--r-profesor)',      desc:'Evalúa, planifica y hace seguimiento.' },
  nutricionista: { nombre:'Nutricionista', color:'var(--r-nutricionista)', desc:'Anamnesis, plan alimentario y control.' }
};
const esProfesional = (r)=> r==='profesor' || r==='nutricionista';

/* ---------------------------------------------------------------
   §2 · PILAR 2 — PLANES Y CONTROL DE ACCESO (monetización)
   El backend define qué se abre. Aquí vive el catálogo y el portero.
   --------------------------------------------------------------- */
const PLANES = {
  base: {
    id:'base', nombre:'Base', precio:0, periodo:'mes',
    maxAlumnos:5,
    permisos:['agenda','vinculos','evaluacion','seguimiento.basico'],
