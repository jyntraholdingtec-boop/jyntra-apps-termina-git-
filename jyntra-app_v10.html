<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JYNTRA Technologies</title>
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   JYNTRA · sistema base
   Paleta del logo: dorado #C6A15A sobre negro
   ============================================================ */
:root{
  --ink:#0D0D0D; --panel:#161616; --panel2:#1E1E1E; --raise:#262626;
  --line:#33302A; --line-soft:#262420;
  --gold:#C6A15A; --gold-hi:#E8CF95; --gold-dim:#7C6535;
  --bone:#EDE7DA; --mute:#8E877A; --mute2:#6A655C;
  --r-alumno:#5B93B8; --r-profesor:#C6A15A; --r-nutricionista:#7FB77E; --r-admin:#C0785F;
  --ok:#7FB77E; --warn:#D9A441; --bad:#C9584C; --info:#5B93B8;
  --rail:250px; --top:60px;
  --f-disp:'Barlow Condensed',Impact,sans-serif;
  --f-head:'Archivo',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --rad:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--bone); font-family:var(--f-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 600px at 82% -14%, rgba(198,161,90,.09), transparent 62%);
  background-attachment:fixed;
}
a{color:var(--gold);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2E2A24;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- tipografía utilitaria ---------- */
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dim)}
.h1{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;margin:0}
.h2{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em;margin:0}
.h3{font-family:var(--f-head);font-weight:600;font-size:14px;margin:0}
.sub{color:var(--mute);font-size:13.5px;margin:6px 0 0}
.mono{font-family:var(--f-mono)}
.num{font-family:var(--f-disp);font-weight:700;font-size:38px;line-height:1;letter-spacing:.01em}

/* ---------- marca ---------- */
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark svg{flex:none}
.brandmark .wm{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.26em;text-transform:uppercase;color:var(--bone);white-space:nowrap}
.brandmark .wm b{color:var(--gold);font-weight:700}
.brandmark .tag{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.3em;color:var(--gold-dim);text-transform:uppercase;display:block;margin-top:1px}

/* ============================================================
   ARMAZÓN
   ============================================================ */
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{
  background:linear-gradient(180deg,#131313,#0F0F0F);
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.rail-head{padding:16px 16px 12px;border-bottom:1px solid var(--line-soft)}
.rail-user{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;flex:none;border-radius:2px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;color:#0D0D0D;background:var(--gold)}
.rail-user .n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-user .r{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.nav{padding:10px 8px;overflow-y:auto;flex:1}
.nav-group{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute2);padding:14px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rad);
  color:var(--bone);font-size:13.5px;border-left:2px solid transparent;transition:background .12s,border-color .12s;
}
.nav a .ic{width:16px;text-align:center;opacity:.75;font-size:13px}
.nav a:hover{background:#1B1B1B}
.nav a.on{background:#1E1B15;border-left-color:var(--gold);color:var(--gold-hi)}
.nav a .pill{margin-left:auto;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;padding:2px 5px;border-radius:2px;background:#2A2418;color:var(--gold-dim);border:1px solid #3A3222}
.rail-foot{padding:10px 12px;border-top:1px solid var(--line-soft);display:flex;gap:8px;align-items:center;justify-content:space-between}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--top);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;
  gap:14px;padding:0 22px;position:sticky;top:0;z-index:40;
  background:rgba(13,13,13,.88);backdrop-filter:blur(10px);
}
.topbar .crumb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.topbar .crumb b{color:var(--bone);font-weight:500}
.topbar .grow{flex:1}
.content{padding:26px 22px 70px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .grow{flex:1}

/* ---------- chips / botones ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--rad);
  border:1px solid var(--line);background:var(--panel2);color:var(--bone);cursor:pointer;
  font-size:13.5px;font-weight:500;transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:var(--raise);border-color:#453F33}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0D0D0D;font-weight:600}
.btn.gold:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{background:transparent}
.btn.danger{border-color:#5A2E28;color:#E0968C}
.btn.danger:hover{background:#2A1614}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid var(--line);color:var(--mute)}
.chip.gold{border-color:var(--gold-dim);color:var(--gold);background:#1C1810}
.chip.ok{border-color:#31502F;color:var(--ok);background:#141C13}
.chip.warn{border-color:#54421C;color:var(--warn);background:#1D1810}
.chip.bad{border-color:#542C27;color:var(--bad);background:#1D1311}
.chip.info{border-color:#28414F;color:var(--info);background:#111820}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- tarjetas / rejillas ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--rad);padding:18px}
.card.pad0{padding:0}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head .grow{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

.kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--rad);padding:16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);opacity:.5}
.kpi .lab{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.kpi .num{color:var(--bone)}
.kpi .foot{font-size:12px;color:var(--mute);margin-top:6px}

/* ---------- formularios ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.inp,select.inp,textarea.inp{
  background:#121212;border:1px solid var(--line);border-radius:var(--rad);
  padding:9px 11px;width:100%;color:var(--bone);transition:border-color .12s;
}
.inp:focus{border-color:var(--gold-dim)}
textarea.inp{min-height:84px;resize:vertical}
.hint{font-size:12px;color:var(--mute2)}

/* ---------- tablas ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#191919}
.tbl td.right,.tbl th.right{text-align:right}

/* ---------- vacíos ---------- */
.empty{border:1px dashed var(--line);border-radius:var(--rad);padding:28px;text-align:center;color:var(--mute)}
.empty .h3{color:var(--bone);margin-bottom:6px}

/* ============================================================
   PIEZA CARACTERÍSTICA · EL BASTIDOR
   Cada hueco de herramienta se muestra como una placa de montaje
   con su identificador, su contrato de datos y su estado.
   ============================================================ */
.slot{
  position:relative;border:1px dashed #3D372B;border-radius:var(--rad);
  background:
    linear-gradient(180deg,rgba(198,161,90,.035),transparent 46%),
    repeating-linear-gradient(135deg,transparent 0 13px,rgba(198,161,90,.028) 13px 14px);
  padding:0;overflow:hidden;
}
.slot.mounted{border-style:solid;border-color:var(--line);background:var(--panel)}
.slot-bar{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-bottom:1px dashed #3D372B;background:#131211;flex-wrap:wrap;
}
.slot.mounted .slot-bar{border-bottom-style:solid;border-bottom-color:var(--line-soft)}
.slot-id{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--gold);white-space:nowrap}
.slot-bar .grow{flex:1}
.slot-body{padding:16px}
.slot-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 18px;text-align:center}
.slot-empty .tt{font-family:var(--f-disp);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.slot-empty .ds{color:var(--mute);font-size:13px;max-width:56ch}
.contract{width:100%;max-width:660px;text-align:left;margin-top:4px;border:1px solid var(--line-soft);border-radius:var(--rad);background:#111}
.contract .cr{display:grid;grid-template-columns:82px 1fr;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.contract .cr:last-child{border-bottom:0}
.contract .cr .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:2px}
.contract code{font-family:var(--f-mono);font-size:11.5px;color:var(--gold-hi);background:#1A1710;border:1px solid #2C2618;border-radius:2px;padding:1px 5px}
.slot iframe{width:100%;border:0;display:block;min-height:620px;background:#0D0D0D}
.slot-corner{position:absolute;width:8px;height:8px;border-color:var(--gold-dim);opacity:.7}

/* ---------- lector / vista de solo lectura para el alumno ---------- */
.readonly-note{display:flex;gap:9px;align-items:flex-start;border-left:2px solid var(--info);background:#101820;padding:10px 12px;border-radius:0 var(--rad) var(--rad) 0;font-size:13px;color:#BFD6E4}

/* ---------- portada / acceso ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.gate-art{
  position:relative;overflow:hidden;border-right:1px solid var(--line-soft);
  background:linear-gradient(160deg,#141210,#0B0B0B 62%);
  display:flex;flex-direction:column;justify-content:space-between;padding:38px;
}
.gate-art .rings{position:absolute;inset:-18% -30% auto auto;width:660px;height:660px;opacity:.5;pointer-events:none}
.gate-claim{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;font-size:clamp(38px,5.4vw,66px);line-height:.92;letter-spacing:.005em;position:relative}
.gate-claim em{font-style:normal;color:var(--gold);display:block}
.gate-pillars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);position:relative}
.gate-pillars div{background:#101010;padding:11px 13px}
.gate-pillars .i{font-family:var(--f-mono);font-size:10px;color:var(--gold-dim);letter-spacing:.16em}
.gate-pillars .t{font-size:13px;margin-top:3px}
.gate-form{display:flex;align-items:center;justify-content:center;padding:38px}
.gate-form .box{width:100%;max-width:400px}
.tabs{display:flex;gap:2px;background:#121212;border:1px solid var(--line-soft);border-radius:var(--rad);padding:3px;margin-bottom:18px}
.tabs button{flex:1;background:transparent;border:0;padding:8px;border-radius:2px;cursor:pointer;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tabs button.on{background:var(--gold);color:#0D0D0D;font-weight:600}
.rolepick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rolepick label{
  border:1px solid var(--line);border-radius:var(--rad);padding:10px;cursor:pointer;background:#121212;
  display:flex;flex-direction:column;gap:2px;transition:border-color .12s,background .12s;
}
.rolepick label:hover{border-color:#4A4436}
.rolepick input{position:absolute;opacity:0;pointer-events:none}
.rolepick input:checked+span{color:var(--gold)}
.rolepick label:has(input:checked){border-color:var(--gold-dim);background:#191610}
.rolepick .rn{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.rolepick .rd{font-size:11.5px;color:var(--mute);line-height:1.35}

/* ---------- planes ---------- */
.plan{border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}
.plan.cur{border-color:var(--gold);box-shadow:0 0 0 1px rgba(198,161,90,.25) inset}
.plan .pn{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;font-size:24px;letter-spacing:.05em}
.plan .pp{font-family:var(--f-disp);font-size:30px;font-weight:700;color:var(--gold)}
.plan .pp small{font-family:var(--f-body);font-size:12px;color:var(--mute);font-weight:400}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px;flex:1}
.plan li{display:flex;gap:8px;align-items:flex-start;color:var(--bone)}
.plan li.off{color:var(--mute2);text-decoration:line-through}
.plan li i{font-style:normal;color:var(--gold);flex:none}
.plan li.off i{color:var(--mute2)}
.plan-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--gold);color:#0D0D0D;font-family:var(--f-mono);font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 11px;border-radius:20px;box-shadow:0 4px 14px rgba(198,161,90,.35);white-space:nowrap}
.plan.svc ul{flex:none}
.plan.svc{gap:10px}

/* ---------- avisos ---------- */
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:#1B1B1B;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--rad);padding:11px 14px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .18s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;background:rgba(5,5,5,.72);z-index:150;display:grid;place-items:center;padding:18px;animation:tin .14s ease-out}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);width:min(560px,100%);max-height:88vh;overflow:auto}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.modal-b{padding:18px}
.modal-f{padding:14px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end}

.locked{border:1px solid #54421C;background:#191510;border-radius:var(--rad);padding:16px;display:flex;gap:12px;align-items:flex-start}
.locked .h3{color:var(--warn)}

/* ---------- responsive ---------- */
.railtoggle{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:120;transform:translateX(-100%);transition:transform .2s ease;height:100dvh}
  body.rail-open .rail{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  body.rail-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:110}
  .railtoggle{display:inline-flex}
  .content{padding:18px 14px 60px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gate{grid-template-columns:1fr}
  .gate-art{border-right:0;border-bottom:1px solid var(--line-soft);padding:26px;gap:26px}
  .gate-form{padding:26px 18px 46px}
  .h1{font-size:27px}
}
@media(max-width:560px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .rolepick{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{.rail,.topbar,.toasts{display:none!important}.shell{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>
<script>
/* ================================================================
   JYNTRA TECHNOLOGIES · cáscara de aplicación
   Archivo único. Sin dependencias. Los 8 pilares de la bitácora.
   Las herramientas se enchufan con JYNTRA.registrar(...)  —  ver §MÓDULOS
   ================================================================ */
(function(){
'use strict';

/* ---------------------------------------------------------------
   §0 · UTILIDADES
   --------------------------------------------------------------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = (p)=> (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoy = ()=> new Date().toISOString().slice(0,10);
const esc = (s)=> String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha = (iso)=>{ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,10);
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}); };
const fechaHora = (iso)=>{ const d=new Date(iso); return isNaN(d)?'—':d.toLocaleString('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); };
const money = (n)=> '$'+Number(n||0).toLocaleString('es-CL');
const iniciales = (n)=> String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const diasES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

/* almacenamiento tolerante: si localStorage está bloqueado (visores en iframe)
   la app sigue funcionando en memoria durante la sesión. */
const mem = {};
const disco = (function(){ try{ const k='__jy'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
const DB = {
  get(k,def){
    try{ const v = disco ? localStorage.getItem('jyntra.'+k) : mem[k];
      return v==null ? def : JSON.parse(v);
    }catch(e){ return def; }
  },
  set(k,v){
    const s = JSON.stringify(v);
    if(disco){ try{ localStorage.setItem('jyntra.'+k,s); }catch(e){ mem[k]=s; } } else { mem[k]=s; }
    return v;
  }
};

function toast(msg,tipo){
  const el = document.createElement('div');
  el.className = 'toast '+(tipo||'');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),200); }, 3400);
}

/* diálogo propio: confirm() y prompt() quedan bloqueados dentro de visores con iframe */
function preguntar(titulo, cuerpoHTML, opciones){
  return new Promise(res=>{
    const o = Object.assign({ok:'Confirmar', cancelar:'Cancelar', peligro:false}, opciones||{});
    const bg = document.createElement('div'); bg.className='modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'
      + '<div class="modal-h"><div class="h2">'+esc(titulo)+'</div></div>'
      + '<div class="modal-b">'+(cuerpoHTML||'')+'</div>'
      + '<div class="modal-f"><button class="btn" data-x="0">'+esc(o.cancelar)+'</button>'
      + '<button class="btn '+(o.peligro?'danger':'gold')+'" data-x="1">'+esc(o.ok)+'</button></div></div>';
    $('#modal-root').appendChild(bg);
    const cerrar = (v)=>{ bg.remove(); res(v); };
    bg.addEventListener('click', e=>{
      if(e.target===bg) return cerrar(false);
      const b = e.target.closest('[data-x]'); if(!b) return;
      if(b.dataset.x==='0') return cerrar(false);
      const form = bg.querySelector('form'); 
      if(form){ const d={}; $$('[name]',form).forEach(i=>d[i.name]= i.type==='checkbox'?i.checked:i.value); return cerrar(d); }
      cerrar(true);
    });
    setTimeout(()=>{ const f=bg.querySelector('input,select,textarea,button.gold'); f&&f.focus(); },30);
  });
}

/* ---------------------------------------------------------------
   §3b · CANAL COMPARTIDO ENTRE PERFILES
   ---------------------------------------------------------------
   Los tres perfiles (alumno, profesor, nutricionista) son archivos
   HTML independientes. Para que la conexión funcione comparten un
   mismo almacén con el prefijo 'jyntra.'.

   · MISMO HOSTING (mismo dominio, p.ej. tu-sitio.cl/alumno.html y
     tu-sitio.cl/profesor.html): funciona tal cual, sin tocar nada.
     El navegador comparte localStorage entre las dos páginas y este
     módulo detecta los cambios del otro perfil y repinta solo.

   · HOSTING SEPARADO (dominios distintos): rellena JY_CANAL.api con
     la URL de tu backend. Este módulo hará GET para traer el estado
     y POST para empujarlo. El backend sólo necesita guardar y
     devolver un JSON con las claves de JY_CANAL.claves.
   --------------------------------------------------------------- */
const JY_CANAL = {
  claves : ['usuarios','vinculos','agenda','registros','metricas','horario','fichas','pautas'],
  api    : null,      /* ← p.ej. 'https://api.tu-dominio.cl/jyntra'  */
  token  : null,      /* ← cabecera Authorization, si tu backend la pide */
  latido : 4000,      /* cada cuánto se mira si el otro perfil escribió */
  sello  : null,
  activo : false
};

/* sello de versión: cambia cada vez que alguien guarda algo */
function jySello(){ try{ return DB.get('__sello', 0); }catch(e){ return 0; } }
function jyMarcarSello(){ try{ DB.set('__sello', Date.now()); }catch(e){} }

/* guardar() original, envuelto para que avise al otro perfil */
const guardarLocal = guardar;
guardar = function(clave){
  guardarLocal(clave);
  if(JY_CANAL.claves.indexOf(clave) >= 0){
    jyMarcarSello();
    jyEmpujar(clave);
  }
};

/* relee del disco las claves que tocó el otro perfil y repinta */
function jyRecargar(){
  let cambio = false;
  JY_CANAL.claves.forEach(k=>{
    if(!(k in S)) return;
    const fresco = DB.get(k, null);
    if(fresco == null) return;
    if(JSON.stringify(fresco) !== JSON.stringify(S[k])){ S[k] = fresco; cambio = true; }
  });
  if(cambio && typeof pintar === 'function'){
    try{ pintar(); }catch(e){}
  }
  return cambio;
}

/* --- puente remoto (sólo si JY_CANAL.api está configurado) --- */
function jyCabeceras(){
  const h = { 'Content-Type':'application/json' };
  if(JY_CANAL.token) h['Authorization'] = 'Bearer ' + JY_CANAL.token;
  return h;
}
function jyEmpujar(clave){
  if(!JY_CANAL.api) return;
  try{
    fetch(JY_CANAL.api + '/estado/' + encodeURIComponent(clave), {
      method:'PUT', headers:jyCabeceras(), body: JSON.stringify({ valor: S[clave] })
    }).catch(()=>{});
  }catch(e){}
}
function jyTraer(){
  if(!JY_CANAL.api) return Promise.resolve(false);
  return fetch(JY_CANAL.api + '/estado', { headers: jyCabeceras() })
    .then(r=> r.ok ? r.json() : null)
    .then(d=>{
      if(!d) return false;
      let cambio = false;
      JY_CANAL.claves.forEach(k=>{
        if(d[k] == null || !(k in S)) return;
        if(JSON.stringify(d[k]) !== JSON.stringify(S[k])){
          S[k] = d[k]; guardarLocal(k); cambio = true;
        }
      });
      if(cambio && typeof pintar === 'function'){ try{ pintar(); }catch(e){} }
      return cambio;
    }).catch(()=> false);
}

/* ---------------------------------------------------------------
   §3d · EXPEDIENTE NUTRICIONAL COMPARTIDO
   Una sola pauta por persona. La arma el nutricionista, el alumno la
   ajusta a su día a día y los dos ven el cambio del otro.
   --------------------------------------------------------------- */
function pautaDe(alumnoId){
  if(!S.pautas) S.pautas = {};
  return S.pautas[alumnoId] || null;
}
function guardarPauta(alumnoId, estado, quienId){
  if(!S.pautas) S.pautas = {};
  const q = usuario(quienId);
  S.pautas[alumnoId] = {
    estado          : estado,
    actualizadoPor  : quienId || null,
    actualizadoNombre: q ? q.nombre : '',
    actualizadoRol  : q ? q.rol : '',
    actualizadoEn   : new Date().toISOString()
  };
  guardar('pautas');
  return S.pautas[alumnoId];
}
function firmaPauta(alumnoId){
  const p = pautaDe(alumnoId);
  if(!p || !p.actualizadoNombre) return '';
  const yo = S.sesion === p.actualizadoPor;
  return (yo ? 'Último cambio tuyo' : 'Último cambio de '+p.actualizadoNombre.split(' ')[0])
       + ' · ' + fechaHora(p.actualizadoEn);
}

/* ---------------------------------------------------------------
   §3e · IDENTIDAD DEL ATLETA
   Nombre, edad y sexo salen de la ficha y son iguales en los tres
   perfiles. Peso y talla se toman de la última medición y vuelven a
   la ficha cuando alguien los corrige.
   --------------------------------------------------------------- */
function identidadDe(alumnoId){
  const u = usuario(alumnoId);
  if(!u) return null;
  let edad = '';
  if(u.nacimiento){
    const e = Math.floor((Date.now() - new Date(u.nacimiento)) / 31557600000);
    if(e > 0 && e < 120) edad = e;
  }
  if(!edad && u.edad) edad = u.edad;

  /* último peso registrado en el seguimiento diario */
  let peso = u.peso || '';
  try{
    const serie = S.metricas
      .filter(m=> m.alumnoId===alumnoId && m.clave==='peso' && m.valor)
      .sort((a,b)=> String(b.fecha).localeCompare(String(a.fecha)));
    if(serie.length) peso = serie[0].valor;
  }catch(e){}

  return {
    id    : u.id,
    nombre: u.nombre || '',
    edad  : edad,
    sexo  : u.sexo || '',
    talla : u.altura || '',
    peso  : peso,
    objetivo: u.objetivo || ''
  };
}

/* peso y talla corregidos desde cualquier herramienta vuelven a la ficha */
function refrescarIdentidad(alumnoId, datos, quienId){
  const u = usuario(alumnoId); if(!u || !datos) return;
  let toco = false;
  if(datos.talla && +datos.talla !== +u.altura){ u.altura = +datos.talla; toco = true; }
  if(toco) guardar('usuarios');

  if(datos.peso){
    const f = hoy();
    const ya = S.metricas.find(m=> m.alumnoId===alumnoId && m.clave==='peso' && m.fecha===f);
    if(ya){ if(+ya.valor !== +datos.peso){ ya.valor = +datos.peso; guardar('metricas'); } }
    else {
      S.metricas.push({ id:uid('m'), alumnoId:alumnoId, clave:'peso',
                        valor:+datos.peso, fecha:f, autorId: quienId||alumnoId });
      guardar('metricas');
    }
  }
}

function jyAbrirCanal(){
  if(JY_CANAL.activo) return;
  JY_CANAL.activo = true;
  JY_CANAL.sello = jySello();

  /* aviso inmediato cuando el otro perfil escribe en otra pestaña */
  try{
    window.addEventListener('storage', function(e){
      if(!e || !e.key || e.key.indexOf('jyntra.') !== 0) return;
      JY_CANAL.sello = jySello();
      jyRecargar();
    });
  }catch(e){}

  /* red de seguridad: revisa el sello por si el evento no llegó */
  setInterval(function(){
    const s = jySello();
    if(s !== JY_CANAL.sello){ JY_CANAL.sello = s; jyRecargar(); }
    if(JY_CANAL.api) jyTraer();
  }, JY_CANAL.latido);

  if(JY_CANAL.api) jyTraer();
}

/* ---------------------------------------------------------------
   §3c · LLAVES DEL ALUMNO
   Qué se abre y qué queda cerrado según con quién esté conectado.
   Sin vínculo activo el alumno usa la versión libre.
   --------------------------------------------------------------- */
function profesionalesPorRol(alumnoId, rol){
  return S.vinculos.filter(v=> v.alumnoId===alumnoId && v.profesionalId && v.estado==='activo')
    .map(v=> S.usuarios.find(u=> u.id===v.profesionalId))
    .filter(u=> u && u.rol===rol);
}
function profesorDe(alumnoId){ return profesionalesPorRol(alumnoId,'profesor')[0] || null; }
function nutricionistaDe(alumnoId){ return profesionalesPorRol(alumnoId,'nutricionista')[0] || null; }

function llaves(alumnoId){
  const pro = profesorDe(alumnoId);
  const nut = nutricionistaDe(alumnoId);
  return {
    profesor      : pro,
    nutricionista : nut,
    conectado     : !!pro || !!nut,
    /* pestaña «Mi evaluación» */
    habitos       : !!pro || !!nut,   // 2º módulo de la anamnesis
    atleta        : !!pro,            // perfil del atleta y fuerza 1RM (sólo lectura)
    /* pestaña «Mi planificación» */
    superserie    : !!pro,            // herramienta de súper series
    planRecibido  : !!pro,            // rutina cargada por el profesor
    /* pestaña «Mis clases» */
    horarioDoble  : !!pro || !!nut    // edición a dos manos del horario
  };
}


/* ---------------------------------------------------------------
   §4 · PILAR 4 — CANAL DE CONEXIÓN (el puente de datos)
   Sin vínculo activo no se comparte una sola fila.
   --------------------------------------------------------------- */
function vinculoDe(alumnoId, proId){
  return S.vinculos.find(v=> v.alumnoId===alumnoId && v.profesionalId===proId);
}
function vinculado(alumnoId, proId){
  const v = vinculoDe(alumnoId, proId); return !!v && v.estado==='activo';
}
function alumnosDe(proId){
  return S.vinculos.filter(v=> v.profesionalId===proId && v.estado==='activo')
                   .map(v=> usuario(v.alumnoId)).filter(Boolean);
}
function profesionalesDe(alumnoId){
  return S.vinculos.filter(v=> v.alumnoId===alumnoId && v.estado==='activo')
                   .map(v=> usuario(v.profesionalId)).filter(Boolean);
}
function usuario(id){ return S.usuarios.find(u=>u.id===id); }
function sesion(){ return S.sesion ? usuario(S.sesion) : null; }

/* portero de permisos: rol + plan del profesional */
function puede(permiso, u){
  u = u || sesion(); if(!u) return false;
  if(u.rol==='administrador') return true;
  if(u.rol==='alumno') return true;                   // el alumno consume, no compra módulos
  const p = PLANES[u.plan||'base'];
  if(!p) return false;
  if(u.suscripcion && u.suscripcion.estado==='vencida') return p.id==='base';
  return p.permisos.includes(permiso);
}
function cupoAlumnos(u){
  u = u || sesion();
  const p = PLANES[u.plan||'base'];
  return { usados: alumnosDe(u.id).length,
           tope: Math.min(p.maxAlumnos, TOPE_CONEXIONES_PRO) };
}

/* ---------------------------------------------------------------
   §4b · TOPES DE CONEXIÓN
   Una cuenta de alumno trabaja con un profesor y con un
   nutricionista: una conexión por especialidad, no más. Del otro
   lado, un profesional atiende hasta 20 personas; es un tope de la
   plataforma y se aplica además del que fije su plan.

   Cuentan tanto los vínculos activos como las solicitudes en
   espera: una solicitud pendiente ya ocupa el lugar.
   --------------------------------------------------------------- */
const TOPE_POR_ESPECIALIDAD = 1;
const TOPE_CONEXIONES_PRO   = 20;
const ESTADOS_VIVOS = ['activo','pendiente'];

function vinculosVivos(filtro, ignorarId){
  return S.vinculos.filter(v=> ESTADOS_VIVOS.indexOf(v.estado) >= 0
                            && v.id !== ignorarId && filtro(v));
}
function conexionesPorEspecialidad(alumnoId, rol, ignorarId){
  return vinculosVivos(v=>{
    if(v.alumnoId !== alumnoId) return false;
    const p = usuario(v.profesionalId);
    return !!p && p.rol === rol;
  }, ignorarId);
}
function cupoEspecialidad(alumnoId, rol, ignorarId){
  return { usados: conexionesPorEspecialidad(alumnoId, rol, ignorarId).length,
           tope  : TOPE_POR_ESPECIALIDAD };
}
function cupoVivoPro(proId, ignorarId){
  return { usados: vinculosVivos(v=> v.profesionalId===proId, ignorarId).length,
           tope  : TOPE_CONEXIONES_PRO };
}

/* Devuelve null si la conexión puede abrirse; si no, el motivo
   escrito para que la persona entienda qué hacer. */
function porQueNoConectar(alumnoId, proId, ignorarId){
  const p = usuario(proId);
  if(!p) return 'Ese perfil ya no est\u00e1 disponible.';

  const c = cupoEspecialidad(alumnoId, p.rol, ignorarId);
  if(c.usados >= c.tope){
    const otro = conexionesPorEspecialidad(alumnoId, p.rol, ignorarId)[0];
    const q = otro ? usuario(otro.profesionalId) : null;
    return 'Esa cuenta ya trabaja con '
         + (p.rol==='profesor' ? 'un profesor' : 'un nutricionista')
         + (q ? ' (' + q.nombre + ')' : '')
         + '. Hay que eliminar esa conexi\u00f3n antes de abrir otra.';
  }

  const cp = cupoVivoPro(proId, ignorarId);
  if(cp.usados >= cp.tope){
    return p.nombre.split(' ')[0] + ' lleg\u00f3 a las ' + cp.tope
         + ' conexiones que permite la plataforma.';
  }
  return null;
}

/* ---------------------------------------------------------------
   §4c · BAJA DEL VÍNCULO
   Cualquiera de los dos lados puede cortarlo. Se pregunta con el
   diálogo propio de la app, se explica qué deja de compartirse y
   nada de lo ya guardado se borra.
   --------------------------------------------------------------- */
async function eliminarVinculo(vinculoId, quienId){
  const x = S.vinculos.find(y=> y.id === vinculoId);
  if(!x) return false;

  const pro = usuario(x.profesionalId) || {nombre:'el profesional'};
  const al  = usuario(x.alumnoId)      || {nombre:'la persona'};
  const otro = (quienId === x.alumnoId) ? pro : al;
  const nombre = (otro.nombre || '').split(' ')[0];

  const ok = await preguntar('Eliminar la conexi\u00f3n con ' + otro.nombre,
      '<p class="sub" style="margin:0">Se corta el paso de datos entre las dos cuentas: '
    + esc(nombre) + ' deja de ver esos registros y esta cuenta deja de ver lo que '
    + esc(nombre) + ' public\u00f3.</p>'
    + '<p class="hint" style="margin:10px 0 0">Nada de lo ya guardado se borra, '
    + 'y pueden volver a conectarse cuando quieran.</p>',
      {ok:'Eliminar conexi\u00f3n', cancelar:'Mantener', peligro:true});
  if(!ok) return false;

  S.vinculos = S.vinculos.filter(y=> y.id !== vinculoId);
  guardar('vinculos');
  bitacora('vinculo', 'Elimin\u00f3 la conexi\u00f3n con ' + otro.nombre, quienId);
  toast('Conexi\u00f3n eliminada', 'warn');
  pintar();
  return true;
}

/* Un solo oyente para todos los botones de baja, los pinte quien
   los pinte: así la pieza funciona igual en el buscador, en la
   lista de pacientes y en cualquier pantalla que se sume después. */
document.addEventListener('click', function(e){
  const b = e.target && e.target.closest && e.target.closest('[data-desvincular]');
  if(!b) return;
  e.preventDefault();
  const yo = sesion();
  if(yo) eliminarVinculo(b.dataset.desvincular, yo.id);
});

/* ---------------------------------------------------------------
   §5 · PUENTE DE DATOS PARA LAS HERRAMIENTAS
   Toda herramienta lee y escribe por aquí. Un solo formato de registro:
   { id, modulo, tipo, autorId, sujetoId, creado, visible, datos }
   --------------------------------------------------------------- */
const Datos = {
  guardar(reg){
    const r = Object.assign({ id:uid('reg'), creado:new Date().toISOString(), visible:true, datos:{} }, reg);
    const i = S.registros.findIndex(x=>x.id===r.id);
    if(i>=0) S.registros[i] = r; else S.registros.push(r);
    guardar('registros'); bitacora('registro', r.modulo+' · '+(r.tipo||''), r.autorId);
    return r;
  },
  listar(filtro){
    filtro = filtro||{};
    return S.registros.filter(r=>{
      if(filtro.modulo && r.modulo!==filtro.modulo) return false;
      if(filtro.tipo && r.tipo!==filtro.tipo) return false;
      if(filtro.sujetoId && r.sujetoId!==filtro.sujetoId) return false;
      if(filtro.autorId && r.autorId!==filtro.autorId) return false;
      return true;
    }).sort((a,b)=> b.creado.localeCompare(a.creado));
  },
  ultimo(filtro){ return this.listar(filtro)[0] || null; },
  borrar(id){ S.registros = S.registros.filter(r=>r.id!==id); guardar('registros'); },
  /* lectura del alumno: sólo lo que su profesional le publicó */
  paraAlumno(alumnoId, modulo){
    return this.listar({sujetoId:alumnoId, modulo}).filter(r=> r.visible && vinculado(alumnoId, r.autorId));
  }
};

function bitacora(tipo, detalle, quien){
  S.bitacora.unshift({ id:uid('log'), tipo, detalle, quien: quien||S.sesion, cuando:new Date().toISOString() });
  S.bitacora = S.bitacora.slice(0,300); guardar('bitacora');
}

/* ---------------------------------------------------------------
   §6 · MÓDULOS — el enchufe de las herramientas
   ---------------------------------------------------------------
   Cada hueco de la app tiene un identificador de ranura. Para montar
   una herramienta basta con registrarla contra esa ranura:

     JYNTRA.registrar({
       ranura : 'profesor.evaluacion',
       id     : 'jyntra-evaluaciones',
       nombre : 'Evaluación RM · VO2 · Flexibilidad',
       montar (caja, ctx) { ... },     // ctx trae usuario, alumno, datos, marca
       desmontar (caja) { ... }        // opcional
     });

   O, si la herramienta ya es un HTML propio:

     JYNTRA.registrarArchivo({
       ranura:'profesor.planificacion', id:'planificador',
       nombre:'Planificador de mesociclos', src:'./herramientas/planificador.html'
     });
   --------------------------------------------------------------- */
const RANURAS = {
  'profesor.evaluacion':      { nombre:'Evaluación física',        pilar:5, permiso:'evaluacion',

const MODULOS = {};                                    // ranura -> definición
const MONTADOS = new WeakMap();                        // caja -> {mod, ctx}

const JYNTRA = window.JYNTRA = {
  version:'1.0',
  ranuras: RANURAS,
  registrar(def){
    if(!def || !def.ranura) { console.warn('[JYNTRA] falta la ranura'); return; }
    if(!RANURAS[def.ranura]) console.warn('[JYNTRA] ranura desconocida: '+def.ranura+'. Ranuras válidas: '+Object.keys(RANURAS).join(', '));
    MODULOS[def.ranura] = def;
    if(document.readyState!=='loading' && typeof pintar==='function') pintar();
    return def;
  },
  registrarArchivo(def){
    return JYNTRA.registrar(Object.assign({}, def, {
      archivo:true,
      montar(caja, ctx){
        const f = document.createElement('iframe');
        f.src = def.src; f.title = def.nombre||def.id; f.loading='lazy';
        f.setAttribute('allow','camera; microphone; clipboard-write');
        if(def.alto) f.style.minHeight = def.alto;
        caja.appendChild(f);
        /* puente con la herramienta: window.parent.postMessage({jyntra:'guardar', ...}) */
        const oir = (e)=>{
          if(!e.data || e.data.jyntra!==true) return;
          if(e.source!==f.contentWindow) return;
          const m = e.data;
          if(m.accion==='guardar')  ctx.guardar(m.registro||{});
          if(m.accion==='metrica')  ctx.registrarMetrica(m.metrica||{});
          if(m.accion==='listo')    f.contentWindow.postMessage({jyntra:true, accion:'contexto', contexto: ctx.serializar()}, '*');
          if(m.accion==='alto' && m.px) f.style.minHeight = m.px+'px';
        };
        window.addEventListener('message', oir);
        f.addEventListener('load', ()=>{ try{ f.contentWindow.postMessage({jyntra:true, accion:'contexto', contexto: ctx.serializar()}, '*'); }catch(e){} });
        return ()=> window.removeEventListener('message', oir);
      }
    }));
  },
  quitar(ranura){ delete MODULOS[ranura]; if(typeof pintar==='function') pintar(); },
  listar(){ return Object.keys(RANURAS).map(r=> ({ranura:r, info:RANURAS[r], modulo:MODULOS[r]||null})); },
  /* acceso controlado a los datos, por si una herramienta lo necesita fuera del ctx */
  datos: Datos,
  db: { usuario, alumnosDe, profesionalesDe, vinculado, puede,
        ejercicios:()=>S.ejercicios, metricas:()=>S.metricas, sesion },
  toast, preguntar
};

/* contexto que recibe cada herramienta al montarse */
function contextoDe(ranura, extra){
  const u = sesion(); const info = RANURAS[ranura]||{};
  const ctx = Object.assign({
    ranura, usuario:u, rol:u&&u.rol,
    marca:{ nombre:'JYNTRA', dorado:'#C6A15A', negro:'#0D0D0D', hueso:'#EDE7DA' },
    alumno:null,
    /* transversal: alumnos/pacientes vinculados al profesional (pilar 4), listos para
       que cualquier herramienta montada (p.ej. la Agenda) los use sin duplicar altas */
    alumnos: (u && esProfesional(u.rol)) ? alumnosDe(u.id) : [],
    agendaPropia: ()=> S.agenda.filter(b=> b.profesionalId===(u&&u.id)),
    historial(modulo){ return Datos.listar({modulo, sujetoId: ctx.alumno? ctx.alumno.id : (u&&u.id)}); },
    ultimo(modulo){ return Datos.ultimo({modulo, sujetoId: ctx.alumno? ctx.alumno.id : (u&&u.id)}); },
    guardar(reg){
      const sujeto = reg.sujetoId || (ctx.alumno&&ctx.alumno.id) || (u&&u.id);
      if(u && ctx.alumno && esProfesional(u.rol) && !vinculado(ctx.alumno.id, u.id)){
        toast('No hay vínculo activo con ese alumno. No se guardó nada.','bad'); return null;
      }
      const r = Datos.guardar(Object.assign({ autorId:u&&u.id, sujetoId:sujeto }, reg));
      toast('Registro guardado','ok'); pintar(); return r;
    },
    metricas(id){ return S.metricas.filter(m=> m.alumnoId===(id|| (ctx.alumno&&ctx.alumno.id) || (u&&u.id))); },
    registrarMetrica(m){ return registrarMetrica(Object.assign({alumnoId:(u&&u.id)}, m)); },
    guardarAgenda(bloques){ S.agenda = bloques; guardar('agenda'); pintar(); },
    ejercicios: ()=> S.ejercicios,
    guardarEjercicio(e){ return guardarEjercicio(e); },
    refrescar: ()=> pintar(),
    aviso: toast,
    serializar(){
      return { ranura, usuario: u&&{id:u.id,nombre:u.nombre,rol:u.rol,plan:u.plan},
               alumno: ctx.alumno&&{id:ctx.alumno.id,nombre:ctx.alumno.nombre,email:ctx.alumno.email,nacimiento:ctx.alumno.nacimiento,sexo:ctx.alumno.sexo},
               alumnos: (u && esProfesional(u.rol)) ? alumnosDe(u.id).map(a=>({id:a.id,nombre:a.nombre,email:a.email,telefono:a.telefono})) : [],
               marca: ctx.marca, historial: ctx.historial(info.modulo||''), permisos: PLANES[(u&&u.plan)||'base'].permisos };
    }
  }, extra||{});
  return ctx;
}

  adherencia:{ nombre:'Adherencia a la pauta', unidad:'%', tipo:'num', grupo:'nutrición' }

function registrarMetrica(m){
  const r = Object.assign({ id:uid('met'), fecha:hoy(), creado:new Date().toISOString() }, m);
  const i = S.metricas.findIndex(x=> x.alumnoId===r.alumnoId && x.clave===r.clave && x.fecha===r.fecha);
  if(i>=0) S.metricas[i]=r; else S.metricas.push(r);
  guardar('metricas'); return r;
}
function serieMetrica(alumnoId, clave, dias){
  dias = dias||30;
  const desde = new Date(Date.now()-dias*864e5).toISOString().slice(0,10);
  return S.metricas.filter(m=>m.alumnoId===alumnoId && m.clave===clave && m.fecha>=desde)
                   .sort((a,b)=> a.fecha.localeCompare(b.fecha));
}
function guardarEjercicio(e){
  const x = Object.assign({ id:uid('ej'), creado:new Date().toISOString() }, e);
  const i = S.ejercicios.findIndex(a=>a.id===x.id);
  if(i>=0) S.ejercicios[i]=x; else S.ejercicios.push(x);
  guardar('ejercicios'); return x;
}

function ranura(ranuraId, opciones){
  opciones = opciones||{};
  const info = RANURAS[ranuraId] || {nombre:ranuraId};
  const mod  = MODULOS[ranuraId];
  const u    = sesion();
  const bloqueado = info.permiso && !puede(info.permiso, u);
  const id = 'slot_'+ranuraId.replace(/\./g,'_');

  let cuerpo;
  if(bloqueado){
    cuerpo = '<div class="slot-body"><div class="locked">'
      + '<div style="font-size:20px;color:var(--warn)">◆</div><div><div class="h3">'+esc(info.nombre)+' no está en tu plan</div>'
      + '<div class="sub">Lo abre el plan '+esc(planQueIncluye(info.permiso))+'. Tus datos quedan guardados igual.</div>'
      + '<div style="margin-top:10px"><a class="btn sm gold" href="#/plan">Ver planes</a></div></div></div></div>';
  } else if(mod){
    cuerpo = '<div class="slot-body" id="'+id+'" data-montaje="'+esc(ranuraId)+'"></div>';
  } else {
    cuerpo = '<div class="slot-empty">'
      + '<div class="tt">'+esc(info.nombre)+'</div>'
      + '<div class="ds">'+esc(opciones.nota || info.nota || '')+'</div>'
      + '<div class="contract">'
      +   '<div class="cr"><span class="k">Ranura</span><span><code>'+esc(ranuraId)+'</code></span></div>'
      +   '<div class="cr"><span class="k">Recibe</span><span><code>'+esc(info.recibe||'ctx')+'</code></span></div>'
      +   '<div class="cr"><span class="k">Entrega</span><span><code>'+esc(info.entrega||'—')+'</code></span></div>'
      +   '<div class="cr"><span class="k">Montar</span><span><code>JYNTRA.registrar({ranura:\''+esc(ranuraId)+'\', montar(caja,ctx){…}})</code></span></div>'
      + '</div></div>';
  }
  return '<section class="slot '+(mod&&!bloqueado?'mounted':'')+'">'
   + '<div class="slot-bar">'
   +   '<span class="slot-id">'+esc(ranuraId)+'</span>'
   +   (info.pilar?'<span class="chip">Pilar '+info.pilar+'</span>':'')
   +   '<div class="grow"></div>'
   +   (opciones.extra||'')
   +   (bloqueado ? '<span class="chip warn"><span class="dot"></span>Fuera de plan</span>'
        : mod ? '<span class="chip ok"><span class="dot"></span>'+esc(mod.nombre||mod.id||'Montado')+'</span>'
        : '<span class="chip"><span class="dot"></span>Hueco libre</span>')
   + '</div>'+cuerpo+'</section>';
}

/* monta de verdad lo registrado, después de que el HTML esté en pantalla */
function montarRanuras(alumno){
  $$('[data-montaje]').forEach(caja=>{
    const ranuraId = caja.dataset.montaje;
    const mod = MODULOS[ranuraId]; if(!mod) return;
    const previo = MONTADOS.get(caja);
    if(previo && previo.limpiar) { try{ previo.limpiar(); }catch(e){} }
    caja.innerHTML = '';
    const ctx = contextoDe(ranuraId, { alumno: alumno||null });
    try{
      const limpiar = mod.montar ? mod.montar(caja, ctx) : null;
      MONTADOS.set(caja, {mod, ctx, limpiar: typeof limpiar==='function'?limpiar:null});
    }catch(e){
      console.error('[JYNTRA] falló el montaje de '+ranuraId, e);
      caja.innerHTML = '<div class="empty"><div class="h3">La herramienta no cargó</div><div class="mono" style="font-size:12px;color:var(--bad)">'+esc(e.message)+'</div></div>';
    }
  });
}

/* gráfico compacto — el mismo que ven profesional y alumno (pilar 7) */
function grafico(puntos, opciones){
  opciones = opciones||{};
  const W=560, H=opciones.alto||140, P=26;
  if(!puntos.length) return '<div class="empty" style="padding:18px">Sin datos todavía</div>';
  const vs = puntos.map(p=>p.valor);
  let min = Math.min.apply(null,vs), max = Math.max.apply(null,vs);
  if(min===max){ min-=1; max+=1; }
  const pad = (max-min)*0.12; min-=pad; max+=pad;
  const x = (i)=> P + i*(W-P*2)/Math.max(1,puntos.length-1);
  const y = (v)=> H-P - (v-min)/(max-min)*(H-P*1.5);
  const d = puntos.map((p,i)=> (i?'L':'M')+x(i).toFixed(1)+' '+y(p.valor).toFixed(1)).join(' ');
  const area = d+' L'+x(puntos.length-1).toFixed(1)+' '+(H-P)+' L'+x(0).toFixed(1)+' '+(H-P)+' Z';
  const col = opciones.color||'#C6A15A';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="'+esc(opciones.titulo||'serie')+'">'
   + '<defs><linearGradient id="g'+opciones.id+'" x1="0" x2="0" y1="0" y2="1">'
   +   '<stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
   + [0,.5,1].map(f=>'<line x1="'+P+'" x2="'+(W-P)+'" y1="'+(H-P-f*(H-P*1.5)).toFixed(1)+'" y2="'+(H-P-f*(H-P*1.5)).toFixed(1)+'" stroke="#2A2620" stroke-width="1"/>').join('')
   + '<path d="'+area+'" fill="url(#g'+opciones.id+')"/>'
   + '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
   + '<circle cx="'+x(puntos.length-1).toFixed(1)+'" cy="'+y(vs[vs.length-1]).toFixed(1)+'" r="3.5" fill="'+col+'"/>'
   + '<text x="'+P+'" y="14" fill="#8E877A" font-family="IBM Plex Mono,monospace" font-size="10">'+esc(opciones.titulo||'')+'</text>'
   + '<text x="'+(W-P)+'" y="14" text-anchor="end" fill="'+col+'" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="15">'
   +   esc(vs[vs.length-1])+' '+esc(opciones.unidad||'')+'</text>'
   + '<text x="'+P+'" y="'+(H-8)+'" fill="#6A655C" font-family="IBM Plex Mono,monospace" font-size="9">'+esc(puntos[0].fecha)+'</text>'
   + '<text x="'+(W-P)+'" y="'+(H-8)+'" text-anchor="end" fill="#6A655C" font-family="IBM Plex Mono,monospace" font-size="9">'+esc(puntos[puntos.length-1].fecha)+'</text>'
   + '</svg>';
}

async function solicitarVinculo(u, proId){

  const r = await preguntar('Conectar con '+p.nombre,
    '<form class="stack"><p class="sub" style="margin:0">Al aceptar, '+esc(p.nombre.split(' ')[0])
    +' podrá ver tus registros y publicarte evaluaciones y planes. Puedes cortar el vínculo cuando quieras.</p>'
    +'<div class="field"><label>Cuéntale qué buscas</label><textarea class="inp" name="mensaje" placeholder="Objetivo, disponibilidad, lesiones previas…"></textarea></div></form>',
    {ok:'Enviar solicitud'});

  S.vinculos.push({ id:uid('v'), alumnoId:u.id, profesionalId:proId, estado:'pendiente',
    desde:new Date().toISOString(), servicio: p.rol==='profesor'?'Entrenamiento':'Nutrición',
    plan:'Por definir', mensaje:(r.mensaje||'') });
  guardar('vinculos'); bitacora('vinculo','Solicitud a '+p.nombre, u.id);

}

async function responderVinculo(id, si, u){
  const x = S.vinculos.find(y=>y.id===id); if(!x) return;
  if(si){
    const c = cupoAlumnos(u);
    if(c.usados >= c.tope){
      const porPlan = c.tope < TOPE_CONEXIONES_PRO;
      toast(porPlan
        ? 'Tu plan '+PLANES[u.plan].nombre+' llega hasta '+c.tope+' alumnos. Sube de plan para aceptar.'
        : 'Llegaste a las '+TOPE_CONEXIONES_PRO+' conexiones que permite la plataforma. Elimina alguna para aceptar esta.','warn');
      return porPlan ? ruta('plan') : ruta('alumnos');
    }
    /* del otro lado: esa persona no puede tener dos de la misma especialidad */
    const vetoAl = porQueNoConectar(x.alumnoId, u.id, x.id);
    if(vetoAl) return toast(vetoAl, 'warn');
    const r = await preguntar('Aceptar a '+(usuario(x.alumnoId)||{}).nombre,
      '<form class="stack"><div class="field"><label>Plan que le asignas</label><input class="inp" name="plan" value="8 sesiones / mes"></div>'
      + '<div class="field"><label>Servicio</label><input class="inp" name="servicio" value="'+esc(x.servicio)+'"></div></form>',{ok:'Aceptar y vincular'});
    if(!r) return;
    x.estado='activo'; x.plan=r.plan; x.servicio=r.servicio; x.desde=new Date().toISOString();
    toast('Vínculo activo. Ya puedes evaluar y planificar.','ok');
  } else { x.estado='rechazado'; toast('Solicitud rechazada','warn'); }
  guardar('vinculos'); bitacora('vinculo',(si?'Aceptó':'Rechazó')+' a '+(usuario(x.alumnoId)||{}).nombre, u.id); pintar();
}

async function abrirEditorPlanServicio(u, planId){
  const planes = u.planesServicio || (u.planesServicio = []);
  const existente = planId ? planes.find(p=>p.id===planId) : null;
  const r = await preguntar(existente? 'Editar plan de servicio' : 'Nuevo plan de servicio',
    '<form class="stack">'
    + '<div class="field"><label>Nombre del plan *</label><input class="inp" name="titulo" required value="'+esc(existente?existente.titulo:'')+'" placeholder="Ej. Plan Individual"></div>'
    + '<div class="field"><label>Descripción breve</label><input class="inp" name="subtitulo" value="'+esc(existente?existente.subtitulo:'')+'" placeholder="Ej. Entrenamiento personalizado 1 a 1"></div>'
    + '<div class="grid g2">'
    +   '<div class="field"><label>Precio (CLP) *</label><input class="inp" name="precio" type="number" min="0" step="1000" required value="'+(existente?existente.precio:'')+'"></div>'
    +   '<div class="field"><label>Duración / frecuencia</label><input class="inp" name="periodo" value="'+esc(existente?(existente.periodo||'mes'):'mes')+'" placeholder="Ej. mes, 4 clases/mes, 2 meses"></div>'
    + '</div>'
    + '<div class="field"><label>Qué incluye (un beneficio por línea)</label><textarea class="inp" name="caracteristicas" placeholder="Evaluación inicial'+String.fromCharCode(10)+'Rutina personalizada'+String.fromCharCode(10)+'Seguimiento por WhatsApp">'+esc(existente?(existente.caracteristicas||[]).join(String.fromCharCode(10)):'')+'</textarea></div>'
    + '<div class="field"><label>Etiqueta destacada (opcional)</label><input class="inp" name="badge" value="'+esc(existente?(existente.badge||''):'')+'" placeholder="Ej. Más elegido"></div>'
    + '<label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" name="destacado" '+(existente&&existente.destacado?'checked':'')+'> Destacar este plan con borde dorado</label>'
    + '<label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" name="visible" '+(!existente||existente.visible!==false?'checked':'')+'> Visible para los alumnos en el buscador</label>'
    + '</form>',
    {ok: existente? 'Guardar cambios' : 'Crear plan'});
  if(!r) return;
  if(!r.titulo || !r.titulo.trim()) return toast('El plan necesita un nombre.','bad');
  const datos = {
    id: existente? existente.id : uid('svcplan'),
    titulo: r.titulo.trim(),
    subtitulo: (r.subtitulo||'').trim(),
    precio: +r.precio || 0,
    periodo: (r.periodo||'').trim() || 'mes',
    caracteristicas: String(r.caracteristicas||'').split('\n').map(s=>s.trim()).filter(Boolean),
    badge: (r.badge||'').trim(),
    destacado: !!r.destacado,
    visible: !!r.visible
  };
  if(existente) Object.assign(existente, datos); else planes.push(datos);
  guardar('usuarios');
  bitacora('plan-servicio', (existente?'Actualizó':'Creó')+' el plan "'+datos.titulo+'"', u.id);
  toast(existente? 'Plan actualizado' : 'Plan creado', 'ok');
  pintar();
}

async function eliminarPlanServicio(u, planId){

  u.planesServicio = planes.filter(p=>p.id!==planId);
  guardar('usuarios'); bitacora('plan-servicio','Eliminó el plan "'+plan.titulo+'"', u.id);
  toast('Plan eliminado','warn'); pintar();
}

/* Variante de solicitarVinculo() que precarga el mensaje con el plan elegido
   y deja registro del plan solicitado en el vínculo (pilar 4). */
async function solicitarVinculoConPlan(u, proId, plan){
  if(!u) return;
  const p = usuario(proId);
  const veto = porQueNoConectar(u.id, proId);
  if(veto) return toast(veto, 'warn');
  const previo = vinculoDe(u.id, proId);
  if(previo){ toast(previo.estado==='activo'? 'Ya estás conectado con '+p.nombre.split(' ')[0]+'.' : 'Ya tienes una solicitud enviada a '+p.nombre.split(' ')[0]+'.', 'warn'); return; }
  const mensajeDefault = plan? ('Me interesa el '+plan.titulo+' ('+money(plan.precio)+' / '+ (plan.periodo||'mes') +').') : '';
  const r = await preguntar('Solicitar '+(plan? plan.titulo : 'conexión')+' con '+p.nombre,
    '<form class="stack"><p class="sub" style="margin:0">Al aceptar, '+esc(p.nombre.split(' ')[0])
    +' podrá ver tus registros y publicarte evaluaciones y planes. Puedes cortar el vínculo cuando quieras.</p>'
    +'<div class="field"><label>Mensaje para '+esc(p.nombre.split(' ')[0])+'</label><textarea class="inp" name="mensaje" placeholder="Objetivo, disponibilidad, lesiones previas…">'+esc(mensajeDefault)+'</textarea></div></form>',
    {ok:'Enviar solicitud'});
  if(!r) return;
  S.vinculos.push({ id:uid('v'), alumnoId:u.id, profesionalId:proId, estado:'pendiente',
    desde:new Date().toISOString(), servicio: p.rol==='profesor'?'Entrenamiento':'Nutrición',
    plan: plan? (plan.titulo+' — '+money(plan.precio)+' / '+(plan.periodo||'mes')) : 'Por definir',
    planServicioId: plan? plan.id : null, mensaje:(r.mensaje||'') });
  guardar('vinculos'); bitacora('vinculo', 'Solicitud a '+p.nombre+(plan? ' por '+plan.titulo : ''), u.id);
  toast('Solicitud enviada a '+p.nombre.split(' ')[0], 'ok'); pintar();
}

/* ================================================================

   ----------------------------------------------------------------
   Un solo módulo, idéntico en los cuatro perfiles. Se apoya en lo

   ================================================================ */
(function(){
'use strict';

/* ---------- 20.0 · utilidades propias ---------- */
var SESIONES_OPC = [1,2,4,8,12,16];
var DIAS_ORD     = [1,2,3,4,5,6,0];
var LIBRES_MAX   = 4;                 /* bloques propios del alumno sin conexión */
var COLOR_ROL    = { profesor:'#C6A15A', nutricionista:'#4FAE7B' };

function q(sel, ctx){ return (ctx||document).querySelector(sel); }
function qq(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
function iso(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function aFecha(s){
  if(!s) return null;
  var d = new Date(String(s)+'T12:00:00');
  return isNaN(d) ? null : d;
}
function diaDeFecha(s){ var d = aFecha(s); return d ? d.getDay() : null; }
function masDias(s, n){ var d = aFecha(s); if(!d) return ''; d.setDate(d.getDate()+n); return iso(d); }
function lunesDe(s){
  var d = aFecha(s); if(!d) return '';
  var k = (d.getDay()+6) % 7;          /* lunes = 0 */
  d.setDate(d.getDate()-k);
  return iso(d);
}
function fechaCorta(s){
  var d = aFecha(s); if(!d) return '—';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
}
function nombreDia(n){ return (typeof diasES !== 'undefined' && diasES[n]) ? diasES[n] : ''; }
function yo(){ return (typeof S !== 'undefined' && S) ? S.sesion : null; }
function usr(id){ return (typeof usuario === 'function') ? usuario(id) : null; }
function esPro(rol){ return rol === 'profesor' || rol === 'nutricionista'; }

/* ---------- 20.1 · estado nuevo y migraciones ---------- */
if(typeof S !== 'undefined' && S){
  if(!Array.isArray(S.quemas))   S.quemas   = DB.get('quemas', []);
  if(!S.calAlumno || typeof S.calAlumno !== 'object') S.calAlumno = DB.get('calAlumno', {});
}
try{
  if(typeof JY_CANAL !== 'undefined' && JY_CANAL && JY_CANAL.claves.indexOf('quemas') < 0){
    JY_CANAL.claves.push('quemas');
  }
}catch(e){}

function migrar(){
  var toco = { usuarios:false, vinculos:false, horario:false };

  /* planes de servicio antiguos: sesiones y fecha del plan */
  (S.usuarios||[]).forEach(function(u){
    (u.planesServicio||[]).forEach(function(pl){
      if(pl.sesiones == null){ pl.sesiones = 8; toco.usuarios = true; }
      if(!pl.fechaPlan){ pl.fechaPlan = (u.creado||'').slice(0,10) || hoy(); toco.usuarios = true; }
    });
  });

  /* vínculos activos sin cupo de sesiones */
  (S.vinculos||[]).forEach(function(v){
    if(v.sesionesPlan != null) return;
    var p  = usr(v.profesionalId);
    var pl = p && v.planServicioId
      ? (p.planesServicio||[]).filter(function(x){ return x.id === v.planServicioId; })[0]
      : null;
    v.sesionesPlan = pl ? (+pl.sesiones || 8) : 8;
    v.fechaPlan    = v.fechaPlan || (pl && pl.fechaPlan) || (v.desde||'').slice(0,10) || hoy();
    toco.vinculos  = true;
  });

  /* bloques antiguos: campos nuevos con valor neutro */
  Object.keys(S.horario||{}).forEach(function(id){
    (S.horario[id]||[]).forEach(function(b){
      if(b.fecha == null){ b.fecha = ''; toco.horario = true; }
      if(b.profesional == null){ b.profesional = b.profesor || ''; toco.horario = true; }
      if(b.origenPlan === undefined){ b.origenPlan = null; toco.horario = true; }
    });
  });

  Object.keys(toco).forEach(function(k){ if(toco[k]) guardar(k); });
}
try{ migrar(); }catch(e){}

/* ---------- 20.2 · horario: lectura, saneo y tope de bloques libres ---------- */
function vinculoActivo(vid){
  return (S.vinculos||[]).filter(function(v){ return v.id === vid && v.estado === 'activo'; })[0] || null;
}
function hDe(alumnoId){
  if(!S.horario) S.horario = {};
  if(!Array.isArray(S.horario[alumnoId])){
    S.horario[alumnoId] = horarioPorDefectoJY();
    guardar('horario');
  }
  var lista = S.horario[alumnoId];
  /* saneo: si el vínculo que sembró un bloque ya no está activo, el bloque se va */
  if(Array.isArray(S.vinculos)){
    var limpia = lista.filter(function(b){ return !b.origenPlan || vinculoActivo(b.origenPlan); });
    if(limpia.length !== lista.length){
      S.horario[alumnoId] = limpia;
      guardar('horario');
      return S.horario[alumnoId];
    }
  }
  return lista;
}
function horarioPorDefectoJY(){
  return [
    {id:uid('h'), dia:1, fecha:'', ini:'08:00', fin:'09:00', actividad:'Fuerza · tren inferior', profesor:'', profesional:'', lugar:'Sala de pesas',  nota:'', origenPlan:null},
    {id:uid('h'), dia:2, fecha:'', ini:'19:00', fin:'20:00', actividad:'Movilidad y core',       profesor:'', profesional:'', lugar:'Sala funcional', nota:'', origenPlan:null},
    {id:uid('h'), dia:4, fecha:'', ini:'08:00', fin:'09:00', actividad:'Fuerza · tren superior', profesor:'', profesional:'', lugar:'Sala de pesas',  nota:'', origenPlan:null},
    {id:uid('h'), dia:6, fecha:'', ini:'10:00', fin:'11:00', actividad:'Sesión libre · cardio',  profesor:'', profesional:'', lugar:'Por definir',    nota:'', origenPlan:null}
  ];
}
function bloquesLibres(alumnoId){ return hDe(alumnoId).filter(function(b){ return !b.origenPlan; }); }
function bloquesDePlan(alumnoId){ return hDe(alumnoId).filter(function(b){ return !!b.origenPlan; }); }

try{ horarioPorDefecto = horarioPorDefectoJY; }catch(e){}
try{ horarioDe = hDe; }catch(e){}

function sellar(b, quienId){
  if(typeof sellarBloque === 'function') return sellarBloque(b, quienId);
  var q2 = usr(quienId);
  b.editadoPor = quienId||null; b.editadoNombre = q2?q2.nombre:'';
  b.editadoRol = q2?q2.rol:''; b.editadoEn = new Date().toISOString();
  return b;
}
function firma(b){ return (typeof firmaBloque === 'function') ? firmaBloque(b) : ''; }

/* ---------- 20.3 · siembra de bloques al aceptar una conexión ---------- */
function sembrarBloques(v){
  var pro = usr(v.profesionalId); if(!pro) return 0;
  var lista = hDe(v.alumnoId);
  var ya = lista.filter(function(b){ return b.origenPlan === v.id; }).length;
  var faltan = Math.max(0, (+v.sesionesPlan || 0) - ya);
  var base = ya;
  for(var i=0; i<faltan; i++){
    var n = base + i;
    lista.push(sellar({
      id: uid('h'),
      dia: DIAS_ORD[n % 6],
      fecha: '',
      ini: '08:00', fin: '09:00',
      actividad: v.servicio || (pro.rol === 'nutricionista' ? 'Consulta nutricional' : 'Entrenamiento'),
      profesor: pro.nombre,
      profesional: pro.nombre,
      profesionalId: pro.id,
      rolPro: pro.rol,
      origenPlan: v.id,
      planNombre: v.plan || '',
      sesionN: n + 1,
      lugar: '', nota: '', publicado: false
    }, v.profesionalId));
  }
  if(faltan) guardar('horario');
  return faltan;
}

/* «información del plan»: la síntesis que viaja del alumno al profesional */
function informacionDelPlan(v){
  var pro = usr(v.profesionalId) || {};
  var al  = usr(v.alumnoId) || {};
  var bl  = hDe(v.alumnoId).filter(function(b){ return b.origenPlan === v.id; });
  var con = bl.filter(function(b){ return !!b.fecha; }).map(function(b){ return b.fecha; }).sort();
  var c   = contadorPlan(v);
  return {
    vinculoId: v.id,
    alumno: al.nombre || '—', alumnoId: v.alumnoId,
    profesional: pro.nombre || '—', rolPro: pro.rol || '',
    plan: v.plan || 'Por definir',
    servicio: v.servicio || '—',
    fechaPlan: v.fechaPlan || (v.desde||'').slice(0,10),
    sesiones: c.total, quemadas: c.quemadas, restantes: c.restantes,
    bloques: bl.length,
    conFecha: con.length,
    desde: con[0] || '', hasta: con[con.length-1] || '',
    publicados: bl.filter(function(b){ return b.publicado; }).length
  };
}

/* ---------- 20.4 · contador de sesiones y quemado bilateral ---------- */
function quemasDe(vid){ return (S.quemas||[]).filter(function(x){ return x.vinculoId === vid; }); }
function contadorPlan(v){
  var total = +v.sesionesPlan || 0;
  var qs = quemasDe(v.id);
  var quemadas = qs.filter(function(x){ return x.estado === 'aceptada'; }).length;
  var pend = qs.filter(function(x){ return x.estado === 'pendiente'; })[0] || null;
  return { total: total, quemadas: quemadas, restantes: Math.max(0, total - quemadas), pendiente: pend };
}
function ladoDe(v, quienId){ return quienId === v.alumnoId ? 'alumno' : 'pro'; }

function botonQuemar(v, quienId){
  var c = contadorPlan(v);
  var lado = ladoDe(v, quienId);
  var esperandoMio = c.pendiente && c.pendiente.pedidoPor === lado;
  var esperandoOtro = c.pendiente && c.pendiente.pedidoPor !== lado;
  var clase = esperandoOtro ? 'btn sm gold' : (esperandoMio ? 'btn sm' : 'btn sm');
  var txt = esperandoOtro ? 'Confirmar quema · ' + c.restantes
          : esperandoMio  ? 'Esperando confirmación · ' + c.restantes
          : 'Quemar clase · ' + c.restantes;
  return '<button class="' + clase + ' jy-quemar" data-quemar="' + esc(v.id) + '"'
   + (esperandoMio ? ' disabled' : '')
   + ' title="' + esc(c.quemadas + ' de ' + c.total + ' sesiones usadas') + '">'
   + esc(txt) + '</button>';
}

function pedirQuema(vid){
  var v = (S.vinculos||[]).filter(function(x){ return x.id === vid; })[0];
  if(!v || v.estado !== 'activo') return toast('El vínculo ya no está activo.','warn');
  var quien = yo(); if(!quien) return;
  var lado = ladoDe(v, quien);
  var c = contadorPlan(v);

  if(c.pendiente){
    if(c.pendiente.pedidoPor === lado) return toast('Ya enviaste la solicitud. Falta que la confirme la otra parte.','warn');
    if(c.restantes <= 0){
      c.pendiente.estado = 'anulada'; c.pendiente.cerrado = new Date().toISOString();
      guardar('quemas'); pintar();
      return toast('No quedan sesiones en este plan.','bad');
    }
    c.pendiente.estado = 'aceptada';
    c.pendiente.aceptadaPor = quien;
    c.pendiente.cerrado = new Date().toISOString();
    guardar('quemas');
    if(typeof bitacora === 'function') bitacora('quema', 'Clase quemada · ' + (v.plan||''), quien);
    toast('Clase descontada. Quedan ' + Math.max(0, c.restantes - 1) + ' sesiones.','ok');
    return pintar();
  }

  if(c.restantes <= 0) return toast('Este plan ya no tiene sesiones disponibles.','bad');
  S.quemas.push({
    id: uid('qm'), vinculoId: v.id, alumnoId: v.alumnoId, profesionalId: v.profesionalId,
    pedidoPor: lado, pedidaPor: quien, estado: 'pendiente', creado: new Date().toISOString(), cerrado: null
  });
  guardar('quemas');
  toast(lado === 'alumno'
    ? 'Solicitud enviada a tu profesional. Se descuenta cuando la confirme.'
    : 'Solicitud enviada. Se descuenta cuando la confirme el alumno.','ok');
  pintar();
}

function calendarioHTML(idBase, mesISO, eventos){
  var base = aFecha(mesISO) || new Date();
  var y = base.getFullYear(), m = base.getMonth();
  var primero = new Date(y, m, 1);
  var arranque = (primero.getDay() + 6) % 7;
  var dias = new Date(y, m+1, 0).getDate();
  var titulo = primero.toLocaleDateString('es-CL', {month:'long', year:'numeric'});
  var porDia = {};
  (eventos||[]).forEach(function(ev){
    if(!ev.fecha) return;
    (porDia[ev.fecha] = porDia[ev.fecha] || []).push(ev);
  });

  var celdas = '';
  for(var i=0; i<arranque; i++) celdas += '<div class="jy-cal-d off"></div>';
  for(var d=1; d<=dias; d++){
    var f = iso(new Date(y, m, d));
    var evs = porDia[f] || [];
    celdas += '<div class="jy-cal-d' + (f === hoy() ? ' hoy' : '') + (evs.length ? ' con' : '') + '">'
      + '<span class="n">' + d + '</span>'
      + evs.slice(0,3).map(function(ev){
          var col = COLOR_ROL[ev.rol] || 'var(--gold)';
          return '<i style="background:' + col + '22;border-left:2px solid ' + col + '">'
            + esc((ev.hora||'') + ' ' + (ev.titulo||'')) + '</i>';
        }).join('')
      + (evs.length > 3 ? '<u>+' + (evs.length-3) + '</u>' : '')
      + '</div>';
  }

  return '<div class="jy-cal" id="' + idBase + '">'
   + '<div class="jy-cal-h"><button class="btn sm" data-cal="' + idBase + '" data-mes="' + iso(new Date(y, m-1, 1)) + '">‹</button>'
   + '<b>' + esc(titulo.charAt(0).toUpperCase() + titulo.slice(1)) + '</b>'
   + '<button class="btn sm" data-cal="' + idBase + '" data-mes="' + iso(new Date(y, m+1, 1)) + '">›</button></div>'
   + '<div class="jy-cal-g">'
   + ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(function(x){ return '<div class="jy-cal-w">' + x + '</div>'; }).join('')
   + celdas + '</div></div>';
}

var JY_SEL_ALUMNO = null;

function alumnosDelPro(proId){
  return (typeof alumnosDe === 'function') ? alumnosDe(proId) : [];
}
function bloquesDelPro(proId){
  var fuera = [];
  alumnosDelPro(proId).forEach(function(a){
    hDe(a.id).forEach(function(b){
      if(b.profesionalId && b.profesionalId !== proId) return;
      fuera.push({ b:b, alumno:a });
    });
  });
  return fuera;
}
function semanasDelMes(mesISO){
  var base = aFecha(mesISO) || new Date();
  var y = base.getFullYear(), m = base.getMonth();
  var d = new Date(y, m, 1);
  var vistos = {}, fuera = [];
  while(d.getMonth() === m){
    var l = lunesDe(iso(d));
    if(l && !vistos[l]){ vistos[l] = true; fuera.push(l); }
    d.setDate(d.getDate()+7);
  }
  return fuera;
}
function enSemana(fecha, lunesISO){
  if(lunesISO === '__todas__') return true;
  if(!fecha) return false;
  return fecha >= lunesISO && fecha <= masDias(lunesISO, 6);
}

   +   '<span class="chip ' + (items.length?'ok':'') + '">' + items.length + ' bloques en total</span>'

      : '<p class="hint" style="margin:14px 0 0">'
        + (gente.length
           ? 'Estás viendo todas tus clases. Elige a una persona para fijar las fechas de sus bloques.'

var jy_ligarHorarioAlumno = function(u, raiz){
  var r = raiz || document;
  var quien = q('#h-quien', r);
  if(quien) quien.onchange = function(){ JY_SEL_ALUMNO = quien.value; pintar(); };
  var sem = q('#h-semana', r);
  if(sem) sem.onchange = function(){ JY_SEL_SEMANA = sem.value; pintar(); };

  var sel = JY_SEL_ALUMNO;
  if(!sel || sel === '__todos__') return;

  var lista = hDe(sel);
  var tabla = q('#t-horario', r);
  var est   = q('#h-estado', r);
  var grid  = q('#jy-grid', r);

  var avisar = function(txt, malo){
    if(!est) return;
    est.textContent = txt;
    est.style.color = malo ? 'var(--bad)' : 'var(--ok)';
    clearTimeout(est._t);
    est._t = setTimeout(function(){ est.textContent=''; est.style.color=''; }, 3500);
  };
  var refrescarGrilla = function(){ if(grid) grid.innerHTML = jy_grillaCombinada(u.id, sel, JY_SEL_SEMANA); };

  var escribir = function(e){
    var el = e.target.closest ? e.target.closest('[data-h][data-c]') : null; if(!el) return;
    var b = lista.filter(function(x){ return x.id === el.dataset.h; })[0]; if(!b) return;
    b[el.dataset.c] = el.value;
    if(el.dataset.c === 'fecha'){
      var d = diaDeFecha(el.value);
      if(d != null){
        b.dia = d;
        var cel = q('[data-dia-de="' + b.id + '"]', r);
        if(cel) cel.textContent = nombreDia(d);
      }
      b.publicado = false;
    }
    if(el.dataset.c === 'actividad') b.servicio = el.value;
    sellar(b, u.id);
    guardar('horario');
    refrescarGrilla();
    avisar('Guardado');
  };
  if(tabla){
    tabla.addEventListener('input', escribir);
    tabla.addEventListener('change', escribir);
    tabla.addEventListener('click', async function(e){
      var b = e.target.closest ? e.target.closest('[data-hborra]') : null; if(!b) return;
      if(!await preguntar('Eliminar el bloque',
        '<p class="sub" style="margin:0">Sale del horario de esta persona, que lo verá desaparecer en «Mis clases».</p>',
        {ok:'Eliminar', peligro:true})) return;
      var i = lista.findIndex(function(x){ return x.id === b.dataset.hborra; });
      if(i >= 0) lista.splice(i,1);
      guardar('horario'); toast('Bloque eliminado','warn'); pintar();
    });
  }

  var gu = q('#h-guardar', r);
  if(gu) gu.onclick = function(){
    var mios = lista.filter(function(b){ return !b.profesionalId || b.profesionalId === u.id; });
    if(!mios.length) return avisar('No hay bloques que guardar', true);
    var conFecha = mios.filter(function(b){ return !!b.fecha; });
    if(!conFecha.length) return avisar('Ponle fecha al menos a un bloque', true);
    conFecha.forEach(function(b){
      b.publicado = true;
      b.profesionalId = b.profesionalId || u.id;
      b.profesional = b.profesional || u.nombre;
      b.rolPro = b.rolPro || u.rol;
      b.dia = diaDeFecha(b.fecha);
      sellar(b, u.id);
    });
    guardar('horario');
    var a = usr(sel);
    toast(conFecha.length + ' clases guardadas en tu calendario. '
      + (a ? a.nombre.split(' ')[0] : 'La persona') + ' las ve en «Mis clases».','ok');
    avisar('Semana guardada · ' + conFecha.length + ' fechas');
    pintar();
  };
};
