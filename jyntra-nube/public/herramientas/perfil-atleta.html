<title>JYNTRA · Evaluaciones (App)</title>



<style>
/* paleta JYNTRA: blanco, negro #171717, rojo var(--jy-acc), blanco 2 #EEF1F3 */
:root{--jy-acc:#DD2C37;--jy-acc-hi:#E8434D;--jy-acc-lo:#8E1C23;--jy-acc-glow:rgba(221,44,55,.16);--jy-borde:#3A3A3A;--jy-texto-acc:#FFFFFF;--jy-texto-tenue:#9AA0A6;}

  html, body { margin: 0; padding: 0; background: #050505; overflow-x: hidden; width: 100%; -webkit-text-size-adjust: 100%; }
  #root { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
  * { -webkit-tap-highlight-color: transparent; }
</style>
<style>/* paleta JYNTRA · ajustes finales */
html, body, #root { background:#171717 !important; }
</style>
</head>
<body>
<div id="root"></div>

<!-- La app está precompilada (antes se compilaba en el navegador con Babel).
     Código fuente: fuentes/perfil-atleta.jsx · ver LEEME.md para recompilar. -->
<script src="../vendor/perfil-atleta.js"></script>

<script>
/* --- puente de alto con la cáscara JYNTRA ---
   El iframe no tiene scroll propio: le avisa al padre cuánto mide para que
   le ajuste el alto, y anuncia 'listo' para recibir el contexto de vuelta. */
(function(){
  if(!window.parent || window.parent === window) return;
  var ultimo = 0;
  function avisar(){
    var h = Math.max(
      document.documentElement.scrollHeight,
      document.body ? document.body.scrollHeight : 0
    );
    if(Math.abs(h - ultimo) > 20){
      ultimo = h;
      try{ window.parent.postMessage({jyntra:true, accion:'alto', px:h}, '*'); }catch(e){}
    }
  }
  window.addEventListener('load', avisar);
  window.addEventListener('resize', avisar);
  setInterval(avisar, 600);
  try{ window.parent.postMessage({jyntra:true, accion:'listo'}, '*'); }catch(e){}
})();
</script>
</body>
</html>
