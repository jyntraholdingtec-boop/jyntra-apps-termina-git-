<title>JYNTRA · Tu progreso conectado</title>

<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="iconos/icono.svg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* paleta JYNTRA: blanco, negro #171717, rojo #DD2C37, blanco 2 #EEF1F3 */
:root{--jy-acc:#DD2C37;--jy-acc-hi:#E8434D;--jy-acc-lo:#8E1C23;--jy-acc-glow:rgba(221,44,55,.16);--jy-borde:#3A3A3A;--jy-texto-acc:#FFFFFF;--jy-texto-tenue:#9F9F9F;}

/* ============================================================
   JYNTRA · sistema base
   Paleta del logo: dorado #DD2C37 sobre negro
   ============================================================ */
:root{
  --ink:#0D0D0D; --panel:#161616; --panel2:#1E1E1E; --raise:#262626;
  --line:#303030; --line-soft:#242424;
  --gold:#DD2C37; --gold-hi:#DD2C37; --gold-dim:#8E1C23;
  --bone:#EEF1F3; --mute:#888888; --mute2:#656565;
  --r-alumno:#5B93B8; --r-profesor:#DD2C37; --r-nutricionista:#7FB77E; --r-admin:#C0785F;
  --ok:#7FB77E; --warn:#D9A441; --bad:#C9584C; --info:#5B93B8;
  --rail:250px; --top:60px;
  --f-disp:'Barlow Condensed',Impact,sans-serif;
  --f-head:'Archivo',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --rad:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--bone); font-family:var(--f-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 600px at 82% -14%, rgba(221,44,55,.09), transparent 62%);
  background-attachment:fixed;
}
a{color:var(--jy-texto-acc);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jy-acc-hi);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- tipografía utilitaria ---------- */
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--jy-texto-tenue)}
.h1{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;margin:0}
.h2{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em;margin:0}
.h3{font-family:var(--f-head);font-weight:600;font-size:14px;margin:0}
.sub{color:var(--mute);font-size:13.5px;margin:6px 0 0}
.mono{font-family:var(--f-mono)}
.num{font-family:var(--f-disp);font-weight:700;font-size:38px;line-height:1;letter-spacing:.01em}

/* ---------- marca ---------- */
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark svg{flex:none}
.brandmark .wm{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.26em;text-transform:uppercase;color:var(--bone);white-space:nowrap}
.brandmark .wm svg{display:block}
.brandmark .wm b{color:var(--jy-texto-acc);font-weight:700}
.brandmark .tag{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.3em;color:var(--jy-texto-tenue);text-transform:uppercase;display:block;margin-top:1px}

/* ============================================================
   ARMAZÓN
   ============================================================ */
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{
  background:linear-gradient(180deg,#131313,#0F0F0F);
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.rail-head{padding:16px 16px 12px;border-bottom:1px solid var(--line-soft)}
.rail-user{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;flex:none;border-radius:2px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;color:#FFFFFF;background:var(--jy-acc)}
.rail-user .n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-user .r{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.nav{padding:10px 8px;overflow-y:auto;flex:1}
.nav-group{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute2);padding:14px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rad);
  color:var(--bone);font-size:13.5px;border-left:2px solid transparent;transition:background .12s,border-color .12s;
}
.nav a .ic{width:16px;text-align:center;opacity:.75;font-size:13px}
.nav a:hover{background:#1B1B1B}
.nav a.on{background:#1B1B1B;border-left-color:var(--jy-acc);color:var(--jy-texto-acc)}
.nav a .pill{margin-left:auto;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;padding:2px 5px;border-radius:2px;background:#242424;color:var(--jy-texto-tenue);border:1px solid #333333}
.rail-foot{padding:10px 12px;border-top:1px solid var(--line-soft);display:flex;gap:8px;align-items:center;justify-content:space-between}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--top);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;
  gap:14px;padding:0 22px;position:sticky;top:0;z-index:40;
  background:rgba(13,13,13,.88);backdrop-filter:blur(10px);
}
.topbar .crumb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.topbar .crumb b{color:var(--bone);font-weight:500}
.topbar .grow{flex:1}
.content{padding:26px 22px 70px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .grow{flex:1}

/* ---------- chips / botones ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--rad);
  border:1px solid var(--line);background:var(--panel2);color:var(--bone);cursor:pointer;
  font-size:13.5px;font-weight:500;transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:var(--raise);border-color:#3F3F3F}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--jy-acc);border-color:var(--jy-acc);color:#FFFFFF;font-weight:600}
.btn.gold:hover{background:var(--jy-acc-hi);border-color:var(--jy-acc-hi)}
.btn.ghost{background:transparent}
.btn.danger{border-color:#5A2E28;color:#E0968C}
.btn.danger:hover{background:#2A1614}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid var(--line);color:var(--mute)}
.chip.gold{border-color:var(--jy-borde);color:var(--jy-texto-acc);background:#181818}
.chip.ok{border-color:#474747;color:var(--ok);background:#1A1A1A}
.chip.warn{border-color:#434343;color:var(--warn);background:#181818}
.chip.bad{border-color:#542C27;color:var(--bad);background:#1D1311}
.chip.info{border-color:#3D3D3D;color:var(--info);background:#171717}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- tarjetas / rejillas ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--rad);padding:18px}
.card.pad0{padding:0}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head .grow{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

.kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--rad);padding:16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--jy-acc);opacity:.5}
.kpi .lab{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.kpi .num{color:var(--bone)}
.kpi .foot{font-size:12px;color:var(--mute);margin-top:6px}

/* ---------- formularios ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.inp,select.inp,textarea.inp{
  background:#121212;border:1px solid var(--line);border-radius:var(--rad);
  padding:9px 11px;width:100%;color:var(--bone);transition:border-color .12s;
}
.inp:focus{border-color:var(--jy-borde)}
textarea.inp{min-height:84px;resize:vertical}
.hint{font-size:12px;color:var(--mute2)}

/* ---------- tablas ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#191919}
.tbl td.right,.tbl th.right{text-align:right}

/* ---------- vacíos ---------- */
.empty{border:1px dashed var(--line);border-radius:var(--rad);padding:28px;text-align:center;color:var(--mute)}
.empty .h3{color:var(--bone);margin-bottom:6px}

/* ============================================================
   PIEZA CARACTERÍSTICA · EL BASTIDOR
   Cada hueco de herramienta se muestra como una placa de montaje
   con su identificador, su contrato de datos y su estado.
   ============================================================ */
.slot{
  position:relative;border:1px dashed #373737;border-radius:var(--rad);
  background:
    linear-gradient(180deg,rgba(221,44,55,.035),transparent 46%),
    repeating-linear-gradient(135deg,transparent 0 13px,rgba(221,44,55,.028) 13px 14px);
  padding:0;overflow:hidden;
}
.slot.mounted{border-style:solid;border-color:var(--line);background:var(--panel)}
.slot-bar{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-bottom:1px dashed #373737;background:#131211;flex-wrap:wrap;
}
.slot.mounted .slot-bar{border-bottom-style:solid;border-bottom-color:var(--line-soft)}
.slot-id{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--jy-texto-acc);white-space:nowrap}
.slot-bar .grow{flex:1}
.slot-body{padding:16px}
.slot-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 18px;text-align:center}
.slot-empty .tt{font-family:var(--f-disp);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.slot-empty .ds{color:var(--mute);font-size:13px;max-width:56ch}
.contract{width:100%;max-width:660px;text-align:left;margin-top:4px;border:1px solid var(--line-soft);border-radius:var(--rad);background:#111}
.contract .cr{display:grid;grid-template-columns:82px 1fr;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.contract .cr:last-child{border-bottom:0}
.contract .cr .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:2px}
.contract code{overflow-wrap:anywhere;word-break:break-word;font-family:var(--f-mono);font-size:11.5px;color:var(--jy-texto-acc);background:#171717;border:1px solid #262626;border-radius:2px;padding:1px 5px}
.slot iframe{width:100%;border:0;display:block;min-height:620px;background:#0D0D0D}
.slot-corner{position:absolute;width:8px;height:8px;border-color:var(--jy-borde);opacity:.7}

/* ---------- lector / vista de solo lectura para el alumno ---------- */
.readonly-note{display:flex;gap:9px;align-items:flex-start;border-left:2px solid var(--info);background:#171717;padding:10px 12px;border-radius:0 var(--rad) var(--rad) 0;font-size:13px;color:#D2D3D4}

/* ---------- portada / acceso ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.gate-art{
  position:relative;overflow:hidden;border-right:1px solid var(--line-soft);
  background:linear-gradient(160deg,#121212,#0B0B0B 62%);
  display:flex;flex-direction:column;justify-content:space-between;padding:38px;
}
.gate-art .rings{position:absolute;inset:-18% -30% auto auto;width:660px;height:660px;opacity:.5;pointer-events:none}
.gate-claim{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;font-size:clamp(38px,5.4vw,66px);line-height:.92;letter-spacing:.005em;position:relative}
.gate-claim em{font-style:normal;color:var(--jy-texto-acc);display:block}
.gate-pillars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);position:relative}
.gate-pillars div{background:#101010;padding:11px 13px}
.gate-pillars .i{font-family:var(--f-mono);font-size:10px;color:var(--jy-texto-tenue);letter-spacing:.16em}
.gate-pillars .t{font-size:13px;margin-top:3px}
.gate-form{display:flex;align-items:center;justify-content:center;padding:38px}
.gate-form .box{width:100%;max-width:400px}
.tabs{display:flex;gap:2px;background:#121212;border:1px solid var(--line-soft);border-radius:var(--rad);padding:3px;margin-bottom:18px}
.tabs button{flex:1;background:transparent;border:0;padding:8px;border-radius:2px;cursor:pointer;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tabs button.on{background:var(--jy-acc);color:#FFFFFF;font-weight:600}
.rolepick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rolepick label{
  border:1px solid var(--line);border-radius:var(--rad);padding:10px;cursor:pointer;background:#121212;
  display:flex;flex-direction:column;gap:2px;transition:border-color .12s,background .12s;
}
.rolepick label:hover{border-color:#444444}
.rolepick input{position:absolute;opacity:0;pointer-events:none}
.rolepick input:checked+span{color:var(--jy-texto-acc)}
.rolepick label:has(input:checked){border-color:var(--jy-borde);background:#161616}
.rolepick .rn{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.rolepick .rd{font-size:11.5px;color:var(--mute);line-height:1.35}

/* ---------- planes ---------- */
.plan{border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}
.plan.cur{border-color:var(--jy-acc);box-shadow:0 0 0 1px rgba(221,44,55,.25) inset}
.plan .pn{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;font-size:24px;letter-spacing:.05em}
.plan .pp{font-family:var(--f-disp);font-size:30px;font-weight:700;color:var(--jy-texto-acc)}
.plan .pp small{font-family:var(--f-body);font-size:12px;color:var(--mute);font-weight:400}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px;flex:1}
.plan li{display:flex;gap:8px;align-items:flex-start;color:var(--bone)}
.plan li.off{color:var(--mute2);text-decoration:line-through}
.plan li i{font-style:normal;color:var(--jy-texto-acc);flex:none}
.plan li.off i{color:var(--mute2)}
.plan-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--jy-acc);color:#FFFFFF;font-family:var(--f-mono);font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 11px;border-radius:20px;box-shadow:0 4px 14px rgba(221,44,55,.35);white-space:nowrap}
.plan.svc ul{flex:none}
.plan.svc{gap:10px}

/* ---------- avisos ---------- */
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:#1B1B1B;border:1px solid var(--line);border-left:3px solid var(--jy-acc);border-radius:var(--rad);padding:11px 14px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .18s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;background:rgba(5,5,5,.72);z-index:150;display:grid;place-items:center;padding:18px;animation:tin .14s ease-out}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);width:min(560px,100%);max-height:88vh;overflow:auto}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.modal-b{padding:18px}
.modal-f{padding:14px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end}

.locked{border:1px solid #434343;background:#151515;border-radius:var(--rad);padding:16px;display:flex;gap:12px;align-items:flex-start}
.locked .h3{color:var(--warn)}

/* ---------- responsive ---------- */
.railtoggle{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:120;transform:translateX(-100%);transition:transform .2s ease;height:100dvh}
  body.rail-open .rail{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  body.rail-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:110}
  .railtoggle{display:inline-flex}
  .content{padding:18px 14px 60px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gate{grid-template-columns:1fr}
  .gate-art{border-right:0;border-bottom:1px solid var(--line-soft);padding:26px;gap:26px}
  .gate-form{padding:26px 18px 46px}
  .h1{font-size:27px}
}
@media(max-width:560px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .rolepick{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{.rail,.topbar,.toasts{display:none!important}.shell{grid-template-columns:1fr}}
.jy-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.jy-day{background:var(--panel2);border:1px solid var(--line-soft);border-radius:var(--rad);padding:9px;min-height:96px}
.jy-day.hoy{border-color:var(--jy-borde)}
.jy-day-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
  border-bottom:1px solid var(--line-soft);padding-bottom:6px;margin-bottom:8px}
.jy-day-h b{font-weight:600;color:var(--bone)}
.jy-day-h span{color:var(--jy-texto-acc)}
.fold{border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);margin-bottom:18px;overflow:hidden}
.fold-h{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--panel2);border:0;border-bottom:1px solid transparent;padding:12px 14px;color:inherit;font:inherit}
.fold.abierto .fold-h{border-bottom-color:var(--line-soft)}

.fold.abierto .fold-ic{transform:rotate(90deg)}
.fold-t{font-weight:600;font-size:15px}
.fold-s{font-size:12px;color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.jy-anam-caja iframe{width:100%;border:0;display:block;background:#0A0A0A;border-radius:8px;min-height:620px}
.slot-body iframe{width:100%;border:0;display:block;background:#0A0A0A;border-radius:8px;min-height:620px}
/* ---------- celular (Android / iOS): nada se sale de la pantalla ---------- */
html{overflow-x:hidden}
body{max-width:100%;overflow-x:clip}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.tbl-scroll{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-scroll>table.tbl{min-width:100%}
.tbl select.inp{min-width:118px}
.h1,.h2,.h3,.sub,.eyebrow,.rail-user .n,.fichamini,.kpi .foot{overflow-wrap:anywhere;word-break:break-word}
.main,.content,.card,.grid>*{min-width:0}
img,svg,video,canvas,iframe{max-width:100%}
@media(max-width:900px){
  .topbar{height:auto;min-height:calc(var(--top) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .rail{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .content{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .topbar .crumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-head{align-items:flex-start}
  input,select,textarea{font-size:16px!important}   /* iOS: sin zoom al escribir */
}
/* ---------- vista de la semana del alumno ---------- */
.horagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.horagrid .col{min-width:0;background:var(--panel2);border:1px solid var(--line-soft);border-radius:var(--rad);padding:8px;display:flex;flex-direction:column;gap:6px}
.horagrid h4{margin:0 0 2px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);font-weight:600;
  border-bottom:1px solid var(--line-soft);padding-bottom:5px}
.horagrid .blk{min-width:0;background:var(--raise);border:1px solid var(--line-soft);border-left:3px solid var(--rol-acc,var(--jy-acc));border-radius:6px;padding:6px 7px;display:flex;flex-direction:column;gap:2px}
.horagrid .blk b{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--bone);white-space:nowrap}
.horagrid .blk span{font-size:12px;color:var(--bone);overflow-wrap:anywhere}
.horagrid .blk i{font-style:normal;font-size:11px;color:var(--mute);overflow-wrap:anywhere}
@media(max-width:520px){.horagrid{grid-template-columns:1fr}.horagrid .col:not(:has(.blk)){flex-direction:row;justify-content:space-between;align-items:center}
  .horagrid .col:not(:has(.blk)) h4{border:0;padding:0;margin:0}}
/* botón de privacidad: en celular, dentro del menú (no tapa el contenido) */
.rail-priv{display:none}
@media(max-width:900px){
  body:has(.shell) #jy21-flot{display:none}
  .rail-priv{display:inline-flex}
  #jy21-flot{bottom:calc(10px + env(safe-area-inset-bottom))}
}

/* ---------- carga rápida de clases ---------- */
.jy-cr label.f{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 5px}
.jy-cr .tg{display:inline-flex;align-items:center;min-height:38px;padding:7px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--bone);border-radius:999px;font-size:13.5px;cursor:pointer;transition:background .12s,border-color .12s}
.jy-cr .tg:hover{border-color:var(--jy-acc)}
.jy-cr .tg.on{background:var(--jy-acc);border-color:var(--jy-acc);color:#fff}
.jy-cr .cr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
/* ---------- horario semanal: todo dentro de su columna ---------- */
.jy-week{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.jy-day{min-width:0;display:flex;flex-direction:column;gap:6px}
.jy-day-h{margin-bottom:2px}
.jy-slot{min-width:0;background:var(--raise);border:1px solid var(--line-soft);border-left:3px solid var(--rol-acc,var(--jy-acc));
  border-radius:6px;padding:7px 8px;font-size:12px;line-height:1.35;overflow:hidden}
.jy-slot:not(.asignado){border-left-style:dashed;background:transparent}
.jy-slot .hh{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--bone)}
.jy-slot .nn{font-weight:600;font-size:12.5px;color:var(--bone);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jy-slot .ss{color:var(--mute);font-size:11.5px;margin-top:2px;overflow-wrap:anywhere;word-break:break-word}
.jy-slot .pub{display:inline-block;margin-top:5px;font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--mute)}
.jy-slot .pub.si{border-color:rgba(45,179,106,.45);color:#2DB36A}
.jy-vacio{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute2);padding:4px 0}
.card-head{flex-wrap:wrap}
.card-head select.inp{width:auto;min-width:0;flex:0 1 230px}
@media(max-width:520px){
  .jy-week{grid-template-columns:1fr}
  .jy-day{min-height:0}
  .jy-day:has(.jy-vacio){flex-direction:row;align-items:center;justify-content:space-between;padding:7px 9px}
  .jy-day:has(.jy-vacio) .jy-day-h{border:0;margin:0;padding:0}
  .card-head select.inp{flex:1 1 100%;max-width:none!important}
}

/* ===============================================================
   IDENTIDAD POR ROL
   ---------------------------------------------------------------
   La marca es roja (botones, logo). Cada perfil tiene además SU
   color, que aparece como líneas y detalles para saber siempre en
   qué perfil estás:
     · ALUMNO         · rojo       #DD2C37
     · PROFESOR       · mostaza    #D9A21E
     · NUTRICIONISTA  · verde      #2DB36A
     · ADMINISTRADOR  · azul       #2F7FE8
   Los colores viven en --r-* (bloque final) y aquí se aplican.
   =============================================================== */
body{ --rol-acc:var(--jy-acc); --rol-hi:var(--jy-acc-hi); --rol-tinta:#FFFFFF; }
body[data-rol="nutricionista"]{ --gold:#FFFFFF; --gold-hi:#FFFFFF; --gold-dim:#9AA0A6; }
body[data-rol="alumno"]{        --rol-acc:var(--r-alumno);        --rol-hi:var(--r-alumno-hi);        --rol-tinta:#FFFFFF; }
body[data-rol="profesor"]{      --rol-acc:var(--r-profesor);      --rol-hi:var(--r-profesor-hi);      --rol-tinta:#171717; }
body[data-rol="nutricionista"]{ --rol-acc:var(--r-nutricionista); --rol-hi:var(--r-nutricionista-hi); --rol-tinta:#171717; }
body[data-rol="administrador"]{ --rol-acc:var(--r-admin);         --rol-hi:var(--r-admin-hi);         --rol-tinta:#FFFFFF; }

/* 1 · franja vertical del riel */
body[data-rol] .rail{ position:relative; }
/* en celular el menú es un cajón fijo: sin esto, la regla de arriba lo
   dejaba ocupando una pantalla entera sobre el contenido */
@media(max-width:900px){ body[data-rol] .rail{ position:fixed; } }
body[data-rol] .rail::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--rol-acc);
}
/* 2 · avatar, rótulo del rol y etiqueta de la marca */
body[data-rol] .rail-user .avatar,
body[data-rol] .rail-head .avatar,
body[data-rol] .topbar .avatar{ background:var(--rol-acc)!important; color:var(--rol-tinta); }
body[data-rol] .rail-user .r{ color:var(--rol-acc); }
body[data-rol] .brandmark .tag{ color:var(--rol-acc); letter-spacing:.3em; }
/* 3 · línea bajo la barra superior (se desvanece hacia la derecha) */
body[data-rol] .topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; pointer-events:none;
  background:linear-gradient(90deg,var(--rol-acc),var(--rol-acc) 22%,transparent 78%);
}
body[data-rol] .topbar .crumb b{ color:var(--rol-hi); }
/* 4 · menú: la opción activa lleva la línea del perfil */
body[data-rol] .nav a.on{ border-left-color:var(--rol-acc); background:color-mix(in srgb,var(--rol-acc) 11%,#1B1B1B); }
body[data-rol] .nav a.on .ic{ color:var(--rol-acc); opacity:1; }
body[data-rol] .nav-group{ display:flex; align-items:center; gap:8px; }
body[data-rol] .nav-group::before{ content:''; width:10px; height:2px; background:var(--rol-acc); opacity:.8; flex:none; }
/* 5 · indicadores, títulos y paneles */
body[data-rol] .kpi::after{ background:var(--rol-acc); opacity:.95; width:3px; }
body[data-rol] .page-head .eyebrow{ color:var(--rol-acc); }
body[data-rol] .page-head{ position:relative; padding-bottom:14px; }
body[data-rol] .page-head::after{
  content:''; position:absolute; left:0; bottom:0; width:64px; height:2px; background:var(--rol-acc);
}
body[data-rol] .slot.mounted{ border-top:2px solid var(--rol-acc); }
body[data-rol] .fold.abierto{ border-left:2px solid var(--rol-acc); }
body[data-rol] .fold-ic{ color:var(--rol-acc); }
body[data-rol] .jy-day.hoy{ border-color:var(--rol-acc); box-shadow:inset 0 2px 0 var(--rol-acc); }
body[data-rol] .jy-day-h span{ color:var(--rol-acc); }
body[data-rol] .toast{ border-left-color:var(--rol-acc); }
body[data-rol] .toast.ok{ border-left-color:var(--ok); } body[data-rol] .toast.bad{ border-left-color:var(--bad); } body[data-rol] .toast.warn{ border-left-color:var(--warn); }
body[data-rol] .modal{ border-top:2px solid var(--rol-acc); }
body[data-rol] .inp:focus{ border-color:var(--rol-acc); }
body[data-rol] ::-webkit-scrollbar-thumb:hover{ background:var(--rol-acc); }

.jy-barra{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 12px;border:1px solid var(--line);background:var(--panel2);}

  position:sticky;bottom:0;z-index:5;background:var(--panel2)}

  text-transform:uppercase;color:var(--mute)}
.jy-barra .hint{margin:0;flex:1;min-width:140px}
@media(max-width:520px){.jy-barra{justify-content:stretch}.jy-barra .btn{flex:1;justify-content:center}}

<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>
<!-- nube: configuración, librería de Firebase (local, sin CDN) y conector -->
<script>
/* app instalable: registra el trabajador sin conexión (sólo en https o local) */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
}
</script>
<script src="nube-config.js"></script>
<script src="vendor/firebase-jyntra.js"></script>
<script src="nube-backend.js"></script>
<script>
/* ================================================================
   JYNTRA TECHNOLOGIES · cáscara de aplicación
   Archivo único. Sin dependencias. Los 8 pilares de la bitácora.
   Las herramientas se enchufan con JYNTRA.registrar(...)  —  ver §MÓDULOS
   ================================================================ */
(function(){
'use strict';

/* ---------------------------------------------------------------
   §0 · UTILIDADES
   --------------------------------------------------------------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = (p)=> (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* fecha de HOY en la hora local (Chile), no en UTC: después de las 21:00 ya no salta al día siguiente */
const hoy = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const esc = (s)=> String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha = (iso)=>{ if(!iso) return '—'; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
  const d = m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(iso); if(isNaN(d)) return String(iso).slice(0,10);
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}); };
const fechaHora = (iso)=>{ const d=new Date(iso); return isNaN(d)?'—':d.toLocaleString('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); };
const money = (n)=> '$'+Number(n||0).toLocaleString('es-CL');
const iniciales = (n)=> String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const diasES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

/* almacenamiento tolerante: si localStorage está bloqueado (visores en iframe)
   la app sigue funcionando en memoria durante la sesión. */
const mem = {};
const disco = (function(){ try{ const k='__jy'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
const DB = {
  get(k,def){
    try{ const v = disco ? localStorage.getItem('jyntra.'+k) : mem[k];
      return v==null ? def : JSON.parse(v);
    }catch(e){ return def; }
  },
  set(k,v){
    const s = JSON.stringify(v);
    if(disco){ try{ localStorage.setItem('jyntra.'+k,s); }catch(e){ mem[k]=s; } } else { mem[k]=s; }
    return v;
  }
};

function toast(msg,tipo){
  const el = document.createElement('div');
  el.className = 'toast '+(tipo||'');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),200); }, 3400);
}

/* diálogo propio: confirm() y prompt() quedan bloqueados dentro de visores con iframe */
function preguntar(titulo, cuerpoHTML, opciones){
  return new Promise(res=>{
    const o = Object.assign({ok:'Confirmar', cancelar:'Cancelar', peligro:false}, opciones||{});
    const bg = document.createElement('div'); bg.className='modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'
      + '<div class="modal-h"><div class="h2">'+esc(titulo)+'</div></div>'
      + '<div class="modal-b">'+(cuerpoHTML||'')+'</div>'
      + '<div class="modal-f">'+(o.cancelar ? '<button class="btn" data-x="0">'+esc(o.cancelar)+'</button>' : '')
      + '<button class="btn '+(o.peligro?'danger':'gold')+'" data-x="1">'+esc(o.ok)+'</button></div></div>';
    $('#modal-root').appendChild(bg);
    const cerrar = (v)=>{ bg.remove(); res(v); };
    /* Enter dentro del formulario = botón principal (antes recargaba la página) */
    bg.addEventListener('submit', e=>{ e.preventDefault(); const ok = bg.querySelector('[data-x="1"]'); if(ok) ok.click(); });
    bg.addEventListener('click', e=>{
      if(e.target===bg) return cerrar(false);
      const b = e.target.closest('[data-x]'); if(!b) return;
      if(b.dataset.x==='0') return cerrar(false);
      const form = bg.querySelector('form'); 
      if(form){ const d={}; $$('[name]',form).forEach(i=>d[i.name]= i.type==='checkbox'?i.checked:i.value); return cerrar(d); }
      cerrar(true);
    });
    setTimeout(()=>{ const f=bg.querySelector('input,select,textarea,button.gold'); f&&f.focus(); },30);
  });
}

/* ---------------------------------------------------------------
   §1 · PILAR 1 — PERSONAS Y ROLES
   --------------------------------------------------------------- */
const ROLES = {
  alumno:        { nombre:'Alumno',        color:'var(--r-alumno)',        desc:'Entrena, registra y consulta sus resultados.' },
  profesor:      { nombre:'Profesor',      color:'var(--r-profesor)',      desc:'Evalúa, planifica y hace seguimiento.' },
  nutricionista: { nombre:'Nutricionista', color:'var(--r-nutricionista)', desc:'Anamnesis, plan alimentario y control.' },
  administrador: { nombre:'Administrador', color:'var(--r-admin)',         desc:'Control de mando de la plataforma.' }
};
const esProfesional = (r)=> r==='profesor' || r==='nutricionista';

/* ---------------------------------------------------------------
   §2 · PILAR 2 — PLANES Y CONTROL DE ACCESO (monetización)
   El backend define qué se abre. Aquí vive el catálogo y el portero.
   --------------------------------------------------------------- */
const PLANES = {
  base: {
    id:'base', nombre:'Base', precio:0, periodo:'mes',
    maxAlumnos:5,
    permisos:['agenda','vinculos','evaluacion','seguimiento.basico'],
    resumen:'Para empezar a atender.'
  },
  pro: {
    id:'pro', nombre:'Pro', precio:24900, periodo:'mes',
    maxAlumnos:40,
    permisos:['agenda','vinculos','evaluacion','planificacion','seguimiento.basico','seguimiento.correlacion','buscador','pdf'],
    resumen:'El plan de trabajo diario en sala.'
  },
  elite: {
    id:'elite', nombre:'Elite', precio:49900, periodo:'mes',
    maxAlumnos:Infinity,
    permisos:['agenda','vinculos','evaluacion','planificacion','seguimiento.basico','seguimiento.correlacion','buscador','pdf','marca','equipo','api'],
    resumen:'Centros y equipos multiprofesional.'
  }
};
const PERMISO_NOMBRE = {
  agenda:'Agenda y reservas', vinculos:'Vínculos con alumnos', evaluacion:'Módulo de evaluación',
  planificacion:'Planificación de mesociclos', 'seguimiento.basico':'Seguimiento diario',
  'seguimiento.correlacion':'Correlación de métricas', buscador:'Ficha en el buscador',
  pdf:'Informes en PDF', marca:'Informes con marca propia', equipo:'Varios profesionales', api:'Acceso por API'
};

/* ---------------------------------------------------------------
   §3 · ESTADO
   --------------------------------------------------------------- */
const S = {
  usuarios:   DB.get('usuarios', null),
  sesion:     DB.get('sesion', null),
  vinculos:   DB.get('vinculos', null),      // pilar 4
  agenda:     DB.get('agenda', null),        // pilar 3
  registros:  DB.get('registros', null),     // pilares 5,6,7 — datos de las herramientas
  metricas:   DB.get('metricas', null),      // pilar 7
  ejercicios: DB.get('ejercicios', null),    // pilar 8
  facturas:   DB.get('facturas', null),      // pilar 8
  bitacora:   DB.get('bitacora', null),
  fichas:     DB.get('fichas', null),
  horario:    DB.get('horario', null),
  pautas:     DB.get('pautas', null)
};
let guardar = function(clave){ DB.set(clave, S[clave]); };
function guardarTodo(){ Object.keys(S).forEach(guardar); }

/* ---------------------------------------------------------------
   §3b · CANAL COMPARTIDO ENTRE PERFILES
   ---------------------------------------------------------------
   Los tres perfiles (alumno, profesor, nutricionista) son archivos
   HTML independientes. Para que la conexión funcione comparten un
   mismo almacén con el prefijo 'jyntra.'.

   · MISMO HOSTING (mismo dominio, p.ej. tu-sitio.cl/alumno.html y
     tu-sitio.cl/profesor.html): funciona tal cual, sin tocar nada.
     El navegador comparte localStorage entre las dos páginas y este
     módulo detecta los cambios del otro perfil y repinta solo.

   · HOSTING SEPARADO (dominios distintos): rellena JY_CANAL.api con
     la URL de tu backend. Este módulo hará GET para traer el estado
     y POST para empujarlo. El backend sólo necesita guardar y
     devolver un JSON con las claves de JY_CANAL.claves.
   --------------------------------------------------------------- */
const JY_CANAL = {
  claves : ['usuarios','vinculos','agenda','registros','metricas','horario','fichas','pautas'],
  api    : null,      /* ← p.ej. 'https://api.tu-dominio.cl/jyntra'  */
  token  : null,      /* ← cabecera Authorization, si tu backend la pide */
  latido : 4000,      /* cada cuánto se mira si el otro perfil escribió */
  sello  : null,
  activo : false
};

/* sello de versión: cambia cada vez que alguien guarda algo */
function jySello(){ try{ return DB.get('__sello', 0); }catch(e){ return 0; } }
function jyMarcarSello(){ try{ DB.set('__sello', Date.now()); }catch(e){} }

/* guardar() original, envuelto para que avise al otro perfil */
const guardarLocal = guardar;
guardar = function(clave){
  guardarLocal(clave);
  if(JY_CANAL.claves.indexOf(clave) >= 0){
    jyMarcarSello();
    jyEmpujar(clave);
  }
};

var jyRepintePendiente = false;
/* relee del disco las claves que tocó el otro perfil y repinta */
function jyRecargar(){
  let cambio = false;
  JY_CANAL.claves.forEach(k=>{
    if(!(k in S)) return;
    const fresco = DB.get(k, null);
    if(fresco == null) return;
    if(JSON.stringify(fresco) !== JSON.stringify(S[k])){ S[k] = fresco; cambio = true; }
  });
  if(cambio || jyRepintePendiente){
    /* Si la persona está escribiendo dentro de una herramienta, repintar
       recargaría el marco y perdería lo que lleva: se espera al próximo
       latido en que no esté dentro de un marco. */
    var enMarco = document.activeElement && document.activeElement.tagName === 'IFRAME';
    if(enMarco){ jyRepintePendiente = true; return cambio; }
    jyRepintePendiente = false;
    if(typeof pintar === 'function'){ try{ pintar(); }catch(e){} }
  }
  return cambio;
}

/* --- puente remoto (sólo si JY_CANAL.api está configurado) --- */
function jyCabeceras(){
  const h = { 'Content-Type':'application/json' };
  if(JY_CANAL.token) h['Authorization'] = 'Bearer ' + JY_CANAL.token;
  return h;
}
function jyEmpujar(clave){
  if(!JY_CANAL.api) return;
  try{
    fetch(JY_CANAL.api + '/estado/' + encodeURIComponent(clave), {
      method:'PUT', headers:jyCabeceras(), body: JSON.stringify({ valor: S[clave] })
    }).catch(()=>{});
  }catch(e){}
}
function jyTraer(){
  if(!JY_CANAL.api) return Promise.resolve(false);
  return fetch(JY_CANAL.api + '/estado', { headers: jyCabeceras() })
    .then(r=> r.ok ? r.json() : null)
    .then(d=>{
      if(!d) return false;
      let cambio = false;
      JY_CANAL.claves.forEach(k=>{
        if(d[k] == null || !(k in S)) return;
        if(JSON.stringify(d[k]) !== JSON.stringify(S[k])){
          S[k] = d[k]; guardarLocal(k); cambio = true;
        }
      });
      if(cambio && typeof pintar === 'function'){ try{ pintar(); }catch(e){} }
      return cambio;
    }).catch(()=> false);
}

/* --- arranque del canal --- */

/* ---------------------------------------------------------------
   §3d · EXPEDIENTE NUTRICIONAL COMPARTIDO
   Una sola pauta por persona. La arma el nutricionista, el alumno la
   ajusta a su día a día y los dos ven el cambio del otro.
   --------------------------------------------------------------- */
function pautaDe(alumnoId){
  if(!S.pautas) S.pautas = {};
  return S.pautas[alumnoId] || null;
}
function guardarPauta(alumnoId, estado, quienId){
  if(!S.pautas) S.pautas = {};
  const q = usuario(quienId);
  S.pautas[alumnoId] = {
    estado          : estado,
    actualizadoPor  : quienId || null,
    actualizadoNombre: q ? q.nombre : '',
    actualizadoRol  : q ? q.rol : '',
    actualizadoEn   : new Date().toISOString()
  };
  guardar('pautas');
  return S.pautas[alumnoId];
}
function firmaPauta(alumnoId){
  const p = pautaDe(alumnoId);
  if(!p || !p.actualizadoNombre) return '';
  const yo = S.sesion === p.actualizadoPor;
  return (yo ? 'Último cambio tuyo' : 'Último cambio de '+p.actualizadoNombre.split(' ')[0])
       + ' · ' + fechaHora(p.actualizadoEn);
}

/* ---------------------------------------------------------------
   §3e · IDENTIDAD DEL ATLETA
   Nombre, edad y sexo salen de la ficha y son iguales en los tres
   perfiles. Peso y talla se toman de la última medición y vuelven a
   la ficha cuando alguien los corrige.
   --------------------------------------------------------------- */
function identidadDe(alumnoId){
  const u = usuario(alumnoId);
  if(!u) return null;
  let edad = '';
  if(u.nacimiento){
    const e = Math.floor((Date.now() - new Date(u.nacimiento)) / 31557600000);
    if(e > 0 && e < 120) edad = e;
  }
  if(!edad && u.edad) edad = u.edad;

  /* último peso registrado en el seguimiento diario */
  let peso = u.peso || '';
  try{
    const serie = S.metricas
      .filter(m=> m.alumnoId===alumnoId && m.clave==='peso' && m.valor)
      .sort((a,b)=> String(b.fecha).localeCompare(String(a.fecha)));
    if(serie.length) peso = serie[0].valor;
  }catch(e){}

  return {
    id    : u.id,
    nombre: u.nombre || '',
    edad  : edad,
    sexo  : u.sexo || '',
    talla : u.altura || '',
    peso  : peso,
    objetivo: u.objetivo || ''
  };
}

/* peso y talla corregidos desde cualquier herramienta vuelven a la ficha */
function refrescarIdentidad(alumnoId, datos, quienId){
  const u = usuario(alumnoId); if(!u || !datos) return;
  let toco = false;
  if(datos.talla && +datos.talla !== +u.altura){ u.altura = +datos.talla; toco = true; }
  if(toco) guardar('usuarios');

  if(datos.peso){
    const f = hoy();
    const ya = S.metricas.find(m=> m.alumnoId===alumnoId && m.clave==='peso' && m.fecha===f);
    if(ya){ if(+ya.valor !== +datos.peso){ ya.valor = +datos.peso; guardar('metricas'); } }
    else {
      S.metricas.push({ id:uid('m'), alumnoId:alumnoId, clave:'peso',
                        valor:+datos.peso, fecha:f, autorId: quienId||alumnoId });
      guardar('metricas');
    }
  }
}

function jyAbrirCanal(){
  if(JY_CANAL.activo) return;
  JY_CANAL.activo = true;
  JY_CANAL.sello = jySello();

  /* aviso inmediato cuando el otro perfil escribe en otra pestaña */
  try{
    window.addEventListener('storage', function(e){
      if(!e || !e.key || e.key.indexOf('jyntra.') !== 0) return;
      JY_CANAL.sello = jySello();
      jyRecargar();
    });
  }catch(e){}

  /* red de seguridad: revisa el sello por si el evento no llegó */
  setInterval(function(){
    const s = jySello();
    if(s !== JY_CANAL.sello){ JY_CANAL.sello = s; jyRecargar(); }
    else if(jyRepintePendiente) jyRecargar();
    if(JY_CANAL.api) jyTraer();
  }, JY_CANAL.latido);

  if(JY_CANAL.api) jyTraer();
}

/* ---------------------------------------------------------------
   §3c · LLAVES DEL ALUMNO
   Qué se abre y qué queda cerrado según con quién esté conectado.
   Sin vínculo activo el alumno usa la versión libre.
   --------------------------------------------------------------- */
function profesionalesPorRol(alumnoId, rol){
  return S.vinculos.filter(v=> v.alumnoId===alumnoId && v.profesionalId && v.estado==='activo')
    .map(v=> S.usuarios.find(u=> u.id===v.profesionalId))
    .filter(u=> u && u.rol===rol);
}
function profesorDe(alumnoId){ return profesionalesPorRol(alumnoId,'profesor')[0] || null; }
function nutricionistaDe(alumnoId){ return profesionalesPorRol(alumnoId,'nutricionista')[0] || null; }

function llaves(alumnoId){
  const pro = profesorDe(alumnoId);
  const nut = nutricionistaDe(alumnoId);
  return {
    profesor      : pro,
    nutricionista : nut,
    conectado     : !!pro || !!nut,
    /* pestaña «Mi evaluación» */
    habitos       : !!pro || !!nut,   // 2º módulo de la anamnesis
    atleta        : !!pro,            // perfil del atleta y fuerza 1RM (sólo lectura)
    /* pestaña «Mi planificación» */
    superserie    : !!pro,            // herramienta de súper series
    planRecibido  : !!pro,            // rutina cargada por el profesor
    /* pestaña «Mis clases» */
    horarioDoble  : !!pro || !!nut    // edición a dos manos del horario
  };
}


/* ---------------------------------------------------------------
   §4 · PILAR 4 — CANAL DE CONEXIÓN (el puente de datos)
   Sin vínculo activo no se comparte una sola fila.
   --------------------------------------------------------------- */
/* Un vínculo por pareja: su id es alumnoId_profesionalId. Así las reglas
   de la nube lo encuentran directo, y pedir de nuevo tras un rechazo
   reutiliza el mismo documento en vez de duplicarlo. */
function ponerVinculo(v){
  v.id = v.alumnoId + '_' + v.profesionalId;
  S.vinculos = (S.vinculos || []).filter(function(x){ return x.id !== v.id; });
  S.vinculos.push(v);
  return v;
}
function vinculoDe(alumnoId, proId){
  return S.vinculos.find(v=> v.alumnoId===alumnoId && v.profesionalId===proId);
}
function vinculado(alumnoId, proId){
  const v = vinculoDe(alumnoId, proId); return !!v && v.estado==='activo';
}
function alumnosDe(proId){
  return S.vinculos.filter(v=> v.profesionalId===proId && v.estado==='activo')
                   .map(v=> usuario(v.alumnoId)).filter(Boolean);
}
function profesionalesDe(alumnoId){
  return S.vinculos.filter(v=> v.alumnoId===alumnoId && v.estado==='activo')
                   .map(v=> usuario(v.profesionalId)).filter(Boolean);
}
/* cómo llama el alumno a su gente: «Mi coach», «Mi nutricionista»
   o «Mi equipo multidisciplinario» si tiene a más de una especialidad */
function nombreEquipo(u, tu){
  const pros = u ? profesionalesDe(u.id) : [];
  const nP = pros.filter(p=>p.rol==='profesor').length, nN = pros.filter(p=>p.rol==='nutricionista').length;
  let t;
  if(nP && nN)       t = 'equipo multidisciplinario';
  else if(nP === 1)  t = 'coach';
  else if(nP > 1)    t = 'coaches';
  else if(nN === 1)  t = 'nutricionista';
  else if(nN > 1)    t = 'nutricionistas';
  else               t = 'equipo multidisciplinario';
  const plural = /es$|as$/.test(t) && t !== 'equipo multidisciplinario';
  return (tu ? (plural?'Tus ':'Tu ') : (plural?'Mis ':'Mi ')) + t;
}
function usuario(id){ return S.usuarios.find(u=>u.id===id); }
function sesion(){ return S.sesion ? usuario(S.sesion) : null; }

/* portero de permisos: rol + plan del profesional */
function puede(permiso, u){
  u = u || sesion(); if(!u) return false;
  if(u.rol==='administrador') return true;
  if(u.rol==='alumno') return true;                   // el alumno consume, no compra módulos
  const p = PLANES[u.plan||'base'];
  if(!p) return false;
  if(u.suscripcion && u.suscripcion.estado==='vencida') return p.id==='base';
  return p.permisos.includes(permiso);
}
function cupoAlumnos(u){
  u = u || sesion();
  const p = PLANES[u.plan||'base'];
  return { usados: alumnosDe(u.id).length,
           tope: Math.min(p.maxAlumnos, TOPE_CONEXIONES_PRO) };
}

/* ---------------------------------------------------------------
   §4b · TOPES DE CONEXIÓN
   Una cuenta de alumno trabaja con un profesor y con un
   nutricionista: una conexión por especialidad, no más. Del otro
   lado, un profesional atiende hasta 20 personas; es un tope de la
   plataforma y se aplica además del que fije su plan.

   Cuentan tanto los vínculos activos como las solicitudes en
   espera: una solicitud pendiente ya ocupa el lugar.
   --------------------------------------------------------------- */
const TOPE_POR_ESPECIALIDAD = 1;
const TOPE_CONEXIONES_PRO   = 20;
const ESTADOS_VIVOS = ['activo','pendiente'];

function vinculosVivos(filtro, ignorarId){
  return S.vinculos.filter(v=> ESTADOS_VIVOS.indexOf(v.estado) >= 0
                            && v.id !== ignorarId && filtro(v));
}
function conexionesPorEspecialidad(alumnoId, rol, ignorarId){
  return vinculosVivos(v=>{
    if(v.alumnoId !== alumnoId) return false;
    const p = usuario(v.profesionalId);
    return !!p && p.rol === rol;
  }, ignorarId);
}
function cupoEspecialidad(alumnoId, rol, ignorarId){
  return { usados: conexionesPorEspecialidad(alumnoId, rol, ignorarId).length,
           tope  : TOPE_POR_ESPECIALIDAD };
}
function cupoVivoPro(proId, ignorarId){
  return { usados: vinculosVivos(v=> v.profesionalId===proId, ignorarId).length,
           tope  : TOPE_CONEXIONES_PRO };
}

/* Devuelve null si la conexión puede abrirse; si no, el motivo
   escrito para que la persona entienda qué hacer. */
function porQueNoConectar(alumnoId, proId, ignorarId){
  const p = usuario(proId);
  if(!p) return 'Ese perfil ya no est\u00e1 disponible.';

  const c = cupoEspecialidad(alumnoId, p.rol, ignorarId);
  if(c.usados >= c.tope){
    const otro = conexionesPorEspecialidad(alumnoId, p.rol, ignorarId)[0];
    const q = otro ? usuario(otro.profesionalId) : null;
    return 'Esa cuenta ya trabaja con '
         + (p.rol==='profesor' ? 'un profesor' : 'un nutricionista')
         + (q ? ' (' + q.nombre + ')' : '')
         + '. Hay que eliminar esa conexi\u00f3n antes de abrir otra.';
  }

  const cp = cupoVivoPro(proId, ignorarId);
  if(cp.usados >= cp.tope){
    return p.nombre.split(' ')[0] + ' lleg\u00f3 a las ' + cp.tope
         + ' conexiones que permite la plataforma.';
  }
  return null;
}

/* ---------------------------------------------------------------
   §4c · BAJA DEL VÍNCULO
   Cualquiera de los dos lados puede cortarlo. Se pregunta con el
   diálogo propio de la app, se explica qué deja de compartirse y
   nada de lo ya guardado se borra.
   --------------------------------------------------------------- */
async function eliminarVinculo(vinculoId, quienId){
  const x = S.vinculos.find(y=> y.id === vinculoId);
  if(!x) return false;

  const pro = usuario(x.profesionalId) || {nombre:'el profesional'};
  const al  = usuario(x.alumnoId)      || {nombre:'la persona'};
  const otro = (quienId === x.alumnoId) ? pro : al;
  const nombre = (otro.nombre || '').split(' ')[0];

  const ok = await preguntar('Eliminar la conexi\u00f3n con ' + otro.nombre,
      '<p class="sub" style="margin:0">Se corta el paso de datos entre las dos cuentas: '
    + esc(nombre) + ' deja de ver esos registros y esta cuenta deja de ver lo que '
    + esc(nombre) + ' public\u00f3.</p>'
    + '<p class="hint" style="margin:10px 0 0">Nada de lo ya guardado se borra, '
    + 'y pueden volver a conectarse cuando quieran.</p>',
      {ok:'Eliminar conexi\u00f3n', cancelar:'Mantener', peligro:true});
  if(!ok) return false;

  S.vinculos = S.vinculos.filter(y=> y.id !== vinculoId);
  guardar('vinculos');
  bitacora('vinculo', 'Elimin\u00f3 la conexi\u00f3n con ' + otro.nombre, quienId);
  toast('Conexi\u00f3n eliminada', 'warn');
  pintar();
  return true;
}

/* Un solo oyente para todos los botones de baja, los pinte quien
   los pinte: así la pieza funciona igual en el buscador, en la
   lista de pacientes y en cualquier pantalla que se sume después. */
document.addEventListener('click', function(e){
  const b = e.target && e.target.closest && e.target.closest('[data-desvincular]');
  if(!b) return;
  e.preventDefault();
  const yo = sesion();
  if(yo) eliminarVinculo(b.dataset.desvincular, yo.id);
});

/* ---------------------------------------------------------------
   §5 · PUENTE DE DATOS PARA LAS HERRAMIENTAS
   Toda herramienta lee y escribe por aquí. Un solo formato de registro:
   { id, modulo, tipo, autorId, sujetoId, creado, visible, datos }
   --------------------------------------------------------------- */
const Datos = {
  guardar(reg){
    const r = Object.assign({ id:uid('reg'), creado:new Date().toISOString(), visible:true, datos:{} }, reg);
    const i = S.registros.findIndex(x=>x.id===r.id);
    if(i>=0) S.registros[i] = r; else S.registros.push(r);
    guardar('registros'); bitacora('registro', r.modulo+' · '+(r.tipo||''), r.autorId);
    return r;
  },
  listar(filtro){
    filtro = filtro||{};
    return S.registros.filter(r=>{
      if(filtro.modulo && r.modulo!==filtro.modulo) return false;
      if(filtro.tipo && r.tipo!==filtro.tipo) return false;
      if(filtro.sujetoId && r.sujetoId!==filtro.sujetoId) return false;
      if(filtro.autorId && r.autorId!==filtro.autorId) return false;
      return true;
    }).sort((a,b)=> b.creado.localeCompare(a.creado));
  },
  ultimo(filtro){ return this.listar(filtro)[0] || null; },
  borrar(id){ S.registros = S.registros.filter(r=>r.id!==id); guardar('registros'); },
  /* lectura del alumno: sólo lo que su profesional le publicó */
  paraAlumno(alumnoId, modulo){
    return this.listar({sujetoId:alumnoId, modulo}).filter(r=> r.visible && vinculado(alumnoId, r.autorId));
  }
};

function bitacora(tipo, detalle, quien){
  S.bitacora.unshift({ id:uid('log'), tipo, detalle, quien: quien||S.sesion, cuando:new Date().toISOString() });
  S.bitacora = S.bitacora.slice(0,300); guardar('bitacora');
}

const MODULOS = {};                                    // ranura -> definición
const MONTADOS = new WeakMap();                        // caja -> {mod, ctx}

const JYNTRA = window.JYNTRA = {
  version:'1.0',
  ranuras: RANURAS,
  registrar(def){
    if(!def || !def.ranura) { console.warn('[JYNTRA] falta la ranura'); return; }
    if(!RANURAS[def.ranura]) console.warn('[JYNTRA] ranura desconocida: '+def.ranura+'. Ranuras válidas: '+Object.keys(RANURAS).join(', '));
    MODULOS[def.ranura] = def;
    if(document.readyState!=='loading' && typeof pintar==='function') pintar();
    return def;
  },
  registrarArchivo(def){
    return JYNTRA.registrar(Object.assign({}, def, {
      archivo:true,
      montar(caja, ctx){
        const f = document.createElement('iframe');
        f.src = def.src; f.title = def.nombre||def.id; f.loading='lazy';
        f.setAttribute('allow','camera; microphone; clipboard-write');
        if(def.alto) f.style.minHeight = def.alto;
        caja.appendChild(f);
        /* puente con la herramienta: window.parent.postMessage({jyntra:'guardar', ...}) */
        const oir = (e)=>{
          if(!e.data || e.data.jyntra!==true) return;
          if(e.source!==f.contentWindow) return;
          const m = e.data;
          if(m.accion==='guardar')  ctx.guardar(m.registro||{});
          if(m.accion==='metrica')  ctx.registrarMetrica(m.metrica||{});
          if(m.accion==='listo')    f.contentWindow.postMessage({jyntra:true, accion:'contexto', contexto: ctx.serializar()}, '*');
          if(m.accion==='alto' && m.px) f.style.minHeight = m.px+'px';
        };
        window.addEventListener('message', oir);
        f.addEventListener('load', ()=>{ try{ f.contentWindow.postMessage({jyntra:true, accion:'contexto', contexto: ctx.serializar()}, '*'); }catch(e){} });
        return ()=> window.removeEventListener('message', oir);
      }
    }));
  },
  quitar(ranura){ delete MODULOS[ranura]; if(typeof pintar==='function') pintar(); },
  listar(){ return Object.keys(RANURAS).map(r=> ({ranura:r, info:RANURAS[r], modulo:MODULOS[r]||null})); },
  /* acceso controlado a los datos, por si una herramienta lo necesita fuera del ctx */
  datos: Datos,
  db: { usuario, alumnosDe, profesionalesDe, vinculado, puede,
        ejercicios:()=>S.ejercicios, metricas:()=>S.metricas, sesion },
  toast, preguntar
};

/* contexto que recibe cada herramienta al montarse */
function contextoDe(ranura, extra){
  const u = sesion(); const info = RANURAS[ranura]||{};
  const ctx = Object.assign({
    ranura, usuario:u, rol:u&&u.rol,
    marca:{ nombre:'JYNTRA', dorado:'#DD2C37', negro:'#0D0D0D', hueso:'#EEF1F3' },
    alumno:null,
    /* transversal: alumnos/pacientes vinculados al profesional (pilar 4), listos para
       que cualquier herramienta montada (p.ej. la Agenda) los use sin duplicar altas */
    alumnos: (u && esProfesional(u.rol)) ? alumnosDe(u.id) : [],
    agendaPropia: ()=> S.agenda.filter(b=> b.profesionalId===(u&&u.id)),
    historial(modulo){ return Datos.listar({modulo, sujetoId: ctx.alumno? ctx.alumno.id : (u&&u.id)}); },
    ultimo(modulo){ return Datos.ultimo({modulo, sujetoId: ctx.alumno? ctx.alumno.id : (u&&u.id)}); },
    guardar(reg){
      const sujeto = reg.sujetoId || (ctx.alumno&&ctx.alumno.id) || (u&&u.id);
      if(u && ctx.alumno && esProfesional(u.rol) && !vinculado(ctx.alumno.id, u.id)){
        toast('No hay vínculo activo con ese alumno. No se guardó nada.','bad'); return null;
      }
      const r = Datos.guardar(Object.assign({ autorId:u&&u.id, sujetoId:sujeto }, reg));
      toast('Registro guardado','ok'); pintar(); return r;
    },
    metricas(id){ return S.metricas.filter(m=> m.alumnoId===(id|| (ctx.alumno&&ctx.alumno.id) || (u&&u.id))); },
    registrarMetrica(m){ return registrarMetrica(Object.assign({alumnoId:(u&&u.id)}, m)); },
    guardarAgenda(bloques){ S.agenda = bloques; guardar('agenda'); pintar(); },
    ejercicios: ()=> S.ejercicios,
    guardarEjercicio(e){ return guardarEjercicio(e); },
    refrescar: ()=> pintar(),
    aviso: toast,
    serializar(){
      return { ranura, usuario: u&&{id:u.id,nombre:u.nombre,rol:u.rol,plan:u.plan},
               alumno: ctx.alumno&&{id:ctx.alumno.id,nombre:ctx.alumno.nombre,email:ctx.alumno.email,nacimiento:ctx.alumno.nacimiento,sexo:ctx.alumno.sexo},
               alumnos: (u && esProfesional(u.rol)) ? alumnosDe(u.id).map(a=>({id:a.id,nombre:a.nombre,email:a.email,telefono:a.telefono})) : [],
               marca: ctx.marca, historial: ctx.historial(info.modulo||''), permisos: PLANES[(u&&u.plan)||'base'].permisos };
    }
  }, extra||{});
  return ctx;
}

/* ---------------------------------------------------------------
   §7 · PILAR 7 — métricas diarias del alumno
   --------------------------------------------------------------- */
const METRICAS = {
  peso:      { nombre:'Peso corporal', unidad:'kg',   tipo:'num',  grupo:'cuerpo' },
  sueno:     { nombre:'Horas de sueño', unidad:'h',   tipo:'num',  grupo:'recuperación' },
  animo:     { nombre:'Ánimo',          unidad:'1-5', tipo:'esc',  grupo:'recuperación' },
  dolor:     { nombre:'Molestias',      unidad:'1-5', tipo:'esc',  grupo:'recuperación' },
  rpe:       { nombre:'Esfuerzo de la sesión (RPE)', unidad:'1-10', tipo:'esc10', grupo:'carga' },
  pasos:     { nombre:'Pasos',          unidad:'pasos',tipo:'num', grupo:'actividad' },
  agua:      { nombre:'Agua',           unidad:'L',   tipo:'num',  grupo:'nutrición' },
  adherencia:{ nombre:'Adherencia a la pauta', unidad:'%', tipo:'num', grupo:'nutrición' }
};
function registrarMetrica(m){
  const r = Object.assign({ id:uid('met'), fecha:hoy(), creado:new Date().toISOString() }, m);
  const i = S.metricas.findIndex(x=> x.alumnoId===r.alumnoId && x.clave===r.clave && x.fecha===r.fecha);

function serieMetrica(alumnoId, clave, dias){
  dias = dias||30;

  return S.metricas.filter(m=>m.alumnoId===alumnoId && m.clave===clave && m.fecha>=desde)

}

  const x = Object.assign({ id:uid('ej'), creado:new Date().toISOString() }, e);
  const i = S.ejercicios.findIndex(a=>a.id===x.id);
  if(i>=0) S.ejercicios[i]=x; else S.ejercicios.push(x);
  guardar('ejercicios'); return x;
}

function svgLogo(L, alto, color, extra){
  var p = L.vb.split(' '); var ancho = Math.round(alto * (+p[2]) / (+p[3]));
  return '<svg width="'+ancho+'" height="'+alto+'" viewBox="'+L.vb+'" aria-hidden="true"'+(extra||'')+'>'
    + '<path fill-rule="evenodd" fill="'+(color||'#FFFFFF')+'" d="'+L.d+'"/></svg>';
}
function logo(alto){ return svgLogo(LOGO_SIMBOLO, alto||30); }
function logoCompleto(alto){ return svgLogo(LOGO_TODO, alto||120, '#FFFFFF', ' role="img" aria-label="JYNTRA"'); }
/* ---------- tema día / noche ---------- */
function temaActual(){ return document.documentElement.getAttribute('data-tema') === 'claro' ? 'claro' : 'oscuro'; }
function etiquetaTema(b){
  var claro = temaActual() === 'claro';
  b.innerHTML = '<span class="ti" aria-hidden="true">' + (claro ? '☾' : '☀') + '</span><span class="tt">' + (claro ? 'Modo noche' : 'Modo día') + '</span>';
  b.setAttribute('aria-label', claro ? 'Cambiar a modo noche' : 'Cambiar a modo día');
  b.title = claro ? 'Cambiar a modo noche' : 'Cambiar a modo día';
}
function ponerTema(t){
  t = (t === 'claro') ? 'claro' : 'oscuro';
  document.documentElement.setAttribute('data-tema', t);
  try{ localStorage.setItem('jyntra.__tema', JSON.stringify(t)); }catch(e){}
  var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', t === 'claro' ? '#F1F3F6' : '#171717');
  Array.prototype.forEach.call(document.querySelectorAll('[data-tema-btn]'), etiquetaTema);
  Array.prototype.forEach.call(document.querySelectorAll('iframe'), function(f){ try{ f.contentWindow.postMessage({jyTema:t}, '*'); }catch(e){} });
}
function botonTema(extra){
  var claro = temaActual() === 'claro';
  return '<button type="button" class="btn sm ghost tema-btn ' + (extra||'') + '" data-tema-btn="1" aria-label="' + (claro ? 'Cambiar a modo noche' : 'Cambiar a modo día') + '" title="' + (claro ? 'Cambiar a modo noche' : 'Cambiar a modo día') + '">'
    + '<span class="ti" aria-hidden="true">' + (claro ? '☾' : '☀') + '</span><span class="tt">' + (claro ? 'Modo noche' : 'Modo día') + '</span></button>';
}
if(!window.__jyTemaLigado){
  window.__jyTemaLigado = true;
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest ? e.target.closest('[data-tema-btn]') : null;
    if(b){ e.preventDefault(); ponerTema(temaActual() === 'claro' ? 'oscuro' : 'claro'); }
  });
  try{ ponerTema(temaActual()); }catch(e){}
}

function ligarAcceso(){
  $$('[data-modo]').forEach(b=> b.onclick = ()=>{ modoAcceso=b.dataset.modo; pintar(); });
  $$('[data-demo]').forEach(b=> b.onclick = ()=>{ entrar(b.dataset.demo,'jyntra'); });
  const fe = $('#f-entrar');
  if(fe) fe.onsubmit = (e)=>{ e.preventDefault(); entrar(fe.email.value.trim().toLowerCase(), fe.clave.value); };
  const fc = $('#f-crear');
  if(fc) fc.onsubmit = (e)=>{
    e.preventDefault();
    const email = fc.email.value.trim().toLowerCase();
    const clave = fc.clave.value;
    const rol = fc.rol.value;
    const u = { nombre:fc.nombre.value.trim(), email, rol,
                telefono:fc.telefono.value.trim(), nacimiento:fc.nacimiento.value, creado:new Date().toISOString() };
    if(esProfesional(rol)){ u.plan='base'; u.publico=false; u.especialidades=[]; u.planesServicio=[];
      u.suscripcion={estado:'activa', desde:new Date().toISOString(), renueva:new Date(Date.now()+30*864e5).toISOString()}; }
    const terminar = (id)=>{
      u.id = id;
      S.usuarios.push(u); guardar('usuarios');
      bitacora('alta','Cuenta nueva: '+u.nombre+' ('+rol+')', u.id);
      S.sesion = u.id; guardar('sesion');
      toast('Cuenta creada. Bienvenido a JYNTRA.','ok'); ruta('inicio');
      return u;
    };
    /* con la nube activa, la cuenta (y su contraseña) la guarda Firebase */
    if(window.__JY_NUBE_CREAR) return window.__JY_NUBE_CREAR(email, clave).then(terminar);
    if(S.usuarios.some(x=>x.email===email)) return toast('Ese correo ya tiene una cuenta.','bad');
    u.clave = clave;
    return terminar(uid('u'));
  };
}
function entrar(email, clave){
  const u = S.usuarios.find(x=> x.email===email && x.clave===clave);
  if(!u) return toast('Correo o contraseña incorrectos.','bad');
  S.sesion = u.id; guardar('sesion'); bitacora('acceso','Entró a la plataforma', u.id);
  ruta('inicio'); toast('Hola, '+u.nombre.split(' ')[0]+'.','ok');
}
function salir(){ bitacora('acceso','Cerró sesión'); S.sesion=null; guardar('sesion'); location.hash=''; pintar(); }

/* toda tabla ancha se desplaza dentro de su caja (en celular no empuja la pantalla) */
(function(){
  function envolver(raiz){
    (raiz.querySelectorAll ? raiz.querySelectorAll('table.tbl') : []).forEach(function(t){
      var pa = t.parentElement;
      if(!pa || pa.classList.contains('tbl-scroll')) return;
      var w = document.createElement('div'); w.className = 'tbl-scroll';
      pa.insertBefore(w, t); w.appendChild(t);
    });
  }
  function iniciar(){
    envolver(document);
    new MutationObserver(function(ms){
      ms.forEach(function(m){ m.addedNodes.forEach(function(n){ if(n.nodeType === 1){ if(n.matches && n.matches('table.tbl')) envolver(n.parentElement||document); else envolver(n); } }); });
    }).observe(document.body, {childList:true, subtree:true});
  }
  if(document.body) iniciar(); else document.addEventListener('DOMContentLoaded', iniciar);
})();

/* la placa de montaje: así se ve un hueco vacío y así se ve ocupado */
function ranura(ranuraId, opciones){
  opciones = opciones||{};
  const info = RANURAS[ranuraId] || {nombre:ranuraId};
  const mod  = MODULOS[ranuraId];
  const u    = sesion();
  const bloqueado = info.permiso && !puede(info.permiso, u);
  const id = 'slot_'+ranuraId.replace(/\./g,'_');
  /* identificadores, pilares y contratos de montaje son cosas de desarrollo:
     sólo los ve el administrador (perfil desarrollador) */
  const esDev = !!(u && u.rol === 'administrador');

  let cuerpo;
  if(bloqueado){
    cuerpo = '<div class="slot-body"><div class="locked">'
      + '<div style="font-size:20px;color:var(--warn)">◆</div><div><div class="h3">'+esc(info.nombre)+' no está en tu plan</div>'
      + '<div class="sub">Lo abre el plan '+esc(planQueIncluye(info.permiso))+'. Tus datos quedan guardados igual.</div>'
      + '<div style="margin-top:10px"><a class="btn sm gold" href="#/plan">Ver planes</a></div></div></div></div>';
  } else if(mod){
    cuerpo = '<div class="slot-body" id="'+id+'" data-montaje="'+esc(ranuraId)+'"></div>';
  } else if(!esDev){
    return '';   /* hueco sin herramienta: sólo lo ve el perfil desarrollador */
  } else {
    cuerpo = '<div class="slot-empty">'
      + '<div class="tt">'+esc(info.nombre)+'</div>'
      + '<div class="ds">'+esc(opciones.nota || info.nota || '')+'</div>'
      + '<div class="contract">'
      +   '<div class="cr"><span class="k">Ranura</span><span><code>'+esc(ranuraId)+'</code></span></div>'
      +   '<div class="cr"><span class="k">Recibe</span><span><code>'+esc(info.recibe||'ctx')+'</code></span></div>'
      +   '<div class="cr"><span class="k">Entrega</span><span><code>'+esc(info.entrega||'—')+'</code></span></div>'
      +   '<div class="cr"><span class="k">Montar</span><span><code>JYNTRA.registrar({ranura:\''+esc(ranuraId)+'\', montar(caja,ctx){…}})</code></span></div>'
      + '</div></div>';
  }
  if(!esDev){
    return '<section class="slot limpio '+(mod&&!bloqueado?'mounted':'')+'">'
     + (opciones.extra ? '<div class="slot-bar"><div class="grow"></div>'+opciones.extra+'</div>' : '')
     + cuerpo+'</section>';
  }
  return '<section class="slot '+(mod&&!bloqueado?'mounted':'')+'">'
   + '<div class="slot-bar">'
   +   '<span class="slot-id">'+esc(ranuraId)+'</span>'
   +   (info.pilar?'<span class="chip">Pilar '+info.pilar+'</span>':'')
   +   '<div class="grow"></div>'
   +   (opciones.extra||'')
   +   (bloqueado ? '<span class="chip warn"><span class="dot"></span>Fuera de plan</span>'
        : mod ? '<span class="chip ok"><span class="dot"></span>'+esc(mod.nombre||mod.id||'Montado')+'</span>'
        : '<span class="chip"><span class="dot"></span>Hueco libre</span>')
   + '</div>'+cuerpo+'</section>';
}
function planQueIncluye(permiso){
  const p = Object.values(PLANES).find(x=> x.permisos.includes(permiso));
  return p? p.nombre : 'Pro';

/* monta de verdad lo registrado, después de que el HTML esté en pantalla */
function montarRanuras(alumno){
  $$('[data-montaje]').forEach(caja=>{
    const ranuraId = caja.dataset.montaje;
    const mod = MODULOS[ranuraId]; if(!mod) return;
    const previo = MONTADOS.get(caja);
    if(previo && previo.limpiar) { try{ previo.limpiar(); }catch(e){} }
    caja.innerHTML = '';
    const ctx = contextoDe(ranuraId, { alumno: alumno||null });
    try{
      const limpiar = mod.montar ? mod.montar(caja, ctx) : null;
      MONTADOS.set(caja, {mod, ctx, limpiar: typeof limpiar==='function'?limpiar:null});
    }catch(e){
      console.error('[JYNTRA] falló el montaje de '+ranuraId, e);
      caja.innerHTML = '<div class="empty"><div class="h3">La herramienta no cargó</div><div class="mono" style="font-size:12px;color:var(--bad)">'+esc(e.message)+'</div></div>';
    }
  });
}

/* gráfico compacto — el mismo que ven profesional y alumno (pilar 7) */
function grafico(puntos, opciones){
  opciones = opciones||{};
  const W=560, H=opciones.alto||140, P=26;
  if(!puntos.length) return '<div class="empty" style="padding:18px">Sin datos todavía</div>';
  const vs = puntos.map(p=>p.valor);
  let min = Math.min.apply(null,vs), max = Math.max.apply(null,vs);
  if(min===max){ min-=1; max+=1; }
  const pad = (max-min)*0.12; min-=pad; max+=pad;
  const x = (i)=> P + i*(W-P*2)/Math.max(1,puntos.length-1);
  const y = (v)=> H-P - (v-min)/(max-min)*(H-P*1.5);
  const d = puntos.map((p,i)=> (i?'L':'M')+x(i).toFixed(1)+' '+y(p.valor).toFixed(1)).join(' ');
  const area = d+' L'+x(puntos.length-1).toFixed(1)+' '+(H-P)+' L'+x(0).toFixed(1)+' '+(H-P)+' Z';
  const col = opciones.color||'#DD2C37';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="'+esc(opciones.titulo||'serie')+'">'
   + '<defs><linearGradient id="g'+opciones.id+'" x1="0" x2="0" y1="0" y2="1">'
   +   '<stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
   + [0,.5,1].map(f=>'<line x1="'+P+'" x2="'+(W-P)+'" y1="'+(H-P-f*(H-P*1.5)).toFixed(1)+'" y2="'+(H-P-f*(H-P*1.5)).toFixed(1)+'" stroke="#262626" stroke-width="1"/>').join('')
   + '<path d="'+area+'" fill="url(#g'+opciones.id+')"/>'
   + '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
   + '<circle cx="'+x(puntos.length-1).toFixed(1)+'" cy="'+y(vs[vs.length-1]).toFixed(1)+'" r="3.5" fill="'+col+'"/>'
   + '<text x="'+P+'" y="14" fill="#888888" font-family="IBM Plex Mono,monospace" font-size="10">'+esc(opciones.titulo||'')+'</text>'
   + '<text x="'+(W-P)+'" y="14" text-anchor="end" fill="'+col+'" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="15">'
   +   esc(vs[vs.length-1])+' '+esc(opciones.unidad||'')+'</text>'
   + '<text x="'+P+'" y="'+(H-8)+'" fill="#656565" font-family="IBM Plex Mono,monospace" font-size="9">'+esc(puntos[0].fecha)+'</text>'
   + '<text x="'+(W-P)+'" y="'+(H-8)+'" text-anchor="end" fill="#656565" font-family="IBM Plex Mono,monospace" font-size="9">'+esc(puntos[puntos.length-1].fecha)+'</text>'
   + '</svg>';
}

async function responderVinculo(id, si, u){
  const x = S.vinculos.find(y=>y.id===id); if(!x) return;
  if(si){
    const c = cupoAlumnos(u);
    if(c.usados >= c.tope){
      const porPlan = c.tope < TOPE_CONEXIONES_PRO;
      toast(porPlan
        ? 'Tu plan '+PLANES[u.plan].nombre+' llega hasta '+c.tope+' alumnos. Sube de plan para aceptar.'
        : 'Llegaste a las '+TOPE_CONEXIONES_PRO+' conexiones que permite la plataforma. Elimina alguna para aceptar esta.','warn');
      return porPlan ? ruta('plan') : ruta('alumnos');
    }
    /* del otro lado: esa persona no puede tener dos de la misma especialidad */
    const vetoAl = porQueNoConectar(x.alumnoId, u.id, x.id);
    if(vetoAl) return toast(vetoAl, 'warn');
    const r = await preguntar('Aceptar a '+(usuario(x.alumnoId)||{}).nombre,
      '<form class="stack"><div class="field"><label>Plan que le asignas</label><input class="inp" name="plan" value="8 sesiones / mes"></div>'
      + '<div class="field"><label>Servicio</label><input class="inp" name="servicio" value="'+esc(x.servicio)+'"></div></form>',{ok:'Aceptar y vincular'});
    if(!r) return;
    x.estado='activo'; x.plan=r.plan; x.servicio=r.servicio; x.desde=new Date().toISOString();
    toast('Vínculo activo. Ya puedes evaluar y planificar.','ok');
  } else { x.estado='rechazado'; toast('Solicitud rechazada','warn'); }
  guardar('vinculos'); bitacora('vinculo',(si?'Aceptó':'Rechazó')+' a '+(usuario(x.alumnoId)||{}).nombre, u.id); pintar();
}

const DIA_ORDEN = [1,2,3,4,5,6,0];          // la semana parte el lunes
const DIA_CORTO = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

function bloqueSano(b){
  return Object.assign({ horaFin:'', servicio:'', lugar:'', nota:'', cupos:1, alumnoId:'' }, b);
}
function sumaHora(hora, minutos){
  const p = String(hora||'').split(':');
  if(p.length < 2) return '';
  let t = (+p[0])*60 + (+p[1]) + minutos;
  t = Math.max(0, Math.min(23*60+59, t));
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function agendaDe(proId){
  return S.agenda.filter(b=> b.profesionalId===proId).map(bloqueSano)
    .sort((a,b)=> DIA_ORDEN.indexOf(a.dia)-DIA_ORDEN.indexOf(b.dia) || String(a.hora).localeCompare(String(b.hora)));
}
function bloqueDe(id){ return S.agenda.find(b=> b.id===id); }

/* --- la grilla que resume todo lo cargado --- */
function grillaSemanal(proId){
  const bl = agendaDe(proId);
  const hoyDia = new Date().getDay();
  return '<div class="jy-week">' + DIA_ORDEN.map(d=>{
    const del = bl.filter(x=> x.dia===d);
    return '<div class="jy-day'+(d===hoyDia?' hoy':'')+'">'
     + '<div class="jy-day-h"><b>'+diasES[d]+'</b><span>'+(del.length||'')+'</span></div>'
     + (del.length ? del.map(x=>{
          const a = x.alumnoId ? usuario(x.alumnoId) : null;
          return '<div class="jy-slot'+(a?' asignado':'')+'"'+(a?' title="'+esc(a.nombre)+'"':'')+'>'
           + '<div class="hh">'+esc(x.hora||'--:--')+(x.horaFin? ' – '+esc(x.horaFin):'')+'</div>'
           + '<div class="nn">'+esc(a ? a.nombre : ((x.cupos>1? x.cupos+' cupos' : 'Cupo')+' libre'))+'</div>'
           + '<div class="ss">'+esc(x.servicio||'—')+(x.lugar? ' · '+esc(x.lugar):'')
           + (x.nota? '<br>'+esc(x.nota):'')+'</div></div>';
        }).join('')
      : '<div class="jy-vacio">libre</div>')
     + '</div>';
  }).join('') + '</div>';
}

/* --- calendario publicado, visto desde la ficha de la persona --- */
function bloqueCalendario(a, u){
  const bl = agendaDe(u.id).filter(b=> b.alumnoId===a.id);
  const pub = Datos.ultimo({sujetoId:a.id, modulo:'agenda', autorId:u.id});
  return '<div class="card pad0" style="margin-bottom:18px">'
   + '<div style="padding:14px 16px" class="row"><div class="h2" style="flex:1">Calendario semanal</div>'
   + (pub? '<span class="chip ok">publicado '+fecha(pub.creado)+'</span>' : '<span class="chip">sin publicar</span>')
   + '<a class="btn sm gold" href="#/agenda">Editar agenda</a></div>'
   + (bl.length
      ? '<table class="tbl"><thead><tr><th>Día</th><th>Horario</th><th>Servicio</th><th>Lugar</th><th>Nota</th></tr></thead><tbody>'
        + bl.map(b=>'<tr><td>'+diasES[b.dia]+'</td>'
           + '<td class="mono" style="font-size:12px">'+esc(b.hora)+(b.horaFin? ' – '+esc(b.horaFin):'')+'</td>'
           + '<td>'+esc(b.servicio||'—')+'</td><td>'+esc(b.lugar||'—')+'</td>'
           + '<td class="hint">'+esc(b.nota||'')+'</td></tr>').join('')
        + '</tbody></table>'
      : '<div class="empty" style="border:0;margin:0 16px 16px"><div class="h3">Sin horarios asignados</div>'
        + '<div>Asígnale días y horas desde la columna «Alumno» de tu agenda.</div></div>')
   + '</div>';
}

function publicarCalendarios(u){
  const asignados = agendaDe(u.id).filter(b=> b.alumnoId);
  const porPersona = {};
  asignados.forEach(b=>{ (porPersona[b.alumnoId] = porPersona[b.alumnoId] || []).push(b); });
  const ids = Object.keys(porPersona).filter(id=> vinculado(id, u.id));
  if(!ids.length) return toast('Todavía no hay horarios asignados a una persona vinculada.','warn');
  ids.forEach(id=>{
    Datos.listar({sujetoId:id, modulo:'agenda', autorId:u.id}).forEach(r=> Datos.borrar(r.id));
    Datos.guardar({
      modulo:'agenda', tipo:'Calendario semanal', autorId:u.id, sujetoId:id, visible:true,
      datos:{
        profesional: u.nombre, rol: u.rol, actualizado: new Date().toISOString(),
        bloques: porPersona[id].map(b=>({ dia:b.dia, diaNombre:diasES[b.dia], hora:b.hora,
          horaFin:b.horaFin, servicio:b.servicio, lugar:b.lugar, nota:b.nota }))
      }
    });
  });
  toast('Calendario publicado para '+ids.length+' persona'+(ids.length===1?'':'s'),'ok');
  pintar();
}
