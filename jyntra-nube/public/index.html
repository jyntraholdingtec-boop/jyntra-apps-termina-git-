    +   '<div class="field"><label>Duración / frecuencia</label><input class="inp" name="periodo" value="'+esc(existente?(existente.periodo||'mes'):'mes')+'" placeholder="Ej. mes, 4 clases/mes, 2 meses"></div>'
    + '</div>'
    + '<div class="field"><label>Qué incluye (un beneficio por línea)</label><textarea class="inp" name="caracteristicas" placeholder="Evaluación inicial'+String.fromCharCode(10)+'Rutina personalizada'+String.fromCharCode(10)+'Seguimiento por WhatsApp">'+esc(existente?(existente.caracteristicas||[]).join(String.fromCharCode(10)):'')+'</textarea></div>'
    + '<div class="field"><label>Etiqueta destacada (opcional)</label><input class="inp" name="badge" value="'+esc(existente?(existente.badge||''):'')+'" placeholder="Ej. Más elegido"></div>'
    + '<label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" name="destacado" '+(existente&&existente.destacado?'checked':'')+'> Destacar este plan con borde dorado</label>'
    + '<label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" name="visible" '+(!existente||existente.visible!==false?'checked':'')+'> Visible para los alumnos en el buscador</label>'
    + '</form>',
    {ok: existente? 'Guardar cambios' : 'Crear plan'});
  if(!r) return;
  if(!r.titulo || !r.titulo.trim()) return toast('El plan necesita un nombre.','bad');
  const datos = {
    id: existente? existente.id : uid('svcplan'),
    titulo: r.titulo.trim(),
    subtitulo: (r.subtitulo||'').trim(),
    precio: +r.precio || 0,
    periodo: (r.periodo||'').trim() || 'mes',
    caracteristicas: String(r.caracteristicas||'').split('\n').map(s=>s.trim()).filter(Boolean),
    badge: (r.badge||'').trim(),
    destacado: !!r.destacado,
    visible: !!r.visible
  };
  if(existente) Object.assign(existente, datos); else planes.push(datos);
  guardar('usuarios');
  bitacora('plan-servicio', (existente?'Actualizó':'Creó')+' el plan "'+datos.titulo+'"', u.id);
  toast(existente? 'Plan actualizado' : 'Plan creado', 'ok');
  pintar();
}

async function eliminarPlanServicio(u, planId){
  const planes = u.planesServicio||[];
  const plan = planes.find(p=>p.id===planId); if(!plan) return;
  if(!await preguntar('Eliminar plan','<p class="sub" style="margin:0">Se eliminará "'+esc(plan.titulo)+'" de tu ficha pública. Los alumnos que ya lo solicitaron mantienen su vínculo.</p>',{ok:'Eliminar',peligro:true})) return;
  u.planesServicio = planes.filter(p=>p.id!==planId);
  guardar('usuarios'); bitacora('plan-servicio','Eliminó el plan "'+plan.titulo+'"', u.id);
  toast('Plan eliminado','warn'); pintar();
}

function toggleVisiblePlanServicio(u, planId){
  const plan = (u.planesServicio||[]).find(p=>p.id===planId); if(!plan) return;
  plan.visible = plan.visible===false;

/* Modal público: lo que ve el ALUMNO al pulsar "Ver planes y precios"
   sobre la ficha de un profesional en el buscador. */
function verPlanesProfesional(proId){
  const p = usuario(proId); if(!p) return;
  const planes = (p.planesServicio||[]).filter(pl=>pl.visible!==false);
  const bg = document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" style="width:min(900px,94vw)">'
   + '<div class="modal-h"><div><div class="h2">Planes de '+esc(p.nombre)+'</div>'
   +   '<div class="sub" style="margin:2px 0 0">'+esc(p.titulo||ROLES[p.rol].nombre)+'</div></div>'
   +   '<div class="grow" style="flex:1"></div>'
   +   '<button class="btn sm ghost" id="b-cerrar-planes">Cerrar ✕</button></div>'
   + '<div class="modal-b">'
   +   (planes.length
        ? '<div class="grid g3">'+planes.map(pl=>planCardHTML(pl,false)).join('')+'</div>'
        : '<div class="empty" style="border:0"><div class="h3">Aún no publica sus tarifas</div><div>Puedes solicitar la conexión igual y coordinar el valor directamente con '+esc(p.nombre.split(' ')[0])+'.</div></div>')
   + '</div></div>';
  $('#modal-root').appendChild(bg);

    const plan = planes.find(pl=>pl.id===btn.dataset.solicitarPlan);
    bg.remove();
    solicitarVinculoConPlan(sesion(), proId, plan);
  });

/* Variante de solicitarVinculo() que precarga el mensaje con el plan elegido
   y deja registro del plan solicitado en el vínculo (pilar 4). */
async function solicitarVinculoConPlan(u, proId, plan){
  if(!u) return;
  const p = usuario(proId);
  const veto = porQueNoConectar(u.id, proId);
  if(veto) return toast(veto, 'warn');
  const previo = vinculoDe(u.id, proId);
  if(previo){ toast(previo.estado==='activo'? 'Ya estás conectado con '+p.nombre.split(' ')[0]+'.' : 'Ya tienes una solicitud enviada a '+p.nombre.split(' ')[0]+'.', 'warn'); return; }
  const mensajeDefault = plan? ('Me interesa el '+plan.titulo+' ('+money(plan.precio)+' / '+ (plan.periodo||'mes') +').') : '';
  const r = await preguntar('Solicitar '+(plan? plan.titulo : 'conexión')+' con '+p.nombre,
    '<form class="stack"><p class="sub" style="margin:0">Al aceptar, '+esc(p.nombre.split(' ')[0])
    +' podrá ver tus registros y publicarte evaluaciones y planes. Puedes cortar el vínculo cuando quieras.</p>'
    +'<div class="field"><label>Mensaje para '+esc(p.nombre.split(' ')[0])+'</label><textarea class="inp" name="mensaje" placeholder="Objetivo, disponibilidad, lesiones previas…">'+esc(mensajeDefault)+'</textarea></div></form>',
    {ok:'Enviar solicitud'});
  if(!r) return;
  ponerVinculo({ alumnoId:u.id, profesionalId:proId, estado:'pendiente',
    desde:new Date().toISOString(), servicio: p.rol==='profesor'?'Entrenamiento':'Nutrición',
    plan: plan? (plan.titulo+' — '+money(plan.precio)+' / '+(plan.periodo||'mes')) : 'Por definir',
    planServicioId: plan? plan.id : null, mensaje:(r.mensaje||'') });
  guardar('vinculos'); bitacora('vinculo', 'Solicitud a '+p.nombre+(plan? ' por '+plan.titulo : ''), u.id);
  toast('Solicitud enviada a '+p.nombre.split(' ')[0], 'ok'); pintar();
}

/* ---------------------------------------------------------------
   FOCO · lo único que las herramientas necesitan saber para armar
   su contexto. Se deja escrito en el mismo almacén que comparte
   toda la plataforma, justo antes de montar el marco; el preámbulo
   _puente.js lo lee de forma síncrona al arrancar la herramienta.
   --------------------------------------------------------------- */
function fijarFoco(ctx, extra){
  var u = sesion();
  var a = ctx && ctx.alumno;
  var f = Object.assign({
    usuarioId : u ? u.id : null,
    alumnoId  : a ? a.id : null,
    modo      : 'edicion',
    llaves    : {}
  }, extra || {});
  try{ DB.set('__foco', f); }catch(e){}
  return f;
}

/* Monta una herramienta que vive en su propio archivo. Entiende los
   dos protocolos que conviven: 'jyntra' (profesor) y 'jyEmbed'
   (alumno), más el canal propio de la cineantropometría. */
function montarArchivo(caja, ctx, opciones){
  opciones = opciones || {};
  /* Cada marco lleva SU foco en la dirección: con dos herramientas en la
     misma pantalla, el foco compartido de una pisaba al de la otra (la
     anamnesis en edición dejaba el 1RM del alumno editable). */
  var foco = fijarFoco(ctx, opciones.foco);

  var montadoEn = Date.now();
  var marco = document.createElement('iframe');
  marco.src   = opciones.src + (opciones.src.indexOf('?') < 0 ? '?' : '&')
              + 'jyfoco=' + encodeURIComponent(JSON.stringify(foco));
  marco.title = opciones.nombre || opciones.src;
  marco.setAttribute('allow','camera; microphone; clipboard-write');
  marco.style.minHeight = (opciones.alto || 900) + 'px';
  caja.appendChild(marco);

  /* barra de acciones: arriba el sello y el salto, abajo el guardado */
  if(opciones.barra) barraHerramienta(caja, ctx, opciones.barra);

  function responder(msg){
    try{ marco.contentWindow.postMessage(msg, '*'); }catch(e){}
  }

  var oir = function(e){
    var m = e.data;
    if(!m) return;
    /* El filtro de origen evita que otra pestaña nos hable. Algunos
       entornos no rellenan e.source, así que cuando falta se acepta
       el mensaje sólo si trae una de nuestras marcas: es tan estricto
       como antes para lo que viene de fuera, y no pierde lo nuestro. */
    if(e.source && e.source !== marco.contentWindow) return;
    if(!e.source && !(m.jyntra === true || m.jyEmbed === true ||
                      m.__jyNutri === true || m.__jyCine === true)) return;

    /* alto: lo mandan ambos protocolos */
    if((m.jyntra === true || m.jyEmbed === true) && m.accion === 'alto' && m.px){
      var px = Math.max(420, Math.min(9000, Math.round(m.px) + 16));
      if(Math.abs(parseInt(marco.style.minHeight,10) - px) > 24) marco.style.minHeight = px + 'px';
      return;
    }

    /* --- protocolo 'jyntra': herramientas del profesional --- */
    if(m.jyntra === true){
      if(m.accion === 'guardar' && opciones.foco && opciones.foco.modo === 'lectura'){
        toast('Esta ficha la completa tu profesional. Aquí sólo la consultas.','warn');
        return;
      }
      if(m.accion === 'guardar') guardarDesdeArchivo(m.registro || {}, ctx);
      if(m.accion === 'metrica' && ctx.registrarMetrica) ctx.registrarMetrica(m.metrica || {});
      if(m.accion === 'listo') abrirUnaVez();
      return;
    }

    /* --- canal propio de la anamnesis nutricional ---
       Es UNA herramienta con seis pasos y un estado por paciente, que
       mostramos en dos ranuras (anamnesis 0-2 · plan 3-5). Para que la
       segunda vea lo que se escribió en la primera, su estado vive en
       una clave propia y se le devuelve entero al montarla. */
    if(m.__jyNutri === true){
      if(m.accion === 'guardar' && m.estado){
        var sn = (ctx && ctx.alumno && ctx.alumno.id) || (sesion() && sesion().id);
        if(sn){
          try{ DB.set('__nutri_' + sn, m.estado); }catch(e){}
          var sel = caja.parentNode && caja.parentNode.querySelector('.jy-sello');
          if(sel) sel.textContent = 'Guardado ' + new Date().toLocaleTimeString('es-CL',
                   {hour:'2-digit', minute:'2-digit'});
        }
        return;   /* autoguardado silencioso: el registro lo hace el botón */
      }
      if(m.accion === 'publicar' || m.accion === 'crearPlan'){
        var r = guardarDesdeArchivo({
          modulo:'nutricion',
          tipo: m.accion === 'publicar' ? 'Pauta alimentaria publicada' : 'Anamnesis nutricional',
          visible: m.accion === 'publicar',
          datos: Object.assign({__nutri:m.estado || m.datos || null}, m.datos || {})
        }, ctx);
        responder({__jyNutri:true, accion:'pautaGuardada',
                   error:!r, mensaje: r ? 'Guardado en la ficha' : 'No se pudo guardar'});
      }
      return;
    }

    /* --- canal propio de la cineantropometría --- */
    if(m.__jyCine === true){
      if(m.accion === 'guardar'){
        /* Se guarda con la forma que el puente sabe reponer (__cine) y
           sin los gráficos en PNG: pesan cientos de KB y llenaban el
           almacén del navegador, que entonces dejaba de guardar. */
        guardarDesdeArchivo({modulo:'seguimiento', tipo:'Cineantropometría ISAK',
                             datos:{ __cine : sinImagenes(m.estado || m.datos || {}),
                                     resumen: sinImagenes(m.resumen || {}),
                                     seccion: m.seccion || null }}, ctx);
      }
      return;
    }

    /* --- protocolo 'jyEmbed': herramientas del alumno y anamnesis --- */
    if(m.jyEmbed === true){
      if(m.accion === 'listo'){
        if(opciones.alListo) opciones.alListo(responder);
        return;
      }
      /* Recién montada, la herramienta puede emitir un 'estado' con el
         formulario todavía vacío, antes de recibir la ficha guardada:
         ese estado no debe pisar lo que ya había. */
      if(m.accion === 'estado' && Date.now() - montadoEn < 2500 && estadoVacio(m.datos)){
        return;
      }
      /* La anamnesis emite 'estado' medio segundo después de cada cambio.
         Antes nadie lo escuchaba y el trabajo se perdía al cerrar. Ahora
         se guarda en borrador, sin toast, para no interrumpir al que
         escribe; el registro definitivo lo hace el botón Guardar. */
      if(m.accion === 'estado'){
        var su = (ctx && ctx.alumno && ctx.alumno.id) || (sesion() && sesion().id);
        if(su){
          try{ DB.set('__borrador_' + (opciones.clave || 'anamnesis') + '_' + su,
                      {datos:m.datos, fecha:new Date().toISOString()}); }catch(e){}
          var sello = caja.parentNode && caja.parentNode.querySelector('.jy-sello');
          if(sello) sello.textContent = 'Guardado ' + new Date().toLocaleTimeString('es-CL',
                     {hour:'2-digit', minute:'2-digit'});
        }
        return;
      }
      if(m.accion === 'guardarAnamnesis'){
        var sa = (ctx && ctx.alumno && ctx.alumno.id) || (sesion() && sesion().id);
        if(sa){ try{ DB.set('__borrador_anamnesis_' + sa, {datos:m.datos, fecha:new Date().toISOString()}); }catch(e){} }
        var ra = guardarDesdeArchivo({ modulo:'evaluacion', tipo:'Anamnesis deportiva',
                  datos: Object.assign({ __anam: m.datos || null }, m.resumen || {}) }, ctx);
        responder({ jyEmbed:true, accion:'anamnesisGuardada', error:!ra,
                    mensaje: ra ? 'Guardado en tu ficha' : 'No se pudo guardar' });
        return;
      }
      if(m.accion === 'guardarRutina'){
        /* Pulsar Guardar varias veces seguidas es normal cuando no se
           ve claro si tomó. Cada clic llegaba como un guardado nuevo y
           podía dejar rutinas paralelas. Se atiende el primero y se
           descartan los que lleguen en el segundo y medio siguiente:
           los datos son los mismos, así que no se pierde nada. */
        var ahora = Date.now();
        if(caja.__jyUltGuardado && ahora - caja.__jyUltGuardado < 1500){
          responder({ jyEmbed:true, accion:'rutinaGuardada', error:false,
                      mensaje:'Guardado' });
          return;
        }
        caja.__jyUltGuardado = ahora;
        /* Una rutina es un hilo, no dos papeles sueltos: cuando el
           alumno responde sobre la que le publicó su profesor, se
           actualiza ESE registro en vez de crear uno paralelo. Así
           el profesor ve sus notas y las respuestas en el mismo
           sitio, y el marcado de ejercicios queda donde toca. */
        var yo3 = sesion();
        var abierta = yo3 ? Datos.paraAlumno(yo3.id, 'planificacion')[0] : null;
        /* Si el alumno pulsa Guardar dos veces seguidas, el segundo
           clic llegaba antes de que el primero dejara su registro y
           se creaban dos rutinas paralelas. Se recuerda cuál se creó
           en este montaje para volver a escribir sobre ella. */
        if(!abierta && caja.__jyRutinaId){
          abierta = Datos.listar({modulo:'planificacion'})
                    .filter(function(r){ return r.id === caja.__jyRutinaId; })[0] || null;
        }
        var reg;
        if(abierta){
          /* Se reescribe por la API, no mutando el objeto en memoria:
             el canal que sincroniza entre perfiles recarga S desde
             disco cada pocos segundos y se llevaba por delante los
             cambios hechos a mano. Datos.guardar respeta el id, así
             que actualiza el mismo registro en vez de crear otro. */
          reg = Datos.guardar(Object.assign({}, abierta, {
            datos      : m.datos || {},
            tocado     : new Date().toISOString(),
            tocadoPor  : yo3.id
          }));
          caja.__jyRutinaId = reg && reg.id;
          toast('Guardado. Tu coach verá tus notas.','ok');
        } else {
          reg = guardarDesdeArchivo({
            modulo:'planificacion', tipo:'Mi planificación',
            datos: m.datos || {}
          }, ctx);
          if(reg) caja.__jyRutinaId = reg.id;
        }
        responder({ jyEmbed:true, accion:'rutinaGuardada',
                    error: !reg,
                    mensaje: reg ? 'Guardado en tu historial' : 'No se pudo guardar' });
      }
      if(m.accion === 'rutinaAbierta' && m.mensaje){
        toast(m.mensaje, m.error ? 'warn' : 'ok');
      }
      return;
    }
  };
  /* Cada montaje dejaba su oyente puesto: al repintar la pantalla se
     acumulaban y cada mensaje se atendía varias veces (de ahí los
     avisos repetidos). Se retira el del montaje anterior de esta
     misma caja antes de poner el nuevo. */
  if(caja.__jyOir) window.removeEventListener('message', caja.__jyOir);
  caja.__jyOir = oir;
  window.addEventListener('message', oir);

  /* cuando el marco termina de cargar, se le envía lo que corresponda */
  /* Enviar la rutina más de una vez la recarga dentro de la
     herramienta y borra lo que la persona llevaba escrito. El marco
     avisa por 'load' y por 'listo', así que se atiende sólo el
     primero de los dos. */
  var yaAbierto = false;
  function abrirUnaVez(){
    if(yaAbierto || !opciones.alAbrir) return;
    yaAbierto = true;
    opciones.alAbrir(responder);
  }
  marco.addEventListener('load', abrirUnaVez);

  return function(){ window.removeEventListener('message', oir); };
}

/* ¿El formulario vino vacío? (sin nombre, edad, peso ni talla) */
function estadoVacio(d){
  var v = (d && d.vals) || {};
  return !['f_nom','f_ed','f_pe','f_ta'].some(function(k){ return v[k] != null && String(v[k]).trim() !== ''; });
}

/* Quita imágenes incrustadas (data:...) de un objeto antes de guardarlo. */
function sinImagenes(o){
  if(o == null) return o;
  if(typeof o === 'string') return /^data:/.test(o) ? '' : o;
  if(Array.isArray(o)) return o.map(sinImagenes);
  if(typeof o === 'object'){
    var r = {}; Object.keys(o).forEach(function(k){ r[k] = sinImagenes(o[k]); }); return r;
  }
  return o;
}

/* Ficha de anamnesis deportiva de una persona: borrador compartido
   (lo escriben el alumno y su profesor) o el último guardado. */
function anamnesisDe(alumnoId){
  var b = null;
  try{ b = DB.get('__borrador_anamnesis_' + alumnoId, null); }catch(e){}
  if(b && b.datos) return b.datos;
  var l = Datos.listar({sujetoId:alumnoId, modulo:'evaluacion'})
            .filter(function(r){ return r.datos && r.datos.__anam; })
            .sort(function(x,y){ return String(y.tocado||y.creado).localeCompare(String(x.tocado||x.creado)); });
  return l[0] ? l[0].datos.__anam : null;
}
function montarAnamnesis(caja, alumno, esAlumno){
  return montarArchivo(caja, {alumno:alumno}, {
    src   : HER + (esAlumno ? 'anamnesis-alu.html' : 'anamnesis.html'),
    alto  : 1300,

    clave : 'anamnesis',
    /* módulo 2 (hábitos y perfil deportivo): se abre al conectar con un
       profesional, como en la v14. Sólo viajan los booleanos. */

    barra : esAlumno ? null : { clave:'anamnesis', modulo:'evaluacion', tipo:'Anamnesis deportiva',
              pie:'Se guarda en la ficha del alumno. Él ve y completa esta misma ficha.' },
    /* se envía al cargar el marco y otra vez cuando la herramienta
       avisa que está lista: lo que llegue primero ya repone la ficha */
    alAbrir: function(responder){
      var d = anamnesisDe(alumno.id);
      if(d) responder({ jyEmbed:true, accion:'cargar', datos:d });
      else {
        /* ficha nueva: nombre y edad salen de la cuenta */
        var v = { f_nom: alumno.nombre || '' };
        if(alumno.nacimiento){
          var ed = Math.floor((Date.now() - new Date(alumno.nacimiento).getTime()) / 31557600000);
          if(ed > 0 && ed < 120) v.f_ed = String(ed);
        }
        responder({ jyEmbed:true, accion:'cargar', datos:{ vals:v, chips:{} } });
      }
    },
    alListo: function(responder){
      var d = anamnesisDe(alumno.id);
      if(d) responder({ jyEmbed:true, accion:'cargar', datos:d });
    }
  });
}

/* Guarda sin repintar: el marco no se pierde a mitad de trabajo. */
function guardarDesdeArchivo(reg, ctx){
  var u = sesion(); if(!u) return null;
  var a = ctx && ctx.alumno;
  /* Guardar en la ficha de OTRA persona exige vínculo. Guardar en la
     propia, no: el alumno registrando sus marcas es el caso normal y
     nadie está vinculado consigo mismo. */
  var propio = !a || a.id === u.id;
  if(!propio && !vinculado(a.id, u.id)){
    toast('No hay vínculo activo con esa persona. No se guardó nada.','bad');
    return null;
  }
  var r = Datos.guardar(Object.assign({ autorId:u.id, sujetoId:(a && a.id) || u.id }, reg));
  toast(propio ? 'Guardado' : ('Guardado en la ficha de ' + String(a.nombre).split(' ')[0]), 'ok');
  return r;
}

/* ---------------------------------------------------------------
   TARJETA PLEGABLE — para que una herramienta alta no ocupe toda
   la pantalla mientras se trabaja en otra cosa.
   --------------------------------------------------------------- */
var PLEGADO = {};
function plegable(clave, titulo, bajada, cuerpo, extra){
  var ab = !!PLEGADO[clave];
  return '<section class="fold'+(ab?' abierto':'')+'" id="fold-'+clave+'">'
   + '<button type="button" class="fold-h" data-fold="'+clave+'" aria-expanded="'+ab+'">'
   +   '<span class="fold-ic">▸</span>'
   +   '<span class="fold-t">'+esc(titulo)+'</span>'
   +   '<span class="fold-s">'+esc(bajada||'')+'</span>'
   +   (extra||'')
   +   '<span class="chip">'+(ab?'ocultar':'desplegar')+'</span>'
   + '</button>'
   + '<div class="fold-b" id="foldb-'+clave+'"'+(ab?'':' hidden')+'>'+cuerpo+'</div>'
   + '</section>';
}
function ligarPlegable(clave, alAbrir){
  var b = $('[data-fold="'+clave+'"]'); if(!b) return;
  b.onclick = function(){
    var abierto = !PLEGADO[clave];
    PLEGADO[clave] = abierto;
    $('#fold-'+clave).classList.toggle('abierto', abierto);
    b.setAttribute('aria-expanded', String(abierto));
    b.querySelector('.chip').textContent = abierto ? 'ocultar' : 'desplegar';
    var cuerpo = $('#foldb-'+clave);
    if(abierto){ cuerpo.removeAttribute('hidden'); if(alAbrir) alAbrir(); }
    else cuerpo.setAttribute('hidden','');
  };
  if(PLEGADO[clave] && alAbrir) alAbrir();
}

/* ---------------------------------------------------------------
   EL LADO DEL ALUMNO
   ---------------------------------------------------------------
   Dos situaciones distintas en la misma pantalla:

   · CON PROFESOR · la cáscara le envía la rutina publicada con
     'abrirRutina' y la herramienta la despliega. Las súper series
     quedan abiertas porque vienen diseñadas por el profesional.

   · SIN PROFESOR · la aplicación es un registrador de marcas y un
     seguidor de métricas propias. Se cierra la llave 'superserie',
     que la herramienta usa para ocultar por CSS los grupos y
     conectores.

   El protocolo es 'jyEmbed', distinto del 'jyntra' que hablan las
   herramientas del profesional; montarArchivo() atiende los dos.
   --------------------------------------------------------------- */
function rutinaPublicada(alumnoId){
  var pubs = Datos.paraAlumno(alumnoId, 'planificacion');
  if(!pubs.length) return null;
  /* 'creado' es cuándo nació el registro; 'tocado', cuándo se escribió
     por última vez. Al ordenar sólo por 'creado', la versión que el
     profesor acababa de publicar tapaba la que el alumno había
     anotado después, y sus notas parecían borrarse. Se toma la más
     reciente de verdad. */
  pubs = pubs.slice().sort(function(a,b){
    return String(b.tocado || b.creado).localeCompare(String(a.tocado || a.creado));
  });
  var d = pubs[0].datos || {};
  if(!Array.isArray(d.sesiones) || !d.sesiones.length) return null;
  /* Sanea la forma: una rutina guardada por una versión antigua puede venir
     sin 'grupos' o sin 'ejercicios', y la herramienta del alumno recorre esos
     campos sin comprobarlos. Se completan aquí antes de enviarla. */
  var sesiones = d.sesiones.map(function(s){
    return Object.assign({}, s, {
      nombre    : s.nombre || 'Sesión',
      modalidad : s.modalidad || '',
      ejercicios: Array.isArray(s.ejercicios) ? s.ejercicios : [],
      grupos    : (s.grupos && typeof s.grupos === 'object') ? s.grupos : {}
    });
  });
  d = Object.assign({}, d, {sesiones: sesiones});
  return {
    nombre         : d.nombre || pubs[0].tipo || 'Rutina de tu coach',
    sesiones       : d.sesiones,
    totalSesiones  : d.totalSesiones  || d.sesiones.length,
    totalEjercicios: d.totalEjercicios
                     || d.sesiones.reduce(function(n,s){
                          return n + ((s.ejercicios||[]).filter(function(e){ return e && e.ejercicio; }).length);
                        }, 0),
    guardadoEn     : pubs[0].creado
  };
}

/* ---------------------------------------------------------------
   BARRA DE ACCIONES DE HERRAMIENTA
   ---------------------------------------------------------------
   Cada herramienta guarda a su manera: unas emiten 'guardar', otras
   sólo 'estado', y la anamnesis no emitía nada persistible. Esta
   barra les da a todas el mismo par de gestos, arriba y abajo:

     · arriba · sello de autoguardado y, donde tiene sentido, el
                salto a la etapa siguiente (anamnesis → plan)
     · abajo  · guardar en la ficha, siempre visible

   La barra vive en la cáscara, no dentro del marco, así que no hay
   que tocar el HTML de ninguna herramienta.
   --------------------------------------------------------------- */
function barraHerramienta(caja, ctx, opciones){
  opciones = opciones || {};
  var sup = document.createElement('div');
  sup.className = 'jy-barra jy-barra-sup';
  sup.innerHTML = '<span class="jy-sello">Sin cambios todavía</span>'
    + (opciones.siguiente
        ? '<button type="button" class="btn gold" data-ir="'+opciones.siguiente.ruta+'">'
          + esc(opciones.siguiente.texto) + ' →</button>'
        : '');

  var inf = document.createElement('div');
  inf.className = 'jy-barra jy-barra-inf';
  inf.innerHTML = '<span class="hint">'+esc(opciones.pie || 'Se guarda en la ficha del alumno.')+'</span>'
    + '<button type="button" class="btn gold" data-guardar="1">Guardar ✓</button>';

  caja.parentNode.insertBefore(sup, caja);
  caja.parentNode.appendChild(inf);

  var irBtn = sup.querySelector('[data-ir]');
  if(irBtn) irBtn.onclick = function(){
    guardarAhora(function(){ ruta(irBtn.dataset.ir); });
  };
  inf.querySelector('[data-guardar]').onclick = function(){ guardarAhora(); };

  /* Guarda lo que haya: primero pide a la herramienta su estado; si no
     responde, usa el último borrador del autoguardado. */
  /* Cada herramienta tiene su propio guardado (su botón o su función).
     La barra lo acciona directamente: antes sólo buscaba un borrador
     que esas herramientas nunca escriben y respondía «no hay nada que
     guardar» aunque la ficha estuviera llena. */
  function guardadoPropio(){
    var marco = caja.querySelector('iframe');
    var w = null, d = null;
    try{ w = marco && marco.contentWindow; d = w && w.document; }catch(e){ return false; }
    if(!d) return false;
    if(opciones.clave === 'cine' && typeof w.saveData === 'function'){
      try{ w.saveData('barra'); return true; }catch(e){}
    }
    var ids = ['#jy-guardar-btn','#jy-guardar-rutina','#jy-guardar-anamnesis'];
    for(var i=0;i<ids.length;i++){
      var b = d.querySelector(ids[i]);
      if(b && !b.disabled){ b.click(); return true; }
    }
    if(opciones.clave === 'atleta'){
      var cand = [].slice.call(d.querySelectorAll('button')).filter(function(x){
        return /^\s*guardar/i.test(x.textContent || '') && x.offsetParent !== null && !x.disabled;
      });
      if(cand.length){ cand[0].click(); return true; }
      toast('Abre la pestaña que quieres guardar (perfil o toma de 1RM) y pulsa Guardar allí.','warn');
      return true;
    }
    return false;
  }

  function guardarAhora(despues){
    var antes = (S.registros || []).length;
    if(opciones.clave !== 'nutri' && opciones.clave !== 'pauta' && opciones.clave !== 'anamnesis' && guardadoPropio()){
      /* Si la herramienta no guardó (p. ej. rutina sin ejercicios), su
         aviso sale arriba, lejos del botón: se repite aquí abajo. */
      setTimeout(function(){
        if((S.registros || []).length !== antes) return;
        var aviso = '';
        try{
          var d = caja.querySelector('iframe').contentWindow.document;
          ['#jy-estado','#jy-eco-anam','#jy-eco'].some(function(sel){
            var e = d.querySelector(sel); aviso = e ? String(e.textContent || '').trim() : '';
            return !!aviso;
          });
        }catch(e){}
        if(aviso) toast(aviso, 'warn');
      }, 700);
      if(despues) setTimeout(despues, 400);
      return;
    }
    var su = (ctx && ctx.alumno && ctx.alumno.id) || (sesion() && sesion().id);
    var clave = '__borrador_' + (opciones.clave || 'anamnesis') + '_' + su;
    var b = null;
    try{ b = DB.get(clave, null); }catch(e){}
    /* la herramienta nutricional guarda su estado en su propia clave */
    if(!b && (opciones.clave === 'nutri' || opciones.clave === 'pauta')){
      var en = null;
      try{ en = DB.get('__nutri_' + su, null); }catch(e){}
      if(en) b = {datos:en};
    }

    var marco = caja.querySelector('iframe');
    if(marco){
      try{ marco.contentWindow.postMessage({jyEmbed:true, accion:'guardarYa'}, '*'); }catch(e){}
      try{ marco.contentWindow.postMessage({jyntra:true,  accion:'guardarYa'}, '*'); }catch(e){}
    }

    if(!b || !b.datos){
      toast('Todavía no hay nada que guardar en esta ficha.','warn');
      if(despues) despues();
      return;
    }
    guardarDesdeArchivo({
      modulo : opciones.modulo || 'evaluacion',
      tipo   : opciones.tipo   || 'Anamnesis',
      datos  : opciones.clave === 'anamnesis' ? { __anam: b.datos } : b.datos
    }, ctx);
    if(despues) despues();
  }
}

/* ================================================================
   §20 · CANAL DE REGISTRO DE CLASES
   ----------------------------------------------------------------
   Un solo módulo, idéntico en los cuatro perfiles. Se apoya en lo
   que ya existe (S, DB, guardar, VISTAS, RANURAS…) y reemplaza las
   piezas que cambian de comportamiento. Nada de esto necesita red:
   sigue funcionando desde file://
   ================================================================ */
(function(){
'use strict';

/* ---------- 20.0 · utilidades propias ---------- */
var SESIONES_OPC = [1,2,4,8,12,16];
/* sesiones por alumno según el plan del profesional:
   Base y Pro, hasta 4; Elite, las que quiera (y puede agregar más después) */
var TOPE_SESIONES_PLAN = 4;
var SESIONES_ELITE = [1,2,4,8,12,16,20,24,30];
function planPro(pro){ return (pro && pro.plan) || 'base'; }
function sinTopeSesiones(pro){ return planPro(pro) === 'elite'; }
function topeSesiones(pro){ return sinTopeSesiones(pro) ? Infinity : TOPE_SESIONES_PLAN; }
function opcionesSesiones(pro){ return sinTopeSesiones(pro) ? SESIONES_ELITE : [1,2,3,4]; }
function sesionesValidas(pro, n, porDefecto){
  n = Math.round(+n || 0);
  var t = topeSesiones(pro);
  if(n < 1) n = porDefecto || 1;
  return Math.min(n, t);

function iso(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function aFecha(s){
  if(!s) return null;
  var d = new Date(String(s)+'T12:00:00');
  return isNaN(d) ? null : d;
}
function diaDeFecha(s){ var d = aFecha(s); return d ? d.getDay() : null; }
function masDias(s, n){ var d = aFecha(s); if(!d) return ''; d.setDate(d.getDate()+n); return iso(d); }
function lunesDe(s){
  var d = aFecha(s); if(!d) return '';
  var k = (d.getDay()+6) % 7;          /* lunes = 0 */
  d.setDate(d.getDate()-k);
  return iso(d);
}
function fechaCorta(s){
  var d = aFecha(s); if(!d) return '—';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');

function migrar(){
  var toco = { usuarios:false, vinculos:false, horario:false };

  /* planes de servicio antiguos: sesiones y fecha del plan */
  (S.usuarios||[]).forEach(function(u){
    (u.planesServicio||[]).forEach(function(pl){

      if(!pl.fechaPlan){ pl.fechaPlan = (u.creado||'').slice(0,10) || hoy(); toco.usuarios = true; }
    });
  });

  /* vínculos activos sin cupo de sesiones */
  (S.vinculos||[]).forEach(function(v){
    if(v.sesionesPlan != null) return;
    var p  = usr(v.profesionalId);
    var pl = p && v.planServicioId
      ? (p.planesServicio||[]).filter(function(x){ return x.id === v.planServicioId; })[0]
      : null;
    v.sesionesPlan = pl ? (+pl.sesiones || 8) : 8;
    v.fechaPlan    = v.fechaPlan || (pl && pl.fechaPlan) || (v.desde||'').slice(0,10) || hoy();
    toco.vinculos  = true;
  });

  /* bloques antiguos: campos nuevos con valor neutro */
  Object.keys(S.horario||{}).forEach(function(id){
    (S.horario[id]||[]).forEach(function(b){
      if(b.fecha == null){ b.fecha = ''; toco.horario = true; }
      if(b.profesional == null){ b.profesional = b.profesor || ''; toco.horario = true; }
      if(b.origenPlan === undefined){ b.origenPlan = null; toco.horario = true; }

function hDe(alumnoId){

/* ---------- 20.3 · siembra de bloques al aceptar una conexión ---------- */
function sembrarBloques(v){
  var pro = usr(v.profesionalId); if(!pro) return 0;
  var lista = hDe(v.alumnoId);
  var ya = lista.filter(function(b){ return b.origenPlan === v.id; }).length;
  var faltan = Math.max(0, (+v.sesionesPlan || 0) - ya);
  var base = ya;
  for(var i=0; i<faltan; i++){
    var n = base + i;
    lista.push(sellar({
      id: uid('h'),
      dia: DIAS_ORD[n % 6],
      fecha: '',
      ini: '08:00', fin: '09:00',
      actividad: v.servicio || (pro.rol === 'nutricionista' ? 'Consulta nutricional' : 'Entrenamiento'),
      profesor: pro.nombre,
      profesional: pro.nombre,
      profesionalId: pro.id,
      rolPro: pro.rol,
      origenPlan: v.id,
      planNombre: v.plan || '',
      sesionN: n + 1,
      lugar: '', nota: '', publicado: false
    }, v.profesionalId));
  }
  if(faltan) guardar('horario');
  return faltan;
}

/* «información del plan»: la síntesis que viaja del alumno al profesional */
function informacionDelPlan(v){
  var pro = usr(v.profesionalId) || {};
  var al  = usr(v.alumnoId) || {};
  var bl  = hDe(v.alumnoId).filter(function(b){ return b.origenPlan === v.id; });
  var con = bl.filter(function(b){ return !!b.fecha; }).map(function(b){ return b.fecha; }).sort();
  var c   = contadorPlan(v);
  return {
    vinculoId: v.id,
    alumno: al.nombre || '—', alumnoId: v.alumnoId,
    profesional: pro.nombre || '—', rolPro: pro.rol || '',
    plan: v.plan || 'Por definir',
    servicio: v.servicio || '—',
    fechaPlan: v.fechaPlan || (v.desde||'').slice(0,10),
    sesiones: c.total, quemadas: c.quemadas, restantes: c.restantes,
    bloques: bl.length,
    conFecha: con.length,
    desde: con[0] || '', hasta: con[con.length-1] || '',
    publicados: bl.filter(function(b){ return b.publicado; }).length
  };
}

/* ---------- 20.4 · contador de sesiones y quemado bilateral ---------- */
function quemasDe(vid){ return (S.quemas||[]).filter(function(x){ return x.vinculoId === vid; }); }
function contadorPlan(v){
  var total = +v.sesionesPlan || 0;
  var qs = quemasDe(v.id);
  var quemadas = qs.filter(function(x){ return x.estado === 'aceptada'; }).length;
  var pend = qs.filter(function(x){ return x.estado === 'pendiente'; })[0] || null;
  return { total: total, quemadas: quemadas, restantes: Math.max(0, total - quemadas), pendiente: pend };
}
function ladoDe(v, quienId){ return quienId === v.alumnoId ? 'alumno' : 'pro'; }

function botonQuemar(v, quienId){
  var c = contadorPlan(v);
  var lado = ladoDe(v, quienId);
  var esperandoMio = c.pendiente && c.pendiente.pedidoPor === lado;
  var esperandoOtro = c.pendiente && c.pendiente.pedidoPor !== lado;
  var clase = esperandoOtro ? 'btn sm gold' : (esperandoMio ? 'btn sm' : 'btn sm');
  var txt = esperandoOtro ? 'Confirmar quema · ' + c.restantes
          : esperandoMio  ? 'Esperando confirmación · ' + c.restantes
          : 'Quemar clase · ' + c.restantes;
  return '<button class="' + clase + ' jy-quemar" data-quemar="' + esc(v.id) + '"'
   + (esperandoMio ? ' disabled' : '')
   + ' title="' + esc(c.quemadas + ' de ' + c.total + ' sesiones usadas') + '">'
   + esc(txt) + '</button>';
}

function pedirQuema(vid){
  var v = (S.vinculos||[]).filter(function(x){ return x.id === vid; })[0];
  if(!v || v.estado !== 'activo') return toast('El vínculo ya no está activo.','warn');
  var quien = yo(); if(!quien) return;
  var lado = ladoDe(v, quien);
  var c = contadorPlan(v);

  if(c.pendiente){
    if(c.pendiente.pedidoPor === lado) return toast('Ya enviaste la solicitud. Falta que la confirme la otra parte.','warn');
    if(c.restantes <= 0){
      c.pendiente.estado = 'anulada'; c.pendiente.cerrado = new Date().toISOString();
      guardar('quemas'); pintar();
      return toast('No quedan sesiones en este plan.','bad');
    }
    c.pendiente.estado = 'aceptada';
    c.pendiente.aceptadaPor = quien;
    c.pendiente.cerrado = new Date().toISOString();
    guardar('quemas');
    if(typeof bitacora === 'function') bitacora('quema', 'Clase quemada · ' + (v.plan||''), quien);
    toast('Clase descontada. Quedan ' + Math.max(0, c.restantes - 1) + ' sesiones.','ok');
    return pintar();
  }

  if(c.restantes <= 0) return toast('Este plan ya no tiene sesiones disponibles.','bad');
  S.quemas.push({
    id: uid('qm'), vinculoId: v.id, alumnoId: v.alumnoId, profesionalId: v.profesionalId,
    pedidoPor: lado, pedidaPor: quien, estado: 'pendiente', creado: new Date().toISOString(), cerrado: null
  });
  guardar('quemas');
  toast(lado === 'alumno'
    ? 'Solicitud enviada a tu profesional. Se descuenta cuando la confirme.'
    : 'Solicitud enviada. Se descuenta cuando la confirme el alumno.','ok');
  pintar();
}

/* calendario mensual reutilizable */
function calendarioHTML(idBase, mesISO, eventos){
  var base = aFecha(mesISO) || new Date();
  var y = base.getFullYear(), m = base.getMonth();
  var primero = new Date(y, m, 1);
  var arranque = (primero.getDay() + 6) % 7;
  var dias = new Date(y, m+1, 0).getDate();
  var titulo = primero.toLocaleDateString('es-CL', {month:'long', year:'numeric'});
  var porDia = {};
  (eventos||[]).forEach(function(ev){
    if(!ev.fecha) return;
    (porDia[ev.fecha] = porDia[ev.fecha] || []).push(ev);
  });

  var celdas = '';
  for(var i=0; i<arranque; i++) celdas += '<div class="jy-cal-d off"></div>';
  for(var d=1; d<=dias; d++){
    var f = iso(new Date(y, m, d));
    var evs = porDia[f] || [];
    celdas += '<div class="jy-cal-d' + (f === hoy() ? ' hoy' : '') + (evs.length ? ' con' : '') + '">'
      + '<span class="n">' + d + '</span>'
      + evs.slice(0,3).map(function(ev){
          var col = COLOR_ROL[ev.rol] || 'var(--gold)';
          return '<i style="background:' + col + '22;border-left:2px solid ' + col + '">'
            + esc((ev.hora||'') + ' ' + (ev.titulo||'')) + '</i>';
        }).join('')
      + (evs.length > 3 ? '<u>+' + (evs.length-3) + '</u>' : '')
      + '</div>';
  }

  return '<div class="jy-cal" id="' + idBase + '">'
   + '<div class="jy-cal-h"><button class="btn sm" data-cal="' + idBase + '" data-mes="' + iso(new Date(y, m-1, 1)) + '">‹</button>'
   + '<b>' + esc(titulo.charAt(0).toUpperCase() + titulo.slice(1)) + '</b>'
   + '<button class="btn sm" data-cal="' + idBase + '" data-mes="' + iso(new Date(y, m+1, 1)) + '">›</button></div>'
   + '<div class="jy-cal-g">'
   + ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(function(x){ return '<div class="jy-cal-w">' + x + '</div>'; }).join('')
   + celdas + '</div></div>';
}

var JY_SEL_ALUMNO = null;
var JY_SEL_SEMANA = '__todas__';

function alumnosDelPro(proId){
  return (typeof alumnosDe === 'function') ? alumnosDe(proId) : [];
}
function bloquesDelPro(proId){
  var fuera = [];
  alumnosDelPro(proId).forEach(function(a){
    hDe(a.id).forEach(function(b){
      if(b.profesionalId && b.profesionalId !== proId) return;
      fuera.push({ b:b, alumno:a });
    });
  });
  return fuera;
}
function semanasDelMes(mesISO){
  var base = aFecha(mesISO) || new Date();
  var y = base.getFullYear(), m = base.getMonth();
  var d = new Date(y, m, 1);
  var vistos = {}, fuera = [];
  while(d.getMonth() === m){
    var l = lunesDe(iso(d));
    if(l && !vistos[l]){ vistos[l] = true; fuera.push(l); }
    d.setDate(d.getDate()+7);
  }
  return fuera;
}
function enSemana(fecha, lunesISO){
  if(lunesISO === '__todas__') return true;
  if(!fecha) return false;
  return fecha >= lunesISO && fecha <= masDias(lunesISO, 6);
}

    .filter(function(x){ return !filtroAlumno || x.alumno.id === filtroAlumno; })
    .filter(function(x){ return sem === '__todas__' ? true : enSemana(x.b.fecha, sem); });

  return '<div class="jy-week">' + DIAS_ORD.map(function(d){
    var del = items.filter(function(x){ return +x.b.dia === d; })
      .sort(function(a,b){ return String(a.b.ini).localeCompare(String(b.b.ini)); });
    return '<div class="jy-day' + (d === hoyDia ? ' hoy' : '') + '">'
     + '<div class="jy-day-h"><b>' + nombreDia(d) + '</b><span>' + (del.length||'') + '</span></div>'
     + (del.length
        ? del.map(function(x){
            var col = COLOR_ROL[x.b.rolPro] || '';
            return '<div class="jy-slot asignado" title="' + esc(x.alumno.nombre) + '"' + (col ? ' style="border-left-color:' + col + '"' : '') + '>'
             + '<div class="hh">' + esc(x.b.ini||'--:--') + (x.b.fin ? ' – ' + esc(x.b.fin) : '')
             + (x.b.fecha ? ' · ' + esc(fechaCorta(x.b.fecha)) : '') + '</div>'
             + '<div class="nn">' + esc(x.alumno.nombre) + '</div>'
             + '<div class="ss">' + esc(x.b.actividad||'Sesión') + (x.b.lugar ? ' · ' + esc(x.b.lugar) : '')
             + (x.b.nota ? '<br>' + esc(x.b.nota) : '')
             + '</div>'
             + (x.b.publicado ? '<span class="pub si">publicado</span>' : '<span class="pub">sin publicar</span>')
             + '</div>';
          }).join('')
        : '<div class="jy-vacio">libre</div>')
     + '</div>';

};

var jy_ligarHorarioAlumno = function(u, raiz){

    if(!est) return;
    est.textContent = txt;
    est.style.color = malo ? 'var(--bad)' : 'var(--ok)';
    clearTimeout(est._t);
    est._t = setTimeout(function(){ est.textContent=''; est.style.color=''; }, 3500);
  };
  var refrescarGrilla = function(){ if(grid) grid.innerHTML = jy_grillaCombinada(u.id, sel, JY_SEL_SEMANA); };

  var escribir = function(e){
    var el = e.target.closest ? e.target.closest('[data-h][data-c]') : null; if(!el) return;
    var b = lista.filter(function(x){ return x.id === el.dataset.h; })[0]; if(!b) return;
    b[el.dataset.c] = el.value;

      if(d != null){

        if(cel) cel.textContent = nombreDia(d);
      }
      b.publicado = false;

  if(tabla){
    tabla.addEventListener('input', escribir);

    tabla.addEventListener('click', async function(e){
      var b = e.target.closest ? e.target.closest('[data-hborra]') : null; if(!b) return;
      if(!await preguntar('Eliminar el bloque',
        '<p class="sub" style="margin:0">Sale del horario de esta persona, que lo verá desaparecer en «Mis clases».</p>',
        {ok:'Eliminar', peligro:true})) return;

    if(!conFecha.length) return avisar('Ponle fecha al menos a un bloque', true);
    conFecha.forEach(function(b){

      b.profesional = b.profesional || u.nombre;
      b.rolPro = b.rolPro || u.rol;
      b.dia = diaDeFecha(b.fecha);

      + (a ? a.nombre.split(' ')[0] : 'La persona') + ' las ve en «Mis clases».','ok');
    avisar('Semana guardada · ' + conFecha.length + ' fechas');

/* ---------- 20.11 · PROFESIONAL · carga rápida de clases ----------
   Elegir personas + días + hora + semanas, ver cuántas clases salen y
   publicarlas de una vez. Usa los bloques del plan que aún no tienen fecha
   (plan Elite: si faltan, agrega sesiones solo); respeta el tope del plan. */
var JY_CR = { personas:null, dias:[1,3], ini:'08:00', dur:60, desde:'', semanas:4, act:'', lugar:'' };
function jyCRFin(ini, dur){
  var m = /^(\d{1,2}):(\d{2})$/.exec(ini||''); if(!m) return '';
  var t = Math.min((+m[1])*60 + (+m[2]) + (+dur||60), 23*60+59);
  return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
}
function jyCRFechas(){
  var e = JY_CR, d0 = e.desde || iso(new Date()), out = [];
  if(!aFecha(d0) || !e.dias.length) return out;
  var n = Math.max(1, Math.min(12, +e.semanas || 1)) * 7;
  for(var k=0;k<n && out.length<60;k++){
    var f = masDias(d0, k);
    if(e.dias.indexOf(diaDeFecha(f)) >= 0) out.push(f);
  }
  return out;
}
function jyCRCalcular(u){
  var e = JY_CR, fechas = jyCRFechas(), fin = jyCRFin(e.ini, e.dur);
  var sel = e.personas || [];
  var filas = vinculosActivosDe(u.id).filter(function(v){ return sel.indexOf(v.alumnoId) >= 0; }).map(function(v){
    var libres = hDe(v.alumnoId).filter(function(b){ return b.origenPlan === v.id && !b.fecha; }).length;
    var faltan = Math.max(0, fechas.length - libres);
    var nuevas = sinTopeSesiones(u) ? faltan : 0;
    var asignadas = Math.min(fechas.length, libres + nuevas);
    return { v:v, nombre:(usr(v.alumnoId)||{nombre:'—'}).nombre, fechas:fechas.slice(0, asignadas),
             nuevas:nuevas, omitidas:fechas.length - asignadas };
  });
  var ocupadas = 0;
  if(fin && e.ini < fin){
    var ya = bloquesDelPro(u.id).map(function(x){ return x.b; }).filter(function(b){ return b.fecha && b.ini; });
    fechas.forEach(function(f){
      if(ya.some(function(b){ return b.fecha === f && b.ini < fin && (b.fin || jyCRFin(b.ini,60)) > e.ini; })) ocupadas++;
    });
  }
  return { filas:filas, fechas:fechas, fin:fin,
           total:filas.reduce(function(a,f){ return a + f.fechas.length; }, 0), ocupadas:ocupadas };
}
function jyCRPrevio(u){
  var e = JY_CR, p = jyCRCalcular(u);
  if(!(e.personas||[]).length) return '<span class="hint" style="margin:0">Elige a quién le programas las clases.</span>';
  if(!e.dias.length) return '<span class="hint" style="margin:0">Elige al menos un día.</span>';
  if(!p.fin || e.ini >= p.fin) return '<span class="hint" style="margin:0">Revisa la hora de inicio y la duración.</span>';
  var partes = p.filas.map(function(f){
    return esc(f.nombre.split(' ')[0]) + ': <b>' + f.fechas.length + '</b>'
      + (f.nuevas ? ' (+' + f.nuevas + ' sesión' + (f.nuevas>1?'es':'') + ' nueva' + (f.nuevas>1?'s':'') + ')' : '')
      + (f.omitidas ? ' <span style="color:var(--warn)">· ' + f.omitidas + ' sin cupo en el plan</span>' : '');
  });
  return '<div class="row" style="gap:8px;flex-wrap:wrap"><span class="chip ' + (p.total ? 'ok' : 'warn') + '">'
    + p.total + ' clase' + (p.total===1?'':'s') + ' por crear</span>'
    + '<span class="hint" style="margin:0">' + partes.join(' · ') + '</span></div>'
    + (p.ocupadas ? '<p class="hint" style="margin:6px 0 0;color:var(--warn)">' + p.ocupadas + ' fecha' + (p.ocupadas>1?'s':'')
        + ' se cruza' + (p.ocupadas>1?'n':'') + ' con otra clase tuya a esa hora (se crean igual).</p>' : '')
    + (p.filas.some(function(f){ return f.omitidas; }) && !sinTopeSesiones(u)
        ? '<p class="hint" style="margin:6px 0 0">' + esc(avisoTopeSesiones(u)) + '</p>' : '');
}

    + '</div>'

    + '<button class="btn gold" id="jy-cr-go">Crear y publicar clases</button></div>';
}
function jyCRLigar(u, raiz){
  var r = q('#jy-cr', raiz || document); if(!r) return;
  var gente = alumnosDelPro(u.id);
  var prev = function(){ var p = q('#jy-cr-prev', r); if(p) p.innerHTML = jyCRPrevio(u); };
  var marcar = function(el, on){ el.classList.toggle('on', !!on); el.setAttribute('aria-pressed', on ? 'true' : 'false'); };
  r.addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('.tg') : null; if(!b) return;
    if(b.hasAttribute('data-cr-todos')){
      var todos = (JY_CR.personas||[]).length !== gente.length;
      JY_CR.personas = todos ? gente.map(function(a){ return a.id; }) : [];
      qq('[data-cr-p]', r).forEach(function(x){ marcar(x, todos); }); marcar(b, todos);
    } else if(b.hasAttribute('data-cr-p')){
      var id = b.getAttribute('data-cr-p'), i = (JY_CR.personas||[]).indexOf(id);
      if(i >= 0) JY_CR.personas.splice(i,1); else JY_CR.personas.push(id);
      marcar(b, i < 0);
      var t = q('[data-cr-todos]', r); if(t) marcar(t, JY_CR.personas.length === gente.length);
    } else if(b.hasAttribute('data-cr-d')){
      var d = +b.getAttribute('data-cr-d'), j = JY_CR.dias.indexOf(d);
      if(j >= 0) JY_CR.dias.splice(j,1); else JY_CR.dias.push(d);
      marcar(b, j < 0);
    }
    prev();
  });
  var campo = function(id, clave, num){
    var el = q('#' + id, r); if(!el) return;
    var f = function(){ JY_CR[clave] = num ? +el.value : el.value; prev(); };
    el.addEventListener('input', f); el.addEventListener('change', f);
  };
  campo('jy-cr-ini','ini'); campo('jy-cr-dur','dur',true); campo('jy-cr-desde','desde');
  campo('jy-cr-sem','semanas',true); campo('jy-cr-act','act'); campo('jy-cr-lugar','lugar');

  var pub = q('#jy-cr-pub', r);
  if(pub) pub.onclick = function(){
    var n = 0;
    bloquesDelPro(u.id).forEach(function(x){
      if(x.b.fecha && !x.b.publicado){
        x.b.publicado = true; x.b.profesionalId = x.b.profesionalId || u.id;
        x.b.profesional = x.b.profesional || u.nombre; x.b.rolPro = x.b.rolPro || u.rol;
        x.b.dia = diaDeFecha(x.b.fecha); sellar(x.b, u.id); n++;
      }
    });
    if(n){ guardar('horario'); toast(n + ' clase' + (n>1?'s':'') + ' publicada' + (n>1?'s':''),'ok'); pintar(); }
  };

  var go = q('#jy-cr-go', r);
  if(go) go.onclick = function(){
    var e = JY_CR, p = jyCRCalcular(u);
    if(!(e.personas||[]).length) return toast('Elige al menos una persona','warn');
    if(!e.dias.length) return toast('Elige al menos un día','warn');
    if(!p.fin || e.ini >= p.fin) return toast('Revisa la hora de inicio y la duración','warn');
    if(!p.total) return toast(sinTopeSesiones(u) ? 'No hay fechas para crear' : 'Sin cupo: ' + avisoTopeSesiones(u),'warn');
    p.filas.forEach(function(f){
      if(f.nuevas){ f.v.sesionesPlan = (+f.v.sesionesPlan || 0) + f.nuevas; guardar('vinculos'); sembrarBloques(f.v); }
      var libres = hDe(f.v.alumnoId).filter(function(b){ return b.origenPlan === f.v.id && !b.fecha; });
      f.fechas.forEach(function(fecha, i){
        var b = libres[i]; if(!b) return;
        b.fecha = fecha; b.dia = diaDeFecha(fecha); b.ini = e.ini; b.fin = p.fin;
        if(e.act){ b.actividad = e.act; b.servicio = e.act; }
        if(e.lugar) b.lugar = e.lugar;
        b.publicado = true; b.profesionalId = u.id;
        b.profesional = b.profesional || u.nombre; b.rolPro = b.rolPro || u.rol;
        sellar(b, u.id);
      });
    });
    guardar('horario');
    var omit = p.filas.reduce(function(a,f){ return a + f.omitidas; }, 0);
    toast(p.total + ' clase' + (p.total>1?'s':'') + ' creada' + (p.total>1?'s':'') + ' y publicada' + (p.total>1?'s':'')
      + (omit ? ' · ' + omit + ' sin cupo en el plan' : ''), omit ? 'warn' : 'ok');
    pintar();
  };
}

var POL = {"version": "1.0", "fecha": "8 de septiembre de 2026", "html": "<div class=\"jy21-doc\"><h2>Política de Privacidad y Tratamiento de Datos Personales</h2><p class=\"jy21-sub\">JYNTRA · Plataforma de entrenamiento y nutrición · Ley N° 21.719 (Chile)</p><p class=\"jy21-sub\">Versión 1.0 · 8 de septiembre de 2026 · Vigencia plena de la ley: 1 de diciembre de 2026</p><h3>1. Quién es responsable de tus datos</h3><p>El responsable del tratamiento de los datos personales que se registran en JYNTRA es <b>[RAZÓN SOCIAL], RUT [RUT]</b>, con domicilio en <b>[DOMICILIO]</b>, comuna de <b>[COMUNA]</b>, Región Metropolitana, Chile (en adelante, «JYNTRA», «la plataforma» o «nosotros»).</p><ul><li>Correo de contacto para materias de privacidad: <b>[privacidad@tu-dominio.cl]</b></li><li>Delegado de Protección de Datos (DPO): <b>[NOMBRE DEL DPO]</b> — <b>[dpo@tu-dominio.cl]</b></li><li>Plazo de respuesta comprometido: 30 días corridos desde la recepción de la solicitud.</li></ul><div class=\"jy21-nota\">Los campos entre corchetes deben completarse con los datos reales del titular del servicio antes de publicar esta política. Sin esa identificación, la política no cumple el deber de información del artículo 14.</div><h3>2. Qué ley se aplica</h3><p>Esta política se rige por la <b>Ley N° 21.719</b>, que regula la protección y el tratamiento de los datos personales y crea la Agencia de Protección de Datos Personales (APDP), publicada en el Diario Oficial el 13 de diciembre de 2024 y con vigencia plena a partir del 1 de diciembre de 2026. Dicha ley moderniza y reemplaza el marco de la Ley N° 19.628 y eleva el estándar chileno al nivel del Reglamento General de Protección de Datos europeo.</p><p>Cuando el tratamiento involucre datos de salud, se consideran además las normas sanitarias aplicables y las obligaciones de secreto profesional que pesan sobre profesores de educación física, preparadores físicos y nutricionistas que utilizan la plataforma.</p><h3>3. A quién aplica esta política</h3><p>Aplica a toda persona que cree una cuenta o cuyos datos se registren en cualquiera de los cuatro perfiles de la plataforma: <b>Alumno</b>, <b>Profesor</b>, <b>Nutricionista</b> y <b>Administrador</b>.</p><p>El alumno es titular de sus propios datos. El profesor y el nutricionista actúan como profesionales tratantes respecto de los alumnos con quienes tienen una conexión activa y aceptada, y quedan sujetos a las mismas obligaciones de confidencialidad, finalidad y seguridad que se describen aquí.</p><h3>4. Qué datos tratamos</h3><p>El inventario siguiente corresponde exactamente a los campos que la aplicación puede registrar. No pedimos datos «por si acaso»: cada categoría existe porque un módulo concreto la necesita (principio de proporcionalidad o minimización).</p><div class=\"jy21-tw\"><table><thead><tr><th>Categoría</th><th>Datos concretos que la plataforma registra</th><th>¿Sensible?</th></tr></thead><tbody><tr><td>A. Identificación y contacto</td><td>Nombre y apellido; correo electrónico; contraseña de acceso; teléfono; fecha de nacimiento; sexo; ciudad y comuna.</td><td>No</td></tr><tr><td>B. Perfil profesional (profesor / nutricionista)</td><td>Título profesional; especialidades; biografía; modalidad de atención; tarifa; planes de servicio y sus precios; visibilidad de la ficha pública en el buscador.</td><td>No</td></tr><tr><td>C. Composición corporal y antropometría</td><td>Talla; peso; perímetros (cintura, cadera, brazo, muslo); pliegues cutáneos; diámetros óseos (biacromial, biiliocrestal, húmero, fémur); talla sentada y envergadura; somatotipo ISAK; porcentaje graso; masa muscular esquelética; grasa visceral; edad metabólica; metabolismo basal y gasto energético estimado (bioimpedancia).</td><td>SÍ — dato de salud</td></tr><tr><td>D. Antecedentes de salud (anamnesis)</td><td>Patologías declaradas; medicamentos; cirugías previas; alergias e intolerancias alimentarias; síntomas y tolerancia digestiva; historial de lesiones y molestias musculoesqueléticas; lesión activa y zona afectada; ciclo menstrual y método anticonceptivo; horas y calidad de sueño; nivel de estrés; estado de ánimo; consumo de alcohol y tabaco; suplementos; patrón alimentario; número de comidas; hidratación; objetivo de salud.</td><td>SÍ — dato de salud</td></tr><tr><td>E. Entrenamiento y rendimiento</td><td>Cargas y repeticiones máximas (1RM); percepción de esfuerzo (RPE); asistencia y clases realizadas; calendario y horario semanal; sesiones del plan; mesociclos y planificación; adherencia.</td><td>Parcialmente — vinculado a salud</td></tr><tr><td>F. Relación comercial y situación socioeconómica</td><td>Plan contratado (Base, Pro, Elite); estado y fecha de renovación de la suscripción; boletas o facturas; montos y tarifas acordadas entre alumno y profesional.</td><td>SÍ — situación socioeconómica</td></tr><tr><td>G. Vínculos entre perfiles</td><td>Solicitudes de conexión y su estado; mensaje de presentación; profesional asignado por especialidad; notas y observaciones que el profesional escribe sobre el alumno.</td><td>Según contenido</td></tr><tr><td>H. Registros técnicos y de uso</td><td>Identificadores internos de usuario; fecha de creación de la cuenta; bitácora de accesos, altas y cambios; marca temporal de sincronización entre perfiles.</td><td>No</td></tr></tbody></table></div><p><b>Qué NO pedimos.</b> La plataforma no solicita ni almacena RUT, cédula de identidad, datos biométricos (huella dactilar, reconocimiento facial, iris o voz), geolocalización, origen étnico, afiliación política, sindical o religiosa, orientación sexual, ni datos de tarjetas de crédito o cuentas bancarias. Si en el futuro algún módulo requiere alguno de estos datos, esta política se actualizará y se solicitará un consentimiento nuevo y específico antes de recogerlos.</p><h3>5. Para qué usamos los datos y con qué base legal</h3><p>Ningún dato se usa para una finalidad distinta de aquella para la que fue recogido. La tabla siguiente es el registro resumido de actividades de tratamiento.</p><div class=\"jy21-tw\"><table><thead><tr><th>Finalidad</th><th>Datos usados</th><th>Base de licitud</th></tr></thead><tbody><tr><td>Crear y mantener la cuenta, autenticar el acceso y dirigir a la persona a su perfil.</td><td>A, H</td><td>Ejecución del servicio solicitado por el titular.</td></tr><tr><td>Permitir que el alumno registre su entrenamiento, su pauta y su seguimiento diario.</td><td>C, D, E</td><td>Consentimiento explícito para datos de salud.</td></tr><tr><td>Permitir que el profesor evalúe, planifique y haga seguimiento del alumno conectado.</td><td>C, D, E, G</td><td>Consentimiento explícito del alumno + ejecución del servicio profesional.</td></tr><tr><td>Permitir que el nutricionista realice anamnesis, antropometría, plan alimentario y control.</td><td>C, D, G</td><td>Consentimiento explícito del alumno + ejecución del servicio profesional.</td></tr><tr><td>Mostrar la ficha pública del profesional en el buscador interno.</td><td>B</td><td>Consentimiento del profesional, revocable en cualquier momento.</td></tr><tr><td>Gestionar agenda, horario semanal, reserva y registro de clases.</td><td>E, G</td><td>Ejecución del servicio.</td></tr><tr><td>Cobrar la suscripción a la plataforma y emitir documentos tributarios.</td><td>A, F</td><td>Ejecución del contrato y obligación legal tributaria.</td></tr><tr><td>Mantener la trazabilidad de accesos y cambios (evidencia de cumplimiento).</td><td>H</td><td>Interés legítimo en la seguridad de la información y deber de responsabilidad proactiva.</td></tr><tr><td>Enviar avisos operativos de la cuenta (cambios de plan, conexiones, recordatorios).</td><td>A</td><td>Ejecución del servicio.</td></tr><tr><td>Enviar comunicaciones comerciales o novedades del producto.</td><td>A</td><td>Consentimiento separado y opcional. Rechazarlo no limita el uso de la plataforma.</td></tr></tbody></table></div><h3>6. Cómo pedimos y cómo revocas tu consentimiento</h3><p>El consentimiento en JYNTRA es <b>libre, específico, informado, previo e inequívoco</b>. Se otorga marcando casillas que siempre aparecen <b>desmarcadas</b>. No usamos casillas premarcadas, no lo escondemos dentro de términos y condiciones y no lo inferimos del uso de la aplicación.</p><ul><li>El consentimiento se pide al crear la cuenta, en un cuadro visible que incluye el enlace a esta política.</li><li>Es <b>granular</b>: aceptar la política no implica aceptar el tratamiento de datos de salud, ni el envío de publicidad, ni compartir tu ficha con un profesional. Cada uno se marca por separado.</li><li>Queda registrado con fecha, hora y número de versión de la política aceptada, como evidencia del cumplimiento.</li><li>Puedes <b>revocarlo en cualquier momento</b> desde «Mi perfil» o escribiendo al correo de privacidad, con la misma facilidad con que lo otorgaste. La revocación no afecta la licitud del tratamiento anterior.</li><li>Si revocas el consentimiento para datos de salud, los módulos de evaluación, anamnesis, antropometría y seguimiento dejan de operar y los registros asociados se bloquean o se suprimen según lo que solicites.</li></ul><h3>7. Datos sensibles: regla reforzada</h3><p>La Ley N° 21.719 califica como sensibles, entre otros, los datos de salud y perfil biológico, los datos biométricos y —particularidad chilena— la <b>situación socioeconómica</b>. Buena parte de lo que JYNTRA registra cae en esa categoría.</p><ul><li>Su tratamiento exige <b>consentimiento explícito y separado</b>, que se solicita en una casilla propia al crear la cuenta y se vuelve a solicitar antes de activar cualquier módulo clínico.</li><li>El acceso está restringido: un profesional sólo puede ver los datos de salud de los alumnos con quienes tiene una <b>conexión activa y aceptada por el alumno</b>. Al terminar la conexión, cesa el acceso.</li><li>El alumno mantiene, en todo momento, una conexión por especialidad como máximo, de modo que sus datos clínicos no circulan entre varios profesionales simultáneamente.</li><li>Los datos sensibles no se usan para publicidad, no se ceden a terceros y no se comercializan en ninguna circunstancia.</li><li>Por su nivel de riesgo, este tratamiento está sujeto a una Evaluación de Impacto en Protección de Datos, que se mantiene documentada y actualizada.</li></ul><h3>8. Niños, niñas y adolescentes</h3><p>El tratamiento de datos de personas menores de edad se rige por el interés superior del niño.</p><ul><li><b>Menores de 14 años:</b> no pueden crear una cuenta por sí mismos. Se requiere el consentimiento de su padre, madre o representante legal, quien debe identificarse en el formulario de registro.</li><li><b>Entre 14 y 15 años:</b> el tratamiento de datos sensibles —es decir, de todo el módulo de salud, composición corporal y anamnesis— requiere igualmente el consentimiento del representante legal.</li><li><b>Entre 16 y 17 años:</b> puede consentir por sí mismo, con información redactada en lenguaje claro y adecuado a su edad; se recomienda de todos modos el acompañamiento de un adulto responsable.</li><li>El formulario de registro calcula la edad a partir de la fecha de nacimiento y activa automáticamente los campos de representante legal cuando corresponde.</li></ul><h3>9. Con quién se comparten los datos</h3><p>Los datos <b>no se venden, no se arriendan y no se ceden</b> con fines comerciales. Se comunican únicamente en estos casos:</p><ul><li><b>Al profesional que tú eliges conectar.</b> Al aceptarse una conexión, el profesor o nutricionista accede a la ficha del alumno en lo estrictamente necesario para su especialidad. Esta comunicación se basa en tu consentimiento y termina cuando terminas la conexión.</li><li><b>Al alumno.</b> El plan, la pauta y los resultados que el profesional publica quedan visibles para el alumno.</li><li><b>A encargados de tratamiento</b> (proveedores de hosting, respaldo o soporte), sólo bajo contrato escrito que les prohíbe usar los datos para fines propios y les impone las mismas medidas de seguridad.</li><li><b>A autoridades competentes</b>, cuando exista una obligación legal o una orden judicial.</li></ul><p><b>Transferencias internacionales.</b> En su configuración por defecto, JYNTRA funciona en el dispositivo del usuario y no transfiere datos fuera de Chile. Si en el futuro se habilita un servidor en el extranjero, se informará previamente y sólo se usarán países o proveedores con nivel adecuado de protección o cláusulas contractuales que garanticen un estándar equivalente.</p><h3>10. Dónde se guardan y por cuánto tiempo</h3><p>La aplicación está construida como archivos HTML autónomos. En su modo estándar, los datos se guardan en el <b>almacenamiento local del navegador del propio usuario</b> (localStorage), bajo el prefijo «jyntra.», y se sincronizan entre los perfiles abiertos en el mismo dispositivo o dominio. Si el operador habilita un servidor central, los datos se replican en él bajo las mismas reglas de esta política.</p><div class=\"jy21-tw\"><table><thead><tr><th>Dato</th><th>Plazo de conservación</th></tr></thead><tbody><tr><td>Cuenta e identificación</td><td>Mientras la cuenta esté activa y hasta 12 meses después de su cierre.</td></tr><tr><td>Datos de salud, antropometría y anamnesis</td><td>Mientras dure la conexión con el profesional y hasta el plazo que exija la normativa sanitaria sobre ficha clínica; luego se suprimen o anonimizan.</td></tr><tr><td>Registros de entrenamiento y seguimiento</td><td>Mientras la cuenta esté activa; se suprimen al cerrar la cuenta si el titular lo solicita.</td></tr><tr><td>Documentos tributarios y de pago</td><td>6 años, por obligación legal.</td></tr><tr><td>Bitácora de accesos y cambios</td><td>24 meses, como evidencia de cumplimiento.</td></tr><tr><td>Registro de consentimientos</td><td>Mientras dure el tratamiento y 5 años después, como prueba del consentimiento.</td></tr></tbody></table></div><h3>11. Seguridad de la información</h3><ul><li>Acceso segmentado por rol: cada perfil sólo ve lo que su función requiere.</li><li>Acceso a datos clínicos condicionado a una conexión aceptada por el titular.</li><li>Bitácora de altas, accesos y modificaciones, con identificación de quién hizo cada cambio.</li><li>Los datos permanecen en el dispositivo del usuario en la configuración estándar, lo que reduce la superficie de exposición.</li><li>Si el operador habilita servidor central: cifrado en tránsito (HTTPS/TLS), cifrado en reposo, autenticación por token y respaldos periódicos.</li><li>Recomendación al usuario: no compartir la contraseña, usar el bloqueo de pantalla del dispositivo y cerrar sesión en equipos compartidos.</li></ul><div class=\"jy21-nota\">Ninguna medida de seguridad es infalible. Si detectas un acceso indebido a tu cuenta, avísanos de inmediato al correo de privacidad.</div><h3>12. Qué hacemos si hay una brecha de seguridad</h3><p>Si se produce una vulneración de seguridad que afecte datos personales —acceso no autorizado, pérdida, alteración o divulgación—, activamos el protocolo de incidentes:</p><ul><li>Notificamos a la Agencia de Protección de Datos Personales <b>sin dilación indebida</b>, en un plazo objetivo de 72 horas desde que tomamos conocimiento del hecho.</li><li>Cuando la brecha afecte datos sensibles, datos de menores de 14 años o datos económicos, notificamos también <b>directamente a las personas afectadas</b>, describiendo qué ocurrió, qué datos se vieron comprometidos, qué medidas tomamos y qué puede hacer la persona.</li><li>Registramos el incidente y las medidas correctivas adoptadas.</li></ul><h3>13. Tus derechos (ARCOP y bloqueo)</h3><p>Como titular de datos puedes ejercer, gratuitamente y sin expresar motivo, los siguientes derechos:</p><div class=\"jy21-tw\"><table><thead><tr><th>Derecho</th><th>Qué te permite hacer</th></tr></thead><tbody><tr><td>Acceso</td><td>Saber qué datos tenemos sobre ti, de dónde provienen, para qué se usan, a quién se han comunicado y por cuánto tiempo se conservarán.</td></tr><tr><td>Rectificación</td><td>Corregir datos inexactos, incompletos o desactualizados.</td></tr><tr><td>Cancelación o supresión</td><td>Pedir que se eliminen tus datos cuando ya no sean necesarios, cuando retires el consentimiento o cuando el tratamiento sea ilícito («derecho al olvido»).</td></tr><tr><td>Oposición</td><td>Oponerte a un tratamiento determinado, por ejemplo al perfilamiento comercial o al envío de comunicaciones.</td></tr><tr><td>Bloqueo</td><td>Pedir la suspensión temporal del tratamiento mientras se resuelve una controversia sobre tus datos.</td></tr><tr><td>Portabilidad</td><td>Recibir tus datos en un formato estructurado, de uso común y lectura mecánica, y pedir que se transfieran a otro responsable.</td></tr></tbody></table></div><p><b>Cómo ejercerlos:</b> escribe a <b>[privacidad@tu-dominio.cl]</b> indicando tu nombre, el correo con que te registraste y el derecho que quieres ejercer. Responderemos en un plazo máximo de <b>30 días corridos</b>, prorrogable por otros 30 en casos complejos, avisándote antes del vencimiento del primer plazo.</p><p>Adicionalmente, la aplicación ofrece dos atajos: desde «Mi perfil» puedes <b>descargar un respaldo completo de tus datos</b> (derecho de portabilidad) y <b>borrar tus datos del dispositivo</b> (derecho de supresión).</p><h3>14. Decisiones automatizadas y perfilamiento</h3><p>JYNTRA calcula automáticamente indicadores como el porcentaje graso, el somatotipo, el metabolismo basal, el gasto energético o los rangos de macronutrientes. Son <b>apoyos al criterio profesional</b>, no decisiones automatizadas con efectos jurídicos ni sustitutos de una evaluación clínica.</p><p>No se realiza elaboración de perfiles con fines publicitarios ni se toman decisiones que afecten derechos de una persona basadas únicamente en un tratamiento automatizado. Toda indicación de entrenamiento o alimentación es revisada y firmada por el profesional a cargo.</p><h3>15. Almacenamiento local y cookies</h3><p>La aplicación no usa cookies de publicidad ni de analítica de terceros. Utiliza exclusivamente almacenamiento local del navegador (localStorage) y un canal de mensajería entre pestañas (BroadcastChannel), ambos <b>estrictamente necesarios</b> para que la plataforma funcione sin servidor y para que los perfiles se sincronicen entre sí. Por ser técnicamente necesarios no requieren consentimiento adicional, pero se informan aquí por transparencia.</p><p>Al borrar los datos de navegación del navegador se elimina también la información almacenada por JYNTRA en ese dispositivo.</p><h3>16. Reclamos ante la autoridad</h3><p>Si consideras que no hemos respetado tus derechos, puedes reclamar ante la <b>Agencia de Protección de Datos Personales (APDP)</b>, organismo fiscalizador creado por la Ley N° 21.719, que puede investigar de oficio, ordenar la suspensión de un tratamiento y aplicar multas de hasta 20.000 UTM en el caso de infracciones gravísimas. El reclamo ante la Agencia es independiente de las acciones judiciales que puedas ejercer.</p><h3>17. Cambios a esta política</h3><p>Podemos actualizar esta política cuando cambien los módulos de la plataforma o la normativa aplicable. Toda versión lleva un número y una fecha. Si el cambio amplía las finalidades o incorpora datos nuevos, se te solicitará un consentimiento nuevo antes de aplicarlo, y la aplicación te mostrará el texto actualizado la próxima vez que inicies sesión.</p><p>Versión vigente: <b>1.0</b> — 8 de septiembre de 2026.</p><h3>Anexo A · Textos de consentimiento que usa la aplicación</h3><p>Estos son los textos exactos que aparecen, en casillas desmarcadas, al crear una cuenta. Se reproducen aquí para que quede constancia de qué se está aceptando.</p><ul><li><b>(Obligatorio)</b> He leído y acepto la Política de Privacidad de JYNTRA, versión 1.0. Autorizo el tratamiento de mis datos de identificación y contacto con la finalidad de crear y operar mi cuenta.</li><li><b>(Obligatorio para usar los módulos de salud)</b> Doy mi consentimiento explícito para que JYNTRA trate mis datos personales sensibles de salud —composición corporal, antropometría, antecedentes clínicos, hábitos, sueño, lesiones y rendimiento— con la única finalidad de la evaluación, planificación y seguimiento de mi entrenamiento y de mi alimentación. Entiendo que puedo revocar esta autorización en cualquier momento.</li><li><b>(Se solicita al conectar)</b> Autorizo que el profesor o nutricionista con quien establezca una conexión acceda a mi ficha en lo necesario para su especialidad, mientras esa conexión esté activa.</li><li><b>(Opcional)</b> Quiero recibir novedades y comunicaciones comerciales de JYNTRA por correo electrónico. Sé que puedo desactivarlo cuando quiera y que no afecta mi uso de la plataforma.</li><li><b>(Sólo si el titular es menor de edad)</b> Declaro ser el padre, madre o representante legal de la persona que se registra y autorizo el tratamiento de sus datos en los términos de esta política.</li></ul><h3>Anexo B · Correspondencia con la Ley N° 21.719</h3><div class=\"jy21-tw\"><table><thead><tr><th>Exigencia de la ley</th><th>Cómo la cumple JYNTRA</th></tr></thead><tbody><tr><td>Licitud y consentimiento válido</td><td>Casillas desmarcadas, granulares y registradas con fecha, hora y versión.</td></tr><tr><td>Finalidad</td><td>Cada categoría de dato está asociada a una finalidad declarada en la sección 5.</td></tr><tr><td>Proporcionalidad / minimización</td><td>No se piden RUT, biometría ni geolocalización; se declara expresamente qué no se recoge.</td></tr><tr><td>Calidad y exactitud</td><td>Derecho de rectificación disponible y edición directa de la ficha por el titular.</td></tr><tr><td>Transparencia e información</td><td>Esta política es accesible desde un botón permanente en la aplicación y se presenta antes de crear la cuenta.</td></tr><tr><td>Seguridad</td><td>Segmentación por rol, acceso condicionado a conexión aceptada, bitácora y cifrado en despliegue con servidor.</td></tr><tr><td>Confidencialidad</td><td>Deber de secreto de los profesionales y prohibición de uso de datos para fines propios por parte de encargados.</td></tr><tr><td>Responsabilidad proactiva</td><td>Registro de actividades de tratamiento (sección 5), registro de consentimientos, bitácora y evaluación de impacto para datos sensibles.</td></tr><tr><td>Derechos ARCOP y bloqueo</td><td>Canal de contacto, plazo de 30 días y funciones de respaldo y borrado en la propia aplicación.</td></tr><tr><td>Datos sensibles</td><td>Consentimiento explícito separado y acceso restringido por conexión.</td></tr><tr><td>Menores de edad</td><td>Umbrales de 14 y 16 años implementados en el formulario de registro.</td></tr><tr><td>Notificación de brechas</td><td>Protocolo con plazo objetivo de 72 horas a la APDP y aviso directo a los afectados.</td></tr></tbody></table></div></div>"};

if(!S.consentimientos){ S.consentimientos = DB.get('consentimientos', null) || []; guardar('consentimientos'); }
try{ if(JY_CANAL && JY_CANAL.claves && JY_CANAL.claves.indexOf('consentimientos') < 0) JY_CANAL.claves.push('consentimientos'); }catch(e){}

function consentimientoDe(usuarioId){
  var l = (S.consentimientos||[]).filter(function(c){ return c.usuarioId===usuarioId && !c.revocado; });
  return l.length ? l[l.length-1] : null;
}
function registrarConsentimiento(usuarioId, items, extra){
  var reg = {
    id: uid('cons'),
    usuarioId: usuarioId,
    version: POL.version,
    fecha: new Date().toISOString(),
    items: items || {},
    representante: (extra && extra.representante) || null,
    agente: (navigator && navigator.userAgent) ? String(navigator.userAgent).slice(0,180) : '',
    revocado: false
  };
  S.consentimientos.push(reg); guardar('consentimientos');
  try{ bitacora('privacidad','Consentimiento otorgado (v'+POL.version+')', usuarioId); }catch(e){}
  return reg;
}
function revocarConsentimiento(usuarioId, motivo){
  (S.consentimientos||[]).forEach(function(c){
    if(c.usuarioId===usuarioId && !c.revocado){ c.revocado = true; c.revocadoEn = new Date().toISOString(); c.motivo = motivo||''; }
  });
  guardar('consentimientos');
  try{ bitacora('privacidad','Consentimiento revocado', usuarioId); }catch(e){}
}
function edadDe(iso){
  if(!iso) return null;
  var n = new Date(iso); if(isNaN(n)) return null;
  var h = new Date(), e = h.getFullYear() - n.getFullYear();
  var m = h.getMonth() - n.getMonth();
  if(m < 0 || (m === 0 && h.getDate() < n.getDate())) e--;
  return e;
}

/* ---------- 21.2 · puente de sesión entre archivos ----------
   ADMITIDOS = roles que este archivo puede atender. null = todos. */
var ADMITIDOS = null;
(function puenteDeSesion(){
  var q = {};
  (location.search||'').replace(/^\?/,'').split('&').forEach(function(p){
    if(!p) return; var i = p.indexOf('=');
    var k = i<0 ? p : p.slice(0,i);
    var v = i<0 ? '' : decodeURIComponent(p.slice(i+1).replace(/\+/g,' '));
    q[k] = v;
  });
  if(!q.u) return;
  var u = (S.usuarios||[]).filter(function(x){ return x.id === q.u; })[0];
  if(!u) return;
  if(q.r && u.rol !== q.r) return;
  if(ADMITIDOS && ADMITIDOS.indexOf(u.rol) < 0){
    try{ toast('Esta aplicación no atiende al perfil '+u.rol+'.','bad'); }catch(e){}
    return;
  }
  S.sesion = u.id; guardar('sesion');
  try{ history.replaceState(null, '', location.pathname + (location.hash||'')); }catch(e){}
})();

/* ---------- 21.4 · la ventana con el documento ---------- */
function abrirPolitica(opciones){
  var o = opciones || {};
  return new Promise(function(res){
    var bg = document.createElement('div'); bg.className = 'jy21-bg';
    var pie = o.aceptar
      ? '<button class="jy21-btn" data-jy21="no">'+(o.textoRechazar||'No acepto')+'</button>'
        + '<button class="jy21-btn oro" data-jy21="si">'+(o.textoAceptar||'Acepto')+'</button>'
      : '<button class="jy21-btn" data-jy21="imprimir">Imprimir o guardar en PDF</button>'
        + '<button class="jy21-btn oro" data-jy21="cerrar">Cerrar</button>';
    bg.innerHTML = '<div class="jy21-caja" role="dialog" aria-modal="true" aria-label="Política de Privacidad">'
      + '<div class="jy21-h"><div style="flex:1"><b>Políticas de privacidad</b>'
      +   '<small>JYNTRA · versión '+POL.version+' · '+POL.fecha+' · Ley N° 21.719</small></div></div>'
      + '<div class="jy21-b">'+POL.html+'</div>'
      + '<div class="jy21-f">'+pie+'</div></div>';
    document.body.appendChild(bg);
    var cerrar = function(v){ bg.remove(); res(v); };
    bg.addEventListener('click', function(e){
