function ligarConsentimiento(form){
  if(!form) return;
  var caja = form.querySelector('#jy21-cons'); if(!caja) return;
  var ver = caja.querySelector('[data-jy21-ver]');
  if(ver) ver.onclick = function(e){ e.preventDefault(); abrirPolitica(); };
  var nac = form.querySelector('[name="nacimiento"]');
  var menor = caja.querySelector('#jy21-menor');
  var txt = caja.querySelector('#jy21-menor-txt');
  var revisar = function(){
    var e = nac ? edadDe(nac.value) : null;
    if(e === null || e >= 18){ menor.classList.remove('on'); return; }
    menor.classList.add('on');
    if(e < 14){
      txt.innerHTML = 'La persona tiene <b>'+e+' años</b>. La ley exige el consentimiento del padre, madre o '
        + 'representante legal para tratar sus datos.';
    } else if(e < 16){
      txt.innerHTML = 'La persona tiene <b>'+e+' años</b>. Los datos sensibles de salud de adolescentes menores de '
        + '16 años requieren el consentimiento del representante legal.';
    } else {
      txt.innerHTML = 'La persona tiene <b>'+e+' años</b>. Recomendamos el acompañamiento de un adulto responsable; '
        + 'si lo hay, complete los campos siguientes.';
    }
  };
  if(nac){ nac.addEventListener('change', revisar); nac.addEventListener('input', revisar); }
  revisar();

  /* si el formulario deja elegir rol, el texto de datos sensibles se adapta */
  var span = caja.querySelector('#jy21-salud-txt');
  var radios = Array.prototype.slice.call(form.querySelectorAll('[name="rol"]'));
  if(span && radios.length){
    var refrescar = function(){
      var r = form.querySelector('[name="rol"]:checked');
      span.innerHTML = textoSalud(r ? r.value : 'alumno');
    };
    radios.forEach(function(r){ r.addEventListener('change', refrescar); });
    refrescar();
  }
}

function validarConsentimiento(form, rol){
  var v = function(n){ var el = form.querySelector('[name="'+n+'"]'); return el ? (el.type==='checkbox' ? el.checked : el.value.trim()) : ''; };
  if(!v('jy21_politica'))
    return { ok:false, msg:'Debes aceptar las políticas de privacidad para crear la cuenta.' };
  if(!v('jy21_salud'))
    return { ok:false, msg: (rol==='profesor'||rol==='nutricionista')
      ? 'Debes aceptar el compromiso de confidencialidad sobre los datos de salud.'
      : 'Sin consentimiento explícito no podemos tratar tus datos de salud.' };
  var nac = form.querySelector('[name="nacimiento"]');
  var e = nac ? edadDe(nac.value) : null;
  var rep = null;
  if(e !== null && e < 18){
    if((rol==='profesor'||rol==='nutricionista') && e < 18)
      return { ok:false, msg:'Las cuentas profesionales requieren ser mayor de edad.' };
    if(e < 16){
      if(!v('jy21_rep_nombre') || !v('jy21_rep_email') || !v('jy21_rep_ok'))
        return { ok:false, msg:'Se requiere el consentimiento del padre, madre o representante legal.' };
    }
    if(v('jy21_rep_nombre')) rep = { nombre:v('jy21_rep_nombre'), email:v('jy21_rep_email'), edadTitular:e };
  }
  return { ok:true, items:{
      politica:  true,
      salud:     true,
      conexion:  !!v('jy21_conexion'),
      comercial: !!v('jy21_comercial'),
      edad:      e
    }, representante: rep };
}

      e.preventDefault();

      var rol = rolEl ? rolEl.value : (typeof PERFIL_UNICO !== 'undefined' ? PERFIL_UNICO : 'alumno');
      var chequeo = validarConsentimiento(fc, rol);
      if(!chequeo.ok) return toast(chequeo.msg, 'bad');
      var antes = (S.usuarios||[]).length;
      creandoCuenta = true;                       /* el portero no molesta durante el alta */
      var alta;
      try{ alta = (typeof orig === 'function') ? orig.call(fc, e) : null; }
      catch(err){ creandoCuenta = false; throw err; }
      /* el alta puede terminar al tiro (modo local) o más tarde (nube) */
      Promise.resolve(alta).then(function(nuevo){
        var u = (nuevo && nuevo.id) ? nuevo
              : ((S.usuarios||[]).length > antes ? S.usuarios[S.usuarios.length-1] : null);
        if(u){
          registrarConsentimiento(u.id, chequeo.items, { representante: chequeo.representante });
          creandoCuenta = false;
          try{ if(typeof JY22 !== 'undefined' && JY22.irAPerfil) JY22.irAPerfil(u); }catch(err){}
        } else {
          creandoCuenta = false;
        }
      }, function(){ creandoCuenta = false; });
    };
  };
}

/* ---------- 21.7 · portero: sin consentimiento vigente, no se entra ---------- */
var puertaAbierta = false, creandoCuenta = false, aceptadoEnSesion = {}, esperaPortero = null;
function portero(u){
  if(!u || puertaAbierta || creandoCuenta) return;
  if(consentimientoDe(u.id)) return;
  /* con la nube: no se pregunta hasta saber qué consentimientos tiene guardados */
  if(window.JYNUBE && JYNUBE.consentimientosListos && !JYNUBE.consentimientosListos()){
    clearTimeout(esperaPortero);
    esperaPortero = setTimeout(function(){ try{ var x = sesion(); if(x) portero(x); }catch(e){} }, 700);
    return;
  }
  /* ya aceptó en esta sesión pero la nube aún no lo confirma: no se vuelve a preguntar */
  if(aceptadoEnSesion[u.id]){
    var r = aceptadoEnSesion[u.id];
    if(!(S.consentimientos||[]).some(function(c){ return c.id === r.id; })){ S.consentimientos.push(r); guardar('consentimientos'); }
    return;
  }
  puertaAbierta = true;
  abrirPolitica({ aceptar:true, textoAceptar:'Acepto y autorizo', textoRechazar:'No acepto · salir' })
   .then(function(ok){
      puertaAbierta = false;
      if(ok){
        aceptadoEnSesion[u.id] = registrarConsentimiento(u.id, { politica:true, salud:true, conexion:false, comercial:false, edad:edadDe(u.nacimiento) });
        toast('Consentimiento registrado. Gracias.','ok');
        try{ pintar(); }catch(e){}
      } else {
        toast('Sin consentimiento no podemos tratar tus datos.','bad');
        try{ salir(); }catch(e){ S.sesion=null; guardar('sesion'); location.reload(); }
      }
   });
}

}

/* ---------- 21.8b · eliminar mi perfil y mis datos (derecho de supresión) ---------- */
function nubeDeBorrado(){ return (window.JYNUBE && window.JYNUBE.activa && window.JYNUBE.backend) || null; }
function leerUnaVez(B, consulta){
  return new Promise(function(ok, mal){
    var hecho = false, off = null;
    var fin = function(fn, v){ if(hecho) return; hecho = true; try{ if(off) off(); }catch(e){} fn(v); };
    off = B.escuchar(consulta, function(l){ fin(ok, l || []); }, function(err){ fin(mal, err); });
    if(hecho){ try{ off(); }catch(e){} }
    setTimeout(function(){ fin(mal, new Error('tiempo de espera agotado')); }, 20000);
  });
}
function borrarRutas(B, rutas, avance){
  var i = 0;
  return new Promise(function(ok, mal){
    (function sig(){
      if(i >= rutas.length) return ok();
      var r = rutas[i++];
      B.del(r).then(function(){ if(avance) avance(i, rutas.length); sig(); }, mal);
    })();
  });
}
function eliminarTodoDe(B, u, correo, paso){
  var uid = u.id, tareas = [];
  ['registros','metricas','quemas','horario','pautas','fichas'].forEach(function(c){
    tareas.push([{col:'alumnos/' + uid + '/' + c}, 'tu ficha y tus registros']);
  });
  tareas.push([{col:'vinculos', donde:['alumnoId', uid]}, 'tus conexiones']);
  tareas.push([{col:'vinculos', donde:['profesionalId', uid]}, 'tus conexiones']);
  tareas.push([{col:'invitaciones', donde:['profesionalId', uid]}, 'tus invitaciones']);
  if(correo) tareas.push([{col:'invitaciones', donde:['email', correo]}, 'tus invitaciones']);
  tareas.push([{col:'agenda', donde:['profesionalId', uid]}, 'tu agenda']);
  tareas.push([{col:'consentimientos', donde:['usuarioId', uid]}, 'tus consentimientos']);
  var i = 0;
  return new Promise(function(ok, mal){
    (function sig(){
      if(i >= tareas.length) return ok();
      var t = tareas[i++];
      paso('Borrando ' + t[1] + '…');
      leerUnaVez(B, t[0]).then(function(lista){
        return borrarRutas(B, lista.map(function(d){ return d.ruta; }));
      }).then(sig, mal);
    })();
  });
}

/* ---------- 23.3 · codificar / decodificar ---------- */
/* Los datos viajan como JSON en un campo 'json' (así no importan los
   arreglos anidados ni los undefined que Firestore no acepta). Al lado
   van, en claro, los campos que usan las reglas de seguridad. */
function limpiar(o){ return JSON.parse(JSON.stringify(o == null ? null : o)); }
function codificar(obj, indice){
  var d = { json: JSON.stringify(obj), v: 2, t: Date.now() };
  (indice || []).forEach(function(k){ d[k] = (obj && obj[k] != null) ? obj[k] : null; });
  if(d.json.length > 900000){
    d.json = JSON.stringify(sinImagenes(obj));
    aviso('grande', 'Una ficha era demasiado pesada y se guardó sin sus imágenes.');
  }
  return d;
}
function decodificar(datos, indice){
  var o = null;
  try{ o = JSON.parse(datos.json); }catch(e){ return null; }
  if(o && typeof o === 'object' && !Array.isArray(o)){
    (indice || []).forEach(function(k){ if(datos[k] !== undefined) o[k] = datos[k]; });
  }
  return o;
}

    if(/guardar (consentimientos|usuarios|privado)/.test(que)) aviso('perm-' + que, 'No se pudo guardar (' + que.replace('guardar ','') + '): permiso denegado. Cierra sesión y vuelve a entrar.', 'bad');
    return;
  }
  if(/unavailable|network/.test(code)) return aviso('red', 'Sin conexión: los cambios se guardan y se enviarán al volver la red.');
  aviso('err-' + que, 'No se pudo sincronizar (' + (code || 'error') + ').', 'bad');

/* ---------- 23.4 · subir lo que cambió ---------- */
var pendientes = {};

  if(!claveLista(clave)){ setTimeout(function(){ programarSubida(clave); }, 400); return; }
  if(clave === 'usuarios') return subirUsuarios();
  var m = MAPA[clave]; if(!m) return;
  var prefijoConocido = '§' + clave + '§';
  var actuales = {};
  if(m.tipo === 'lista'){
    (S[clave] || []).forEach(function(x){
      if(!x || !x.id) return;
      var r = m.ruta(x); if(!r) return;
      actuales[r] = x;
    });
  } else {
    var obj = S[clave] || {};
    Object.keys(obj).forEach(function(k){ actuales[m.ruta(k)] = { __k:k, v:obj[k] }; });
  }
  Object.keys(actuales).forEach(function(r){
    var x = actuales[r];
    var dueno = m.tipo === 'lista' ? m.mio(x) : m.mio(x.__k);
    if(!dueno) return;
    /* una ficha única (horario, pauta) sólo se escribe cuando ya se
       sabe qué hay en la nube para esa persona */
    if(m.tipo === 'mapa' && !rutaEntregada(r)){ setTimeout(function(){ programarSubida(clave); }, 600); return; }
    var datos = m.tipo === 'lista' ? codificar(limpiar(x), m.indice)
                                   : codificar(limpiar(x.v), []);
    if(m.tipo === 'mapa') datos.alumnoId = x.__k;
    var huella = datos.json;
    if(conocidos[r] === huella) return;
    conocidos[r] = huella;
    registrarRuta(clave, r);
    escribir(r, datos);
  });
  if(m.soloAgregar) return;
  /* BORRADOS: sólo lo que la nube muestra AHORA y aquí se quitó a propósito.
     Si una escucha se cortó (red, permisos, vínculo terminado), sus datos
     desaparecen de la pantalla pero NUNCA se borran de la nube. */
  var enNube = union(clave);
  (rutasDe[clave] || []).slice().forEach(function(r){
    if(actuales[r] || conocidos[r] === undefined) return;
    var previo = objetoDeRuta(clave, r);
    if(previo && m.tipo === 'lista' && !m.mio(previo)) return;
    if(!enNube[r] && vistoServidor[r]){ delete conocidos[r]; quitarRuta(clave, r); return; }   // sólo se olvida aquí
    delete conocidos[r];
    quitarRuta(clave, r);
    borrar(r);
  });
}
function rutaEntregada(r){
  var ids = Object.keys(subs).concat(Object.keys(entregado));
  for(var i=0;i<ids.length;i++){
    var id = ids[i];
    if(consultaDe[id] && consultaDe[id].doc === r) return !!entregado[id];
  }
  return false;
}
/* qué rutas conocemos de cada clave (para detectar borrados) */
var rutasDe = {};
var ultimoObjeto = {};
function registrarRuta(clave, r){ (rutasDe[clave] = rutasDe[clave] || []); if(rutasDe[clave].indexOf(r) < 0) rutasDe[clave].push(r); }
function quitarRuta(clave, r){ var l = rutasDe[clave] || []; var i = l.indexOf(r); if(i >= 0) l.splice(i, 1); delete ultimoObjeto[r]; }
function objetoDeRuta(clave, r){ return ultimoObjeto[r] || null; }

function partirUsuario(u){
  var pub = {}, priv = {};
  Object.keys(u).forEach(function(k){
    if(k === 'clave') return;                       // la contraseña jamás sube
    if(PRIV.indexOf(k) >= 0) priv[k] = u[k]; else pub[k] = u[k];
  });
  return { pub:limpiar(pub), priv:limpiar(priv) };
}
function subirUsuarios(){
  var vistos = {};
  (S.usuarios || []).forEach(function(u){
    if(!u || !u.id) return;
    vistos[u.id] = true;
    var ajeno = u.id !== yoUid;
    /* datos de OTRA persona: sólo el administrador, y sólo después de haber
       recibido de la nube lo que ya hay (si no, se pisarían con datos a medias) */
    if(ajeno && (!soyAdmin() || !entregado['adm-priv'] || !entregado['adm-usr'])) return;
    var p = partirUsuario(u);
    var dPub = codificar(p.pub, []); dPub.rol = u.rol || 'alumno'; dPub.estado = u.estado || 'activo';
    var rPub = 'usuarios/' + u.id, rPriv = 'privado/' + u.id;
    if(conocidos[rPub] !== dPub.json && !(ajeno && conocidos[rPub] === undefined)){
      conocidos[rPub] = dPub.json; registrarRuta('usuarios', rPub); escribir(rPub, dPub); }
    var dPriv = codificar(p.priv, []);
    if(conocidos[rPriv] !== dPriv.json && !(ajeno && conocidos[rPriv] === undefined)){
      conocidos[rPriv] = dPriv.json; registrarRuta('usuarios', rPriv); escribir(rPriv, dPriv); }
  });
  if(!soyAdmin()) return;
  /* borrar personas: sólo el administrador, sólo a quien la nube muestra AHORA
     y se quitó a propósito, y nunca a más de una persona de una vez */
  var enNube = Object.assign({}, union('usuarios'), union('privado'));
  var aBorrar = {};
  (rutasDe.usuarios || []).slice().forEach(function(r){
    var id = r.split('/')[1];
    if(vistos[id] || conocidos[r] === undefined) return;
    if(!enNube[r]){ delete conocidos[r]; quitarRuta('usuarios', r); return; }   // sólo se olvida aquí
    (aBorrar[id] = aBorrar[id] || []).push(r);
  });
  var ids = Object.keys(aBorrar);
  if(ids.length > 1){
    console.warn('[nube] se evitó borrar a ' + ids.length + ' personas de una vez');
    aviso('borrado-masivo', 'Por seguridad no se borró a varias personas de una vez. Recarga la página.', 'bad');
    return;
  }
  ids.forEach(function(id){
    aBorrar[id].forEach(function(r){ delete conocidos[r]; quitarRuta('usuarios', r); borrar(r); });
  });
}

/* ---------- 23.5 · recibir lo que cambió ---------- */
var repintarTmr = null, repintarPendiente = false;

function recibir(clave, escucha, lista){
  var mapa = {};
  lista.forEach(function(d){ mapa[d.ruta] = d.datos; });
  (fuentes[clave] = fuentes[clave] || {})[escucha] = mapa;
  recomponer(clave);
}
function union(clave){
  var u = {};
  var f = fuentes[clave] || {};
  Object.keys(f).forEach(function(e){ Object.keys(f[e]).forEach(function(r){ u[r] = f[e][r]; }); });
  return u;
}
function recomponer(clave){
  var antes = JSON.stringify(S[clave]);
  if(clave === 'usuarios' || clave === 'privado'){ recomponerUsuarios(); clave = 'usuarios'; antes = null; }
  else if(clave === 'fichas'){ return recomponerFichas(); }
  else {
    var m = MAPA[clave]; var u = union(clave);
    if(m.tipo === 'lista'){
      var porId = {};
      Object.keys(u).forEach(function(r){
        var o = decodificar(u[r], m.indice); if(!o || !o.id) return;
        porId[o.id] = o; conocidos[r] = u[r].json; registrarRuta(clave, r); ultimoObjeto[r] = o;
        vistoServidor[r] = true;
      });
      /* conserva el orden local y agrega lo nuevo al final; lo creado
         aquí que todavía no vuelve de la nube se mantiene */
      var nueva = [];
      (S[clave] || []).forEach(function(x){
        if(!x) return;
        if(porId[x.id]){ nueva.push(porId[x.id]); delete porId[x.id]; return; }
        var r = x.id ? m.ruta(x) : '';
        if(r && !vistoServidor[r] && m.mio(x)) nueva.push(x);
      });
      Object.keys(porId).forEach(function(id){ nueva.push(porId[id]); });
      if(clave === 'bitacora') nueva.sort(function(a,b){ return String(b.cuando||'').localeCompare(String(a.cuando||'')); });
      S[clave] = nueva;
    } else {
      var obj = {};
      Object.keys(u).forEach(function(r){
        var v = decodificar(u[r], []); var k = u[r].alumnoId || r.split('/')[1];
        obj[k] = v; conocidos[r] = u[r].json; registrarRuta(clave, r); vistoServidor[r] = true;
      });
      var local = S[clave] || {};
      Object.keys(local).forEach(function(k){
        var r = m.ruta(k);
        if(obj[k] === undefined && !vistoServidor[r] && !rutaEntregada(r) && m.mio(k)) obj[k] = local[k];
      });
      S[clave] = obj;
    }
  }
  guardarLocal(clave);
  if(clave === 'vinculos') ajustarEscuchasDinamicas();
  if(antes === null || JSON.stringify(S[clave]) !== antes) programarRepintado();
}
function recomponerUsuarios(){
  var pub = union('usuarios'), priv = union('privado');
  var lista = [];
  var privPorId = {};
  Object.keys(priv).forEach(function(r){
    var id = r.split('/')[1]; var o = decodificar(priv[r], []);
    if(o){ privPorId[id] = o; conocidos[r] = priv[r].json; registrarRuta('usuarios', r); }
  });
  var antes = JSON.stringify(S.usuarios);
  Object.keys(pub).forEach(function(r){
    var id = r.split('/')[1]; var o = decodificar(pub[r], []);
    if(!o) return;
    conocidos[r] = pub[r].json; registrarRuta('usuarios', r);
    o.id = id; o.rol = pub[r].rol || o.rol;
    if(privPorId[id]) Object.assign(o, privPorId[id]);
    if(id === yoUid && yoCorreo && !o.email) o.email = yoCorreo;
    lista.push(o);
  });
  /* mi propio usuario recién creado todavía puede no haber vuelto */
  (S.usuarios || []).forEach(function(x){
    if(x && x.id === yoUid && !lista.some(function(y){ return y.id === x.id; })) lista.push(x);
  });
  S.usuarios = lista;
  guardarLocal('usuarios');
  if(JSON.stringify(S.usuarios) !== antes){ ajustarEscuchasDinamicas(); programarRepintado(); }
}
function recomponerFichas(){
  var u = union('fichas');
  Object.keys(u).forEach(function(r){
    var d = u[r]; if(!d || !d.clave) return;
    conocidos['ficha:' + d.clave] = d.json;
    var v = decodificar(d, []);
    var actual = null;
    try{ actual = JSON.stringify(DB.get(d.clave, null)); }catch(e){}
    if(actual !== d.json) dbSetLocal(d.clave, v);
  });
}

/* ---------- 23.7 · escuchas ---------- */
var consultaDe = {};
function escuchar(id, clave, q){
  if(subs[id]) return;
  claveDe[id] = clave; consultaDe[id] = q;
  subs[id] = B.escuchar(q, function(lista){
    var primera = !entregado[id];
    entregado[id] = true;
    recibir(clave, id, lista);
    if(primera && INICIALES.indexOf(id) >= 0 && inicialListo()) setTimeout(function(){ try{ pintar(); }catch(e){} }, 0);
  }, function(err){
    entregado[id] = true;
    delete subs[id];
    if(fuentes[clave] && fuentes[clave][id]){ delete fuentes[clave][id]; recomponer(clave); }
    errorNube(err, 'escuchar ' + clave);
  });
}
function soltar(id){
  if(!subs[id]) return;
  try{ subs[id](); }catch(e){}
  delete subs[id]; delete claveDe[id]; delete entregado[id]; delete consultaDe[id];
  Object.keys(fuentes).forEach(function(c){
    if(fuentes[c][id]){ delete fuentes[c][id]; recomponer(c); }
  });
}

/* según mis vínculos activos: el espacio de cada alumno que atiendo y
   los datos personales de cada persona con quien estoy conectado */
function ajustarEscuchasDinamicas(){
  if(!yoUid) return;
  var quiero = {};
  (S.vinculos || []).forEach(function(v){
    if(!v) return;
    /* el perfil del alumno se lee con cualquier vínculo (también pendiente) */
    if(v.profesionalId === yoUid && v.alumnoId) quiero['usr:'+v.alumnoId] = v.alumnoId;
    if(v.estado !== 'activo') return;
    if(v.profesionalId === yoUid && v.alumnoId){
      ['reg','met','que','fic','hor','pau'].forEach(function(p){ quiero['al-'+p+':'+v.alumnoId] = v.alumnoId; });
      quiero['priv:'+v.alumnoId] = v.alumnoId;
    }
    if(v.alumnoId === yoUid && v.profesionalId) quiero['priv:'+v.profesionalId] = v.profesionalId;
  });
  Object.keys(subs).forEach(function(id){
    if(/^(al-|priv:|usr:)/.test(id) && !quiero[id]) soltar(id);
  });
  Object.keys(quiero).forEach(function(id){
    if(subs[id]) return;
    var aid = quiero[id];
    if(id.indexOf('priv:') === 0) escuchar(id, 'privado', {doc:'privado/'+aid});
    else if(id.indexOf('usr:') === 0) escuchar(id, 'usuarios', {doc:'usuarios/'+aid});
    else espacioAlumno(aid, 'al-');
  });
  /* administrador verificado: personas, consentimientos, facturas y bitácora de todos */
  if(soyAdmin()){
    escuchar('adm-usr', 'usuarios', {col:'usuarios'});
    escuchar('adm-priv', 'privado', {col:'privado'});
    escuchar('adm-cons', 'consentimientos', {col:'consentimientos'});
    escuchar('adm-fac', 'facturas', {col:'facturas'});
    escuchar('adm-bit', 'bitacora', {col:'bitacora'});
  }
}

function mensajeAuth(err){
  var c = (err && err.code) || '';
  if(/email-already-in-use/.test(c)) return 'Ese correo ya tiene una cuenta. Usa «Entrar».';
  if(/weak-password/.test(c))        return 'La contraseña debe tener al menos 6 caracteres.';
  if(/invalid-email/.test(c))        return 'Ese correo no es válido.';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Correo o contraseña incorrectos.';
  if(/too-many-requests/.test(c))    return 'Demasiados intentos. Espera unos minutos y vuelve a intentar.';
  if(/network/.test(c))              return 'Sin conexión a internet.';
  if(/operation-not-allowed|configuration-not-found/.test(c)) return 'Ese método de acceso no está activado en Firebase (Authentication → Método de acceso).';
  if(/unauthorized-domain/.test(c))  return 'Este dominio no está autorizado para entrar con Google (Authentication → Configuración → Dominios autorizados).';
  if(/popup-blocked/.test(c))        return 'El navegador bloqueó la ventana de Google. Permite ventanas emergentes e intenta de nuevo.';
  if(/invalid-action-code|expired-action-code/.test(c)) return 'Este enlace ya se usó o venció. Pide uno nuevo.';
  if(/user-disabled/.test(c))        return 'Esta cuenta está desactivada.';
  if(/missing-email/.test(c))        return 'Escribe tu correo.';
  return 'No se pudo completar (' + (c || 'error') + ').';
}

  ['fichas','pautas','horario'].forEach(function(k){ S[k] = {}; });
  conocidos = {}; fuentes = {}; rutasDe = {}; ultimoObjeto = {}; vistoServidor = {};
}

/* ---------- 23.9b · administrador: Google, una sola cuenta ---------- */
function huella(txt){
  try{
    if(!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.resolve(null);
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(txt||'').trim().toLowerCase()))
      .then(function(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); })
      .catch(function(){ return null; });
  }catch(e){ return Promise.resolve(null); }
}
function huellaDisponible(){ return !!(window.crypto && crypto.subtle && window.TextEncoder); }
function esCorreoAdmin(correo){
  return huella(correo).then(function(h){ return h === null ? true : h === ADMIN_HUELLA; });  // sin cripto: deciden las reglas
}
window.__JY_NUBE_GOOGLE = function(boton){

    yoUid = u.uid; yoCorreo = u.email; yoVerificado = !!u.verificado;
    return esCorreoAdmin(u.email).then(function(ok){

        /* si la cuenta se acaba de crear con este intento, no queda nada guardado */
        return (u.nuevo ? B.auth.eliminar() : Promise.reject()).catch(function(){ return B.auth.salir(); });
      }
      return esperarPerfil(u.uid).then(function(perfil){
        listo();
        if(perfil && perfil.rol !== 'administrador'){
          /* el correo autorizado, verificado por Google, recupera su perfil aunque
             alguien lo hubiera registrado antes con otro rol */

          guardar('usuarios');

          S.usuarios.push(perfil); guardar('usuarios');

        if(window.JY22 && JY22.irAPerfil) JY22.irAPerfil(perfil); else ruta('inicio');
      });
    });
  }).catch(function(err){
    listo();
    var c = (err && err.code) || '';
    if(/popup-closed-by-user|cancelled-popup-request/.test(c)) return;

function escucharActividad(win){

function revisarGuardia(){
  if(!guardia.uid) return;
  Array.prototype.forEach.call(document.querySelectorAll('iframe'), function(f){
    try{ escucharActividad(f.contentWindow); }catch(e){}
  });
  var quieto = Date.now() - guardia.ultimo;
  if(quieto >= INACTIVO_MS){
    detenerGuardia();
    try{ sessionStorage.setItem('jy.aviso', 'Sesión de administrador cerrada por 15 minutos sin actividad.'); }catch(e){}
    salir();
  } else if(quieto >= AVISO_MS && !guardia.avisado){
    guardia.avisado = true;
    toast('Por seguridad, la sesión se cerrará en 1 minuto si no hay actividad.', 'warn');
  }
}
function iniciarGuardia(uid){
  if(guardia.uid === uid) return;
  guardia.uid = uid; actividad();
  escucharActividad(window);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) revisarGuardia(); });
  clearInterval(guardia.tmr);
  guardia.tmr = setInterval(revisarGuardia, 15000);
}
function detenerGuardia(){ guardia.uid = null; clearInterval(guardia.tmr); guardia.tmr = null; }

var adminRevisado = null;
function revisarAdmin(){
  var yo = yoUid && usuario(yoUid);
  if(!yo || yo.rol !== 'administrador'){ if(guardia.uid) detenerGuardia(); return; }
  if(adminRevisado === yoUid) return;
  adminRevisado = yoUid;
  B.auth.proveedor().then(function(prov){
    if(prov !== 'google.com'){
      try{ sessionStorage.setItem('jy.aviso', 'El perfil Administrador sólo se abre con «Entrar con Google».'); }catch(e){}
      salir();
      return;
    }
    iniciarGuardia(yoUid);
  }).catch(function(){ salir(); });
}

salir = function(){
  detenerGuardia();
  try{ bitacora('acceso','Cerró sesión'); }catch(e){}
  var fin = function(){ limpiarCache(); try{ location.hash = ''; }catch(e){} location.reload(); };
  setTimeout(function(){ B.auth.salir().then(fin, fin); }, 250);
};

function ocupado(si){
  var b = document.querySelector('#f-entrar button[type="submit"], #f-crear button[type="submit"]');
  if(b){ b.disabled = !!si; b.style.opacity = si ? '.6' : ''; }
}

B.auth.onCambio(function(u){
  autenticado = true;
  if(!u){
    soltarTodo();
    var habia = !!S.sesion;
    yoUid = null; yoCorreo = null; yoVerificado = false; sesionIniciada = null;
    adminRevisado = null; detenerGuardia();
    if(habia){ limpiarCache(); S.sesion = null; guardarLocal('sesion'); }
    return pintar();
  }
  yoUid = u.uid; yoCorreo = u.email; yoVerificado = !!u.verificado;
  if(sesionIniciada !== u.uid){
    sesionIniciada = u.uid;
    soltarTodo();
    /* se parte de lo que dice la nube, nunca de una copia vieja de este
       equipo (Firestore trae su propia caché para cuando no hay red) */
    if(!creando) limpiarCache();
  }
  S.sesion = u.uid; guardarLocal('sesion');
  /* sin red y sin copia guardada, no se queda esperando para siempre */
  esperaVencida = false;
  clearTimeout(esperaTmr);
  esperaTmr = setTimeout(function(){
    if(!inicialListo()){ esperaVencida = true; aviso('red', 'Sin conexión: trabajando con lo guardado. Se sincroniza al volver la red.'); pintar(); }
  }, 8000);
  iniciarEscuchas();
  ajustarEscuchasDinamicas();
  /* lo que se escribió antes de conectar (alta, consentimiento) sube ahora */
  setTimeout(function(){
    ['usuarios','consentimientos','bitacora'].forEach(programarSubida);
  }, 300);
  pintar();
});

/* ---------- 23.10 · pantalla de espera y ajustes de la interfaz ---------- */
var pintarNube = pintar;
pintar = function(){
  if(!autenticado || (yoUid && !inicialListo() && !creando && !esperaVencida)){
    var app = document.getElementById('app');
    if(app) app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;'
      + 'flex-direction:column;gap:14px;color:var(--mute)">' + marca(false)
      + '<div class="mono" style="font-size:11px;letter-spacing:.22em;text-transform:uppercase">Conectando…</div></div>';
    return;
  }
  pintarNube();
  try{ ajustesInterfaz(); }catch(e){ console.error(e); }
  try{ revisarAdmin(); }catch(e){ console.error(e); }
  if(avisoPendiente && autenticado && !yoUid){
    var av = avisoPendiente; avisoPendiente = null;
    setTimeout(function(){ toast(av, 'warn'); }, 300);
  }
};
/* aviso que dejó la página anterior (p. ej. «sesión cerrada por inactividad»):
   se lee una sola vez al abrir, para que no se pierda con la recarga */
var avisoPendiente = null;
try{ avisoPendiente = sessionStorage.getItem('jy.aviso'); sessionStorage.removeItem('jy.aviso'); }catch(e){}

function ajustesInterfaz(){
  /* entrar: recuperar contraseña */
  var fe = document.getElementById('f-entrar');
  var perfilElegido = (window.JY22 && JY22.elegido) ? JY22.elegido() : null;
  if(fe && perfilElegido !== 'administrador' && !fe.querySelector('[data-olvido]')){
    var a = document.createElement('button');
    a.type = 'button'; a.className = 'btn sm'; a.setAttribute('data-olvido','1');
    a.style.cssText = 'justify-content:center;background:transparent;border-color:transparent;color:var(--mute)';
    a.textContent = '¿Olvidaste tu contraseña?';
    var sub = fe.querySelector('button[type="submit"]');
    if(sub && sub.nextSibling) fe.insertBefore(a, sub.nextSibling); else fe.appendChild(a);
    a.onclick = function(){
      preguntar('Recuperar contraseña',
        '<form class="stack"><div class="field"><label>Tu correo</label><input class="inp" name="email" type="email" value="'
        + esc(fe.email.value || '') + '"></div><p class="hint" style="margin:0">Te enviaremos un correo con un enlace para crear una contraseña nueva. El enlace sirve una sola vez y vence en 1 hora.</p></form>',
        {ok:'Enviar enlace'}).then(function(r){
          if(!r || !r.email) return;
          var correo = String(r.email).trim().toLowerCase();
          if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) return toast('Ese correo no es válido.', 'bad');
          esCorreoAdmin(correo).then(function(esAdm){
            if(esAdm && huellaDisponible()) return toast('Esa cuenta entra con Google: no usa contraseña de JYNTRA.', 'warn');
            return B.auth.recuperar(correo).then(function(){
              preguntar('Revisa tu correo',
                '<div class="stack" style="gap:10px"><p style="margin:0">Si <b>' + esc(correo) + '</b> tiene una cuenta en JYNTRA, '
                + 'en unos minutos te llegará un correo con el enlace para crear tu contraseña nueva.</p>'
                + '<p class="hint" style="margin:0">¿No aparece? Revisa «Spam» o «Promociones». El enlace sirve una sola vez y vence en 1 hora.</p></div>',
                {ok:'Entendido', cancelar:null});
            });
          }).catch(function(err){ toast(mensajeAuth(err),'bad'); });
        });
    };
  }
  /* crear: la contraseña pide 6 caracteres como mínimo */
  var fc = document.getElementById('f-crear');
  if(fc && fc.clave){ fc.clave.setAttribute('minlength','6'); fc.clave.placeholder = 'Mínimo 6 caracteres'; }

  /* mi perfil: correo y contraseña se manejan desde la cuenta */
  var fp = document.getElementById('f-perfil');
  if(fp && !fp.__nube){
    fp.__nube = true;
    if(fp.email){ fp.email.readOnly = true; fp.email.style.opacity = '.7';
      fp.email.title = 'El correo es el de tu cuenta.'; }
    var yoP = yoUid && usuario(yoUid);
    if(fp.clave && yoP && yoP.rol === 'administrador'){
      /* el administrador no tiene contraseña en JYNTRA: su acceso es su cuenta de Google */
      fp.clave.value = ''; fp.clave.disabled = true; fp.clave.style.display = 'none';
      var campoA = fp.clave.closest('.field') || fp.clave.parentNode;
      var nota = document.createElement('div'); nota.className = 'hint';
      nota.textContent = 'Entras con Google. La contraseña y la verificación en dos pasos se administran en tu cuenta de Google.';
      campoA.appendChild(nota);
    } else if(fp.clave){
      fp.clave.value = ''; fp.clave.disabled = true;
      var campo = fp.clave.closest('.field') || fp.clave.parentNode;
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn sm'; btn.textContent = 'Cambiar contraseña por correo';
      btn.onclick = function(){
        B.auth.recuperar(yoCorreo).then(function(){ toast('Te enviamos un enlace a ' + yoCorreo + '.','ok'); })
          .catch(function(err){ toast(mensajeAuth(err),'bad'); });
      };
      fp.clave.style.display = 'none';
      campo.appendChild(btn);
    }
    /* respaldo e reinicio locales no aplican con datos en la nube */
    ['b-imp','b-reset'].forEach(function(id){
      var el = document.getElementById(id);
      var card = el && el.closest('.card');
      if(card) card.style.display = 'none';
    });
  }

  /* administrador sin correo verificado: sus permisos esperan */
  var yo = yoUid && usuario(yoUid);
  if(yo && yo.rol === 'administrador' && !yoVerificado && !document.getElementById('jy-verif')){
    var d = document.createElement('div');
    d.id = 'jy-verif'; d.className = 'readonly-note';
    d.style.cssText = 'margin:12px 16px 0;border-color:var(--warn)';
    d.innerHTML = '<span>✉</span><div><b>Verifica tu correo</b> para activar los permisos de administrador. '
      + 'Te enviamos un enlace a ' + esc(yoCorreo || '') + '. '
      + '<button class="btn sm" data-reenviar>Reenviar</button> <button class="btn sm gold" data-yaverifique>Ya lo verifiqué</button></div>';
    var main = document.querySelector('.main') || document.getElementById('app');
    main.insertBefore(d, main.firstChild);
    d.querySelector('[data-reenviar]').onclick = function(){
      B.auth.verificar().then(function(){ toast('Correo reenviado.','ok'); }).catch(function(err){ toast(mensajeAuth(err),'bad'); });
    };
    d.querySelector('[data-yaverifique]').onclick = function(){
      B.auth.refrescar().then(function(u){
        yoVerificado = !!(u && u.verificado);
        if(yoVerificado){ toast('Correo verificado. Permisos activos.','ok'); ajustarEscuchasDinamicas(); pintar(); }
        else toast('Todavía no aparece verificado. Abre el enlace del correo y vuelve a intentar.','warn');
      });
    };
  }
}

pintar();
})();

/* ================================================================
   §25 · ENLACES DEL CORREO — contraseña nueva y verificación
   ----------------------------------------------------------------
   Los correos de Firebase (recuperar contraseña, verificar correo)
   traen un enlace con ?mode=…&oobCode=…. Si en la consola de Firebase
   la «URL de acción» apunta a https://jintra-db.web.app/ , el enlace
   abre ESTA pantalla, con la marca JYNTRA, en vez de la página
   genérica de Firebase. Si no, la de Firebase también funciona.
   ================================================================ */
(function(){
'use strict';
var q; try{ q = new URLSearchParams(location.search); }catch(e){ return; }
var modo = q.get('mode'), oob = q.get('oobCode');
if(!modo || !oob) return;
var N = window.JYNUBE;
if(!N || !N.backend || !N.backend.auth || !N.backend.auth.leerCodigo) return;
var A = N.backend.auth;

(function estilos(){
  var st = document.createElement('style'); st.id = 'jy25-css';
  st.textContent = [
    '.jy25-caja{background:var(--panel);border:1px solid var(--line-soft);border-top:3px solid var(--jy-acc);border-radius:10px;',
    ' padding:22px 22px 24px;box-shadow:0 22px 50px -30px var(--jy-acc)}',
    '.jy25-caja .h2{margin:6px 0 4px}',
    '.jy25-caja .sub{margin:0 0 16px}',
    '.jy25-medidor{height:4px;border-radius:4px;background:var(--line);overflow:hidden}',
    '.jy25-medidor span{display:block;height:100%;width:0;background:var(--bad);transition:width .2s,background .2s}',
    '.jy25-icono{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;margin-bottom:8px}',
    '.jy25-icono.ok{background:rgba(127,183,126,.14);color:var(--ok);border:1px solid rgba(127,183,126,.45)}',
    '.jy25-icono.mal{background:rgba(221,44,55,.12);color:var(--jy-acc-hi);border:1px solid rgba(221,44,55,.45)}'
  ].join('');
  document.head.appendChild(st);
})();

var estado = { paso:'cargando', correo:'' };
var activo = true;
var pintarBase = pintar;
pintar = function(){ return activo ? dibujar() : pintarBase(); };

function limpiarUrl(){ try{ history.replaceState(null, '', location.pathname + (location.hash || '')); }catch(e){} }
function salirDePantalla(correo){
  activo = false; limpiarUrl();
  if(correo){ try{ sessionStorage.setItem('jy.correo', correo); }catch(e){} }
  pintarBase();
}
function mensaje(err){
  var c = (err && err.code) || '';
  if(/invalid-action-code|expired-action-code/.test(c)) return 'Este enlace ya se usó o venció.';
  if(/weak-password/.test(c))  return 'La contraseña debe tener al menos 6 caracteres.';
  if(/user-disabled/.test(c))  return 'Esta cuenta está desactivada.';
  if(/user-not-found/.test(c)) return 'La cuenta de este enlace ya no existe.';
  if(/network/.test(c))        return 'Sin conexión a internet.';
  return 'No se pudo completar (' + (c || 'error') + ').';
}
function nivel(k){
  var p = 0;
  if(k.length >= 6) p++;
  if(k.length >= 10) p++;
  if(/[a-z]/.test(k) && /[A-Z]/.test(k)) p++;
  if(/\d/.test(k)) p++;
  if(/[^A-Za-z0-9]/.test(k)) p++;
  if(k.length < 6) return { n:0, t:'Muy corta: mínimo 6 caracteres', c:'var(--bad)', w:12 };
  if(p <= 2) return { n:1, t:'Aceptable', c:'var(--warn)', w:40 };
  if(p === 3) return { n:2, t:'Buena', c:'var(--ok)', w:70 };
  return { n:3, t:'Fuerte', c:'var(--ok)', w:100 };
}

function marco(html){
  return '<div class="jy22-portal">' + (typeof botonTema === 'function' ? botonTema('tema-flot') : '') + '<div class="jy22-in" style="width:min(440px,100%)">'
   + '<div class="jy22-marca" style="display:flex;justify-content:center;margin-bottom:18px">' + logoCompleto(96) + '</div>'
   + '<div class="jy25-caja" id="jy25">' + html + '</div></div></div>';
}

function dibujar(){
  var app = document.getElementById('app'); if(!app) return;
  var pasoPintado = app.getAttribute('data-jy25');
  if(pasoPintado === estado.paso) return;          // ya está en pantalla: no se borra lo escrito
  app.setAttribute('data-jy25', estado.paso);
  document.body.removeAttribute('data-rol');
  var h = '';
  if(estado.paso === 'cargando'){
    h = '<div class="eyebrow">JYNTRA</div><div class="h2">Revisando el enlace…</div>';
  } else if(estado.paso === 'clave'){
    h = '<div class="eyebrow">Recuperar acceso</div>'
      + '<div class="h2">Crea tu contraseña nueva</div>'
      + '<p class="sub">Para la cuenta <b>' + esc(estado.correo) + '</b></p>'
      + '<form id="f-nueva" class="stack" autocomplete="on">'
      +   '<input type="email" name="username" autocomplete="username" value="' + esc(estado.correo) + '" style="display:none">'
      +   '<div class="field"><label>Contraseña nueva</label><input class="inp" name="clave" type="password" autocomplete="new-password" minlength="6" required placeholder="Mínimo 6 caracteres"></div>'
      +   '<div class="jy25-medidor"><span></span></div><div class="hint" id="jy25-nivel" style="margin-top:-6px">Usa letras, números y algún símbolo.</div>'
      +   '<div class="field"><label>Repite la contraseña</label><input class="inp" name="clave2" type="password" autocomplete="new-password" minlength="6" required></div>'
      +   '<button class="btn gold" type="submit" style="justify-content:center">Guardar contraseña</button>'
      + '</form>';
  } else if(estado.paso === 'clave-lista'){
    h = '<div class="jy25-icono ok">✓</div>'
      + '<div class="h2">Contraseña actualizada</div>'
      + '<p class="sub">Ya puedes entrar a JYNTRA con tu contraseña nueva. Por seguridad, las sesiones abiertas en otros equipos se cerrarán.</p>'
      + '<button class="btn gold" type="button" data-jy25="entrar" style="justify-content:center;width:100%">Ir a entrar</button>';
  } else if(estado.paso === 'correo-listo'){
    h = '<div class="jy25-icono ok">✓</div>'
      + '<div class="h2">' + (modo === 'recoverEmail' ? 'Correo restablecido' : 'Correo verificado') + '</div>'
      + '<p class="sub">' + (modo === 'recoverEmail'
          ? 'Tu cuenta vuelve a usar <b>' + esc(estado.correo) + '</b>. Te recomendamos cambiar tu contraseña.'
          : 'Listo, <b>' + esc(estado.correo) + '</b> quedó verificado.') + '</p>'
      + '<button class="btn gold" type="button" data-jy25="entrar" style="justify-content:center;width:100%">Ir a JYNTRA</button>';
  } else {
    h = '<div class="jy25-icono mal">!</div>'
      + '<div class="h2">Enlace no válido</div>'
      + '<p class="sub">' + esc(estado.error || 'Este enlace ya se usó o venció.') + ' '
      + (modo === 'resetPassword' ? 'Pide uno nuevo con «¿Olvidaste tu contraseña?».' : '') + '</p>'
      + '<button class="btn gold" type="button" data-jy25="entrar" style="justify-content:center;width:100%">Volver a JYNTRA</button>';
  }
  app.innerHTML = marco(h);
  ligar();
}

function ligar(){
  var ir = document.querySelector('[data-jy25="entrar"]');
  if(ir) ir.onclick = function(){
    salirDePantalla(estado.paso === 'clave-lista' ? estado.correo : null);
  };
  var f = document.getElementById('f-nueva');
  if(!f) return;
  if(window.JY22 && JY22.ojos) JY22.ojos(f);
  var barra = f.querySelector('.jy25-medidor span'), texto = document.getElementById('jy25-nivel');
  f.clave.addEventListener('input', function(){
    var n = nivel(f.clave.value);
    barra.style.width = n.w + '%'; barra.style.background = n.c; texto.textContent = n.t;
  });
  setTimeout(function(){ try{ f.clave.focus(); }catch(e){} }, 50);
  f.onsubmit = function(e){
    e.preventDefault();
    var k = f.clave.value, k2 = f.clave2.value;
    if(k.length < 6) return toast('La contraseña debe tener al menos 6 caracteres.', 'bad');
    if(k !== k2) return toast('Las dos contraseñas no coinciden.', 'bad');
    var b = f.querySelector('button[type="submit"]'); b.disabled = true; b.style.opacity = '.6';
    A.nuevaClave(oob, k).then(function(){
      estado.paso = 'clave-lista'; dibujar();
    }).catch(function(err){
      b.disabled = false; b.style.opacity = '';
      if(/invalid-action-code|expired-action-code/.test((err && err.code) || '')){ estado.paso = 'mal'; estado.error = mensaje(err); return dibujar(); }
      toast(mensaje(err), 'bad');
    });
  };
}

dibujar();
A.leerCodigo(modo, oob).then(function(correo){
  estado.correo = correo || '';
  estado.paso = modo === 'resetPassword' ? 'clave' : 'correo-listo';
  if(modo !== 'resetPassword' && A.actual && A.actual()){ try{ A.refrescar().catch(function(){}); }catch(e){} }
  dibujar();
}).catch(function(err){
  estado.paso = 'mal'; estado.error = mensaje(err); dibujar();
});
})();

})();
</script>
